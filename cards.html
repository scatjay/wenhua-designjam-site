<div class="wrap">

  <h1 data-i18n="h1">完整卡池 · 文化遊戲松 Cultural Game Jam</h1>
  <p class="sub" data-i18n="sub">目前遊戲裡所有角色的所有卡片內容，方便瀏覽全貌、也方便楊老師比對更新。虛線外框的是同學新增的自訂卡，會即時加進抽卡池裡增加多元性。</p>

    <input type="number" id="addEnv" min="0" max="130" placeholder="例如 17">
    <label data-i18n="addRoleLabel">要加進哪個角色的卡池</label>
    <select id="addRole">
      <option value="producer" data-i18n="optProducer">🟢 執行製作人（時程與資源）</option>
      <option value="engineer" data-i18n="optEngineer">🔵 首席工程師（形式／平台）</option>
      <option value="marketing" data-i18n="optMarketing">🟣 行銷主管（客群／情感訴求）</option>

    <textarea id="addNote" maxlength="200" style="min-height:60px" placeholder="這張卡在提示什麼、怎麼用" data-i18n-ph="addNotePh"></textarea>
    <button id="addBtn" data-i18n="addBtn">加進卡池</button>
    <div class="st" id="addStatus"></div>
  </div>

  <div class="lookupbox">
    <h2 data-i18n="lookupH2">🔍 查我抽過哪些卡</h2>
    <div class="row">
      <input type="number" id="lookupEnv" min="0" max="130" placeholder="輸入你的編號" data-i18n-ph="lookupPh">
      <button id="lookupBtn" data-i18n="lookupBtn">查詢</button>
    </div>

  </div>

  <div id="sections"></div>
</div>

const root = document.getElementById("sections");
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// 全班抽卡紀錄——用來算「這張卡被抽過幾次」＋查某個編號抽過哪些卡
let allRounds = {};
let usageCount = {}; // `${role}::${cardValue}` -> 次數

function recomputeUsage() {
  usageCount = {};
  Object.values(allRounds).forEach(r => {
    Object.entries(r.players || {}).forEach(([env, p]) => {
      const card = (r.cards || {})[p.role];
      if (!card) return;
      const key = p.role + "::" + card.v;
      usageCount[key] = (usageCount[key] || 0) + 1;
    });
  });
}

function renderAll() {
  root.innerHTML = "";
  SECTIONS.forEach(s => {
    const customList = custom[s.key] || [];
    const total = s.deck.length + customList.length;
    const sec = document.createElement("div");
    sec.className = "section";
    const badge = (v) => {
      const n = usageCount[s.key + "::" + v] || 0;
      return n > 0 ? `<div class="usebadge">🎲 ${t("usedTimes").replace("{n}", n)}</div>` : "";
    };
    const baseHtml = s.deck.map(c =>
      `<div class="cardbox ${s.key}"><div class="v">${escapeHtml(cv(c))}</div><div class="d">${escapeHtml(cd(c))}</div><div class="note">💡 ${escapeHtml(cnote(c))}</div>${badge(c.v)}</div>`
    ).join("");
    const customHtml = customList.map(c =>
      `<div class="cardbox ${s.key} custom"><div class="v">${escapeHtml(c.v)}</div><div class="d">${escapeHtml(c.d)}</div>${c.note ? `<div class="note">💡 ${escapeHtml(c.note)}</div>` : ""}<div class="by">✨ #${c.addedBy} ${t("addedByLabel")}</div>${badge(c.v)}</div>`
    ).join("");
    sec.innerHTML = `<h2>${stitle(s)}</h2><div class="n">${t("cardCountText").replace("{total}", total).replace("{custom}", customList.length)}</div>` +
      `<div class="cardgrid">${baseHtml}${customHtml}</div>`;
    root.appendChild(sec);
  });
}

function t(key) { const e = I18N[key]; return e ? (e[currentLang] || e.zh) : key; }
function applyLang(lang) {
  currentLang = lang;
  try { localStorage.setItem("designjam_lang", lang); } catch(_) {}
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.getElementById("langZh").classList.toggle("sel", lang === "zh");
  document.getElementById("langVi").classList.toggle("sel", lang === "vi");
  renderAll();
}
document.getElementById("langZh").onclick = () => applyLang("zh");
document.getElementById("langVi").onclick = () => applyLang("vi");

SECTIONS.forEach(s => {
  db.ref(`${NS}/customCards/${s.key}`).on("value", snap => {
    custom[s.key] = Object.values(snap.val() || {});
    renderAll();
  });
});
db.ref(`${NS}/rounds`).on("value", snap => {
  allRounds = snap.val() || {};
  recomputeUsage();
  renderAll();
});
let savedLang = "zh";
try { savedLang = localStorage.getItem("designjam_lang") || "zh"; } catch(_) {}
applyLang(savedLang); // calls renderAll() internally

// 2026-09-09 楊老師：登入頁已經打過一次編號了，這裡不用再叫學生重打——
// 有存過就自動帶入，但欄位還留著可以改（避免同一台裝置換人用、或編號記錯時卡住）。
try {
  const savedEnv = localStorage.getItem("designjam_env");
  if (savedEnv) {
    document.getElementById("addEnv").value = savedEnv;
    document.getElementById("lookupEnv").value = savedEnv;
  }
} catch(_) {}

const SECTION_BY_KEY = Object.fromEntries(SECTIONS.map(s => [s.key, s]));
document.getElementById("lookupBtn").onclick = () => {
  const env = parseInt(document.getElementById("lookupEnv").value, 10);
  const resEl = document.getElementById("lookupResult");
  if (Number.isNaN(env) || (env !== 0 && env !== 99 && !(env >= 1 && env <= 60) && !(env >= 101 && env <= 130))) { resEl.textContent = t("errNoEnv"); return; }
  const hits = [];
  Object.values(allRounds).forEach(r => {
    const p = (r.players || {})[env];
    if (!p) return;
    const card = (r.cards || {})[p.role];
    if (!card) return;
    hits.push({role: p.role, card, t: r.createdAt});
  });
  hits.sort((a, b) => a.t - b.t);
  if (!hits.length) { resEl.innerHTML = `<div class="hit">#${env} ${t("noCardsYet")}</div>`; return; }
  resEl.innerHTML = `<div style="margin-bottom:6px">#${env} ${t("playedRounds").replace("{n}", hits.length)}</div>` +
    hits.map((h, i) => `<div class="hit">${t("roundNth").replace("{n}", i+1)}${stitle(SECTION_BY_KEY[h.role])}：${escapeHtml(cv(h.card))}</div>`).join("");
};

document.getElementById("addBtn").onclick = () => {
  const env = parseInt(document.getElementById("addEnv").value, 10);
  const role = document.getElementById("addRole").value;
  const v = document.getElementById("addV").value.trim();
  const note = document.getElementById("addNote").value.trim();
  const statusEl = document.getElementById("addStatus");
  if (Number.isNaN(env) || (env !== 0 && env !== 99 && !(env >= 1 && env <= 60) && !(env >= 101 && env <= 130))) { statusEl.textContent = t("errNoEnv"); return; }
  if (!v) { statusEl.textContent = t("errNoV"); return; }
  const dfl = SECTIONS.find(s => s.key === role).dfl;
  const data = {v, d: dfl, addedBy: env, t: Date.now()};
  if (note) data.note = note;
  db.ref(`${NS}/customCards/${role}`).push(data)
    .then(() => {
      // 累計「新增過幾張卡片」——跟index.html的完成卡是同一份playerStats，
      // 讓學生截圖時看得到自己對卡池的貢獻累計，不用另外查。
      db.ref(`${NS}/playerStats/${env}`).transaction(cur => {
        cur = cur || {roundCount: 0, totalMs: 0, cardsAdded: 0};
        return {...cur, cardsAdded: (cur.cardsAdded||0) + 1, lastSeen: Date.now()};
      });
      statusEl.textContent = t("addOk");
      document.getElementById("addV").value = "";
      document.getElementById("addNote").value = "";
    })
    .catch(e => { statusEl.textContent = t("addFailPrefix") + e.message; });
};
