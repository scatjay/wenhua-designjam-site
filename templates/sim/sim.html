<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小上帝廟的半年｜經營模擬樣板</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
:root{
  --tk-font-title:"Cactus Classical Serif","Noto Serif TC","Songti TC",serif;
  --tk-font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:Consolas,"Cascadia Mono","Courier New",monospace;
  --tk-radius:4px;
  --tk-shadow:3px 3px 0 rgba(58,36,18,.35);
  --tk-surface:#e9d8b4; --tk-panel:#f6ead0; --tk-ink:#3a2412; --tk-muted:#7a5f45; --tk-line:#b99a66;
  --tk-accent:#2f6b3a; --tk-accent-ink:#ffffff;
  --gold:#a8741a; --good:#2f6b3a; --bad:#a8271d; --info:#2f5f8a;
  --chip:#efdcb2; --btn:#fbf1d9; --btn-line:#b08a4a; --dis:#e4d6b6; --scrim:rgba(40,25,10,.55);
  --notch:none;
  /* 色盤（只在 :root 定義；元件一律用 var(--…)） */
  --pal-2b1a12:#2b1a12;
  --pal-2f6b3a:#2f6b3a;
  --pal-34475e:#34475e;
  --pal-3a6ea5:#3a6ea5;
  --pal-3d2c22:#3d2c22;
  --pal-4a3220:#4a3220;
  --pal-4a3f2d:#4a3f2d;
  --pal-4a8a56:#4a8a56;
  --pal-4b5560:#4b5560;
  --pal-4f9a5c:#4f9a5c;
  --pal-55606b:#55606b;
  --pal-56616c:#56616c;
  --pal-58bdb7:#58bdb7;
  --pal-6a4a2e:#6a4a2e;
  --pal-6b7886:#6b7886;
  --pal-6b9be0:#6b9be0;
  --pal-6f8fb3:#6f8fb3;
  --pal-7a6a4d:#7a6a4d;
  --pal-7b8794:#7b8794;
  --pal-7cbf7c:#7cbf7c;
  --pal-8895a3:#8895a3;
  --pal-8a4a2e:#8a4a2e;
  --pal-8a5a2b:#8a5a2b;
  --pal-8a6a1f:#8a6a1f;
  --pal-8a6a2e:#8a6a2e;
  --pal-9aa7b4:#9aa7b4;
  --pal-9b7a46:#9b7a46;
  --pal-a12085:rgba(255,255,255,.7);
  --pal-a15761:rgba(120,100,70,.22);
  --pal-a18317:rgba(0,0,0,.45);
  --pal-a24882:rgba(255,255,255,.22);
  --pal-a35550:rgba(0,0,0,.25);
  --pal-a47244:rgba(0,0,0,.3);
  --pal-a66801:rgba(30,18,8,.6);
  --pal-a70245:rgba(0,0,0,.12);
  --pal-a71258:rgba(16,26,36,.86);
  --pal-a72850:rgba(47,107,58,.7);
  --pal-a7636:rgba(47,107,58,0);
  --pal-a77ce0:#a77ce0;
  --pal-a9806b:#a9806b;
  --pal-b5392c:#b5392c;
  --pal-b79a6b:#b79a6b;
  --pal-b8861b:#b8861b;
  --pal-c0853f:#c0853f;
  --pal-c4962e:#c4962e;
  --pal-c9372c:#c9372c;
  --pal-c97a4a:#c97a4a;
  --pal-c9a45a:#c9a45a;
  --pal-d6a86f:#d6a86f;
  --pal-d9c58e:#d9c58e;
  --pal-d9ccb2:#d9ccb2;
  --pal-dbe4ee:#dbe4ee;
  --pal-e0786b:#e0786b;
  --pal-e0b04a:#e0b04a;
  --pal-e0b24f:#e0b24f;
  --pal-e5533d:#e5533d;
  --pal-efe6d3:#efe6d3;
  --pal-f0b429:#f0b429;
  --pal-f1c9a0:#f1c9a0;
  --pal-f3ead7:#f3ead7;
  --pal-f6e7c8:#f6e7c8;
  --pal-f7f0d8:#f7f0d8;
  --pal-f7f0e0:#f7f0e0;
  --pal-ffcf6b:#ffcf6b;
  --pal-ffd36b:#ffd36b;
  --pal-ffe2a8:#ffe2a8;
  --pal-ffffff:#fff;
}
:root[data-mode="skin"]{
  --tk-shadow:3px 3px 0 rgba(23,48,42,.18);
  --tk-radius:10px;
  --tk-surface:#eef3ef; --tk-panel:#ffffff; --tk-ink:#17302a; --tk-muted:#566a63; --tk-line:#b9cdc4;
  --tk-accent:#0f7b6c; --tk-accent-ink:#fff; --gold:#5d7a72; --good:#1f7a4d; --bad:#b3362b; --info:#2f5f8a;
  --chip:#dfece6; --btn:#f4faf7; --btn-line:#8fb3a6; --dis:#e4ece8; --scrim:rgba(20,40,34,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--tk-surface);color:var(--tk-ink);font:17px/1.6 var(--tk-font-body);max-width:100vw;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:12px 14px 90px}
main.wide{max-width:1040px}
h1{font-family:var(--tk-font-title);font-size:22px;margin:6px 0 2px;letter-spacing:.08em;color:var(--tk-accent)}
h2{font-family:var(--tk-font-title);font-size:16px;margin:16px 0 8px;border-bottom:2px solid var(--tk-accent);padding-bottom:2px;letter-spacing:.1em}
.sub{color:var(--tk-muted);font-size:14px;margin:0 0 8px}
.card{background:var(--tk-panel);border:2px solid var(--tk-line);border-radius:var(--tk-radius);padding:10px 14px;margin:10px 0;clip-path:var(--notch);outline:1px solid var(--tk-accent);outline-offset:-6px}
button{font:inherit;color:var(--tk-ink);background:var(--btn);border:2px solid var(--btn-line);border-left:7px solid var(--tk-accent);border-radius:var(--tk-radius);clip-path:var(--notch);min-height:46px;padding:8px 12px;cursor:pointer;text-align:left;width:100%}
button:hover:not(:disabled){filter:brightness(.97)}
button:focus-visible{outline:3px solid var(--info);outline-offset:2px}
button:disabled{background:var(--dis);color:var(--tk-muted);border-color:var(--tk-line);cursor:not-allowed}
button.primary{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent);border-left-width:2px;text-align:center;font-weight:700;letter-spacing:.2em;font-size:18px}
button.small{min-height:44px;width:auto;padding:6px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.modes{display:flex;gap:8px;margin:8px 0}
.modes button{text-align:center;font-weight:700}
.modes button[aria-pressed="true"]{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent)}
.note{font-size:13px;color:var(--tk-muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top button{width:auto;min-height:44px;text-align:center}
.pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 var(--font-num);background:var(--chip);border-radius:8px;padding:8px}
.opts{display:grid;gap:8px}
.foot{font-size:12px;color:var(--tk-muted);margin-top:18px}
.err{color:var(--bad);font-size:14px;white-space:pre-wrap}
.ok{color:var(--good);font-size:14px}
textarea{width:100%;min-height:120px;font:13px/1.45 var(--font-num);background:var(--tk-panel);color:var(--tk-ink);border:1.5px solid var(--tk-line);border-radius:10px;padding:8px}
details{margin:8px 0} summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.badge{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle;border:1px solid currentColor;white-space:nowrap}
.b-原著{color:var(--good)} .b-改編{color:var(--gold)} .b-工坊創作{color:var(--tk-muted)} .b-田野{color:var(--info)} .b-slot{color:var(--tk-muted)}
.banner{border:2px solid var(--tk-accent);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--tk-panel)}
.banner.win{border-color:var(--good)}
.ck{list-style:none;padding:0;margin:6px 0}
.ck li{padding:4px 0}

/* ---------- 開場 ---------- */
.hero{position:relative;border-radius:var(--tk-radius);overflow:hidden;border:3px solid var(--tk-accent);margin:8px 0}
.hero .scene{display:block;width:100%;height:auto}
.hero .ttl{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:10px 24px;border:3px double var(--tk-accent);background:var(--pal-a71258);color:var(--pal-f3ead7);text-align:center;width:max-content;max-width:92%}
.hero .ttl b{font-family:var(--tk-font-title);font-size:26px;letter-spacing:.2em;display:block;line-height:1.3;color:var(--pal-f0b429)}
.hero .ttl span{font-size:13px;opacity:.92}
.goal li{padding:3px 0}
.howto{margin:6px 0;padding-left:1.3em}
.howto li{padding:2px 0}
.pill{display:inline-block;background:var(--chip);border:1px solid var(--tk-accent);border-radius:3px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}

/* ---------- 遊戲畫面 ---------- */
.game{display:block}
.stagebar{background:var(--tk-panel);border:2px solid var(--tk-line);border-radius:var(--tk-radius);clip-path:var(--notch);padding:8px 10px;margin:8px 0}
.stagebar .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.stagebar .nm b{font-family:var(--tk-font-title);font-size:15px}
.track{display:flex;align-items:center;gap:0;margin:8px 2px 2px}
.pip{flex:1 1 0;height:8px;background:var(--chip);position:relative}
.pip:first-child{border-radius:6px 0 0 6px} .pip.last{border-radius:0 6px 6px 0}
.pip.s0{background:var(--pal-d9c58e)} .pip.s1{background:var(--pal-d6a86f)} .pip.s2{background:var(--pal-a9806b)}
.pip.done{filter:saturate(1)} .pip:not(.done):not(.cur){opacity:.45}
.pip.cur::after{content:"";position:absolute;left:50%;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--tk-accent);border:3px solid var(--tk-panel);box-shadow:0 0 0 1px var(--tk-accent)}
.pip.tf{background:var(--pal-6b7886)}
.monthlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--tk-muted);margin:3px 0 0}
.hud{background:var(--tk-panel);border:2px solid var(--tk-accent);border-radius:var(--tk-radius);padding:8px;margin:8px 0;position:sticky;top:0;z-index:20;box-shadow:var(--tk-shadow)}
.hud .hd{display:flex;justify-content:space-between;align-items:center;margin:0 2px 6px;font-size:14px}
.dots{letter-spacing:3px;font-size:17px;color:var(--tk-accent)}
.dots i{font-style:normal;opacity:.3}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res .c{position:relative;background:var(--chip);border-radius:var(--tk-radius);border-bottom:3px solid var(--tk-line);padding:5px 8px 6px;min-height:44px}
.res .c .l{font-size:12px;color:var(--tk-muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .c b{font:700 21px/1.1 var(--font-num);color:var(--tk-accent)}
.res .c .bar{position:relative;height:5px;background:var(--pal-a15761);border-radius:3px;margin-top:3px;overflow:visible}
.res .c .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--good);transition:width .5s}
.res .c .bar i.mid{background:var(--gold)} .res .c .bar i.lo{background:var(--bad)}
.res .c .bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tk-ink);opacity:.7;text-decoration:none}
.res .c.low b{color:var(--bad)}
:root[data-mode="skin"] .res .c b{color:var(--tk-ink)}
.res .c .fl{position:absolute;right:6px;top:-2px;font-weight:800;font-size:15px;pointer-events:none;animation:rise 1.5s ease-out forwards;text-shadow:0 0 3px var(--tk-panel),0 0 3px var(--tk-panel)}
.res .c .fl.up{color:var(--good)} .res .c .fl.dn{color:var(--bad)}
@keyframes rise{0%{transform:translateY(8px);opacity:0}15%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
.hud.shake{animation:shake .38s} @keyframes shake{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.hud.glow{animation:glow .7s} @keyframes glow{0%{box-shadow:0 0 0 0 var(--pal-a72850)}100%{box-shadow:0 0 0 12px var(--pal-a7636)}}
.scenebox{box-shadow:var(--tk-shadow);border-radius:var(--tk-radius);overflow:hidden;border:3px solid var(--tk-line);margin:8px 0;position:relative}
.scenebox .scene{display:block;width:100%;height:auto;max-height:150px}
.scenebox .cap{position:absolute;left:8px;bottom:6px;background:var(--pal-a66801);color:var(--pal-ffffff);font-size:12px;padding:1px 8px;border-radius:999px}
.queue h2{margin-top:12px}
.wait{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.cust{display:flex;gap:8px;align-items:center;background:var(--chip);border-radius:var(--tk-radius);border-left:5px solid var(--tk-accent);padding:6px 8px;min-height:50px}
.cust.zero{opacity:.4}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:6px;transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;font-size:19px;border:2px solid var(--tk-panel);box-shadow:0 0 0 1px var(--tk-line)}
.cust b{font-size:14px;display:block;line-height:1.25}
.cust small{display:block;color:var(--tk-muted);font-size:12px;line-height:1.3}
.tokens{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.tokens i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid var(--pal-a35550)}
.act{display:flex;flex-direction:column;gap:2px}
.act .t{font-weight:700}
.act .d{font-size:13px;color:var(--tk-muted)}
.act .why{font-size:12px;color:var(--bad)}
.abtn{display:flex;gap:10px;align-items:center}
.abtn .ic{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--tk-accent);background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:19px}
.abtn.locked{opacity:.8}
.abtn.locked .ic{filter:grayscale(1)}
.endbtn{margin-top:12px}
.log{list-style:none;margin:0;padding:0}
.log li{padding:6px 0;border-bottom:1px dashed var(--tk-line);font-size:15px}
.log li.bad{color:var(--bad)} .log li.good{color:var(--good)} .log li.event{font-weight:600} .log li.act{color:var(--tk-muted)} .log li.field{color:var(--info)}
.tip{background:var(--chip);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:calc(100% - 20px);max-width:520px;z-index:30;background:var(--tk-panel);color:var(--tk-ink);border:2px solid var(--tk-accent);border-radius:var(--tk-radius);padding:8px 12px;box-shadow:var(--tk-shadow);pointer-events:none;animation:toast 6.5s ease-out forwards;font-size:14px}
.toast .tl{font-weight:700}
.toast .ln{margin-top:2px}
.toast .ln.good{color:var(--good)} .toast .ln.bad{color:var(--bad)} .toast .ln.event{font-weight:600}
@keyframes toast{0%{opacity:0;transform:translate(-50%,14px)}6%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

/* ---------- 卡片（事件、階段、月結算） ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.pop{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--tk-panel);border-radius:var(--tk-radius);border:4px double var(--tk-accent);box-shadow:var(--tk-shadow);animation:pop .3s ease-out}
@keyframes pop{from{transform:translateY(24px) scale(.96);opacity:0}}
.pop .band{padding:16px 14px 12px;text-align:center;color:var(--pal-ffffff)}
.pop .band.ev{background:linear-gradient(135deg,var(--pal-8a5a2b),var(--pal-c0853f))}
.pop .band.ev.原著{background:linear-gradient(135deg,var(--pal-2f6b3a),var(--pal-4f9a5c))}
.pop .band.ev.改編{background:linear-gradient(135deg,var(--pal-8a6a1f),var(--pal-c4962e))}
.pop .band.ev.工坊創作{background:linear-gradient(135deg,var(--pal-55606b),var(--pal-7b8794))}
.pop .band.st0{background:linear-gradient(135deg,var(--pal-8a6a2e),var(--pal-c9a45a))}
.pop .band.st1{background:linear-gradient(135deg,var(--pal-8a4a2e),var(--pal-c97a4a))}
.pop .band.st2{background:linear-gradient(135deg,var(--pal-34475e),var(--pal-6b7886))}
.pop .band.rp{background:linear-gradient(135deg,var(--pal-4a3f2d),var(--pal-7a6a4d))}
.pop .band .big{width:64px;height:64px;border-radius:50%;background:var(--pal-a24882);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 6px;border:3px solid var(--pal-a12085)}
.pop .band .kicker{font-size:12px;opacity:.9;letter-spacing:.12em}
.pop .band h3{font-family:var(--tk-font-title);margin:2px 0 0;font-size:19px;line-height:1.3}
.pop .bd{padding:12px 14px 14px}
.pop .bd p{margin:6px 0}
.ln-good{color:var(--good)} .ln-bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;background:var(--chip)}
.chips span.up{color:var(--good)} .chips span.dn{color:var(--bad)}
.rtab{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.rtab td{padding:3px 4px;border-bottom:1px dashed var(--tk-line)}
.rtab td:last-child{text-align:right;white-space:nowrap}
.rtab .up{color:var(--good)} .rtab .dn{color:var(--bad)}
.unl{background:var(--chip);border-radius:10px;padding:6px 10px;font-size:14px;margin:8px 0}

/* ---------- 結局 ---------- */
.stars{font-size:26px;letter-spacing:4px;color:var(--gold);line-height:1.2}
.rec{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.best{font-size:13px;color:var(--tk-muted)}

@media (min-width:900px){
  .game{display:grid;grid-template-columns:400px 1fr;grid-template-areas:"stg stg" "hud hud" "scn play" "que play";column-gap:18px;grid-template-rows:auto auto auto 1fr;align-items:start}
  .stagebar{grid-area:stg} .hud{grid-area:hud;position:static} .scenebox{grid-area:scn} .scenebox .scene{max-height:none} .queue{grid-area:que} .play{grid-area:play}
  .res{grid-template-columns:repeat(5,1fr)}
  .hud{margin-bottom:12px}
  .opts{grid-template-columns:1fr 1fr}
  h1{font-size:24px}
  .toast{left:auto;right:18px;transform:none;bottom:18px;width:380px}
  @keyframes toast{0%{opacity:0;transform:translateY(14px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
}
@media (max-width:420px){ main{padding:10px 10px 90px} .res .c b{font-size:17px} .pop .band h3{font-size:17px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} .toast{opacity:1} }
</style>
</head>

<script type="application/json" id="data-culture">{"_說明":"小封神版（文化長在規則裡）。這份檔案就是整個遊戲的內容與規則：改這裡，遊戲就跟著變。每一段的作用寫在 README.md 的『欄位對照』。tag 欄標示來源：原著＝書裡有寫；改編＝依書裡的事改成遊戲規則；工坊創作＝書裡沒有、我們自己加的。","meta":{"id":"temple_sim","version":"culture","label":"小封神版","title":"小上帝廟的半年","subtitle":"你是廟祝，替小上帝、康元帥、趙元帥撐過半年，等七月三日夜的颱風。","months":6,"slots_per_month":5,"noise":1,"play_minutes":"8–12","goal":"撐過 6 個月：七月三日夜颱風來時，廟不倒、三位神明有飯吃。","finale_label":"七月三日夜"},"intro":["小上帝奉命駐在赤崁樓東邊的小鎮，鎮上的廟「三分不像寺、四分不像宮」，香煙稀微，燒金的人很少。","原書裡，半年後的七月三日夜，颱風把廟吹倒；之後三位神明挨餓，只靠廟祝的一壺清茶撐著。","這一次由你當廟祝。你每個月有 5 個時辰，要決定：先接待誰、米夠不夠、廟要不要修、那頂銅鍍金的通天冠留不留。"],"resources":{"money":{"label":"香油錢","icon":"🪙","start":24,"max":999,"note":"信眾投的錢。糴米、修廟都要它。"},"rice":{"label":"米","icon":"🍚","start":6,"max":30,"note":"三位神明每個月要吃 3 份。"},"incense":{"label":"香火","icon":"🕯️","start":18,"max":100,"decay_pct":25,"note":"信眾上門才有。放著不管，每個月會散掉四分之一，而且不能拿來花。"},"face":{"label":"體面","icon":"🎩","start":60,"max":100,"note":"神明的臉面。掉到 0，你們就被調走了。"},"repair":{"label":"廟況","icon":"🧱","start":30,"max":100,"note":"屋瓦、梁柱的狀況。每個月會自己舊掉一點。颱風夜要撐得住。"}},"flags":{"crown":"worn","kangzhao":"here"},"counters":{"grudge":0,"favor":0,"gambles":0,"verified":0},"reset_counters_monthly":["verified"],"customers":{"shuibian":{"label":"水邊人家","icon":"🌊","want":"夜裡水邊有怪聲，怕龜精蛇怪作怪","fit":"管得到","tag":"改編","src":"小上帝奉命『專管龜精蛇怪，並察人間善惡』（第一回）"},"yuan":{"label":"含冤的人","icon":"⚖️","want":"被人誣賴，想請神明看個公道","fit":"管得到","tag":"改編","src":"『察人間善惡』（第一回）；小上帝誤認魁星、被斥『用神不明』（第二、二十三回）"},"scholar":{"label":"趕考的書生","icon":"📜","want":"想求功名順利","fit":"管不到","tag":"改編","src":"功名是魁星的事；魁星出自赤崁樓文昌閣（第二回照片說明）"},"trader":{"label":"做生意的人","icon":"🧺","want":"想求生意興隆","fit":"管不到","tag":"工坊創作","src":"遊戲簡化：原書裡他專管龜蛇，功名、生意不是他的專長"},"passerby":{"label":"路過歇腳的人","icon":"🚶","want":"走累了，想坐一下","fit":"不求事","tag":"改編","src":"三神挨餓時，廟裡只有廟祝的清茶（第二回）"},"evac":{"label":"來避風的人","icon":"🧳","want":"颱風要來了，想借廟裡的長椅躲一躲","fit":"不求事","tag":"工坊創作","src":"遊戲加的：颱風前夕的情境，書裡沒有"}},"calendar":{"shuibian":[2,2,1,2,2,1],"yuan":[0,1,0,1,0,1],"scholar":[2,2,2,1,2,1],"trader":[ <script type="application/json" id="data-remix">{"title":"怎麼改做：小上帝廟的半年","lead":"這個遊戲的內容和規矩都放在一個叫 sim.json 的資料檔裡，網頁只是讀它、播它。所以你不用會寫程式，會改文字和數字就能改做。改完把整份貼回頁面最下面的「我的資料檔」，按「載入」就能玩。每改一次，按一下「試跑 100 局」，看看遊戲有沒有被你改壞。","tiers":[{"n":1,"name":"換內容","one_line":"不動規矩，只換人、換話、換比例。","task":"找一間你去得到的廟（進廟要安靜、不要擋路、拍照先問過），待半小時，記下來的人各是哪一類（問事情的、拜拜的、路過的、做生意的……）。再問廟祝或管理員一句話：「最近最常有人來問什麼？」把你記到的人數填進資料檔最下面的 field.observed_counts，把那句話填進 interview_line。再把來客的名字和「想要什麼」換成你看到的。","ai_cannot":"你去現場看到的人數、廟祝說的那句話，AI 沒去過，編出來的也不算數。","prompt":"我貼給你一份小遊戲的資料檔（JSON）。我去了〔廟名〕待半小時，看到的人大概是：〔例：問考試的 5 位、路過歇腳的 8 位、問身體的 2 位〕。廟祝跟我說：「〔那句話〕」。請只改 customers 的 label、want、icon，calendar 的數字，和 field 裡的 observed_counts、interview_line。不要動 actions、events、finale 裡的規則和條件。改完把整份資料檔原樣回傳，不要省略。"},{"n":2,"name":"換規矩","one_line":"選一條規矩改掉，看遊戲變成什麼樣。","task":"從下面挑一條改：①香火每個月散掉多少（resources.incense.decay_pct，25 改成 0 或 50）；②鎮龜蛇幾次龜靈聖母才會出面（events 裡 e_turtle 的 ['counter','grudge','>=',3]）；③康、趙兩位元帥賭輸的機率（actions 裡 buy_kz 的 p：0.15 和 0.55）；④沒查證就斷理的冤枉機率（judge 裡的 p：0.5）。改完按「試跑 100 局」，記下勝率從多少變多少，再用一句話寫：這條規矩被改掉以後，玩的人的選擇變少了還是變多了？","ai_cannot":"「改完好不好玩」要你自己玩一局才知道；AI 只能算勝率。","prompt":"這是小遊戲的資料檔（JSON）。請把〔例：香火每個月散掉四分之一〕改成〔例：每個月散掉一半〕，只改必要的欄位，並列出你改了哪幾個欄位。再告訴我：這樣改會讓哪些選擇變得更重要、哪些選擇變得沒意義？我會把「試跑 100 局」的勝率貼給你，請幫我判斷有沒有太簡單或太難。"},{"n":3,"name":"換形式","one_line":"同一套資料格式，換成別的場景；或拆一段去做別的遊戲。","task":"兩條路選一條。（甲）換場景：資料檔的格式不變，把「廟」換成「辦桌」——來客改成賓客（長輩、晚輩、有過節的兩家人），動作改成安排座位、上菜，資源改成體面、菜、時間。（乙）拆一段：把「含冤的人」那一段（兩個長得很像的人，先查證再斷理）拆出來，做成一個解謎小遊戲，用解謎樣板去做。","ai_cannot":"辦桌真正的規矩（誰坐哪、先上哪道菜）要問長輩或辦桌的人，AI 寫的常常是想像出來的。","prompt":"請用和這份資料檔完全相同的格式（meta、resources、customers、calendar、actions、events、finale），把場景改成「辦桌」。來客改成〔例：長輩、晚輩、兩個有過節的親戚〕，動作改成〔例：安排主桌、安排前排、請人換桌〕。要有一個「沒有人會攔你、但做錯會被記一筆」的規矩。回傳完整的 JSON，並用三句話說明：把辦桌的規矩拿掉後，這個遊戲還玩得下去嗎？"}],"extend_title":"加一個東西：兩種最常見的擴充","extend":[{"title":"加一種來客","why":"例如「受驚的孩子」。三個地方各加一筆就好：customers（他是誰）、calendar（每個月來幾個）、actions（你怎麼接待他）。","snippet":"\"customers\"（在裡面多加這一筆）: { \"shock\": { \"label\": \"受驚的孩子\", \"icon\": \"🧒\", \"want\": \"被嚇到，家長想讓他安心\", \"fit\": \"管得到\", \"tag\": \"工坊創作\", \"src\": \"我自己查的來源\" } }\n\"calendar\"（在裡面多加這一筆）: { \"shock\": [0, 1, 1, 0, 1, 0] }\n\"actions\"（在陣列裡多加這一筆）: { \"id\": \"calm\", \"label\": \"替孩子收驚\", \"desc\": \"一次 2 位\", \"slots\": 1, \"target\": \"shock\", \"cap\": 2, \"effects\": [ { \"each_group\": [ { \"add\": { \"incense\": 6, \"money\": 2 } } ] } ] }","note":"收驚是真的有人在做的習俗。遊戲裡只是簡化的示意，真正怎麼做、說什麼，請去問長輩或廟方，不要照 AI 寫的。"},{"title":"加一個事件","why":"例如「廟口有人辦桌」。events 裡加一筆：什麼時候發生（month）、發生什麼（effects）、一句話（text）。","snippet":"{ \"id\": \"e_feast\", \"phase\": \"start\", \"month\": [3, 3], \"once\": true, \"tag\": \"工坊創作\", \"title\": \"廟口有人辦桌\", \"text\": \"隔壁辦桌，路過的人變多，可是廟裡的米被借走兩份。\", \"effects\": [ { \"arrive\": { \"passerby\": 4 } }, { \"add\": { \"rice\": -2 } } ] }","note":"tag 要老實填：原著（書裡有）、改編（依書裡的事改的）、工坊創作（你加的）。這是你的作品，標清楚就是你的功勞。"}],"tool_chain":{"title":"這一單元多學的一個工具串接","text":"把頁面上「試跑 100 局」的結果貼給 Claude 或 Gemini，連同你改的那一行，問它：這樣改合理嗎？下一步該調哪個數字？它建議、你改、再試跑——這個來回，就是用工具改遊戲最常用的流程。"},"judge_prompt":"兩個版本都玩過之後，回答這一題：同一間廟、同一批人，哪一版讓你想多玩一局？是哪一個選擇或哪一件事讓你這樣想？"}</script>

  h += '<p class="note">種子 ' + g.seed + '（網址後面加 ?seed=' + g.seed + ' 可以重玩同一局）</p>';
  h += '<h2>用一句話說這局的故事</h2><p class="note">誰想要什麼？卡到了什麼？最後怎樣？（不用交，說給旁邊的人聽。）</p>';
  h += '<button class="primary" data-act="__restart">再玩一局</button></div>';
  return h;
}
function judgeHtml() {
  if (!(S.played.culture && S.played.skin)) {
    var other = S.mode === 'culture' ? '普通經營版' : '小封神版';
    return '<div class="card"><b>下一步：</b>換到「' + other + '」也玩一局，兩邊比一比。<div class="note">兩個版本都玩完，這裡會出現一個題目。</div></div>';
  }
  var cs = S.played.culture, sk = S.played.skin;
  var h = '<div class="banner"><h2 style="margin-top:0">比一比</h2>';
  h += '<p>你在小封神版的結果：<b>' + esc(cs.title) + '</b>；在普通經營版：<b>' + esc(sk.title) + '</b>。</p>';
  h += '<p><b>' + esc(REMIX.judge_prompt) + '</b></p><div class="opts" role="group">';
  var opts = ['小封神版比較想再玩', '普通經營版比較想再玩', '兩個差不多', '說不準'];
  h += opts.map(function (o, i) { return '<button data-act="__judge' + i + '" aria-pressed="' + (S.judged === i) + '">' + o + '</button>'; }).join('') + '</div>';
  if (S.judged != null) {
    if (!S.sim) { S.sim = { culture: simulate(DATA.culture, botRandom, 300), skin: simulate(DATA.skin, botRandom, 300), cg: simulate(DATA.culture, botGeneric, 300), sg: simulate(DATA.skin, botGeneric, 300) }; }
    h += '<p>我們讓機器各玩 300 局看看：<br>普通經營版，隨便亂點的勝率 <b>' + S.sim.skin.win + '%</b>，照一般經營遊戲的玩法 <b>' + S.sim.sg.win + '%</b>。<br>小封神版，隨便亂點 <b>' + S.sim.culture.win + '%</b>，照一般經營遊戲的玩法 <b>' + S.sim.cg.win + '%</b>。</p>';
    h += '<p class="note">數字高，代表「幾乎不用想也會贏」。你怎麼看？這是你的判斷，沒有標準答案；有人會說普通版還是能玩，只是少了味道。</p>';
  }
  return h + '</div>';
}
function remixHtml() {
  var h = '<div class="card"><h2 style="margin-top:0">' + esc(REMIX.title) + '</h2><p>' + esc(REMIX.lead) + '</p>';
  REMIX.tiers.forEach(function (t) {
    h += '<details><summary>第 ' + t.n + ' 階：' + esc(t.name) + '　<span class="note">' + esc(t.one_line) + '</span></summary><p>' + esc(t.task) + '</p><p class="note">🔎 ' + esc(t.ai_cannot) + '</p><p><b>可以貼給 Claude／Gemini 的指令：</b></p><div class="pre" id="p' + t.n + '">' + esc(t.prompt) + '</div><button class="small" data-copy="p' + t.n + '">複製這段指令</button></details>';
  });
  h += '<h2>' + esc(REMIX.extend_title) + '</h2>';
  REMIX.extend.forEach(function (x, i) {
    h += '<details><summary>' + esc(x.title) + '</summary><p>' + esc(x.why) + '</p><div class="pre" id="x' + i + '">' + esc(x.snippet) + '</div><button class="small" data-copy="x' + i + '">複製範例</button><p class="note">' + esc(x.note) + '</p></details>';
  });
  h += '<p><b>' + esc(REMIX.tool_chain.title) + '</b><br>' + esc(REMIX.tool_chain.text) + '</p></div>';
  return h;
}
function jsonPanel() {
  var h = '<details id="jsondet"' + (S.jsonOpen ? ' open' : '') + '><summary>我的資料檔（貼上改好的 JSON）</summary><p class="note">把整份貼進來，按「載入」，會換掉目前這個版本的內容。載入前會先檢查常見的手誤。</p><textarea id="jsonbox" aria-label="我的資料檔" spellcheck="false"></textarea><div class="row"><button class="small" data-act="__load">載入並重新開始</button><button class="small" data-act="__fill">放入目前的資料檔</button><button class="small" data-act="__simulate">試跑 100 局</button></div>';
  if (S.jsonMsg) h += S.jsonMsg.err ? '<p class="err">' + esc(S.jsonMsg.err) + '</p>' : '<p class="ok">' + esc(S.jsonMsg.ok) + '</p>';
  return h + '</details>';
}
function titleHtml(d) {
  var goalLis = (d.finale.checks || []).map(function (c) { return '<li>' + esc(c.label) + '</li>'; }).join('');
  var h = '<div class="hero">' + sceneSvg({ repair: 62, incense: 22, rice: 6, crown: 'worn', kz: true, weather: 0, culture: S.mode === 'culture', label: '小上帝廟的開場畫面' }) + '<div class="ttl"><b>' + esc(d.meta.title) + '</b><span>' + esc(d.meta.subtitle) + '</span></div></div>';
  h += '<div class="card">' + (d.intro || []).map(function (p) { return '<p style="margin:6px 0">' + esc(p) + '</p>'; }).join('') + '</div>';
  h += '<div class="card goal"><b>🎯 你的目標</b><p style="margin:4px 0">' + esc(d.meta.goal || '撐過這半年。') + '</p><p class="note" style="margin:2px 0">七月三日夜會逐項檢查：</p><ul class="ck goal" style="margin:2px 0">' + goalLis + '</ul>';
  h += '<span class="pill">⏱ 約 ' + esc(d.meta.play_minutes || '8–12') + ' 分鐘</span><span class="pill">📅 ' + d.meta.months + ' 個月</span><span class="pill">⏳ 每月 ' + d.meta.slots_per_month + ' 個時辰</span></div>';
  h += '<div class="card"><b>怎麼玩</b><ol class="howto"><li>每個月會有人上門、有事發生。看右邊（手機在下面）在等的人與他們要什麼。</li><li>用時辰做事：接待某一類人，或處理廟務。時辰用完、或你覺得夠了，就按「結束這個月」。</li><li>資源會此消彼長，月底還會自動扣米、舊屋瓦。每個選擇都有後果，先想一想。</li></ol></div>';
  if (S.jsonMsg && S.jsonMsg.err) h += '<p class="err">' + esc(S.jsonMsg.err) + '</p>';
  var best = lsGet('simbest-' + S.mode);
  if (best) h += '<p class="best">這個版本的最好紀錄（這台裝置）：' + esc(best.title) + '，達成 ' + best.score + ' / ' + best.total + ' 項</p>';
  return h + '<button class="primary" data-act="__restart">開始這半年</button>';
}

function render() {
  var app = document.getElementById('app'), d = DATA[S.mode], g = S.g;
  var keepJson = document.getElementById('jsonbox') ? document.getElementById('jsonbox').value : '';
  var final = g && g.phase === 'ended' && !S.queue.length;
  if (final && !S.recorded[S.mode + g.seed]) {      // 結局只記一次：存結果、存最好紀錄、播音效
    S.recorded[S.mode + g.seed] = true; S.played[S.mode] = g.result;
    var bk = 'simbest-' + S.mode, old = lsGet(bk);
    if (!g.result.early && (!old || g.result.score > old.score)) lsSet(bk, { score: g.result.score, total: g.result.total, title: g.result.title });
    S.best = lsGet(bk) || { score: g.result.score, total: g.result.total, title: g.result.title };
    sfx(g.result.win ? 'good' : 'bad');
  }
  document.getElementById('app').classList.toggle('wide', !!g);
  var h = '<div class="top"><h1>' + esc(d.meta.title) + '</h1><button data-act="__mute" aria-pressed="' + (!S.muted) + '" aria-label="聲音開關">' + (S.muted ? '🔇 靜音' : '🔊 有聲') + '</button></div>';
  if (g) h += '<p class="sub">' + esc(d.meta.label) + '　·　' + esc(d.meta.subtitle) + '</p>';
  h += '<div class="modes" role="group" aria-label="選版本"><button data-act="__m_culture" aria-pressed="' + (S.mode === 'culture') + '">' + esc(DATA.culture.meta.label) + '</button><button data-act="__m_skin" aria-pressed="' + (S.mode === 'skin') + '">' + esc(DATA.skin.meta.label) + '</button></div>';
  if (!g) {
    h += titleHtml(d);
  } else {
    var cardOpen = S.queue.length > 0;
    h += '<div class="game"' + (cardOpen ? ' inert' : '') + '>' + MOD.time.render(g) + MOD.feedback.render(g);
    h += '<div class="scenebox">' + MOD.feedback.scene(g, g.phase === 'ended' ? { weather: 2 } : null) + '<span class="cap">' + (S.mode === 'culture' ? '小上帝廟' : '小上帝廟（普通經營版）') + '</span></div>';
    if (g.phase === 'ended') {
      h += '<div class="play" style="grid-area:play">' + (final ? MOD.verdict.render(g) + judgeHtml() : '') + '<h2>' + (S.logAll ? '全部紀錄' : '這個月發生的事') + '</h2><div class="card">' + MOD.events.render(g) + '<button class="small" data-act="__logall">' + (S.logAll ? '只看這個月' : '看全部紀錄') + '</button></div></div>';
    } else {
      h += '<div class="queue"><h2>現在在等的人</h2>' + MOD.actions.renderQueue(g) + '</div>';
      h += '<div class="play">' + ((!S.tipSeen) ? '<div class="tip">💡 上面是你的資源（黑線＝七月三日夜的檢查線）。選一件事做，會用掉時辰；做完要結束這個月。人和事每個月都不一樣。</div>' : '') + MOD.actions.render(g);
      h += '<div class="endbtn"><button class="primary" data-act="__end">結束這個月</button></div>';
      h += '<h2>' + (S.logAll ? '全部紀錄' : '這個月發生的事') + '</h2><div class="card">' + MOD.events.render(g) + '<button class="small" data-act="__logall">' + (S.logAll ? '只看這個月' : '看全部紀錄') + '</button></div></div>';
    }
    h += '</div>';
    if (cardOpen) h += cardHtml(S.queue[0], g);
    else h += toastHtml();
  }
  h += '<h2>想自己改一改？</h2>' + (S.showRemix ? remixHtml() : '') + '<button data-act="__remix">' + (S.showRemix ? '收起「怎麼改做」' : '看「怎麼改做」') + '</button>' + jsonPanel();
  h += '<p class="foot">遊戲為示意與簡化，不是民俗儀式教學。故事取材自許丙丁《小封神》；每個事件旁的標籤說明它是「原著」、「改編」還是「工坊創作」。聲音由瀏覽器現場合成。</p>';
  app.innerHTML = h;
  S.flash = null; S.mood = '';
  var jb = document.getElementById('jsonbox'); if (jb && keepJson) jb.value = keepJson;
  var cb = document.getElementById('cardbtn');
  if (cb) { try { cb.focus({ preventScroll: true }); } catch (e) { cb.focus(); } }
  else if (S.focusAct) {
    var fb = app.querySelector('button[data-act="' + S.focusAct + '"]:not([disabled])');
    if (fb) { try { fb.focus({ preventScroll: true }); } catch (e) { fb.focus(); } }
  }
  S.focusAct = null;
  var key = S.queue.length ? S.queue[0].kind + (S.queue[0].id || S.queue[0].month) : '';
  if (key && key !== S.lastCardKey) sfx(S.queue[0].kind === 'stage' ? 'stage' : S.queue[0].kind === 'report' ? 'click' : 'card');
  S.lastCardKey = key;
}

/* ---------- 事件 ---------- */
function copyFrom(id, btn) {
  var el = document.getElementById(id), txt = el.textContent;
  function mark() { btn.textContent = '已複製 ✓'; setTimeout(function () { btn.textContent = btn.getAttribute('data-label') || '複製'; }, 1500); }
  btn.setAttribute('data-label', btn.textContent);
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(mark, function () { selectNode(el); }); } else { selectNode(el); }
}
function selectNode(el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }

document.getElementById('app').addEventListener('toggle', function (ev) { if (ev.target.id === 'jsondet') S.jsonOpen = ev.target.open; }, true);
document.getElementById('app').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-copy')) { copyFrom(b.getAttribute('data-copy'), b); return; }
  var a = b.getAttribute('data-act'); if (!a) return;
  if (a === '__mute') { S.muted = !S.muted; if (!S.muted) { ensureAudio(); if (AC && AC.state === 'suspended') AC.resume(); sfx('click'); bgmOn(); } else bgmOff(); render(); return; }
  if (a === '__m_culture' || a === '__m_skin') {
    var nm = a === '__m_skin' ? 'skin' : 'culture';
    if (S.g) { startGame(nm); window.scrollTo(0, 0); return; }          // 玩到一半或玩完：直接開新的一局
    S.mode = nm; document.documentElement.setAttribute('data-mode', nm === 'skin' ? 'skin' : 'culture'); render(); return;   // 還在開場畫面：只換畫面
  }
  if (a === '__restart') { startGame(S.mode); window.scrollTo(0, 0); return; }
  if (a === '__remix') { S.showRemix = !S.showRemix; render(); return; }
  if (a === '__logall') { S.logAll = !S.logAll; render(); return; }
  if (a.indexOf('__judge') === 0) { S.judged = parseInt(a.slice(7), 10); render(); return; }
  if (a === '__fill') { document.getElementById('jsonbox').value = JSON.stringify(DATA[S.mode], null, 2); return; }
  if (a === '__load') {
    var txt = document.getElementById('jsonbox').value, obj;
    try { obj = JSON.parse(txt); } catch (e) { S.jsonMsg = { err: '這不是正確的 JSON：' + e.message }; render(); document.getElementById('jsonbox').value = txt; return; }
    var errs = E.validate(obj);
    if (errs.length) { S.jsonMsg = { err: errs.join('\n') }; render(); document.getElementById('jsonbox').value = txt; return; }
    DATA[S.mode] = obj; S.sim = null; S.jsonMsg = { ok: '已載入。這個版本現在用的是你的資料檔。' }; startGame(S.mode); document.getElementById('jsonbox').value = txt; return;
  }
  if (a === '__simulate') {
    var d2 = DATA[S.mode];
    try {
      var r1 = simulate(d2, botRandom, 100), r2 = simulate(d2, botGeneric, 100);
      S.jsonMsg = { ok: '試跑 100 局｜亂點的勝率 ' + r1.win + '%｜照一般經營玩法的勝率 ' + r2.win + '%。（太接近 100% 代表沒什麼好決定的；太接近 0% 代表太難。）' };
    } catch (e) { S.jsonMsg = { err: '試跑時出錯：' + e.message }; }
    var keep = document.getElementById('jsonbox').value; render(); document.getElementById('jsonbox').value = keep; return;
  }
  if (a === '__card') { S.queue.shift(); render(); return; }
  if (!S.g || S.queue.length) return;
  S.tipSeen = true;
  if (a === '__end') {
    var before = snap(S.g); sfx('click');
    var m0 = S.g.month;
    MOD.time.step(S.g, { type: 'endMonth' });
    var all = S.g.cards.splice(0), endc = all.filter(function (c) { return c.phase === 'end'; }), rest = all.filter(function (c) { return c.phase !== 'end'; });
    var rp = S.g.report ? { kind: 'report', id: 'rp' + m0, month: m0, before: S.g.report.before, after: S.g.report.after, last: S.g.phase !== 'play', btn: S.g.phase !== 'play' ? (S.g.result && S.g.result.early ? '看結果' : '迎接' + (MOD.time.cfg.meta.finale_label || '最後一夜')) : '進入下一個月' } : null;
    S.queue = endc.concat(rp ? [rp] : [], rest);
    S.toast = null;
    var bad = endc.concat(rest).some(function (c) { return (c.lines || []).some(function (l) { return l.kind === 'bad'; }); });
    if (bad) sfx('bad');
    render(); window.scrollTo(0, 0); return;
  }
  var before2 = snap(S.g), n0 = S.g.log.length, res = MOD.actions.step(S.g, { type: 'act', id: a });
  if (res.ok) {
    var ls = S.g.log.slice(n0), dl = diff(before2, S.g.res), def = MOD.actions.cfg.actions.filter(function (x) { return x.id === a; })[0];
    S.flash = dl; S.toast = { title: (def.icon ? def.icon + ' ' : '') + def.label, lines: ls.map(function (l) { return { text: l.text, kind: l.kind }; }), delta: dl };
    var hasBad = ls.some(function (l) { return l.kind === 'bad'; }), hasGood = ls.some(function (l) { return l.kind === 'good'; });
    S.mood = hasBad ? 'shake' : (hasGood ? 'glow' : '');
    if (hasBad) sfx('bad'); else if (hasGood) sfx('good'); else sfx('click');
    S.focusAct = a;
  }
  render();
});

window.__SIM = { S: S, E: E, DATA: DATA, simulate: simulate };   // 給自動驗收用
document.documentElement.setAttribute('data-mode', 'culture');
render();
})();
</script>
