<style>
:root{--bg:#f6f1e6;--fg:#241f19;--mute:#6a604f;--card:#fffdf7;--line:#d9ceb8;--acc:#b23a26;--acc2:#1d6a63;--chip:#ece3cf;--ok:#1f7a4a;--bad:#a8321f}
@media (prefers-color-scheme:dark){:root{--bg:#12161a;--fg:#ece7dc;--mute:#a1a9b0;--card:#1b2127;--line:#33404a;--acc:#e5755f;--acc2:#58d0bf;--chip:#27323b;--ok:#5ccf8f;--bad:#ff8d78}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 48px}
h1{font-size:22px;margin:4px 0 2px;line-height:1.3}
h2{font-size:18px;margin:18px 0 6px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.btn{display:block;width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-weight:600;text-align:left;margin:8px 0;cursor:pointer}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
.btn.ghost{text-align:center;font-weight:500}
.btn.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px}
.row .btn{margin:6px 0;text-align:center}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;font-size:13px}
.tag{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;margin-right:6px;color:#fff;background:var(--acc2)}
.tag.art{background:#7a5a1c}.tag.sch{background:#4c5fa8}
.stop{display:block;width:100%;min-height:56px;text-align:left}
.st{float:right;font-size:13px;color:var(--mute)}
.npc{border-left:4px solid var(--acc2);padding:4px 10px;margin:8px 0;background:var(--chip);border-radius:0 8px 8px 0}
.npc b{display:block;font-size:14px}
.field{font-size:13px;color:var(--acc);font-weight:700}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
textarea{min-height:96px}
.rw{color:var(--ok);margin-top:6px}
.err{color:var(--bad)}
.fb{color:var(--bad);margin:4px 0}
details{margin:12px 0}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--mute)}
input[type=file]{width:100%;min-height:44px;padding:8px 0}
label.chk{display:flex;align-items:center;gap:10px;min-height:44px}
label.chk input{width:22px;height:22px}
img.pv{max-width:100%;border-radius:8px;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.small{font-size:13px;color:var(--mute)}
</style>
</head>

<script>
(function () {

  function validate(d) {

    function bad(m) { e.push(m); }
    if (!d || typeof d !== 'object') return { e: ['整份資料不是物件'], w: w };
    if (!d.meta || !d.meta.title) bad('meta.title 不能空白');
    if (!d.rules || ['gated', 'free'].indexOf(d.rules.mode) < 0) bad('rules.mode 只能是 "gated"（照順序）或 "free"（隨便走）');

    d.stops.forEach(function (s, i) {

      if (!s.id || !/^[A-Za-z0-9_-]+$/.test(s.id)) bad(p + '：id 要用英文、數字或底線');
      else if (ids[s.id]) bad(p + '：id「' + s.id + '」重複了'); else ids[s.id] = 1;
      if (!s.name) bad(p + '：沒有 name');
      var hasLat = typeof s.lat === 'number', hasLon = typeof s.lon === 'number';
      if (hasLat !== hasLon) bad(p + '：lat 和 lon 要一起有、或一起是 null');
      if (!hasLat && d.rules && d.rules.geofence) w.push(p + '：沒有座標，到了要自己按「我到了」');
      chkFlags(s.requires, p + ' 的 requires');
      if (s.on_complete) chkFlags(s.on_complete.grant, p + ' 的 on_complete.grant');
      if (!Array.isArray(s.tasks) || !s.tasks.length) { bad(p + '：tasks 至少要有一題'); return; }

        var q = p + ' 的第 ' + (j + 1) + ' 題（' + (t.id || '沒有 id') + '）';
        if (!t.id || tid[t.id]) bad(q + '：id 沒填或重複'); else tid[t.id] = 1;
        if (!t.title) bad(q + '：沒有 title');
        chkFlags(t.show_if, q + ' 的 show_if');
        var ty = t.type;
        if (['choice', 'text', 'order', 'observe', 'decision'].indexOf(ty) < 0) { bad(q + '：type「' + ty + '」不認得（choice／text／order／observe／decision）'); return; }

          if (!Array.isArray(t.options) || t.options.length < 2) bad(q + '：options 至少兩個');
          else if (t.options.indexOf(t.answer) < 0) bad(q + '：answer 要和其中一個選項一字不差');
        }
        if (ty === 'text' && (!Array.isArray(t.accept) || !t.accept.length)) bad(q + '：accept 要列出可以接受的答案');
        if (ty === 'order') {
          if (!Array.isArray(t.items) || !Array.isArray(t.answer) || t.items.length !== t.answer.length) bad(q + '：items 和 answer 數量要一樣');
          else t.answer.forEach(function (a) { if (t.items.indexOf(a) < 0) bad(q + '：answer 裡的「' + a + '」不在 items 裡'); });
        }
        if (ty === 'decision') {
          if (!Array.isArray(t.options) || t.options.length < 2) bad(q + '：options 至少兩個');

          if (!tk || tk.type !== 'observe') bad('結局「' + (en.title || '') + '」的 ' + m + ' 要指到某一站的 observe 現場題（站id.題id）');
        });

  /* ---------- 存檔（只存在這支手機的瀏覽器；讀不到也能玩） ---------- */

  function key(s, t) { return s.id + '.' + t.id; }

  function grant(list) { (list || []).forEach(function (f) { ST.flags[f] = true; }); }
  function afterTask(s) {

  }
  function dist(a, b, c, d) {
    var R = 6371000, r = Math.PI / 180, dl = (c - a) * r, dn = (d - b) * r;
    var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dn / 2) * Math.sin(dn / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function norm(s) { return String(s).trim().toLowerCase().replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 65248); }).replace(/\s+/g, ''); }

  /* ---------- 畫面 ---------- */
  function tagOf(o) { return '<span class="tag ' + (o === '學者說法' ? 'sch' : (o === '工坊創作' ? 'art' : '')) + '">' + esc(o) + '</span>'; }
  function switcher() {
    return '<div class="row">' + BUILTIN.map(function (n) { return '<button class="btn ghost' + (n === NAME ? ' on' : '') + '" data-act="variant" data-n="' + n + '">' + LABEL[n] + '</button>'; }).join('') + '</div>';
  }

    if (got.length) h += '<div>' + got.map(function (f) { return '<span class="chip">✓ ' + esc(D.flags[f]) + '</span>'; }).join('') + '</div>';

    h += '<h2>路線</h2>';
    D.stops.forEach(function (s, i) {
      var st = locked(s) ? '🔒 還沒開' : (stopDone(s) ? '✅ 完成' : (ST.at[s.id] ? '📍 進行中' : '⬜ 還沒到'));
      h += '<button class="btn stop" data-act="open" data-s="' + esc(s.id) + '"><span class="st">' + st + '</span>' + (i + 1) + '. ' + esc(s.name) + (s.optional ? '（選擇性）' : '') + '</button>';
    });
    if (allDone()) h += '<button class="btn pri" data-act="end">路走完了，看結局</button>';
    var errs = D.__warn && D.__warn.length ? '<div class="small">提醒：' + esc(D.__warn.join('；')) + '</div>' : '';
    h += errs;
    h += '<details><summary>測試與資料</summary>' +
      '<label class="small chk"><input type="checkbox" id="sim"' + (ST.sim ? ' checked' : '') + '> 桌面測試：不用真的走到，按一下就當作到了</label>' +
      '<p class="small">想用自己改過的資料玩：選一個 JSON 檔。</p><input type="file" id="pick" accept=".json,application/json">' +
      '<button class="btn ghost" data-act="reset">' + (ST.confirmReset ? '再按一次就清掉這一版的進度' : '重新開始這一版') + '</button></details>';
    APP.innerHTML = h;
  }
  function stopView(s) {
    var h = '<button class="btn ghost" data-act="home">← 回路線</button><h1>' + esc(s.name) + '</h1>';
    if (locked(s)) { h += '<div class="card">🔒 ' + esc(s.locked_msg || '還沒輪到這一站。') + '</div>'; APP.innerHTML = h; return; }
    if (s.culture) h += '<div class="small">' + tagOf(s.culture.origin) + esc(s.culture.note) + '</div>';
    if (s.npc) {
      h += '<div class="npc"><b>' + esc(s.npc.ava || '') + ' ' + esc(s.npc.name) + '</b>' + (s.npc.lines || []).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>';
    }
    if (!ST.at[s.id]) {
      var hasXY = typeof s.lat === 'number' && D.rules.geofence;
      h += '<div class="card"><b>先到這一站</b>' + (hasXY ? '<div class="small">要走到離這裡 ' + (s.r || 60) + ' 公尺內。' + (s.coord_status === '待確認' ? '這個位置是概略值，如果你已經在廟前，就按下面的「自己確認」。' : '') + '</div>' : '<div class="small">這一站還沒有座標，到了以後自己按「我到了」。</div>');
      if (hasXY) h += '<button class="btn pri" data-act="gps" data-s="' + esc(s.id) + '">用定位檢查我到了沒</button>';
      if (!hasXY) h += '<button class="btn pri" data-act="arrive" data-s="' + esc(s.id) + '">我到了</button>';
      if (hasXY && (ST.fail || s.coord_status === '待確認')) h += '<button class="btn ghost" data-act="arrive" data-s="' + esc(s.id) + '">定位不準，我已經到了（自己確認）</button>';
      if (ST.sim) h += '<button class="btn ghost" data-act="arrive" data-s="' + esc(s.id) + '">（測試）直接傳送到這裡</button>';
      if (ST.note) h += '<div class="fb">' + esc(ST.note) + '</div>';
      h += '</div>'; APP.innerHTML = h; return;
    }
    h += '<h2>任務</h2>';
    tasksOf(s).forEach(function (t) { h += taskView(s, t); });
    if (ST.msg && stopDone(s)) h += '<div class="card"><b>' + esc(ST.msg) + '</b></div>';
    if (stopDone(s)) h += '<button class="btn pri" data-act="home">這一站完成，回路線</button>';
    APP.innerHTML = h;
  }
  function taskView(s, t) {
    var k = key(s, t), b = ' data-s="' + esc(s.id) + '" data-t="' + esc(t.id) + '"';
    var h = '<div class="card">' + (t.fieldwork ? '<div class="field">📍 這一題要到現場才寫得出來</div>' : '') + '<b>' + esc(t.title) + '</b>';
    if (ST.done[k]) {
      var a = ST.ans[k];
      h += '<div class="rw">✓ ' + esc(t.type === 'decision' ? (a || '') : (t.reward || '完成')) + '</div>';
      if (t.type === 'observe' && a) h += '<div class="small">你寫的：' + esc(a) + '</div>';
      return h + '</div>';
    }
    if (ST.fb[k]) h += '<div class="fb">' + esc(ST.fb[k]) + '</div>';
    if (t.type === 'choice') t.options.forEach(function (o, i) { h += '<button class="btn" data-act="choice"' + b + ' data-i="' + i + '">' + esc(o) + '</button>'; });
    if (t.type === 'decision') t.options.forEach(function (o, i) { h += '<button class="btn" data-act="decide"' + b + ' data-i="' + i + '">' + esc(o.text) + '</button>'; });
    if (t.type === 'text') h += '<input type="text" id="in-' + esc(k) + '" autocomplete="off"><button class="btn pri" data-act="text"' + b + '>送出</button>';
    if (t.type === 'order') {
      var picked = ST.order[k] || [];
      if (picked.length) h += '<ol>' + picked.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ol>';
      t.items.forEach(function (it) { if (picked.indexOf(it) < 0) h += '<button class="btn" data-act="pick"' + b + ' data-v="' + esc(it) + '">' + esc(it) + '</button>'; });
      if (picked.length) h += '<button class="btn ghost" data-act="unpick"' + b + '>重排</button>';
    }
    if (t.type === 'observe') {
      h += '<textarea id="in-' + esc(k) + '" placeholder="至少 ' + (t.min || 8) + ' 個字">' + esc((ST.draft || {})[k] || '') + '</textarea>';
      if (t.photo) h += '<div class="small">可以拍一張照片（只留在你的手機裡，不會上傳；請不要拍到別人清楚的臉）。</div><input type="file" accept="image/*" capture="environment" data-photo="' + esc(k) + '">' + (PHOTO[k] ? '<img class="pv" src="' + PHOTO[k] + '" alt="">' : '');
      h += '<button class="btn pri" data-act="observe"' + b + '>記下來</button>';
    }
    return h + '</div>';
  }
  function fillText(t) {   // 結局文字裡的 {{站id.題id}}，換成玩家在現場寫下的那一句
    return String(t || '').replace(/\{\{(\w+)\.(\w+)\}\}/g, function (m, sid, tid) { var v = ST.ans[sid + '.' + tid]; return v ? v : '（你沒有寫）'; });
  }
  function endView() {
    var en = D.endings.filter(function (e) { return (e.requires || []).every(function (f) { return ST.flags[f]; }); })[0] || D.endings[D.endings.length - 1];
    var h = '<button class="btn ghost" data-act="home">← 回路線</button><h1>' + esc(en.title) + '</h1><div class="small">' + tagOf(en.origin || '工坊創作') + '</div><div class="card">' + esc(fillText(en.text)) + '</div>';
    if (D.rules.score) {
      var total = 0; D.stops.forEach(function (s) { s.tasks.forEach(function (t) { if (t.type === 'choice' || t.type === 'text') total++; }); });
      h += '<div class="card"><b>得分：' + ST.score + ' / ' + total + '</b></div>';
    }
    var got = Object.keys(D.flags || {}).filter(function (f) { return ST.flags[f]; });
    if (got.length) h += '<h2>你這一路的選擇與紀錄</h2><div>' + got.map(function (f) { return '<span class="chip">✓ ' + esc(D.flags[f]) + '</span>'; }).join('') + '</div>';
    var notes = [];
    D.stops.forEach(function (s) { s.tasks.forEach(function (t) { var k = key(s, t); if (t.type === 'observe' && ST.ans[k]) notes.push('<li><b>' + esc(s.name) + '</b>：' + esc(ST.ans[k]) + '</li>'); }); });
    if (notes.length) h += '<h2>你在現場寫下的</h2><ul>' + notes.join('') + '</ul>';
    h += '<h2>想一想</h2><div class="card"><b>' + esc(D.reflect.question) + '</b>' +
      D.reflect.choices.map(function (c, i) { return '<button class="btn' + (ST.reflect.c === i ? ' on' : '') + '" data-act="refl" data-i="' + i + '">' + esc(c) + '</button>'; }).join('') +
      '<p><b>' + esc(D.reflect.story_prompt || '') + '</b></p><textarea id="story">' + esc(ST.reflect.story) + '</textarea>' +
      '<button class="btn pri" data-act="share">整理成一段文字，貼給老師或貼給 AI</button><textarea id="out" readonly hidden></textarea></div>';
    APP.innerHTML = h;
  }
  function shareText() {
    var out = ['【' + D.meta.title + '／' + (D.meta.subtitle || '') + '】'];
    Object.keys(D.flags || {}).forEach(function (f) { if (ST.flags[f]) out.push('✓ ' + D.flags[f]); });
    D.stops.forEach(function (s) { s.tasks.forEach(function (t) { var k = key(s, t); if (t.type === 'observe' && ST.ans[k]) out.push('現場（' + s.name + '）：' + ST.ans[k]); }); });
    if (D.rules.score) out.push('得分：' + ST.score);
    out.push('抽掉文化還玩得下去嗎：' + (ST.reflect.c >= 0 ? D.reflect.choices[ST.reflect.c] : '還沒選'));
    out.push('一句話故事：' + (ST.reflect.story || '還沒寫'));
    return out.join('\n');
  }
  function render() {
    if (!D) return;
    if (ST.view === 'stop' && ST.cur && sget(ST.cur)) return stopView(sget(ST.cur));
    if (ST.view === 'end') return endView();
    ST.view = 'home'; home();
  }
  function fatal(list) {
    APP.innerHTML = '<h1>這份資料有地方錯了</h1><div class="card err"><ul>' + list.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div><p class="small">改好 JSON 以後重新整理，或在下面重新選一個檔。</p><input type="file" id="pick" accept=".json,application/json">' + '<div class="row">' + BUILTIN.map(function (n) { return '<button class="btn ghost" data-act="variant" data-n="' + n + '">' + LABEL[n] + '</button>'; }).join('') + '</div>';
  }

  /* ---------- 載入資料 ---------- */
  function start(d, name) {
    var v = validate(d);
    if (v.e.length) { D = null; return fatal(v.e); }
    d.__warn = v.w; D = d; NAME = name; ST = load(); render(); window.__walkReady = true;
  }
  function parseThen(text, name) { var d; try { d = JSON.parse(text); } catch (x) { return fatal(['JSON 格式不對（多一個逗號、少一個引號？）：' + x.message]); } start(d, name); }
  function loadByName(name) {
    var inl = document.getElementById('inline-' + name);
    function useInline() { if (inl) parseThen(inl.textContent, name); else fatal(['找不到 ' + name]); }
    if (location.protocol === 'file:') return useInline();
    fetch(name, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (t) { parseThen(t, name); }).catch(useInline);
  }

  /* ---------- 事件 ---------- */
  APP.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), s = b.getAttribute('data-s') ? sget(b.getAttribute('data-s')) : null;
    var t = s && b.getAttribute('data-t') ? s.tasks.filter(function (x) { return x.id === b.getAttribute('data-t'); })[0] : null;
    var k = s && t ? key(s, t) : '';
    if (act === 'variant') { return loadByName(b.getAttribute('data-n')); }
    if (!D) return;
    if (act === 'home') { ST.view = 'home'; ST.note = ''; ST.fail = false; }
    else if (act === 'open') { ST.view = 'stop'; ST.cur = s.id; ST.note = ''; ST.fail = false; }
    else if (act === 'end') { ST.view = 'end'; }
    else if (act === 'reset') { if (!ST.confirmReset) { ST.confirmReset = true; render(); setTimeout(function () { if (ST && ST.confirmReset) { ST.confirmReset = false; render(); } }, 6000); return; } var sim = ST.sim; ST = fresh(); ST.sim = sim; }
    else if (act === 'arrive') { ST.at[s.id] = 1; ST.note = ''; ST.fail = false; }
    else if (act === 'gps') {
      if (!navigator.geolocation) { ST.note = '這個瀏覽器不能定位，請用「自己確認」。'; ST.fail = true; render(); return; }
      ST.note = '定位中……'; render();
      navigator.geolocation.getCurrentPosition(function (p) {
        var d = Math.round(dist(p.coords.latitude, p.coords.longitude, s.lat, s.lon));
        if (d <= (s.r || 60)) { ST.at[s.id] = 1; ST.note = ''; } else { ST.note = '你離這裡還有約 ' + d + ' 公尺，再走近一點。'; ST.fail = true; }
        save(); render();
      }, function () { ST.note = '拿不到定位（可能沒開權限或在室內）。你可以用「自己確認」。'; ST.fail = true; render(); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
      return;
    }
    else if (act === 'choice') {
      var o = t.options[+b.getAttribute('data-i')];
      if (o === t.answer) { ST.done[k] = true; ST.fb[k] = ''; if (!ST.wrong[k] && D.rules.score) ST.score++; afterTask(s); }
      else { ST.wrong[k] = true; ST.fb[k] = '不是這個。' + (D.rules.hints && t.hint ? '提示：' + t.hint : ''); }
    }
    else if (act === 'decide') {
      var op = t.options[+b.getAttribute('data-i')]; grant(op.grant); ST.done[k] = true; ST.ans[k] = op.reply || op.text; afterTask(s);
    }
    else if (act === 'text') {
      var v = norm(document.getElementById('in-' + k).value || '');
      if (t.accept.some(function (a) { return norm(a) === v; })) { ST.done[k] = true; ST.fb[k] = ''; if (!ST.wrong[k] && D.rules.score) ST.score++; afterTask(s); }
      else { ST.wrong[k] = true; ST.fb[k] = '不對，再試一次。' + (D.rules.hints && t.hint ? '提示：' + t.hint : ''); }
    }
    else if (act === 'pick') {
      var pk = ST.order[k] = ST.order[k] || []; pk.push(b.getAttribute('data-v'));
      if (pk.length === t.items.length) {
        if (pk.join('|') === t.answer.join('|')) { ST.done[k] = true; ST.fb[k] = ''; afterTask(s); }
        else { ST.order[k] = []; ST.fb[k] = '順序不對，重排。' + (D.rules.hints && t.hint ? '提示：' + t.hint : ''); }
      }
    }
    else if (act === 'unpick') { ST.order[k] = []; }
    else if (act === 'observe') {
      var tx = (document.getElementById('in-' + k).value || '').trim();
      if (tx.length < (t.min || 8)) { ST.fb[k] = '再多寫一點（至少 ' + (t.min || 8) + ' 個字）。'; }
      else { ST.done[k] = true; ST.ans[k] = tx; ST.fb[k] = ''; afterTask(s); }
    }
    else if (act === 'refl') { ST.reflect.c = +b.getAttribute('data-i'); }
    else if (act === 'share') {
      var sv = document.getElementById('story'); if (sv) ST.reflect.story = sv.value;
      save(); render();
      var out = document.getElementById('out'); out.value = shareText(); out.hidden = false; out.focus(); out.select();
      try { if (navigator.clipboard) navigator.clipboard.writeText(out.value).catch(function () { }); } catch (x) { }
      return;
    }
    save(); render(); window.scrollTo(0, 0);
  });
  APP.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'sim') { ST.sim = t.checked; save(); return; }
    if (t.id === 'pick' && t.files[0]) { var r = new FileReader(); r.onload = function () { parseThen(r.result, 'custom'); }; r.readAsText(t.files[0]); return; }
    if (t.getAttribute && t.getAttribute('data-photo') && t.files[0]) { ST.draft = ST.draft || {}; Array.prototype.forEach.call(APP.querySelectorAll('textarea[id^="in-"]'), function (x) { ST.draft[x.id.slice(3)] = x.value; }); PHOTO[t.getAttribute('data-photo')] = URL.createObjectURL(t.files[0]); var top = window.scrollY; render(); window.scrollTo(0, top); }
  });

  var q = new URLSearchParams(location.search).get('data');
  loadByName(q && /^[\w.\-]+\.json$/.test(q) ? q : 'walk.json');
})();
</script>
