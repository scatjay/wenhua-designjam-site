*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 56px}
h1{font-size:22px;margin:4px 0 2px;line-height:1.3}
h2{font-size:18px;margin:18px 0 6px}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}

.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc);text-align:center}
.btn.ghost{text-align:center;font-weight:500}
.btn.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{min-height:54px;font-size:18px}
.row{display:flex;gap:8px}
.row .btn{margin:6px 0;text-align:center}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;font-size:13px}

.tag.art{background:#7a5a1c}.tag.sch{background:#4c5fa8}
.st{float:right;font-size:13px;color:var(--mute)}
.field{font-size:13px;color:var(--acc);font-weight:700}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
textarea{min-height:96px}
.rw{color:var(--ok);margin-top:6px}
.err{color:var(--bad)}
.fb{color:var(--bad);margin:4px 0}
details{margin:12px 0}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--mute)}
input[type=file]{width:100%;min-height:44px;padding:8px 0}
img.pv{max-width:100%;border-radius:8px;margin-top:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.small{font-size:13px;color:var(--mute)}
/* 標題畫面 */
.hero{text-align:center;padding:26px 14px 20px;margin:8px 0 12px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,var(--chip),var(--card) 70%)}
.hero .cv{font-size:64px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.hero h1{font-size:30px;margin:10px 0 4px;letter-spacing:.04em}
.hero .tg{font-size:15px;color:var(--mute);margin:0 0 10px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 4px}
.how{margin:8px 0;padding-left:0;list-style:none}
.how li{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.how b{flex:0 0 30px;font-size:22px;text-align:center}

.hud .chip{margin:0;font-weight:600}
.tray{display:flex;gap:6px;margin:6px 0 2px}
.slot{flex:1 1 0;min-width:0;border:1.5px dashed var(--line);border-radius:10px;text-align:center;padding:5px 2px;font-size:12px;color:var(--mute);background:var(--card)}
.slot .ic{display:block;font-size:22px;line-height:1.3}
.slot.got{border:1.5px solid var(--gold);color:var(--fg);background:var(--chip)}
.slot.opt{opacity:.8}

.mapbox svg{display:block;width:100%;height:auto;max-height:62vh}
.mapbox .cap{position:absolute;right:8px;bottom:5px;font-size:11px;color:var(--mute)}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle.nc{stroke:var(--acc);stroke-width:1.2}
.node .nc{stroke:var(--fg);stroke-width:.5;fill:var(--card)}
.node.done .nc{fill:var(--ok);stroke:var(--ok)}
.node.lock .nc{fill:var(--chip);stroke:var(--mute);stroke-dasharray:1.2 1}
.node.next .nc{fill:var(--acc);stroke:var(--acc)}
.node.sel .ring{opacity:1}
.node .ring{fill:none;stroke:var(--acc);stroke-width:.8;opacity:0}
.node .num{font-size:4.4px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--fg);pointer-events:none}
.node.done .num,.node.next .num{fill:#fff}
.node .lbl{font-size:3.5px;font-weight:700;text-anchor:middle;fill:var(--fg);paint-order:stroke;stroke:var(--map);stroke-width:1.1px;stroke-linejoin:round;pointer-events:none}
.node .opt{font-size:2.8px;text-anchor:middle;fill:var(--mute);paint-order:stroke;stroke:var(--map);stroke-width:1px;pointer-events:none}
.node.next .pulse{animation:pls 1.6s ease-out infinite}
.pulse{fill:var(--acc);opacity:0;transform-origin:center;transform-box:fill-box}
@keyframes pls{0%{opacity:.45;transform:scale(1)}100%{opacity:0;transform:scale(2.1)}}
#pl{transition:transform .85s ease-in-out}
.pawn{font-size:6.6px;text-anchor:middle;pointer-events:none}
.selcard h2{margin:0 0 2px}
/* 場景與對話 */
.scene{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--chip),var(--card));margin:8px 0}
.scene .em{font-size:44px;line-height:1}
.scene .nm{font-size:20px;font-weight:800;line-height:1.3}
.bub{display:flex;gap:8px;align-items:flex-start;margin:8px 0}

.bub .tx{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;max-width:calc(100% - 50px)}
.bub .who{font-size:12px;color:var(--mute);font-weight:700;display:block}
.bub.last .tx{animation:pop .3s ease-out}
.bub.me{flex-direction:row-reverse}.bub.me .tx{border-radius:14px 4px 14px 14px;background:var(--chip)}
.dots{display:flex;gap:6px;align-items:center;margin:8px 0 2px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:transparent;display:inline-block}
.dots i.d{background:var(--ok);border-color:var(--ok)}
.dots i.c{border-color:var(--acc);background:var(--acc)}
.dots span{font-size:13px;color:var(--mute);margin-left:4px}
.res{border-color:var(--ok);border-width:2px}
.res .hd{font-weight:800;color:var(--ok)}
.frag{text-align:center;border:2px solid var(--gold);background:linear-gradient(160deg,var(--chip),var(--card));border-radius:16px;padding:16px 14px;margin:12px 0;animation:pop .5s ease-out}
.frag .ic{font-size:54px;line-height:1.1}
.frag .nm{font-size:19px;font-weight:800;margin:4px 0}
.frag .got{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.1em}
.frag p{margin:6px 0;text-align:left}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#pl{transition:none}.frag,.bub.last .tx,.node.next .pulse{animation:none}}

.stars{font-size:30px;letter-spacing:4px;color:var(--gold);text-align:center;margin:2px 0}
.rank{text-align:center;font-size:22px;font-weight:800;margin:2px 0}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 2px}
.bd div{background:var(--chip);border-radius:10px;padding:6px 8px;font-size:13px}
.bd b{display:block;font-size:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.fgrid .frag{margin:0;animation:none;padding:10px}
.fgrid .frag .ic{font-size:34px}
.fgrid .frag .nm{font-size:16px}
.fgrid .frag p{font-size:13px}
</style>
</head>

<script>
(function () {
  'use strict';
  var APP = document.getElementById('app');
  var D = null, NAME = 'walk.json', ST = null, PHOTO = {}, WALKING = false;
  var BUILTIN = ['walk.json', 'walk_skin.json'];
  var LABEL = { 'walk.json': '規則版', 'walk_skin.json': '外觀版' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  /* ---------- 資料檢查（學生改壞 JSON 時，在這裡看得到哪裡錯） ---------- */
  function validate(d) {
    var e = [], w = [], ids = {};
    function bad(m) { e.push(m); }
    if (!d || typeof d !== 'object') return { e: ['整份資料不是物件'], w: w };
    if (!d.meta || !d.meta.title) bad('meta.title 不能空白');
    if (!d.rules || ['gated', 'free'].indexOf(d.rules.mode) < 0) bad('rules.mode 只能是 "gated"（照順序）或 "free"（隨便走）');
    var flags = d.flags || {};
    if (!Array.isArray(d.stops) || !d.stops.length) { bad('stops 至少要有一站'); return { e: e, w: w }; }
    function chkFlags(list, where) { (list || []).forEach(function (f) { if (!has(flags, f)) bad(where + ' 用了沒有登記的旗標「' + f + '」（要先寫進 flags）'); }); }
    d.stops.forEach(function (s, i) {
      var p = '第 ' + (i + 1) + ' 站（' + (s.name || s.id || '沒有名字') + '）';
      if (!s.id || !/^[A-Za-z0-9_-]+$/.test(s.id)) bad(p + '：id 要用英文、數字或底線');
      else if (ids[s.id]) bad(p + '：id「' + s.id + '」重複了'); else ids[s.id] = 1;
      if (!s.name) bad(p + '：沒有 name');
      var hasLat = typeof s.lat === 'number', hasLon = typeof s.lon === 'number';
      if (hasLat !== hasLon) bad(p + '：lat 和 lon 要一起有、或一起是 null');
      if (s.map && (typeof s.map.x !== 'number' || typeof s.map.y !== 'number' || s.map.x < 0 || s.map.x > 100 || s.map.y < 0 || s.map.y > 80)) w.push(p + '：map 的 x 要在 0–100、y 要在 0–80 之間（這一站會被自動排位置）');
      if (s.frag && (!s.frag.name || !s.frag.text)) w.push(p + '：frag 要有 name 和 text（這一站會用預設碎片）');
      chkFlags(s.requires, p + ' 的 requires');
      if (s.on_complete) chkFlags(s.on_complete.grant, p + ' 的 on_complete.grant');
      if (!Array.isArray(s.tasks) || !s.tasks.length) { bad(p + '：tasks 至少要有一題'); return; }
      var tid = {};
      s.tasks.forEach(function (t, j) {
        var q = p + ' 的第 ' + (j + 1) + ' 題（' + (t.id || '沒有 id') + '）';
        if (!t.id || tid[t.id]) bad(q + '：id 沒填或重複'); else tid[t.id] = 1;
        if (!t.title) bad(q + '：沒有 title');
        chkFlags(t.show_if, q + ' 的 show_if');
        var ty = t.type;
        if (['choice', 'text', 'order', 'observe', 'decision'].indexOf(ty) < 0) { bad(q + '：type「' + ty + '」不認得（choice／text／order／observe／decision）'); return; }
        if (ty === 'choice') {
          if (!Array.isArray(t.options) || t.options.length < 2) bad(q + '：options 至少兩個');
          else if (t.options.indexOf(t.answer) < 0) bad(q + '：answer 要和其中一個選項一字不差');
        }
        if (ty === 'text' && (!Array.isArray(t.accept) || !t.accept.length)) bad(q + '：accept 要列出可以接受的答案');
        if (ty === 'order') {
          if (!Array.isArray(t.items) || !Array.isArray(t.answer) || t.items.length !== t.answer.length) bad(q + '：items 和 answer 數量要一樣');
          else t.answer.forEach(function (a) { if (t.items.indexOf(a) < 0) bad(q + '：answer 裡的「' + a + '」不在 items 裡'); });
        }
        if (ty === 'decision') {
          if (!Array.isArray(t.options) || t.options.length < 2) bad(q + '：options 至少兩個');
          else t.options.forEach(function (o) { if (!o.text) bad(q + '：每個選項要有 text'); chkFlags(o.grant, q + ' 的 grant'); });
        }
      });
    });
    if (!Array.isArray(d.endings) || !d.endings.length) bad('endings 至少要有一個');
    else {
      d.endings.forEach(function (en) {
        chkFlags(en.requires, '結局「' + (en.title || '') + '」的 requires');
        String(en.text || '').replace(/\{\{(\w+)\.(\w+)\}\}/g, function (m, sid, tid) {
          var st = d.stops.filter(function (x) { return x.id === sid; })[0], tk = st && (st.tasks || []).filter(function (x) { return x.id === tid; })[0];
          if (!tk || tk.type !== 'observe') bad('結局「' + (en.title || '') + '」的 ' + m + ' 要指到某一站的 observe 現場題（站id.題id）');
        });
      });
      if ((d.endings[d.endings.length - 1].requires || []).length) bad('最後一個結局的 requires 要是空的 []（當作沒有其他結局時的保底）');
    }
    if (!d.reflect || !d.reflect.question || !Array.isArray(d.reflect.choices)) bad('reflect 要有 question 和 choices');
    return { e: e, w: w };
  }

  /* ---------- 存檔（只存在這支手機的瀏覽器；讀不到也能玩） ---------- */
  function skey() { return 'walktpl:' + D.meta.id; }
  function fresh() { return { view: 'title', started: false, pos: 'start', sel: null, cur: null, at: {}, done: {}, flags: {}, ans: {}, wrong: {}, fb: {}, order: {}, completed: {}, pts: {}, talk: {}, talked: {}, pend: null, score: 0, sim: false, note: '', reflect: { c: -1, story: '' } }; }
  function load() { try { var r = localStorage.getItem(skey()); if (r) { var o = JSON.parse(r); if (o.view === 'home') o.view = 'map'; return Object.assign(fresh(), o); } } catch (x) { } return fresh(); }
  function save() { try { localStorage.setItem(skey(), JSON.stringify(ST)); } catch (x) { } }

  /* ---------- 狀態 ---------- */
  function sget(id) { return D.stops.filter(function (s) { return s.id === id; })[0]; }
  function locked(s) { return D.rules.mode === 'gated' && (s.requires || []).some(function (f) { return !ST.flags[f]; }); }
  function key(s, t) { return s.id + '.' + t.id; }
  function tasksOf(s) { return s.tasks.filter(function (t) { return !(t.show_if || []).some(function (f) { return !ST.flags[f]; }); }); }
  function stopDone(s) { return !!ST.at[s.id] && tasksOf(s).filter(function (t) { return !t.optional; }).every(function (t) { return ST.done[key(s, t)]; }); }
  function reqStops() { return D.stops.filter(function (s) { return !s.optional; }); }
  function allDone() { return reqStops().every(stopDone); }
  function grant(list) { (list || []).forEach(function (f) { ST.flags[f] = true; }); }
  function shortName(s) { return s.short || String(s.name).replace(/（.*?）/g, '').replace(/\(.*?\)/g, ''); }
  function fragOf(s) { var c = s.culture || {}; var f = s.frag || {}; return { icon: f.icon || '🧩', name: f.name || (shortName(s) + '的碎片'), text: f.text || c.note || '', origin: c.origin || '' }; }
  function afterTask(s) {
    if (stopDone(s) && !ST.completed[s.id]) {
      ST.completed[s.id] = true;
      var oc = s.on_complete || {};
      grant(oc.grant); ST.msg = oc.msg || '';
    }
    save();
  }
  function dist(a, b, c, d) {
    var R = 6371000, r = Math.PI / 180, dl = (c - a) * r, dn = (d - b) * r;
    var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dn / 2) * Math.sin(dn / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function norm(s) { return String(s).trim().toLowerCase().replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 65248); }).replace(/\s+/g, ''); }
  function nextStop() { var l = reqStops().filter(function (s) { return !stopDone(s) && !locked(s); }); return l[0] || null; }
  function doneCount() { return reqStops().filter(stopDone).length; }
  function fragCount() { return D.stops.filter(function (s) { return ST.completed[s.id]; }).length; }
  function pts(t) { return t.type === 'decision' ? 1 : 2; }

  /* ---------- 評價 ---------- */
  function tally() {
    var earned = 0, poss = 0, right = 0, quiz = 0, notes = 0, dec = 0;
    D.stops.forEach(function (s) {
      if (s.optional && !ST.at[s.id]) return;
      poss += 1; if (ST.completed[s.id]) earned += 1;
      tasksOf(s).forEach(function (t) {
        var k = key(s, t); poss += pts(t);
        if (ST.done[k]) earned += (ST.pts[k] || 0);
        if (t.type === 'choice' || t.type === 'text' || t.type === 'order') { quiz++; if (ST.done[k] && !ST.wrong[k]) right++; }
        if (t.type === 'observe' && ST.done[k]) notes++;
        if (t.type === 'decision' && ST.done[k]) dec++;
      });
    });
    var pct = poss ? Math.round(earned * 100 / poss) : 0;
    var ranks = (D.ranks && D.ranks.length ? D.ranks : [{ min: 0, title: '走完了這條路', text: '' }]).slice().sort(function (a, b) { return a.min - b.min; });
    var rk = ranks[0]; ranks.forEach(function (r) { if (pct >= r.min) rk = r; });
    return { earned: earned, poss: poss, pct: pct, right: right, quiz: quiz, notes: notes, dec: dec, rank: rk, stars: Math.max(1, Math.min(5, Math.round(pct / 20))) };
  }

  /* ---------- 地圖座標 ---------- */
  function posOf(s) {
    if (s.map && typeof s.map.x === 'number' && typeof s.map.y === 'number') return { x: s.map.x, y: s.map.y };
    var i = D.stops.indexOf(s), n = D.stops.length;
    return { x: i % 2 ? 70 : 30, y: n > 1 ? 14 + i * (50 / (n - 1)) : 36 };
  }
  function startPos() {
    var m = D.map && D.map.start;
    if (m && typeof m.x === 'number') return { x: m.x, y: m.y };
    var p = posOf(D.stops[0]); return { x: Math.min(94, p.x + 16), y: Math.max(8, p.y - 2) };
  }
  function whereIs(id) { return id === 'start' || !sget(id) ? startPos() : posOf(sget(id)); }

  /* ---------- 畫面 ---------- */
  function tagOf(o) { return '<span class="tag ' + (o === '學者說法' ? 'sch' : (o === '工坊創作' ? 'art' : '')) + '">' + esc(o) + '</span>'; }
  function switcher() {
    return '<div class="row">' + BUILTIN.map(function (n) { return '<button class="btn ghost' + (n === NAME ? ' on' : '') + '" data-act="variant" data-n="' + n + '">' + LABEL[n] + '</button>'; }).join('') + '</div>';
  }
  function dataBox() {
    return '<details><summary>測試與資料</summary><p class="small">想用自己改過的資料玩：選一個 JSON 檔。</p><input type="file" id="pick" accept=".json,application/json">' +
      '<button class="btn ghost" data-act="reset">' + (ST.confirmReset ? '再按一次就清掉這一版的進度' : '重新開始這一版') + '</button></details>';
  }

  function titleView() {
    var n = reqStops().length, opt = D.stops.length - n, m = D.meta;
    var h = '<div class="hero"><div class="cv" aria-hidden="true">' + esc(m.cover || '🗺️') + '</div><h1>' + esc(m.title) + '</h1>' +
      '<div class="tg">' + esc(m.tagline || m.subtitle || '') + '</div><div class="sub">' + esc(m.subtitle || '') + '</div>' +
      '<div class="meta"><span class="chip">🗺️ ' + n + ' 站' + (opt ? '＋' + opt + ' 站選擇性' : '') + '</span><span class="chip">⏱ ' + esc(m.minutes || '約 10 分鐘') + '</span><span class="chip">' + (D.rules.mode === 'gated' ? '🔒 要照順序走' : '🧭 順序隨你') + '</span></div></div>';
    h += '<div class="card">' + esc(m.intro || '') + '</div>';
    h += '<button class="btn pri big" data-act="start">' + (ST.started ? '▶ 繼續這一趟' : '▶ 開始走讀') + '</button>';
    h += '<div class="card"><b>怎麼玩</b><ul class="how"><li><b>🗺️</b><span>在地圖上點一個地點，按「走過去」（在教室裡玩就用模擬；真的在現場可以用定位檢查）。</span></li><li><b>💬</b><span>到了先聽站上的人說話，再一題一題做任務。</span></li><li><b>🧩</b><span>做完一站，拿到一塊碎片；走完全程，看你的結局和評價。</span></li></ul></div>';
    h += '<div class="small" style="margin-top:10px">玩哪一版：</div>' + switcher();
    h += '<div class="small">規則版：順序、抉擇和現場題都會影響結局。外觀版：同一條路，只有打卡答題。玩完兩版，比一比。</div>';
    h += dataBox();
    APP.innerHTML = h;
  }

  function hud() {
    var h = '<div class="hud"><span class="chip">📍 ' + doneCount() + ' / ' + reqStops().length + ' 站</span><span class="chip">🧩 ' + fragCount() + ' / ' + D.stops.length + ' 碎片</span>';
    if (D.rules.score) h += '<span class="chip">⭐ ' + tally().earned + ' 分</span>';
    h += '<button class="btn ghost" style="width:auto;min-height:44px;margin:0 0 0 auto;padding:4px 14px" data-act="title">封面</button></div>';
    return h;
  }
  function tray() {
    return '<div class="tray">' + D.stops.map(function (s) {
      var got = !!ST.completed[s.id], f = fragOf(s);
      return '<div class="slot' + (got ? ' got' : '') + (s.optional ? ' opt' : '') + '"><span class="ic">' + (got ? esc(f.icon) : '❔') + '</span>' + (got ? esc(f.name) : (s.optional ? '選擇性' : '還沒到')) + '</div>';
    }).join('') + '</div>';
  }
  function mapSvg() {
    var S = startPos(), cur = whereIs(ST.pos), nx = nextStop(), parts = [];
    parts.push('<svg viewBox="0 0 100 80" role="img" aria-label="路線示意圖">');
    [[4, 6, 30, 16], [38, 4, 22, 12], [66, 6, 28, 18], [6, 28, 22, 14], [58, 52, 36, 12], [6, 56, 28, 16], [36, 72, 40, 6], [78, 30, 18, 10]].forEach(function (r) { parts.push('<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" rx="2.5" fill="var(--blk)" opacity=".55"/>'); });
    // 路：必經站依序連線；選擇性站用虛線接到最近的一站
    var req = reqStops(), prev = null, edges = [];
    req.forEach(function (s, i) { var p = posOf(s); if (i === 0) edges.push([S, p, false]); else edges.push([posOf(req[i - 1]), p, false]); });
    D.stops.filter(function (s) { return s.optional; }).forEach(function (s) {
      var p = posOf(s), best = null, bd = 1e9; req.forEach(function (r) { var q = posOf(r), dd = Math.hypot(p.x - q.x, p.y - q.y); if (dd < bd) { bd = dd; best = q; } });
      if (best) edges.push([best, p, true]);
    });
    edges.forEach(function (e) {
      var mx = (e[0].x + e[1].x) / 2, my = (e[0].y + e[1].y) / 2 + (e[0].x < e[1].x ? 3 : -3);
      parts.push('<path d="M' + e[0].x + ' ' + e[0].y + ' Q' + mx + ' ' + my + ' ' + e[1].x + ' ' + e[1].y + '" fill="none" stroke="var(--road)" stroke-width="2.2" stroke-linecap="round"' + (e[2] ? ' stroke-dasharray="1.5 2.2"' : '') + '/>');
    });
    parts.push('<g><circle cx="' + S.x + '" cy="' + S.y + '" r="2.4" fill="var(--acc2)"/><text x="' + S.x + '" y="' + (S.y + 5.2) + '" class="opt" style="font-size:3px;text-anchor:middle;fill:var(--acc2);font-weight:700">出發</text></g>');
    D.stops.forEach(function (s, i) {
      var p = posOf(s), lk = locked(s), dn = stopDone(s), isNext = nx && nx.id === s.id, sel = ST.sel === s.id;
      var cls = 'node' + (dn ? ' done' : (lk ? ' lock' : (isNext ? ' next' : ''))) + (sel ? ' sel' : '');
      var st = lk ? '還沒開' : (dn ? '已完成' : (isNext ? '下一站' : '可以去'));
      var below = p.y > 60;
      parts.push('<g class="' + cls + '" data-act="sel" data-s="' + esc(s.id) + '" tabindex="0" role="button" aria-label="' + esc(shortName(s) + '，' + st) + '">' +
        '<circle class="pulse" cx="' + p.x + '" cy="' + p.y + '" r="5.4"/><circle class="ring" cx="' + p.x + '" cy="' + p.y + '" r="7"/>' +
        '<circle class="nc" cx="' + p.x + '" cy="' + p.y + '" r="5.4"/><text class="num" x="' + p.x + '" y="' + p.y + '">' + (dn ? '✓' : (lk ? '🔒' : (i + 1))) + '</text>' +
        '<text class="lbl" x="' + p.x + '" y="' + (below ? p.y - 7.4 : p.y + 10.6) + '">' + esc(shortName(s)) + '</text>' +
        (s.optional ? '<text class="opt" x="' + p.x + '" y="' + (below ? p.y - 11.2 : p.y + 14) + '">（選擇性）</text>' : '') + '</g>');
    });
    parts.push('<g id="pl" style="transform:translate(' + cur.x + 'px,' + cur.y + 'px)"><text class="pawn" x="0" y="-6.2">🚶</text><circle r="1.1" fill="var(--acc)"/></g>');
    parts.push('</svg>');
