<script>
(function(){
'use strict';
// ===================== 引擎（不碰畫面，可單獨模擬） =====================
function readData(id){ var t=document.getElementById(id).textContent.replace(/<!--\/?DATA_(RULE|SKIN)-->/g,''); return JSON.parse(t); }
var RULE_TYPES={adj_any:1,turf:1}, SCORE_TYPES={base:1,per_adj:1,if_adj_all:1}, DIRS={left:1,vertical:1,any:1};
var E={
  newState:function(D){ var b=[]; for(var r=0;r<D.board.rows;r++){ b.push([]); for(var c=0;c<D.board.cols;c++) b[r].push(c===D.board.sea_col?'sea':null);} return {board:b,turn:0,rejects:0,discards:0,placed:0}; },
  at:function(D,b,r,c){ if(r<0||c<0||r>=D.board.rows||c>=D.board.cols) return null; return b[r][c]; },
  nbrs:function(dir){ if(dir==='left') return [[0,-1]]; if(dir==='vertical') return [[-1,0],[1,0]]; return [[-1,0],[1,0],[0,-1],[0,1]]; },
  turfActive:function(D,S){ return D.stele_turn>0 && (S.turn+1)<D.stele_turn; },
  rowSurnames:function(D,b){ // 每一橫排的港道，岸邊碼頭是哪幾姓
    var out=[]; for(var r=0;r<D.board.rows;r++){ var s={}; for(var c=0;c<D.board.cols;c++){ if(b[r][c]!=='canal') continue; [r-1,r+1].forEach(function(rr){ var t=E.at(D,b,rr,c); if(t==='dockA'||t==='dockB') s[t]=1; }); } out.push(Object.keys(s)); } return out; },
  canPlace:function(D,S,t,r,c){
    if(r<0||c<0||r>=D.board.rows||c>=D.board.cols) return {ok:false,why:'超出地圖了。'};
    if(S.board[r][c]!==null) return {ok:false,why:S.board[r][c]==='sea'?'這一格是海。':'這一格已經有東西了。',occupied:true};
    var rules=(D.place_rules&&D.place_rules[t])||[];
    for(var i=0;i<rules.length;i++){ var R=rules[i];
      if(R.type==='adj_any'){ var hit=false; E.nbrs(R.dir).forEach(function(d){ var v=E.at(D,S.board,r+d[0],c+d[1]); if(v&&R.of.indexOf(v)>=0) hit=true; }); if(!hit) return {ok:false,why:R.why}; }
      else if(R.type==='turf'){ if(!E.turfActive(D,S)) continue; var b2=S.board.map(function(x){return x.slice();}); b2[r][c]=t; var rs=E.rowSurnames(D,b2); for(var k=0;k<rs.length;k++){ if(rs[k].length>1) return {ok:false,why:R.why}; } }
    }
    return {ok:true};
  },
  place:function(D,S,t,r,c){ var v=E.canPlace(D,S,t,r,c); if(!v.ok){ S.rejects++; return v;} S.board[r][c]=t; S.turn++; S.placed++; return v; },
  discard:function(D,S){ S.turn++; S.discards++; },
  offer:function(D,S){ return D.deck[S.turn]||[]; },
  done:function(D,S){ return S.turn>=D.turns; },
  score:function(D,b){
    var total=0, by={}, order=[];
    function add(label,p){ if(!p) return; total+=p; if(!(label in by)){by[label]=0;order.push(label);} by[label]+=p; }
    for(var r=0;r<D.board.rows;r++) for(var c=0;c<D.board.cols;c++){ var t=b[r][c]; if(!t||t==='sea') continue;
      ((D.score_rules&&D.score_rules[t])||[]).forEach(function(R){
        if(R.type==='base') add(R.label,R.pts);
        else if(R.type==='per_adj'){ var n=0; E.nbrs('any').forEach(function(d){ var v=E.at(D,b,r+d[0],c+d[1]); if(v&&R.of.indexOf(v)>=0) n++; }); add(R.label,n*R.pts); }
        else if(R.type==='if_adj_all'){ var all=R.groups.every(function(g){ return E.nbrs('any').some(function(d){ var v=E.at(D,b,r+d[0],c+d[1]); return v&&g.indexOf(v)>=0; }); }); if(all) add(R.label,R.pts); }
      }); }
    return {total:total, items:order.map(function(l){return {label:l,pts:by[l]};})};
  },
  validate:function(D){
    var e=[]; if(!D||typeof D!=='object') return ['整份資料不是一個 { } 物件。'];
    ['title','board','turns','tiles','deck','place_rules','score_rules','rules_text','endings','reflect'].forEach(function(k){ if(!(k in D)) e.push('少了「'+k+'」這一段。'); });
    if(e.length) return e;
    if(!(D.board.rows>=3&&D.board.rows<=8)) e.push('board.rows 要在 3 到 8 之間，現在是 '+D.board.rows+'。');
    if(!(D.board.cols>=3&&D.board.cols<=7)) e.push('board.cols 要在 3 到 7 之間（手機才排得下），現在是 '+D.board.cols+'。');
    if(!(D.board.sea_col>=0&&D.board.sea_col<D.board.cols)) e.push('board.sea_col 要是 0 到 cols−1 的數字。');
    if(!Array.isArray(D.deck)||D.deck.length<D.turns) e.push('deck 至少要有 '+D.turns+' 手（turns 寫幾手，deck 就要有幾組）。');
    (D.deck||[]).forEach(function(p,i){ if(!Array.isArray(p)||p.length<1) e.push('deck 第 '+(i+1)+' 手要是一個 [ ] 清單。'); else p.forEach(function(t){ if(!D.tiles[t]) e.push('deck 第 '+(i+1)+' 手用了不存在的板塊「'+t+'」。'); }); });
    Object.keys(D.tiles).forEach(function(t){ var T=D.tiles[t]; if(!T.name) e.push('板塊「'+t+'」沒有 name。'); if(!T.icon) e.push('板塊「'+t+'」沒有 icon（一兩個字）。'); });
    Object.keys(D.place_rules).forEach(function(t){ if(!D.tiles[t]) e.push('place_rules 寫了不存在的板塊「'+t+'」。'); (D.place_rules[t]||[]).forEach(function(R,i){ if(!RULE_TYPES[R.type]) e.push('「'+t+'」的第 '+(i+1)+' 條放置規則 type「'+R.type+'」看不懂（只能用 adj_any、turf）。'); if(R.type==='adj_any'){ if(!DIRS[R.dir]) e.push('「'+t+'」的 adj_any 要寫 dir：left、vertical 或 any。'); (R.of||[]).forEach(function(o){ if(o!=='sea'&&!D.tiles[o]) e.push('「'+t+'」的放置規則提到不存在的「'+o+'」。'); }); } if(!R.why) e.push('「'+t+'」的第 '+(i+1)+' 條放置規則沒有 why（放不下時要告訴玩家為什麼）。'); }); });
    Object.keys(D.score_rules).forEach(function(t){ if(!D.tiles[t]) e.push('score_rules 寫了不存在的板塊「'+t+'」。'); (D.score_rules[t]||[]).forEach(function(R,i){ if(!SCORE_TYPES[R.type]) e.push('「'+t+'」的第 '+(i+1)+' 條得分規則 type「'+R.type+'」看不懂（只能用 base、per_adj、if_adj_all）。'); if(typeof R.pts!=='number') e.push('「'+t+'」的第 '+(i+1)+' 條得分規則 pts 要是數字。'); if(!R.label) e.push('「'+t+'」的第 '+(i+1)+' 條得分規則沒有 label。'); }); });
    if(!Array.isArray(D.endings)||!D.endings.length) e.push('endings 至少要有一個結局。'); else if(!D.endings.some(function(x){return x.min===0;})) e.push('endings 要有一個 min 是 0 的結局（不然低分時沒有結局）。');
    if(!D.reflect||!Array.isArray(D.reflect.options)||D.reflect.options.length<2) e.push('reflect.options 至少要兩個選項。');
    return e;
  },
  // 模擬：informed＝知道規則、每手挑分數最高的位置；blind＝看不懂規則，隨便選一塊、隨便點一格，被擋就再試（最多 tries 次）
  simulate:function(D,policy,seed,tries){
    var s=seed||1; function rnd(){ s=(s*1103515245+12345)%2147483648; return s/2147483648; }
    var S=E.newState(D);
    while(!E.done(D,S)){
      var off=E.offer(D,S), placed=false;
      if(policy==='informed'){
        var best=null; off.forEach(function(t){ for(var r=0;r<D.board.rows;r++) for(var c=0;c<D.board.cols;c++){ if(!E.canPlace(D,S,t,r,c).ok) continue; var b2=S.board.map(function(x){return x.slice();}); b2[r][c]=t; var sc=E.score(D,b2).total; if(!best||sc>best.sc) best={t:t,r:r,c:c,sc:sc}; } });
        if(best){ E.place(D,S,best.t,best.r,best.c); placed=true; }
      } else {
        for(var k=0;k<(tries||6)&&!placed;k++){ var t=off[Math.floor(rnd()*off.length)], r=Math.floor(rnd()*D.board.rows), c=Math.floor(rnd()*D.board.cols); if(S.board[r][c]!==null){k--; continue;} if(E.place(D,S,t,r,c).ok) placed=true; }
      }
      if(!placed) E.discard(D,S);
    }
    return {score:E.score(D,S.board).total, rejects:S.rejects, discards:S.discards, placed:S.placed};
  }
};

  return {name:T.name,icon:T.icon,color:T.color||'#777',meaning:T.meaning||''}; }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }

function render(){ var a=document.getElementById('app'); a.innerHTML = ui.screen==='home'?home():ui.screen==='play'?play():end(); bind(); }

function w2block(d){ return '<div class="card"><span class="kind">W2 文化卡：'+esc(d.w2_kind.label)+'</span><p>'+esc(d.w2_kind.line)+'</p>'+
  d.w2_cards.map(function(c){ return '<div class="w2c"><b>#'+c.no+' '+esc(c.v)+'</b>：'+esc(c.note)+(c.more?'<small>'+esc(c.more)+'</small>':'')+'</div>'; }).join('')+'</div>'; }

function home(){ var d=DATA.rule;
  return '<h1>'+esc(d.title)+'</h1><div class="sub">板塊拼接・文化遊戲松樣板</div>'+w2block(d)+
  '<div class="card"><h2>怎麼玩</h2><p>地圖最左邊一排是海。每一手會給你兩塊地，選一塊、點一格放下去。一共 '+d.turns+' 手，放完算分。</p>'+
  '<p>這個樣板有兩版，玩法看起來一樣，差在<b>規則看不看「它是什麼」</b>。兩版都玩完，再回答同一題。</p>'+
  '<div class="row"><button class="primary" data-act="start" data-ver="rule">玩「文化長在規則裡」</button><button data-act="start" data-ver="skin">玩「文化只是皮」</button></div>'+
  (DATA.custom?'<div class="row"><button data-act="start" data-ver="custom">玩我改做的版本</button></div>':'')+'</div>'+
  remix()+basis(d)+'<div class="foot">工坊創作的樣板；《小封神》相關內容只取故事裡的事實，標示在「依據」。</div>'; }

function basis(d){ return '<details><summary>依據：哪些是原著、歷史資料、遊戲自己加的</summary><div class="card">'+
  d.basis.map(function(b){ return '<p><span class="tag">'+esc(b.tag)+'</span>'+esc(b.text)+'</p>'; }).join('')+'</div></details>'; }

function remix(){ return '<details id="remix"><summary>我要改做（貼上自己的資料）</summary><div class="card">'+
  '<p>整個遊戲的內容都在一份 JSON 裡。取出來、貼給 Claude 或 Gemini 改，再貼回來載入。改法看「怎麼改做」那一頁。</p>'+
  '<div class="row"><button data-act="dump" data-ver="rule">取出規則版資料</button><button data-act="dump" data-ver="skin">取出皮版資料</button></div>'+
  '<textarea id="remix-box" spellcheck="false" placeholder="把 JSON 貼在這裡"></textarea>'+
  '<div class="row"><button class="primary" data-act="load">載入我的版本</button></div>'+
  (ui.remixErr?'<div class="err">'+esc(ui.remixErr)+'</div>':'')+(ui.remixOk?'<div class="msg ok">'+esc(ui.remixOk)+'</div>':'')+'</div></details>'; }

function legend(d){ return '<details><summary>每一塊是什麼</summary><div class="legend">'+Object.keys(d.tiles).map(function(t){ var v=tileView(t); return '<div><span class="chip" style="background:'+v.color+'">'+esc(v.icon)+'</span><span><b>'+esc(v.name)+'</b>'+(v.meaning?'：'+esc(v.meaning):'')+'</span></div>'; }).join('')+'</div></details>'; }

function play(){ var d=D(), S=ui.S, off=E.offer(d,S), sc=E.score(d,S.board).total;
  var cand={}; if(ui.sel!==null){ var t=off[ui.sel]; for(var r=0;r<d.board.rows;r++) for(var c=0;c<d.board.cols;c++) if(!ui.strip && E.canPlace(d,S,t,r,c).ok) cand[r+','+c]=1; }
  var g='<div class="board" style="grid-template-columns:repeat('+d.board.cols+',1fr)">';
  for(var r=0;r<d.board.rows;r++) for(var c=0;c<d.board.cols;c++){ var v=S.board[r][c];
    if(v==='sea'){ var sv=tileView('sea'); g+='<button class="cell sea" aria-label="'+esc(sv.name)+'" disabled>'+(ui.strip?'·':esc(sv.icon))+'</button>'; }
    else if(v){ var tv=tileView(v); g+='<button class="cell filled" data-r="'+r+'" data-c="'+c+'" aria-label="'+esc(tv.name)+'" style="background:'+tv.color+'">'+esc(tv.icon)+'</button>'; }
    else g+='<button class="cell'+(cand[r+','+c]?' cand':'')+'" data-act="cell" data-r="'+r+'" data-c="'+c+'" aria-label="空格 第'+(r+1)+'排第'+(c+1)+'格"></button>'; }
  g+='</div>';
  var hand='<div class="hand">'+off.map(function(t,i){ var v=tileView(t); return '<button data-act="pick" data-i="'+i+'" class="'+(ui.sel===i?'sel':'')+'"><span class="chip" style="background:'+v.color+'">'+esc(v.icon)+'</span><span>'+esc(v.name)+'</span></button>'; }).join('')+'</div>';
  var rules=d.rules_text.filter(function(x){ return !ui.strip||!x.culture; });
  var hidden=d.rules_text.length-rules.length;
  var stele=''; if(!ui.strip && d.stele_turn>0){ stele='<div class="stele">'+(E.turfActive(d,S)?'【碑】還沒立碑：一條港只歸一姓搬。'+esc(d.stele_text):'【碑】'+esc(d.stele_text))+'</div>'; }
  return '<div class="hud"><b>'+esc(d.title)+'｜'+esc(ui.ver==='custom'?'我改做的版本':d.version_label)+'</b><span>第 '+(S.turn+1)+' / '+d.turns+' 手・目前 '+sc+' 分</span></div>'+
   '<div class="'+(ui.strip?'strip-on':'')+'">'+(ui.strip?'<div class="sub">🔍 抽掉文化中：名字、圖示、規則說明都換成代號。</div>':'')+stele+
   '<div class="sub">這一手給你兩塊，先選一塊：</div>'+hand+g+
   '<div class="msg '+ui.msgCls+'" id="msg" role="status">'+esc(ui.msg||'選一塊，再點地圖上的空格。'+(ui.strip?'':'黃色的格子是可以放的地方。'))+'</div>'+
   '<div class="row"><button data-act="discard">這兩塊都放不下：丟掉一塊</button><button data-act="strip">'+(ui.strip?'把文化放回來':'抽掉文化試試看')+'</button></div>'+
   '<details '+(S.turn===0?'open':'')+'><summary>規則</summary><ul class="rules">'+rules.map(function(x){return '<li>'+esc(x.text)+'</li>';}).join('')+(hidden?'<li class="sub">（還有 '+hidden+' 條規則是用文化講的，抽掉之後就看不到了。）</li>':'')+'</ul></details>'+
   legend(d)+'</div><div class="row"><button data-act="home">回首頁</button></div>'; }

function end(){ var d=D(), sc=E.score(d,ui.S.board), en=d.endings.slice().sort(function(a,b){return b.min-a.min;}).filter(function(x){return sc.total>=x.min;})[0]||{title:'',text:''};
  var R=d.reflect, ansDone=ui.answer!==null;
  var top=sc.items.slice().sort(function(a,b){return b.pts-a.pts;})[0];
  var story='我在這張地圖上放了 '+ui.S.placed+' 塊，最多分數來自「'+(top?top.label:'—')+'」，最後 '+sc.total+' 分'+(ui.strip?'（抽掉文化玩的）':'')+'。';
  return '<h1>'+esc(en.title)+'</h1><div class="sub">'+esc(ui.ver==='custom'?'我改做的版本':d.version_label)+(ui.strip?'・抽掉文化':'')+'・'+sc.total+' 分</div>'+
   '<div class="card"><p>'+esc(en.text)+'</p><p><b>一句話故事：</b>'+esc(story)+'</p><ul class="score-list">'+sc.items.map(function(x){return '<li>'+esc(x.label)+'：'+x.pts+' 分</li>';}).join('')+'</ul>'+
   '<p class="sub">被擋下來 '+ui.S.rejects+' 次・丟掉 '+ui.S.discards+' 塊</p></div>'+
   '<div class="card"><h2>W2 判斷題</h2><p>'+esc(R.question)+'</p>'+R.options.map(function(o,i){ return '<button class="opt'+(ui.answer===i?' sel':'')+'" data-act="ans" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+
   '<p>寫一句為什麼：</p><textarea id="why" placeholder="例：抽掉之後我只能亂試，因為……">'+esc(ui.why)+'</textarea>'+
   (ansDone?'<div class="msg ok"><p>你選的是「'+esc(R.options[ui.answer])+'」。</p><p>'+esc(R.our_view)+'</p></div>':'')+'</div>'+
   '<div class="card"><h2>'+esc(d.field.title)+'</h2><p>'+esc(d.field.prompt)+'</p><textarea id="field" placeholder="'+esc(d.field.placeholder)+'">'+esc(store('tiles_field')||'')+'</textarea><div class="row"><button data-act="field">記下來（只存在這台裝置）</button></div><div id="field-msg" class="sub"></div></div>'+
   '<div class="row"><button class="primary" data-act="again">再玩一次</button><button data-act="other">換另一版玩</button><button data-act="again-strip">'+(ui.strip?'把文化放回來再玩':'抽掉文化再玩一次')+'</button><button data-act="home">回首頁</button></div>'+basis(d); }

function start(ver,strip){ ui.ver=ver; ui.strip=!!strip; ui.S=E.newState(D()); ui.sel=null; ui.msg=''; ui.msgCls=''; ui.answer=null; ui.why=''; ui.screen='play'; render(); window.scrollTo(0,0); }
function say(m,cls){ ui.msg=m; ui.msgCls=cls||''; }

function bind(){ document.querySelectorAll('[data-act]').forEach(function(el){ el.addEventListener('click',function(){ act(el.getAttribute('data-act'),el); }); }); }
function act(a,el){ var d=D();
  if(a==='start'){ start(el.getAttribute('data-ver'),false); return; }
  if(a==='home'){ ui.screen='home'; ui.strip=false; render(); return; }
  if(a==='pick'){ ui.sel=+el.getAttribute('data-i'); var t=E.offer(d,ui.S)[ui.sel]; var tv=tileView(t); say('你拿了「'+tv.name+'」'+(tv.meaning?'：'+tv.meaning:'')+'點一個空格放下去。',''); render(); return; }
  if(a==='cell'){ if(ui.sel===null){ say('先在上面選一塊，再點格子。','bad'); render(); return; }
    var t=E.offer(d,ui.S)[ui.sel], r=+el.getAttribute('data-r'), c=+el.getAttribute('data-c'); var v=E.place(d,ui.S,t,r,c);
    if(!v.ok){ say('放不下：'+(ui.strip?'這裡不能放。':v.why),'bad'); render(); var b=document.querySelector('[data-r="'+r+'"][data-c="'+c+'"]'); if(b) b.classList.add('bad'); return; }
    ui.sel=null; say('放好了。','ok'); next(); return; }
  if(a==='discard'){ E.discard(d,ui.S); ui.sel=null; say('丟掉一塊，這一手過了。',''); next(); return; }
  if(a==='strip'){ ui.strip=!ui.strip; say(ui.strip?'文化抽掉了：只剩代號。規則還是一樣，只是你看不到它為什麼。':'文化放回來了。',''); render(); return; }
  if(a==='ans'){ ui.why=(document.getElementById('why')||{}).value||ui.why; ui.answer=+el.getAttribute('data-i'); render(); return; }
  if(a==='field'){ var f=document.getElementById('field').value.trim(); var m=document.getElementById('field-msg'); if(f.length<(d.field.min_chars||10)){ m.textContent='再多寫一點（至少 '+(d.field.min_chars||10)+' 個字），寫你在哪裡、看到什麼。'; return; } store('tiles_field',f); m.textContent='記下來了。之後改做時，把它變成一條放置規則。'; return; }
  if(a==='again'){ start(ui.ver,ui.strip); return; }
  if(a==='again-strip'){ start(ui.ver,!ui.strip); return; }
  if(a==='other'){ start(ui.ver==='rule'?'skin':'rule',false); return; }
  if(a==='dump'){ var box=document.getElementById('remix-box'); box.value=JSON.stringify(DATA[el.getAttribute('data-ver')],null,2); ui.remixErr=''; return; }
  if(a==='load'){ var txt=document.getElementById('remix-box').value, obj=null; ui.remixOk=''; ui.remixErr='';
    try{ obj=JSON.parse(txt); }catch(e){ ui.remixErr='這不是正確的 JSON：'+e.message+'\n把這行紅字貼回給 AI，說「請修這個」。'; render(); document.getElementById('remix').open=true; return; }
    var errs=E.validate(obj); if(errs.length){ ui.remixErr=errs.join('\n')+'\n把上面的紅字貼回給 AI，說「請修這個」。'; render(); document.getElementById('remix').open=true; return; }
    DATA.custom=obj; ui.remixOk='載入成功。按「玩我改做的版本」。'; render(); document.getElementById('remix').open=true; return; }
}
function next(){ if(E.done(D(),ui.S)){ ui.screen='end'; render(); window.scrollTo(0,0); } else render(); }

window.__T={E:E, DATA:DATA, ui:ui, start:start};
render();
window.__tilesReady=true;
})();
</script>
