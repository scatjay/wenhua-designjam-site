<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小上帝廟的半年｜經營模擬樣板</title>
<style>
:root{
  --bg:#f7f1e6; --card:#fffaf0; --ink:#2b2118; --mute:#6b5d4d; --line:#d9c9ad;
  --accent:#a8271d; --accent-ink:#fff; --gold:#b8861b; --good:#2f6b3a; --bad:#a8271d; --info:#2f5f8a;
  --chip:#efe3cc; --btn:#fff3d6; --btn-line:#c9a45a; --dis:#e9e0cf;
}
:root[data-mode="skin"]{
  --bg:#eef1f4; --card:#ffffff; --ink:#1f2933; --mute:#5a6672; --line:#cfd6dd;
  --accent:#3b6ea5; --accent-ink:#fff; --gold:#6b7a89; --chip:#e3e8ee; --btn:#f4f7fa; --btn-line:#aab6c2; --dis:#e8ecf0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d1812; --card:#2a2319; --ink:#f1e8d8; --mute:#b9ab94; --line:#4a3f2d; --accent:#d9483b; --gold:#e0b04a;
    --good:#7bc88a; --bad:#ff8a7c; --info:#8cbcf0; --chip:#3a3123; --btn:#3a3023; --btn-line:#8a7338; --dis:#322a1e; }
  :root[data-mode="skin"]{ --bg:#14181d; --card:#1e252d; --ink:#e8edf2; --mute:#9aa7b4; --line:#33404d; --accent:#6aa3dc; --gold:#9aa7b4;
    --chip:#2a333d; --btn:#26303a; --btn-line:#4c5d6d; --dis:#222a32; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;max-width:100vw;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:12px 14px 80px}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.04em}
h2{font-size:16px;margin:18px 0 8px;border-left:4px solid var(--accent);padding-left:8px}
.sub{color:var(--mute);font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
button{font:inherit;color:var(--ink);background:var(--btn);border:1.5px solid var(--btn-line);border-radius:10px;min-height:46px;padding:8px 12px;cursor:pointer;text-align:left;width:100%}
button:hover:not(:disabled){filter:brightness(.97)}
button:focus-visible{outline:3px solid var(--info);outline-offset:2px}
button:disabled{background:var(--dis);color:var(--mute);border-color:var(--line);cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-align:center;font-weight:700}
button.small{min-height:44px;width:auto;padding:6px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.modes{display:flex;gap:8px;margin:8px 0}
.modes button{text-align:center;font-weight:700}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.res .c{background:var(--chip);border-radius:10px;padding:6px 8px;min-height:44px}
.res .c b{display:block;font-size:20px;line-height:1.2}
.res .c span{font-size:12px;color:var(--mute)}
.res .c.low b{color:var(--bad)}
.dots{letter-spacing:3px;font-size:18px}
.wait{display:flex;flex-wrap:wrap;gap:6px}
.wait .w{background:var(--chip);border-radius:999px;padding:6px 12px;min-height:44px;display:flex;align-items:center;gap:6px;font-size:15px}
.wait .w.zero{opacity:.45}
.wait small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.act{display:flex;flex-direction:column;gap:2px}
.act .t{font-weight:700}
.act .d{font-size:13px;color:var(--mute)}
.act .why{font-size:12px;color:var(--bad)}
.badge{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:middle;border:1px solid currentColor}
.b-原著{color:var(--good)} .b-改編{color:var(--gold)} .b-工坊創作{color:var(--mute)} .b-田野{color:var(--info)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.log li.bad{color:var(--bad)} .log li.good{color:var(--good)} .log li.event{font-weight:600} .log li.act{color:var(--mute)} .log li.field{color:var(--info)}
.note{font-size:13px;color:var(--mute)}
.banner{border:2px solid var(--accent);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--card)}
.banner.win{border-color:var(--good)}
.ck{list-style:none;padding:0;margin:6px 0}
.ck li{padding:4px 0}
textarea{width:100%;min-height:120px;font:13px/1.45 ui-monospace,Consolas,monospace;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px}
details{margin:8px 0} summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top button{width:auto;min-height:44px;text-align:center}
.pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Consolas,monospace;background:var(--chip);border-radius:8px;padding:8px}
.opts{display:grid;gap:8px}
.foot{font-size:12px;color:var(--mute);margin-top:18px}
.err{color:var(--bad);font-size:14px;white-space:pre-wrap}
.ok{color:var(--good);font-size:14px}
@media (max-width:420px){ main{padding:10px 10px 80px} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script type="application/json" id="data-culture">{"_說明":"小封神版（文化長在規則裡）。這份檔案就是整個遊戲的內容與規則：改這裡，遊戲就跟著變。每一段的作用寫在 README.md 的『欄位對照』。tag 欄標示來源：原著＝書裡有寫；改編＝依書裡的事改成遊戲規則；工坊創作＝書裡沒有、我們自己加的。","meta":{"id":"temple_sim","version":"culture","label":"小封神版","title":"小上帝廟的半年","subtitle":"你是廟祝，替小上帝、康元帥、趙元帥撐過半年，等七月三日夜的颱風。","months":6,"slots_per_month":5,"noise":1},"intro":["小上帝奉命駐在赤崁樓東邊的小鎮，鎮上的廟「三分不像寺、四分不像宮」，香煙稀微，燒金的人很少。","原書裡，半年後的七月三日夜，颱風把廟吹倒；之後三位神明挨餓，只靠廟祝的一壺清茶撐著。","這一次由你當廟祝。你每個月有 5 個時辰，要決定：先接待誰、米夠不夠、廟要不要修、那頂銅鍍金的通天冠留不留。"],"resources":{"money":{"label":"香油錢","icon":"🪙","start":24,"max":999,"note":"信眾投的錢。糴米、修廟都要它。"},"rice":{"label":"米","icon":"🍚","start":6,"max":30,"note":"三位神明每個月要吃 3 份。"},"incense":{"label":"香火","icon":"🕯️","start":18,"max":100,"decay_pct":25,"note":"信眾上門才有。放著不管，每個月會散掉四分之一，而且不能拿來花。"},"face":{"label":"體面","icon":"🎩","start":60,"max":100,"note":"神明的臉面。掉到 0，你們就被調走了。"},"repair":{"label":"廟況","icon":"🧱","start":30,"max":100,"note":"屋瓦、梁柱的狀況。每個月會自己舊掉一點。颱風夜要撐得住。"}},"flags":{"crown":"worn","kangzhao":"here"},"counters":{"grudge":0,"favor":0,"gambles":0,"verified":0},"reset_counters_monthly":["verified"],"customers":{"shuibian":{"label":"水邊人家","icon":"🌊","want":"夜裡水邊有怪聲，怕龜精蛇怪作怪","fit":"管得到","tag":"改編","src":"小上帝奉命『專管龜精蛇怪，並察人間善惡』（第一回）"},"yuan":{"label":"含冤的人","icon":"⚖️","want":"被人誣賴，想請神明看個公道","fit":"管得到","tag":"改編","src":"『察人間善惡』（第一回）；小上帝誤認魁星、被斥『用神不明』（第二、二十三回）"},"scholar":{"label":"趕考的書生","icon":"📜","want":"想求功名順利","fit":"管不到","tag":"改編","src":"功名是魁星的事；魁星出自赤崁樓文昌閣（第二回照片說明）"},"trader":{"label":"做生意的人","icon":"🧺","want":"想求生意興隆","fit":"管不到","tag":"工坊創作","src":"遊戲簡化：原書裡他專管龜蛇，功名、生意不是他的專長"},"passerby":{"label":"路過歇腳的人","icon":"🚶","want":"走累了，想坐一下","fit":"不求事","tag":"改編","src":"三神挨餓時，廟裡只有廟祝的清茶（第二回）"}},"calendar":{"shuibian":[2,2,1,2,2,1],"yuan":[0,1,0,1,0,1],"scholar":[2,2,2,1,2,1],"trader":[1,1,2,1,1,1],"passerby":[3,3,2,3,3,2]},"actions":[{"id":"comfort","label":"安撫水邊人家","desc":"慢慢來，一次顧 2 戶。","slots":1,"target":"shuibian","cap":2,"log":"你去水邊燒香、說明，慢慢安撫。","effects":[{"each_group":[{"add":{"incense":6,"money":3}}]}]},{"id":"drive","label":"鎮住龜蛇","desc":"快，一次最多 4 戶。但龜蛇會記仇。","slots":1,"target":"shuibian","cap":4,"log":"你照著小上帝的本分，把水邊的龜蛇通通鎮住。","effects":[{"each_group":[{"add":{"incense":4,"money":2}}]},{"counter":["grudge",1]}]},{"id":"verify","label":"查證誰才是對的","desc":"先把兩邊的說法對一對，一次查 2 件。","slots":1,"target":"yuan","cap":2,"log":"你一個一個去問、去對。","effects":[{"each_group":[{"counter":["verified",1]}]}]},{"id":"judge","label":"替含冤的人斷理","desc":"一次斷 2 件。沒查證就斷，可能冤枉到人。","slots":1,"target":"yuan","cap":2,"log":"你請神明作主，替含冤的人說句公道話。","effects":[{"each_group":[{"if":["counter","verified",">",0],"then":[{"counter":["verified",-1]},{"add":{"incense":8,"face":4,"money":2}},{"log":"查清楚了，斷得準，信眾都服氣。","kind":"good"}],"else":[{"roll":{"p":0.5,"yes":[{"add":{"incense":8,"face":4,"money":2}},{"log":"沒查證就斷，這次運氣好，斷對了。","kind":"good"}],"no":[{"add":{"incense":-4,"face":-15}},{"log":"沒查證就斷，冤枉了好人，傳得全鎮都知道。","kind":"bad"}]}}]}]}]},{"id":"refer","label":"請書生去文昌閣","desc":"功名不是這位神明管的，一次送 3 位。","slots":1,"target":"scholar","cap":3,"log":"你指路，請書生到赤崁樓的文昌閣去拜魁星。","effects":[{"each_group":[{"add":{"incense":1}}]},{"counter":["favor",1]}]},{"id":"take_scholar","label":"硬接書生的香","desc":"收他們的香油錢，一次 3 位。","slots":1,"target":"scholar","cap":3,"log":"你收下書生的香油錢，替他們求功名。","effects":[{"each_group":[{"add":{"money":3,"incense":-3}}]},{"log":"書生考不好，到處說早知道該去文昌閣。","kind":"bad"}]},{"id":"trader","label":"接待做生意的人","desc":"他們捐得多，一次 2 位。靈不靈，要看運氣。","slots":1,"target":"trader","cap":2,"log":"你收下做生意的人的香油錢，請神明保佑他們。","effects":[{"each_group":[{"add":{"money":8}},{"roll":{"p":0.4,"yes":[{"add":{"incense":6}}],"no":[{"add":{"incense":-5,"face":-3}}]}}]}]},{"id":"tea","label":"奉茶給路過的人","desc":"不求事，坐下喝杯茶就好。一次 4 位。","slots":1,"target":"passerby","cap":4,"log":"你端出廟祝的清茶。","effects":[{"each_group":[{"add":{"incense":2}}]}]},{"id":"buy_self","label":"你自己去糴米","desc":"花 10 錢，換 6 份米。","slots":1,"requires":["res","money",">=",10],"why_not":"香油錢不到 10","log":"你自己走一趟，把米扛回來。","effects":[{"add":{"money":-10,"rice":6}}]},{"id":"buy_kz","label":"派康、趙元帥去糴米","desc":"不花你的時辰，每月一次。但錢在他們手上……","slots":0,"once_per_month":true,"requires":["and",["res","money",">=",10],["flag","kangzhao","==","here"]],"why_not":"香油錢不到 10，或兩位元帥已經不在","log":"你把糴米錢交給康元帥和趙元帥。","effects":[{"add":{"money":-10,"rice":6}},{"if":["flag","crown","==","pawned"],"then":[{"roll":{"p":0.55,"yes":[{"add":{"rice":-6,"money":-10}},{"counter":["gambles",1]},{"log":"兩位元帥路過媽祖宮口，想把通天冠贏回來，賭輸了，還把糴米錢賠進去。回來只說錢被一個獠牙大漢搶走了。","kind":"bad"}],"no":[]}}],"else":[{"roll":{"p":0.15,"yes":[{"add":{"rice":-6,"money":-10}},{"counter":["gambles",1]},{"log":"兩位元帥路過媽祖宮口，被攤子勾住，賭了兩把，糴米錢輸光。回來只說錢被一個獠牙大漢搶走了。","kind":"bad"}],"no":[]}}]}]},{"id":"repair","label":"修廟","desc":"花 8 錢，廟況 +12。","slots":1,"requires":["res","money",">=",8],"why_not":"香油錢不到 8","log":"你請人補瓦、換梁。","effects":[{"add":{"money":-8,"repair":12}}]},{"id":"pawn","label":"當掉通天冠","desc":"銅鍍金的通天冠，換一大筆錢。可是冠沒了……","slots":1,"requires":["flag","crown","==","worn"],"why_not":"冠已經不在身上","log":"小上帝脫下通天冠，交給你去打銀街的當店。","effects":[{"add":{"money":50,"face":-10}},{"flag":["crown","pawned"]},{"log":"當出了不少錢，可是小上帝披頭散髮，臉色很難看。","kind":"bad"}]},{"id":"redeem","label":"把通天冠贖回來","desc":"要 55 錢（連利息）。","slots":1,"requires":["and",["flag","crown","==","pawned"],["res","money",">=",55]],"why_not":"冠還戴著，或香油錢不到 55","log":"你湊足錢，去把通天冠贖回來。","effects":[{"add":{"money":-55,"face":10}},{"flag":["crown","worn"]},{"log":"小上帝重新戴上冠，腰桿直了。（原書沒寫贖回，這是遊戲加的。）","kind":"good"}]}],"upkeep":[{"add":{"rice":-3,"repair":-5}}],"events":[{"id":"e_tea","phase":"start","month":[1,1],"once":true,"tag":"原著","title":"廟祝的清茶","text":"廟祝端來一壺清茶。原書裡，廟被颱風吹倒之後，三位神明餓著，只有這樣的清茶。這半年，你要改寫這件事。","effects":[]},{"id":"e_surge","phase":"start","month":[2,2],"once":true,"tag":"工坊創作","title":"水邊傳出怪聲","text":"河邊的人家說夜裡有東西在水裡翻，一下子多來了兩戶。","effects":[{"arrive":{"shuibian":2}}]},{"id":"e_audit","phase":"start","month":[3,3],"once":true,"tag":"改編","title":"天庭來清點","text":"天庭派人清點各廟的香火。書裡李靖說過，神仙也躲不過『行政整理』。","effects":[{"if":["res","incense",">=",25],"then":[{"add":{"face":5}},{"log":"香火夠旺， <script type="application/json" id="data-remix">{"title":"怎麼改做：小上帝廟的半年","lead":"這個遊戲的內容和規矩都放在一個叫 sim.json 的資料檔裡，網頁只是讀它、播它。所以你不用會寫程式，會改文字和數字就能改做。改完把整份貼回頁面最下面的「我的資料檔」，按「載入」就能玩。每改一次，按一下「試跑 100 局」，看看遊戲有沒有被你改壞。","tiers":[{"n":1,"name":"換內容","one_line":"不動規矩，只換人、換話、換比例。","task":"找一間你去得到的廟（進廟要安靜、不要擋路、拍照先問過），待半小時，記下來的人各是哪一類（問事情的、拜拜的、路過的、做生意的……）。再問廟祝或管理員一句話：「最近最常有人來問什麼？」把你記到的人數填進資料檔最下面的 field.observed_counts，把那句話填進 interview_line。再把來客的名字和「想要什麼」換成你看到的。","ai_cannot":"你去現場看到的人數、廟祝說的那句話，AI 沒去過，編出來的也不算數。","prompt":"我貼給你一份小遊戲的資料檔（JSON）。我去了〔廟名〕待半小時，看到的人大概是：〔例：問考試的 5 位、路過歇腳的 8 位、問身體的 2 位〕。廟祝跟我說：「〔那句話〕」。請只改 customers 的 label、want、icon，calendar 的數字，和 field 裡的 observed_counts、interview_line。不要動 actions、events、finale 裡的規則和條件。改完把整份資料檔原樣回傳，不要省略。"},{"n":2,"name":"換規矩","one_line":"選一條規矩改掉，看遊戲變成什麼樣。","task":"從下面挑一條改：①香火每個月散掉多少（resources.incense.decay_pct，25 改成 0 或 50）；②鎮龜蛇幾次龜靈聖母才會出面（events 裡 e_turtle 的 ['counter','grudge','>=',3]）；③康、趙兩位元帥賭輸的機率（actions 裡 buy_kz 的 p：0.15 和 0.55）；④沒查證就斷理的冤枉機率（judge 裡的 p：0.5）。改完按「試跑 100 局」，記下勝率從多少變多少，再用一句話寫：這條規矩被改掉以後，玩的人的選擇變少了還是變多了？","ai_cannot":"「改完好不好玩」要你自己玩一局才知道；AI 只能算勝率。","prompt":"這是小遊戲的資料檔（JSON）。請把〔例：香火每個月散掉四分之一〕改成〔例：每個月散掉一半〕，只改必要的欄位，並列出你改了哪幾個欄位。再告訴我：這樣改會讓哪些選擇變得更重要、哪些選擇變得沒意義？我會把「試跑 100 局」的勝率貼給你，請幫我判斷有沒有太簡單或太難。"},{"n":3,"name":"換形式","one_line":"同一套資料格式，換成別的場景；或拆一段去做別的遊戲。","task":"兩條路選一條。（甲）換場景：資料檔的格式不變，把「廟」換成「辦桌」——來客改成賓客（長輩、晚輩、有過節的兩家人），動作改成安排座位、上菜，資源改成體面、菜、時間。（乙）拆一段：把「含冤的人」那一段（兩個長得很像的人，先查證再斷理）拆出來，做成一個解謎小遊戲，用解謎樣板去做。","ai_cannot":"辦桌真正的規矩（誰坐哪、先上哪道菜）要問長輩或辦桌的人，AI 寫的常常是想像出來的。","prompt":"請用和這份資料檔完全相同的格式（meta、resources、customers、calendar、actions、events、finale），把場景改成「辦桌」。來客改成〔例：長輩、晚輩、兩個有過節的親戚〕，動作改成〔例：安排主桌、安排前排、請人換桌〕。要有一個「沒有人會攔你、但做錯會被記一筆」的規矩。回傳完整的 JSON，並用三句話說明：把辦桌的規矩拿掉後，這個遊戲還玩得下去嗎？"}],"extend_title":"加一個東西：兩種最常見的擴充","extend":[{"title":"加一種來客","why":"例如「受驚的孩子」。三個地方各加一筆就好：customers（他是誰）、calendar（每個月來幾個）、actions（你怎麼接待他）。","snippet":"\"customers\"（在裡面多加這一筆）: { \"shock\": { \"label\": \"受驚的孩子\", \"icon\": \"🧒\", \"want\": \"被嚇到，家長想讓他安心\", \"fit\": \"管得到\", \"tag\": \"工坊創作\", \"src\": \"我自己查的來源\" } }\n\"calendar\"（在裡面多加這一筆）: { \"shock\": [0, 1, 1, 0, 1, 0] }\n\"actions\"（在陣列裡多加這一筆）: { \"id\": \"calm\", \"label\": \"替孩子收驚\", \"desc\": \"一次 2 位\", \"slots\": 1, \"target\": \"shock\", \"cap\": 2, \"effects\": [ { \"each_group\": [ { \"add\": { \"incense\": 6, \"money\": 2 } } ] } ] }","note":"收驚是真的有人在做的習俗。遊戲裡只是簡化的示意，真正怎麼做、說什麼，請去問長輩或廟方，不要照 AI 寫的。"},{"title":"加一個事件","why":"例如「廟口有人辦桌」。events 裡加一筆：什麼時候發生（month）、發生什麼（effects）、一句話（text）。","snippet":"{ \"id\": \"e_feast\", \"phase\": \"start\", \"month\": [3, 3], \"once\": true, \"tag\": \"工坊創作\", \"title\": \"廟口有人辦桌\", \"text\": \"隔壁辦桌，路過的人變多，可是廟裡的米被借走兩份。\", \"effects\": [ { \"arrive\": { \"passerby\": 4 } }, { \"add\": { \"rice\": -2 } } ] }","note":"tag 要老實填：原著（書裡有）、改編（依書裡的事改的）、工坊創作（你加的）。這是你的作品，標清楚就是你的功勞。"}],"tool_chain":{"title":"這一單元多學的一個工具串接","text":"把頁面上「試跑 100 局」的結果貼給 Claude 或 Gemini，連同你改的那一行，問它：這樣改合理嗎？下一步該調哪個數字？它建議、你改、再試跑——這個來回，就是用工具改遊戲最常用的流程。"},"judge_prompt":"兩個版本都玩過之後，回答這一題：把小封神的規矩拿掉，只剩普通的開店賺錢，這個遊戲還玩得下去嗎？"}</script>

  function test(g, c) {

    if (k === 'flag') return cmp(g.flags[c[1]], c[2], c[3]);
    if (k === 'counter') return cmp(g.counters[c[1]] || 0, c[2], c[3]);
    if (k === 'month') return cmp(g.month, c[1], c[2]);
    if (k === 'waiting') return cmp(g.waiting[c[1]] || 0, c[2], c[3]);
    if (k === 'and') return c.slice(1).every(function (x) { return test(g, x); });

  }
  function apply(g, effs, ctx) {
    ctx = ctx || {};

        Object.keys(e.add).forEach(function (k) {
          if (!(k in g.res)) throw new Error('資源不存在：' + k);

      if (e.counter) g.counters[e.counter[0]] = (g.counters[e.counter[0]] || 0) + e.counter[1];
      if (e.counter_set) g.counters[e.counter_set[0]] = e.counter_set[1];
      if (e.flag) g.flags[e.flag[0]] = e.flag[1];
      if (e.arrive) {
        Object.keys(e.arrive).forEach(function (k) {
          g.waiting[k] = (g.waiting[k] || 0) + e.arrive[k];

        for (var i = 0; i < (ctx.n || 0); i++) apply(g, e.each_group, ctx);

      if (e.if) apply(g, test(g, e.if) ? e.then : e.else, ctx);

  /* ---------- 月初／月底 ---------- */
  function arrivals(g) {

      if (ev.once && g.fired[ev.id]) return;

  function startMonth(g) {
    g.slotsLeft = g.data.meta.slots_per_month;
    g.used = {};

  }

  /* ---------- 玩家動作 ---------- */
  function actionState(g, a) {

    if (a.slots > g.slotsLeft) return { ok: false, why: '這個月的時辰用完了', n: 0 };
    if (a.once_per_month && g.used[a.id]) return { ok: false, why: '這個月已經做過了', n: 0 };
    var n = 0;
    if (a.target) {
      n = Math.min(a.cap || 99, g.waiting[a.target] || 0);

  }

    var a = g.data.actions.filter(function (x) { return x.id === id; })[0];
    if (!a) throw new Error('沒有這個動作：' + id);
    var s = actionState(g, a);
    if (!s.ok) return { ok: false, why: s.why };
    var before = g.log.length;
    g.slotsLeft -= a.slots;
    if (a.once_per_month) g.used[a.id] = true;
    if (a.target) g.waiting[a.target] -= s.n;
    say(g, a.log || a.label, 'act', '');
    apply(g, a.effects, { n: s.n });
    checkFail(g);

  }

  /* ---------- 資料檢查（給改 JSON 的人用，抓最常見的手誤） ---------- */
  function validate(data) {
    var errs = [];
    function need(c, m) { if (!c) errs.push(m); }
    need(data && data.meta, '缺 meta');
    if (!data || !data.meta) return errs;
    ['months', 'slots_per_month'].forEach(function (k) {
      need(Number.isInteger(data.meta[k]) && data.meta[k] > 0, 'meta.' + k + ' 要是正整數');
    });
    need(data.resources && Object.keys(data.resources).length > 0, '缺 resources');
    need(data.customers && data.calendar, '缺 customers / calendar');
    var rid = Object.keys(data.resources || {});
    Object.keys(data.customers || {}).forEach(function (c) {
      need(data.calendar && data.calendar[c], '來客 ' + c + ' 在 calendar 裡沒有每月人數');
      if (data.calendar && data.calendar[c]) {

      }

    var json = JSON.stringify(data.actions || []) + JSON.stringify(data.events || []) + JSON.stringify(data.upkeep || []);

    });
    (data.actions || []).forEach(function (a) {
      need(a.id && a.label, '動作缺 id 或 label');
      if (a.target) need(data.customers && data.customers[a.target], '動作 ' + a.id + ' 的 target 不是已定義的來客：' + a.target);
      need(typeof a.slots === 'number', '動作 ' + a.id + ' 缺 slots');
    });
    need(data.finale && data.finale.checks && data.finale.endings, '缺 finale.checks / finale.endings');
    if (data.finale && data.finale.endings) {
      var last = data.finale.endings[data.finale.endings.length - 1];
      need(last && last.min_passed === 0 && !last.requires, 'finale.endings 最後一個要是「什麼都沒過也算」（min_passed: 0）');
    }
    return errs;
  }

  return { create: create, legal: legal, act: act, endMonth: endMonth, validate: validate, test: test, clone: clone };
});

  var h = '<div class="card"><h2 style="margin-top:0">' + esc(REMIX.title) + '</h2><p>' + esc(REMIX.lead) + '</p>';
  REMIX.tiers.forEach(function (t) {
    h += '<details><summary>第 ' + t.n + ' 階：' + esc(t.name) + '　<span class="note">' + esc(t.one_line) + '</span></summary><p>' + esc(t.task) + '</p><p class="note">🔎 ' + esc(t.ai_cannot) + '</p><p><b>可以貼給 Claude／Gemini 的指令：</b></p><div class="pre" id="p' + t.n + '">' + esc(t.prompt) + '</div><button class="small" data-copy="p' + t.n + '">複製這段指令</button></details>';
  });
  h += '<h2>' + esc(REMIX.extend_title) + '</h2>';
  REMIX.extend.forEach(function (x, i) {
    h += '<details><summary>' + esc(x.title) + '</summary><p>' + esc(x.why) + '</p><div class="pre" id="x' + i + '">' + esc(x.snippet) + '</div><button class="small" data-copy="x' + i + '">複製範例</button><p class="note">' + esc(x.note) + '</p></details>';
  });
  h += '<p><b>' + esc(REMIX.tool_chain.title) + '</b><br>' + esc(REMIX.tool_chain.text) + '</p></div>';
  return h;
}
function jsonPanel() {
  var h = '<details id="jsondet"' + (S.jsonOpen ? ' open' : '') + '><summary>我的資料檔（貼上改好的 JSON）</summary><p class="note">把整份貼進來，按「載入」，會換掉目前這個版本的內容。載入前會先檢查常見的手誤。</p><textarea id="jsonbox" aria-label="我的資料檔" spellcheck="false"></textarea><div class="row"><button class="small" data-act="__load">載入並重新開始</button><button class="small" data-act="__fill">放入目前的資料檔</button><button class="small" data-act="__simulate">試跑 100 局</button></div>';
  if (S.jsonMsg) h += S.jsonMsg.err ? '<p class="err">' + esc(S.jsonMsg.err) + '</p>' : '<p class="ok">' + esc(S.jsonMsg.ok) + '</p>';
  return h + '</details>';
}

function render() {
  var app = document.getElementById('app'), d = DATA[S.mode], g = S.g;
  var keepJson = document.getElementById('jsonbox') ? document.getElementById('jsonbox').value : '';
  var h = '<div class="top"><h1>' + esc(d.meta.title) + '</h1><button data-act="__mute" aria-pressed="' + (!S.muted) + '" aria-label="聲音開關">' + (S.muted ? '🔇 靜音' : '🔊 有聲') + '</button></div>';
  h += '<p class="sub">' + esc(d.meta.subtitle) + '</p>';
  h += '<div class="modes" role="group" aria-label="選版本"><button data-act="__m_culture" aria-pressed="' + (S.mode === 'culture') + '">' + esc(DATA.culture.meta.label) + '</button><button data-act="__m_skin" aria-pressed="' + (S.mode === 'skin') + '">' + esc(DATA.skin.meta.label) + '</button></div>';
  if (!g) {
    h += '<div class="card">' + (d.intro || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
    if (S.jsonMsg && S.jsonMsg.err) h += '<p class="err">' + esc(S.jsonMsg.err) + '</p>';
    h += '<button class="primary" data-act="__restart">開始</button>';
  } else {
    h += '<div class="card"><div class="top"><b>第 ' + g.month + ' 個月 / 共 ' + d.meta.months + ' 個月</b><span class="dots" aria-label="剩 ' + g.slotsLeft + ' 個時辰">' + '●'.repeat(g.slotsLeft) + '○'.repeat(Math.max(0, d.meta.slots_per_month - g.slotsLeft)) + '</span></div>' + resHtml(g) + (S.lastDelta ? '<p class="note">上個月底：' + esc(S.lastDelta) + '</p>' : '') + '</div>';
    if (g.phase === 'ended') {
      h += endHtml(g);
      h += judgeHtml();
    } else {
      h += '<h2>現在在等的人</h2>' + waitHtml(g) + actHtml(g);
      h += '<div style="margin-top:12px"><button class="primary" data-act="__end">結束這個月</button></div>';
    }
    h += '<h2>' + (S.logAll ? '全部紀錄' : '這個月發生的事') + '</h2><div class="card">' + logHtml(g) + '<button class="small" data-act="__logall">' + (S.logAll ? '只看這個月' : '看全部紀錄') + '</button></div>';
  }
  h += '<h2>想自己改一改？</h2>' + (S.showRemix ? remixHtml() : '') + '<button data-act="__remix">' + (S.showRemix ? '收起「怎麼改做」' : '看「怎麼改做」') + '</button>' + jsonPanel();
  h += '<p class="foot">遊戲為示意與簡化，不是民俗儀式教學。故事取材自許丙丁《小封神》；每個事件旁的標籤說明它是「原著」、「改編」還是「工坊創作」。聲音由瀏覽器現場合成。</p>';
  app.innerHTML = h;
  var jb = document.getElementById('jsonbox'); if (jb && keepJson) jb.value = keepJson;
  if (g && g.phase === 'ended' && !S.played[S.mode + '_rec' + g.seed]) {
    S.played[S.mode + '_rec' + g.seed] = true; S.played[S.mode] = g.result; sfx(g.result.win ? 'good' : 'bad');
    render();
  }
}

/* ---------- 事件 ---------- */
function copyFrom(id, btn) {
  var el = document.getElementById(id), txt = el.textContent;
  function mark() { btn.textContent = '已複製 ✓'; setTimeout(function () { btn.textContent = btn.getAttribute('data-label') || '複製'; }, 1500); }
  btn.setAttribute('data-label', btn.textContent);
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(mark, function () { selectNode(el); }); } else { selectNode(el); }
}
function selectNode(el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }

document.getElementById('app').addEventListener('toggle', function (ev) { if (ev.target.id === 'jsondet') S.jsonOpen = ev.target.open; }, true);
document.getElementById('app').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-copy')) { copyFrom(b.getAttribute('data-copy'), b); return; }
  var a = b.getAttribute('data-act'); if (!a) return;
  if (a === '__mute') { S.muted = !S.muted; if (!S.muted) { ensureAudio(); if (AC && AC.state === 'suspended') AC.resume(); sfx('click'); } render(); return; }
  if (a === '__m_culture' || a === '__m_skin') { startGame(a === '__m_skin' ? 'skin' : 'culture'); return; }
  if (a === '__restart') { startGame(S.mode); return; }
  if (a === '__remix') { S.showRemix = !S.showRemix; render(); return; }
  if (a === '__logall') { S.logAll = !S.logAll; render(); return; }
  if (a.indexOf('__judge') === 0) { S.judged = parseInt(a.slice(7), 10); render(); return; }
  if (a === '__fill') { document.getElementById('jsonbox').value = JSON.stringify(DATA[S.mode], null, 2); return; }
  if (a === '__load') {
    var txt = document.getElementById('jsonbox').value, obj;
    try { obj = JSON.parse(txt); } catch (e) { S.jsonMsg = { err: '這不是正確的 JSON：' + e.message }; render(); document.getElementById('jsonbox').value = txt; return; }
    var errs = E.validate(obj);
    if (errs.length) { S.jsonMsg = { err: errs.join('\n') }; render(); document.getElementById('jsonbox').value = txt; return; }
    DATA[S.mode] = obj; S.sim = null; S.jsonMsg = { ok: '已載入。這個版本現在用的是你的資料檔。' }; startGame(S.mode); document.getElementById('jsonbox').value = txt; return;
  }
  if (a === '__simulate') {
    var d2 = DATA[S.mode];
    try {
      var r1 = simulate(d2, botRandom, 100), r2 = simulate(d2, botGeneric, 100);
      S.jsonMsg = { ok: '試跑 100 局｜亂點的勝率 ' + r1.win + '%｜照一般經營玩法的勝率 ' + r2.win + '%。（太接近 100% 代表沒什麼好決定的；太接近 0% 代表太難。）' };
    } catch (e) { S.jsonMsg = { err: '試跑時出錯：' + e.message }; }
    var keep = document.getElementById('jsonbox').value; render(); document.getElementById('jsonbox').value = keep; return;
  }
  if (!S.g) return;
  if (a === '__end') {
    var before = snap(S.g); sfx('click');
    var nLog = S.g.log.length;
    E.endMonth(S.g);
    S.lastDelta = deltaText(before, S.g.res, S.g.data);
    var newer = S.g.log.slice(nLog);
    if (newer.some(function (l) { return l.kind === 'bad'; })) sfx('bad'); else if (newer.some(function (l) { return l.kind === 'event'; })) sfx('event');
    render(); return;
  }
  var n0 = S.g.log.length, res = E.act(S.g, a);
  if (res.ok) {
    var ls = S.g.log.slice(n0);
    if (ls.some(function (l) { return l.kind === 'bad'; })) sfx('bad'); else if (ls.some(function (l) { return l.kind === 'good'; })) sfx('good'); else sfx('click');
  }
  render();
});

window.__SIM = { S: S, E: E, DATA: DATA, simulate: simulate };   // 給自動驗收用
startGame('culture');
})();
</script>
