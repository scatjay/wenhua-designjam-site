<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>冠不見了｜解謎樣板・小封神示範</title>
<style>
/* ===== 共用語意 token（名稱固定，值由本樣板決定）＋本樣板私有變數。寫死的顏色只准出現在這一區 ===== */
:root{
  --tk-surface:#efe4cb; --tk-panel:#f8f1de; --tk-ink:#2a211a; --tk-muted:#6a5a48; --tk-accent:#a8322a; --tk-accent-ink:#fff7ee; --tk-line:#c9b896;
  --tk-font-title:"DFKai-SB","BiauKai","Kaiti TC","STKaiti","Noto Serif TC",serif;
  --tk-font-body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --tk-radius:3px; --tk-shadow:3px 3px 0 rgba(42,33,26,.85);
  /* 私有 */
  --paper2:#efe3c6; --red2:#c94a3f; --jade:#2c6a55; --gold:#a97c1c; --blue:#2c5f7a; --ok:#2c6a55; --bad:#a8322a;
  --t-orig:#2c6a55; --t-folk:#8a5a14; --t-made:#6a4b8a; --t-adapt:#2c5f7a; --t-field:#a8322a;
  --white:#fff; --cover-bg:#10202a; --cover-ink:#fff3d6; --stage-bg:#222; --chip-on:#ffd9a0; --spot-ring-on:#ffe08a;
  --shade-45:rgba(0,0,0,.45); --shade-70:rgba(0,0,0,.7); --clear:rgba(0,0,0,0); --rule:rgba(120,90,50,.12);
  --pulse-a:rgba(201,74,63,.6); --pulse-b:rgba(201,74,63,0);
  --glow-a:rgba(255,236,170,.75); --glow-b:rgba(255,236,170,0); --halo:rgba(255,236,170,.35); --stamp-bg:rgba(255,247,226,.88);
  --spot-bg:rgba(168,50,42,.88); --spot-look:rgba(42,33,26,.78); --spot-done:rgba(44,106,85,.72);
}
@media (prefers-color-scheme:dark){
  :root{
    --tk-surface:#15130f; --tk-panel:#201c15; --tk-ink:#f1e7cf; --tk-muted:#b9ab8c; --tk-accent:#e0614f; --tk-accent-ink:#fff7ee; --tk-line:#4a4132;
    --tk-shadow:3px 3px 0 rgba(0,0,0,.7);
    --paper2:#2a251b; --red2:#f08373; --jade:#5ec3a0; --gold:#e1b24c; --blue:#7fc0dd; --ok:#5ec3a0; --bad:#ef7060;
    --t-orig:#5ec3a0; --t-folk:#e1b24c; --t-made:#b79ae0; --t-adapt:#7fc0dd; --t-field:#ef7060;
  }
}
/* 抽掉文化版：整體換成素色，讓兩版一眼分得出來 */
body.skin{--tk-surface:#e6e9ec;--tk-panel:#f4f6f8;--tk-ink:#1f2933;--tk-muted:#58636f;--tk-line:#b9c2cc;--tk-accent:#3b5f8a;--paper2:#e4e8ec;--red2:#5a7fae;--gold:#6b7785;--spot-bg:rgba(59,95,138,.9)}
@media (prefers-color-scheme:dark){body.skin{--tk-surface:#14181c;--tk-panel:#1c2228;--tk-ink:#e6ebf0;--tk-muted:#a2adb8;--tk-line:#3a444e;--tk-accent:#7fa6d6;--paper2:#252d35;--red2:#9dbbe2;--gold:#97a3b0}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--tk-surface);color:var(--tk-ink);font:16px/1.65 var(--tk-font-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
#app{max-width:760px;margin:0 auto;padding:0 12px 40px}
h1,h2,h3{font-family:var(--tk-font-title);margin:0;line-height:1.35}
p{margin:.4em 0}
button,select,textarea,input{font:inherit;color:inherit}
button{min-height:46px;padding:8px 14px;border:2px solid var(--tk-muted);background:var(--tk-panel);border-radius:var(--tk-radius);cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:not-allowed}
button:not(.spot):not(.ghost):not(.chip){box-shadow:2px 2px 0 var(--tk-ink)}
button.primary{background:var(--tk-accent);border-color:var(--tk-accent);color:var(--tk-accent-ink);font-weight:700}
button.ghost{border-color:var(--tk-line);background:transparent}
button.sel{outline:3px solid var(--gold);outline-offset:1px}
button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,label.opt:focus-within{outline:3px solid var(--blue);outline-offset:2px}
select,textarea{width:100%;min-height:46px;padding:8px 10px;border:2px solid var(--tk-line);border-radius:var(--tk-radius);background:var(--tk-panel)}
textarea{min-height:84px;resize:vertical}

/* 抬頭 */
header.top{padding:10px 0 4px}
.titlerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.titlerow h1{font-size:24px;letter-spacing:.08em}
.ver{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--tk-accent);color:var(--tk-accent-ink)}
.sub{color:var(--tk-muted);font-size:14px;margin-top:2px}
.banner{margin:8px 0 0;padding:8px 12px;border-left:5px solid var(--gold);background:var(--paper2);border-radius:0 8px 8px 0;font-size:14px;color:var(--tk-muted)}
body.playing .sub,body.playing .banner{display:none}
body.playing .titlerow h1{font-size:19px}
body.playing .ctl{gap:6px}
body.playing .ctl button{min-height:44px;padding:4px 10px}
body.playing .seg button{min-width:58px;padding:4px 8px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seg{display:flex;border:2px solid var(--tk-muted);border-radius:var(--tk-radius);overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;min-width:84px}
.seg button.on{background:var(--tk-ink);color:var(--tk-panel);font-weight:700}

nav.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:10px 0;position:sticky;top:0;z-index:5;background:var(--tk-surface);padding:6px 0}
nav.tabs button{border-radius:var(--tk-radius) 10px 4px 4px;border-width:2px;padding:6px 4px;font-weight:600;position:relative}
nav.tabs button.on{background:var(--tk-ink);color:var(--tk-panel);border-color:var(--tk-ink)}
nav.tabs[hidden]{display:none}
.badge{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--tk-accent);color:var(--tk-accent-ink);font-size:12px;line-height:20px}
.dot{position:absolute;top:2px;right:6px;width:10px;height:10px;border-radius:50%;background:var(--red2);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pulse-a)}100%{box-shadow:0 0 0 10px var(--pulse-b)}}

/* 卡片 */
.card{background:var(--tk-panel);border:1.5px solid var(--tk-line);border-radius:var(--tk-radius);padding:12px 14px;margin:10px 0;box-shadow:var(--tk-shadow)}
.card h2{font-size:19px}
.card h3{font-size:16px}
.muted{color:var(--tk-muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.tag{font-size:12px;padding:0 8px;border-radius:99px;border:1.5px solid currentColor;line-height:20px}
.tag.orig{color:var(--t-orig)} .tag.folk{color:var(--t-folk)} .tag.made{color:var(--t-made)} .tag.adapt{color:var(--t-adapt)} .tag.field{color:var(--t-field)} .tag.other{color:var(--tk-muted)}
.stamp{display:inline-block;border:2.5px solid var(--tk-accent);color:var(--tk-accent);padding:0 10px;border-radius:6px;font-weight:700;transform:rotate(-4deg);font-size:14px}
.got{color:var(--ok);font-weight:700}
.lock{opacity:.6}
.msg{margin:8px 0;padding:8px 12px;border-radius:8px;background:var(--paper2);border:1.5px dashed var(--tk-line)}
.msg.ok{border-color:var(--ok);border-style:solid}
.msg.bad{border-color:var(--bad);border-style:solid}

.items{display:flex;gap:8px;flex-wrap:wrap}
.items button{flex:1 1 140px;text-align:left}
.items button small{display:block;color:var(--tk-muted);font-size:12px;line-height:1.35}
.pair{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

details.cx{border:1.5px solid var(--tk-line);border-radius:var(--tk-radius);margin:8px 0;background:var(--tk-panel)}
details.cx summary{min-height:46px;display:flex;align-items:center;padding:6px 12px;cursor:pointer;font-weight:700;list-style:none}
details.cx summary::-webkit-details-marker{display:none}
details.cx summary::after{content:"＋";margin-left:auto;color:var(--tk-muted)}
details.cx[open] summary::after{content:"－"}
details.cx .in{padding:0 14px 12px}

label.opt{display:flex;gap:10px;align-items:flex-start;min-height:46px;padding:8px 10px;border:2px solid var(--tk-line);border-radius:var(--tk-radius);margin:6px 0;cursor:pointer;background:var(--tk-panel)}
label.opt input{margin-top:5px;width:20px;height:20px;flex:none}
label.opt.on{border-color:var(--gold);background:var(--paper2)}

/* 封面 */
.cover{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--tk-ink);background:var(--cover-bg);margin-top:6px}
.cover svg.art{display:block;width:100%;height:auto;aspect-ratio:400/300}
.cover .ct{position:absolute;left:0;right:0;top:10%;text-align:center;color:var(--cover-ink);text-shadow:0 2px 10px var(--shade-70)}
.cover .ct .k{font-size:13px;letter-spacing:.5em;opacity:.85}
.cover .ct .t{font:900 clamp(38px,12vw,64px)/1.1 var(--tk-font-title);letter-spacing:.12em;margin:6px 0}
.cover .ct .s{font-size:14px;opacity:.9}
.coverbar{padding:14px;background:var(--tk-panel);display:grid;gap:10px}
.coverbar .big{min-height:56px;font-size:19px;letter-spacing:.2em}
.facts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--tk-muted)}
.facts span{border:1.5px solid var(--tk-line);border-radius:99px;padding:0 10px;line-height:24px}

/* 序幕（狀紙） */
.scroll{position:relative;background:var(--tk-panel);border:2px solid var(--tk-muted);border-radius:6px;padding:22px 18px;margin:12px 0;box-shadow:var(--tk-shadow);background-image:repeating-linear-gradient(0deg,transparent 0 31px,var(--rule) 31px 32px)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-6px;right:-6px;height:12px;border-radius:6px;background:var(--tk-muted)}
.scroll::before{top:-8px}.scroll::after{bottom:-8px}
.scroll .pg{font-size:18px;line-height:2;min-height:150px;animation:rise .5s both}
.scroll .who{font-size:13px;color:var(--tk-muted);letter-spacing:.2em;margin-bottom:6px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--tk-line)}
.dots i.on{background:var(--tk-accent)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 地圖與場景 */
.map{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;margin:4px 0 8px}
.map button{min-height:50px;padding:4px 2px;font-size:13px;line-height:1.25;border-radius:var(--tk-radius);position:relative}
.map button.on{background:var(--tk-ink);color:var(--tk-panel);border-color:var(--tk-ink);font-weight:700}
.map button.lock{opacity:.55;border-style:dashed}
.map .n{display:block;font-size:11px;color:var(--tk-accent);font-weight:700}
.map button.on .n{color:var(--chip-on)}
.stage{position:relative;border:2px solid var(--tk-ink);border-radius:14px;overflow:hidden;background:var(--stage-bg);aspect-ratio:400/260;box-shadow:var(--tk-shadow)}
.stage svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{position:absolute;width:48px;height:48px;min-height:48px;margin:-24px 0 0 -24px;padding:0;border-radius:50%;border:2.5px solid var(--tk-accent-ink);background:var(--spot-bg);color:var(--white);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px var(--shade-45);animation:glow 1.8s infinite}
.spot.look{background:var(--spot-look);animation:none}
.spot.done{background:var(--spot-done);opacity:.8;animation:none}
.spot.on{outline:3px solid var(--spot-ring-on)}
.spot:focus-visible{outline:3px solid var(--white);outline-offset:2px}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--glow-a),0 2px 8px var(--shade-45)}100%{box-shadow:0 0 0 14px var(--glow-b),0 2px 8px var(--shade-45)}}
.cap{font-size:13px;color:var(--tk-muted);margin:6px 2px}
.reveal{display:flex;gap:10px;align-items:flex-start;background:var(--tk-panel);border:2px solid var(--tk-muted);border-radius:var(--tk-radius);padding:10px 12px;margin:8px 0;min-height:76px;animation:pop .35s both}
.reveal .ic{font-size:30px;line-height:1.1;flex:none;width:38px;text-align:center}
.reveal .hd{font-size:12px;color:var(--tk-muted);letter-spacing:.08em}
.reveal .tx{font-size:15.5px}
.reveal.new{border-color:var(--gold);background:linear-gradient(90deg,var(--paper2),var(--tk-panel))}
.reveal .nw{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--tk-accent-ink);background:var(--tk-accent);border-radius:99px;padding:0 10px;line-height:22px}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.goal{font-size:14px;margin:6px 2px;color:var(--tk-muted)}
.goal b{color:var(--tk-accent)}
.bag{background:var(--tk-panel);border:1.5px solid var(--tk-line);border-radius:var(--tk-radius);padding:8px 10px;margin:8px 0}
.bag .hd{font-size:12px;color:var(--tk-muted);letter-spacing:.1em;margin-bottom:4px}
.bag .row{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--tk-radius);font-size:14px}
.chip .e{font-size:22px}
.chip.sel{background:var(--paper2)}
.bagact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* 解開特效（不擋點擊） */
.cele{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,var(--halo),var(--clear) 65%);animation:fadeout 2.6s forwards}
.cele .st{font:900 clamp(40px,14vw,78px)/1 var(--tk-font-title);color:var(--tk-accent);border:6px solid var(--tk-accent);padding:6px 22px;border-radius:var(--tk-radius);background:var(--stamp-bg);transform:rotate(-8deg);animation:slam .55s cubic-bezier(.2,1.6,.4,1) both;text-align:center}
.cele .st small{display:block;font:600 15px/1.4 system-ui,sans-serif;letter-spacing:.1em;color:var(--tk-ink)}
.cele i{position:absolute;left:50%;top:50%;width:10px;height:14px;border-radius:2px;animation:burst 1.6s ease-out both}
@keyframes slam{from{transform:rotate(-8deg) scale(3);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
@keyframes burst{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0}}

/* 結局 */
.rv{animation:rise .7s both}
.grade{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.grade .seal{width:92px;height:92px;border-radius:50%;border:5px solid var(--tk-accent);color:var(--tk-accent);display:flex;align-items:center;justify-content:center;font:900 40px/1 var(--tk-font-title);transform:rotate(-8deg);flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.stats div{background:var(--paper2);border-radius:var(--tk-radius);padding:6px 10px;font-size:13px;color:var(--tk-muted)}
.stats b{display:block;font-size:20px;color:var(--tk-ink)}
.stars{font-size:26px;letter-spacing:.1em;color:var(--gold)}

/* 筆記本 */
.note{border-left:5px solid var(--gold)}
.note.new{animation:pop .5s both;border-left-color:var(--tk-accent)}
.logline{font-size:14px;border-bottom:1px dashed var(--tk-line);padding:4px 0}
.badge.new{background:var(--gold)}

/* 筊杯 */
#oracleTop{scroll-margin-top:72px}
.bei-row{display:flex;gap:18px;justify-content:center;align-items:center;margin:10px 0;min-height:70px}
.bei{width:78px;height:50px;transform-origin:center}
.bei svg{width:100%;height:100%;display:block}
.bei.throw{animation:flip .7s ease-out}
.bei.throw.b2{animation-delay:.08s}
@keyframes flip{0%{transform:translateY(-40px) rotate(0)}60%{transform:translateY(0) rotate(540deg)}80%{transform:translateY(-8px) rotate(600deg)}100%{transform:translateY(0) rotate(720deg)}}
.incense{display:flex;gap:6px;align-items:flex-end;height:40px;margin:4px 0}
.stick{width:7px;background:var(--gold);border-radius:2px 2px 0 0;position:relative}
.stick::before{content:"";position:absolute;left:1px;top:-6px;width:5px;height:6px;border-radius:50%;background:var(--red2)}
.stick.used{background:var(--tk-line);height:12px!important}
.stick.used::before{display:none}
.qlist{display:grid;gap:8px;margin-top:8px}
.qlist button{text-align:left}
.qlist button.done{opacity:.55}
.res{font-weight:700}

.chain{display:flex;align-items:center;gap:6px;margin:4px 0 8px;font-size:13px;color:var(--tk-muted);flex-wrap:wrap}
.chain span{border:1.5px solid var(--tk-line);border-radius:99px;padding:0 10px;line-height:24px}
.chain span.on{border-color:var(--ok);color:var(--ok);font-weight:700}
.chain span.cur{border-color:var(--tk-accent);color:var(--tk-accent);font-weight:700}
.hintbox{margin-top:10px}
.hintbox .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hintbox .lv{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.08em}
ol.steps{margin:6px 0 0 20px;padding:0}
#toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,40px);max-width:min(92vw,520px);background:var(--tk-ink);color:var(--tk-panel);padding:10px 16px;border-radius:var(--tk-radius);opacity:0;pointer-events:none;transition:.25s;z-index:30;font-size:15px}
#toast.show{opacity:1;transform:translate(-50%,0)}
footer.foot{margin-top:24px;padding-top:10px;border-top:1.5px solid var(--tk-line);font-size:13px;color:var(--tk-muted)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--bad)}
.warn{color:var(--gold)}
@media (max-width:420px){
  .titlerow h1{font-size:20px}
  .seg button{min-width:70px;padding:8px 6px}
  .map button{font-size:12px}
  .scroll .pg{font-size:17px}
}
/* 場景小動畫 */
.fl{animation:flick 2.2s infinite alternate}
@keyframes flick{from{opacity:1}to{opacity:.65}}
.sw{animation:swing 3.2s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.sm{animation:smoke 3s ease-in-out infinite alternate}
@keyframes smoke{from{transform:translateY(0);opacity:.7}to{transform:translateY(-6px);opacity:.3}}
@media (prefers-reduced-motion:reduce){
  .fl,.sw,.sm{animation:none!important}
  .bei.throw,.spot,.dot,.rv,.reveal,.cele,.cele .st,.cele i,.scroll .pg{animation:none!important}
  .cele{opacity:0}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="titlerow"><h1 id="gTitle"></h1><span class="ver" id="gVer"></span></div>
    <div class="sub" id="gSub"></div>
    <div class="banner" id="gBanner"></div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="版本">
        <button id="btnCulture" type="button">文化版</button>
        <button id="btnSkin" type="button">抽掉文化版</button>
      </div>
      <button id="btnSound" type="button" aria-pressed="false">聲音：關</button>
      <button id="btnRemix" type="button">我要改做</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="分頁"></nav>
  <main id="view"></main>
  <footer class="foot" id="foot"></footer>

<script type="application/json" id="data-culture">{"schema":"puzzle-template/1","meta":{"id":"puzzle-xfs","title":"冠不見了","subtitle":"封神查案・解謎（線索推理）樣板","versionLabel":"文化版","bannerNote":"文化卡：擲筊（問神只能問「是不是」）＋魁星造像（認人看手上的東西，不看臉）","disclaimer":"遊戲為示意與簡化，不是民俗儀式教學。","reminder":"小提醒：「小上帝」的「小」，原書先說是一個地名——赤崁樓東邊的小鎮，神和廟後來才跟著叫。","tags":{"orig":"原著","folk":"民間","made":"工坊創作","adapt":"改編","field":"田野"},"tagHelp":{"orig":"許丙丁《小封神》書裡有寫","folk":"民間信仰裡常見的說法","made":"這個遊戲自己加的，原書沒有","adapt":"照原書的意思改寫過","field":"你自己去現場看到、問到的"},"kicker":"天庭稽查書記・案卷之一","tagline":"冠不見了，人被吊在樹上。你只有一個下午。","playTime":"約 10 分鐘"},"intro":{"title":"冠不見了","text":["天庭收到一張狀紙：小上帝說，他的通天冠被一個獠牙大漢搶走了（「冠被搶」是這個遊戲的讀法），還把一個人吊在榕樹上示眾。","你是天庭派來的稽查書記（這個角色是工坊編的）。今天要查清楚：冠到底怎麼了？該放的人，也要放。","故事改自許丙丁《小封神》第二回。案子裡的線索，有的來自原書，有的是工坊補的，每一張卡都有標示。"],"rules":["到「現場」各處走走，撿東西、看線索","到「線索」頁，把兩樣東西湊在一起看","不認得的人和東西，翻「圖鑑」","到「謎題」頁解開三個謎，最後結案"]},"scenes":[{"id":"s_temple","name":"小上帝廟前","desc":"一間簡陋的廟，三分不像寺、四分不像宮。康元帥和趙元帥站在門口，肚子叫得很大聲。","tag":["orig","made"],"finds":[{"kind":"item","id":"i_testimony","label":"聽康、趙兩位元帥怎麼說","at":[18,64],"icon":"🗣️","say":"康元帥（紅臉）搶著說：「冠被一個獠牙大漢搶了！」趙元帥（青臉）在旁邊猛點頭，眼睛卻不敢看你。你把這段話記在口供紙上。"},{"kind":"look","id":"l_zhao","label":"仔細看看趙元帥","at":[82,64],"icon":"👀","text":"趙元帥縮著脖子，兩手一直揣在袖子裡。你問他話，他先看康元帥一眼，才敢開口。（他看起來有心事。）"},{"kind":"look","id":"l_plaque","label":"抬頭看看匾額","at":[50,33],"icon":"🔍","text":"匾額的漆掉了一半，「小上帝廟」四個字只剩輪廓。這間廟很窮，連匾都沒錢重漆。"},{"kind":"look","id":"l_burner","label":"看看門口的香爐","at":[50,80],"icon":"🕯️","text":"香爐裡只有一炷香，快燒完了。看來平常沒什麼人來拜。"}],"art":"temple","short":"廟前"},{"id":"s_banyan","name":"榕樹下","desc":"一棵大榕樹。樹頂吊著一個人，樹根旁散落著幾樣東西。","tag":["orig","made"],"finds":[{"kind":"clue","id":"K2","label":"抬頭看看被吊的人","at":[66,60],"icon":"👀"},{"kind":"item","id":"i_rope","label":"摸摸吊人的繩索","at":[66,24],"icon":"🪢"},{"kind":"item","id":"i_brush","label":"撿起樹根旁的毛筆","at":[30,90],"icon":"🖌️"},{"kind":"item","id":"i_ink","label":"撿起旁邊的墨斗","at":[46,88],"icon":"📏"},{"kind":"look","id":"l_bark","label":"看看榕樹的鬚根","at":[17,52],"icon":"🔍","text":"榕樹的鬚根垂了一地，風一吹就晃。這棵樹很老了，平常大概有人在樹下乘涼。"}],"art":"banyan","short":"榕樹下"},{"id":"s_pawn","name":"打銀街・同裕當店","desc":"打銀街上的同裕當店。櫃台後面沒有人，只有一本攤開的帳冊壓在算盤下。","tag":["orig","made"],"finds":[{"kind":"item","id":"i_ledger","label":"翻看攤開的帳冊","at":[64,62],"icon":"📒"},{"kind":"look","id":"l_abacus","label":"看看櫃台上的算盤","at":[28,60],"icon":"🧮","text":"算盤的珠子停在「五千」的位置，像是剛算完就走了。"},{"kind":"look","id":"l_sign","label":"看看大招牌","at":[50,17],"icon":"🔍","text":"招牌上一個大大的「當」字。當店就是拿東西抵押換錢的地方，之後可以拿錢去贖。（圖鑑裡也有寫。）"},{"kind":"look","id":"l_dark","label":"探頭看櫃台後面","at":[85,50],"icon":"👀","text":"櫃台後面黑黑的，沒有人。門口的簾子還在晃，好像有人剛走。"}],"art":"pawn","short":"當店"},{"id":"s_gate","name":"媽祖宮口","desc":"天上聖母（媽祖）廟的門口。廟門關得緊緊的，四周靜悄悄。","tag":["orig","made"],"finds":[{"kind":"item","id":"i_cloth","label":"看看門前地上的布","at":[50,88],"icon":"🎲"},{"kind":"item","id":"i_incense","label":"拿起供桌上沒點過的三炷香","at":[13,78],"icon":"🕯️"},{"kind":"look","id":"l_door","label":"看看緊閉的廟門","at":[50,44],"icon":"🔍","text":"廟門關得緊緊的，裡面一點聲音都沒有。"},{"kind":"look","id":"l_empty","label":"看看門邊兩側的空位","at":[17,54],"icon":"👀","text":"門邊兩側，原本該站著人的位置，今天是空的。"}],"art":"gate","short":"廟口"},{"id":"s_earth","name":"路邊的土地公廟","desc":"一間小小的土地公廟，香爐還有餘溫。老土地公最會幫人排解糾紛，也許祂知道些什麼。","tag":["made","orig"],"opens":{"clues":["K3","K4"]},"lockedText":"還沒有理由去問神。先把當店和媽祖廟口都看過。","finds":[{"kind":"item","id":"i_bei","label":"拿起香爐旁的筊杯","at":[70,78],"icon":"🌗","needs":"i_incense","needHint":"小廟要先點香，才好動祂的東西。你手上有香嗎？（先去媽祖廟口找找，找到後在道具欄選好它，再點這裡。）","say":"你先點了香，才拿起筊杯。香煙直直往上飄。"},{"kind":"look","id":"l_burner","label":"看看香爐","at":[34,74],"icon":"🕯️","text":"香爐還有餘溫。有人剛剛來過。","uses":{"i_incense":"你把香插進香爐，點燃。香煙直直往上，像是在說：「說吧，什麼事？」"}},{"kind":"look","id":"l_god","label":"看看小小的神像","at":[50,46],"icon":"👀","text":"小小的土地公神像，白鬍子，笑瞇瞇地看著你。（這間小廟是工坊借來讓你問事的。）"}],"art":"shrine","short":"土地公廟"}],"items":[{"id":"i_testimony","name":"口供紙","desc":"記下康、趙兩位元帥說法的紙。","clue":"K1","icon":"📜"},{"id":"i_brush","name":"朱筆","desc":"筆尖還是紅的，掉在樹根旁。","icon":"🖌️"},{"id":"i_ink","name":"墨斗","desc":"木頭做的，線還繞在裡面。","icon":"📏"},{"id":"i_rope","name":"吊人的繩索","desc":"很粗的一條繩，原書叫它捆妖索。","icon":"🪢"},{"id":"i_ledger","name":"當店帳冊","desc":"同裕當店今天那一頁的帳。","clue":"K3","icon":"📒"},{"id":"i_cloth","name":"賭攤布","desc":"畫著格子的布，旁邊散著幾枚錢。","clue":"K4","icon":"🎲"},{"id":"i_bei","name":"筊杯","desc":"兩塊半月形的木片，拿來問神。","icon":"🌗"},{"id":"i_incense","name":"三炷香","desc":"沒點過的香，三炷繫在一起。","icon":"🕯️"}],"clues":[{"id":"K1","title":"康趙的口供","tag":["orig","adapt"],"text":"康元帥、趙元帥回廟稟報：「是在媽祖宮口，被一個獠牙大漢千里眼搶去了。」（原書沒寫被搶的是什麼；這個遊戲讀成「冠被搶」。）你看了看廟裡，冷冷清清，三位神明都像沒吃飽。","src":"P1 第二回 PDF頁6（原句）；「冠被搶」為改編：P3 頁41 讀成冠、頁70 讀成錢，兩說並存"},{"id":"K2","title":"吊在榕樹上的人","tag":["orig","made"],"text":"榕樹頂上吊著一個人，瘦得像柴。他嘴邊露出獠牙，和康趙形容的「獠牙大漢」一模一樣；他委屈得直掉眼淚，卻說不出話。（你記得《小封神》寫過：有一位神，面目和千里眼是同一個樣子。）","src":"P1 第二回 PDF頁6（同是一樣面目）；第三回 PDF頁7（儒弱、骨瘦像柴）、頁9（形容枯槁、榕樹頂）；獠牙為推論；掉淚、說不出話為工坊創作"},{"id":"K3","title":"當店帳冊","tag":["orig","made"],"text":"同裕當店的帳冊，這一頁寫著：「收　銅鍍金通天冠一頂；付　五千錢。」經手的是兩位穿盔甲的神明，一位紅臉、一位青臉。","src":"P1 第二回 PDF頁4（紅面康、青面趙）、頁5（店名、銅鍍金、五千錢）；穿盔甲來自民間造像；帳冊格式為工坊創作（待確認）"},{"id":"K4","title":"媽祖廟口的賭攤","tag":["orig","made"],"text":"媽祖廟門前，廟門關得緊緊的。地上鋪著一塊畫了格子的賭攤布，旁邊散著幾枚錢。平常站在媽祖兩旁的兩位護法，今天不在原位。","src":"P1 第二回 PDF頁5–6（廟口賭戲、關廟門）；賭攤布為工坊創作"},{"id":"K5","title":"成套的筆墨","tag":["folk","orig"],"text":"一支朱筆配一個墨斗，成套出現——民間認得，這是某一位神明的標記。（到圖鑑找找看是誰。）","src":"P3 頁74（右手筆、左手墨斗）；P1 第二十四回 PDF頁90（賜朱筆墨斗）"},{"id":"K6","title":"土地公的回答","tag":["made"],"text":"你向土地公問了幾件事，筊杯這樣回答：","src":"工坊創作（問神的情節）","compose":"oracle"}],"combos":[{"a":"i_brush","b":"i_ink","gives":"K5"},{"a":"i_testimony","b":"i_ledger","msg":"口供說冠被搶走了；帳冊卻寫著冠已經當出去、收了五千錢。兩邊不可能同時是真的。"},{"a":"i_ledger","b":"i_cloth","msg":"當店付出去的五千錢，和賭攤布旁邊的錢……會是同一筆嗎？先記在心裡。"},{"a":"i_rope","b":"i_brush","msg":"繩子綁的是人，不是筆。這樣湊不出什麼。"},{"a":"i_bei","b":"i_ledger","msg":"神明不看帳冊。想知道什麼，要用問的。"},{"a":"i_testimony","b":"i_cloth","msg":"口供說千里眼搶了東西。可是廟口這裡，被拿走的好像只有錢。先記在心裡。"},{"a":"i_incense","b":"i_bei","msg":"香和筊杯是一起用的：點了香，才好用筊杯問事。"},{"a":"i_ink","b":"i_rope","msg":"墨斗的線可以彈出一條直線，可是拿來綁人不行。"}],"comboDefault":"這兩樣湊不出什麼。換兩樣試試。","codex":[{"id":"c_kuixing","name":"魁星","tag":["folk","orig"],"text":"管考運的神。民間造像常見：右手拿筆（原書結尾賜他「朱筆墨斗」）、左手拿墨斗、一腳踩鰲頭、另一腳高高踢起（「魁星踢斗，獨占鰲頭」）。《小封神》裡他是個儒弱的小書生。","src":"P1 第二回、第二十四回；P3 頁74"},{"id":"c_qianli","name":"千里眼・順風耳","tag":["orig","folk"],"text":"天上聖母（媽祖）的兩位手下，民間常見他們分站媽祖兩旁。千里眼眼觀四方，順風耳耳聽八達。有論文記載大天后宮的神像是千里眼綠臉、順風耳紅臉；各廟的顏色不一定一樣——去現場核對看看。","src":"P1 第二回 PDF頁5–6；P3 頁71、頁110（顏色一項待現場核對）","field":"f_qianli"},{"id":"c_kangzhao","name":"康元帥・趙元帥","tag":["orig"],"text":"玉皇大帝派來輔佐小上帝的兩位元帥，總是一起行動。康元帥是紅臉，趙元帥是青臉。","src":"P1 第一回 PDF頁2、第二回 PDF頁4"},{"id":"c_xiaoshangdi","name":"小上帝（玄天上帝）","tag":["orig"],"text":"原書也叫他「上帝爺」。專管龜精蛇怪，腳踩龜和蛇；脫下冠後披頭散髮，發怒時赤腳提劍。他到偏僻的小上帝鎮赴任，廟窮、香火少，脾氣急，受冷落時也忍氣吞聲。","src":"P1 第一、二回；P3 頁62、頁103"},{"id":"c_tongtian","name":"通天冠","tag":["orig"],"text":"小上帝頭上戴的冠，原書寫它是「銅鍍金」的。","src":"P1 第二回 PDF頁5"},{"id":"c_bei","name":"擲筊（簡化）","tag":["folk"],"text":"民間問神的方式：丟兩塊半月形的筊杯，看落地的樣子。常見說法：一面平、一面圓凸＝聖筊（神明同意）；兩塊都凸面朝上＝陰筊（不同意）；兩塊都平面朝上＝笑筊（沒有答案，通常重問）。各地、各廟、各位長輩的說法會有點不同；重要的事常要連擲三個聖筊才算。問神通常一次問一件事、問清楚。遊戲裡的「香有限」是遊戲規則，不是民俗規定。","src":"民間說法（用字待文史顧問確認；說法有地區差異）","field":"f_bei"},{"id":"c_tudi","name":"土地公","tag":["folk","orig"],"text":"管一個地方的神。《小封神》裡有一位老土地（原書是安海街土地），四處奔走幫忙排解糾紛。路邊這間小廟是工坊借來讓你問事的，不是哪一間真實的廟。","src":"P1 第十九回、第二十四回"},{"id":"c_tongyu","name":"打銀街・同裕當店","tag":["orig"],"text":"原書裡的一條街和一間店：打銀街（約是今天臺南忠義路一帶）的同裕當店。當店就是拿東西抵押換錢的地方，之後可以拿錢去贖。","src":"P1 第二回 PDF頁5；P2 頁167 註14；P3 頁115–116"},{"id":"c_mazu","name":"媽祖宮口","tag":["orig"],"text":"天上聖母（媽祖）廟門前一帶，原書的地名；學者對到臺南的大天后宮。","src":"P1 第二回；P3 頁109–111"},{"id":"c_kuixing_field","name":"（留給你）魁星像長什麼樣","tag":["field"],"text":"圖鑑只是紙上的說法。真的魁星像，手上拿什麼、腳怎麼站？","field":"f_kuixing"}],"fieldwork":[{"id":"f_qianli","prompt":"去大天后宮，或你家附近的媽祖廟：千里眼、順風耳各站哪一邊？各是什麼臉色？拍照或畫下來，寫一句你看到的。","placeholder":"例：左邊的是……，臉是……色","note":"這一格 AI 幫不了你，只有去現場的人寫得出來。"},{"id":"f_bei","prompt":"問一位長輩：他擲筊的時候怎麼問？得到笑筊時怎麼辦？","placeholder":"他說：……","note":"長輩的原話，比 AI 寫的更有用。"},{"id":"f_kuixing","prompt":"找一間有魁星像的廟或閣，看看：他手上拿什麼？腳怎麼站？","placeholder":"我看到……","note":"看到的和圖鑑寫的一不一樣？不一樣更好。"}],"puzzles":[{"id":"p1","type":"identify","title":"吊在樹上的人是誰？","prompt":"康趙說搶冠的是「獠牙大漢千里眼」，小上帝就把榕樹上這個人吊起來示眾。他真的是千里眼嗎？先選他是誰，再選你憑什麼這樣認。","needsClues":["K2","K5"],"lockedText":"還缺線索：先去榕樹下看看被吊的人，再把樹根旁撿到的東西湊在一起看。","whoLabel":"他是誰？","who":[{"id":"w_qianli","label":"千里眼","fb":"千里眼是媽祖的護法。康趙說搶冠的是他，但這個被吊的人身上的東西，不是千里眼會拿的。回圖鑑對一對。"},{"id":"w_shunfeng","label":"順風耳","fb":"康趙沒有提到順風耳，現場的東西也和順風耳對不上。再想想。"},{"id":"w_kuixing","label":"魁星"},{"id":"w_zhao","label":"趙元帥","fb":"趙元帥是青臉沒錯，但他是康趙二帥之一，帳冊上還有他的份，他不會被吊在樹上。"}],"answerWho":"w_kuixing","reasonLabel":"你憑什麼這樣認？","reasons":[{"id":"r_face","label":"他有獠牙，跟康趙形容的一模一樣。","fb":"臉不能當證據：書上說有一位神和千里眼「同是一樣面目」。兩個人長得一樣的時候，要看別的。"},{"id":"r_tools","label":"地上的朱筆和墨斗是成套的，那是某一位神明的標記。"},{"id":"r_hung","label":"他被吊在樹上，所以他一定做了壞事。","fb":"被吊只代表小上帝在氣頭上，不代表這個人做過什麼。"},{"id":"r_rope","label":"吊他用的是捆妖索，所以他是妖怪。","fb":"捆妖索是小上帝手上的工具，拿它綁誰，不能證明被綁的是誰。"}],"answerReason":"r_tools","mismatchText":"認的人和理由對不上。再想想：你的理由真的指向你選的那個人嗎？","okText":"對。臉分不出來，但手上的東西不會騙人：朱筆配墨斗，是魁星的標記。被吊的是魁星，不是千里眼——小上帝抓錯人了。","onSolve":{"appendClue":{"id":"K2","text":"【已認出：這位被吊的，是魁星。】"}},"hints":["被吊的人有獠牙，但書上說有一位神和千里眼「同一副面目」。臉分不出來的時候，要看別的東西。","圖鑑裡每一位神明都寫了「拿著什麼」。哪一位的手上是一支朱筆加一個墨斗？","這位神管考運，是個儒弱的小書生，最有名的姿勢是一腳踢斗。選他，再選「成套的筆墨」當理由。"]},{"id":"p2","type":"oracle","title":"問土地公","prompt":"口供和帳冊對不起來，錢又不知去向。用筊杯問土地公吧——但每問一次要燒一炷香，香有限。想清楚再問。","needsClues":["K3","K4"],"needsItems":["i_bei","i_incense"],"lockedText":"要先認出被吊的是誰，再備好筊杯和香，並且看過當店和媽祖廟口，才知道要問什麼。","oracle":{"mode":"bei","incense":3,"laughLimit":2,"strictYesNo":true,"questions":[{"id":"y1","text":"冠被搶走了嗎？","form":"yesno","answer":false,"means":"冠不是被搶走的。"},{"id":"y2","text":"冠是被人拿去換錢了嗎？","form":"yesno","answer":true,"means":"冠是被人拿去換錢的。"},{"id":"y3","text":"換來的錢，還在拿去換錢的人手上嗎？","form":"yesno","answer":false,"means":"錢已經不在他們手上了。"},{"id":"y4","text":"那筆錢是在媽祖宮口的賭攤輸掉的嗎？","form":"yesno","answer":true,"means":"錢是在媽祖宮口的賭攤輸掉的。"},{"id":"y5","text":"被吊在樹上的那位偷了冠嗎？","form":"yesno","answer":false,"means":"被吊的人沒偷冠。你抬頭看了一眼，他還在晃。"},{"id":"y6","text":"康、趙兩位元帥說的是實話嗎？","form":"yesno","answer":false,"means":"康趙說的不是實話。"},{"id":"y7","text":"是小上帝自己叫人把冠拿去當的嗎？","form":"yesno","answer":true,"means":"是小上帝自己叫人拿去當的。"},{"id":"o1","text":"冠到底去哪裡了？","form":"open"},{"id":"o2","text":"冠是被搶走，還是被拿去當？","form":"open"},{"id":"o3","text":"神明，請直接告訴我是誰幹的。","form":"open"}],"solveWhen":["y4","y7"],"laughText":"笑筊——這樣問，筊杯答不出來。拆開來，一次問一件事。","yesText":"聖筊——神明點頭：是。","noText":"陰筊——神明搖頭：不是。","repeatText":"這件事問過了，神明不改口。","emptyText":"香燒完了，土地公說：「明天再來。」公文還在排隊蓋章。（問到的答案你都記下了。）","tiredText":"筊杯連笑兩次，這幾題先放一放；歇一下再重新備香。"},"okText":"兩件關鍵事都問到了：是小上帝自己叫人拿冠去當；錢是在媽祖廟口的賭攤輸掉的。土地公的回答已記成線索。","onSolve":{"giveClue":"K6"},"hints":["神明不是什麼都肯答。看看「笑筊」出現時神明說了什麼，想想問法哪裡不對。","只有「是不是」的問題，神明才答得出來。「到底是A還是B」「是誰」這種問法，祂只會笑。","你還缺兩件事：誰叫人把冠拿去當？錢後來在哪裡不見的？挑這兩件，用「是不是」問。"],"needsPuzzles":["p1"]},{"id":"p3","type":"accuse","title":"結案","prompt":"把案子說清楚。你是書記，沒有憑據不下筆：每一題選一個答案，再勾出支持它的線索卡。","needsPuzzles":["p1","p2"],"lockedText":"先解開前兩個謎，才有資格結案。","evidenceLabel":"證據（勾出支持這個答案的線索卡）","rows":[{"id":"a1","q":"通天冠現在在哪裡？","options":[{"id":"a1a","label":"被獠牙大漢搶走了","fb":"「被搶」只是口供，帳冊和土地公都不是這麼說。"},{"id":"a1b","label":"在同裕當店裡（當出去了）"},{"id":"a1c","label":"在媽祖廟的廟門裡","fb":"賭攤上輸掉的是錢，不是冠。"}],"answer":"a1b","must":["K3"]},{"id":"a2","q":"誰說了謊？","options":[{"id":"a2a","label":"魁星","fb":"狀紙還在排隊蓋章。魁星是被冤枉的那個，連話都說不出來。"},{"id":"a2b","label":"康元帥和趙元帥"},{"id":"a2c","label":"當店","fb":"帳冊寫得清清楚楚，說謊的不在當店。"}],"answer":"a2b","must":["K1","K3"]},{"id":"a3","q":"是誰叫人把冠拿去當的？","options":[{"id":"a3a","label":"小上帝自己"},{"id":"a3b","label":"千里眼","fb":"千里眼只是在廟口贏了錢，冠不是他叫人當的。"},{"id":"a3c","label":"土地公","fb":"土地公只是被你問話的那位。"}],"answer":"a3a","must":["K6"]},{"id":"a4","q":"那筆五千錢，最後輸給了誰？","options":[{"id":"a4a","label":"魁星","fb":"魁星那時候是被吊著的，沒碰過那筆錢。"},{"id":"a4b","label":"千里眼和順風耳（媽祖廟口的護法）"},{"id":"a4c","label":"同裕當店","fb":"當店是付錢給他們的那一方，錢不是輸給當店。"}],"answer":"a4b","must":["K4","K6"]}],"okText":"結案！每一題都有證據撐著。","missingEvidenceText":"答案對了，但還缺證據：請勾出能證明它的線索卡。","hints":["每一題要選一個答案，再勾出能證明它的線索卡。找不到證據的答案，先別選。","哪些人說的話，和物證對不起來？口供和帳冊放在一起看。","帳冊上經手的兩位，一紅臉一青臉——圖鑑裡找他們是誰。再看看土地公回答了什麼。"]}],"ending":{"title":"案情說明","lines":[{"text":"冠沒有被搶。小上帝窮得沒飯吃，叫康、趙二帥把銅鍍金的通天冠拿到打銀街的同裕當店，當了五千錢。","tag":["orig"]},{"text":"二帥路過媽祖廟口，見千里眼、順風耳在「拋璉寶」，想賭贏好贖回冠，結果五千錢輸得精光。沒辦法，只好糊裡糊塗回稟：「在媽祖宮口，被獠牙大漢千里眼搶去了。」","tag":["orig","adapt"]},{"text":"小上帝聽了，氣得赤腳提劍衝出去，把路過的魁星當成千里眼，吊在榕樹上。魁星和千里眼「同是一樣面目」，所以認錯人。","tag":["orig"]},{"text":"有趣的是：康趙那句「被千里眼搶了」，其實半真半假——錢，確實是被千里眼贏走的；「冠」不是。（這一句是工坊的讀法。）","tag":["made"]},{"text":"這個遊戲裡的筆墨、帳冊、賭攤布、土地公問神，是工坊為了讓你「查」出來而補的，原書沒有。「冠被搶」的說法也是工坊的讀法（原書沒寫被搶的是什麼）。","tag":["made"]},{"text":"你遞上結案書，魁星被放了下來。他揉揉手腕，什麼也沒說——倒是小上帝，這回換他說不出話了。","tag":["made"]}],"storyPrompt":"挑一個人（小上帝、康趙、魁星），用一句話說他的故事：他想要什麼？被什麼卡住？最後怎樣？","storyPlaceholder":"例：（挑一個人）他想要……，卡在……，最後……","storyMax":80},"judge":{"title":"玩完之後，想一想","question":"把這個遊戲裡的文化抽掉（神明換成普通人、問神換成普通問答），這個遊戲還玩得下去嗎？","options":[{"id":"j1","label":"照樣玩得下去"},{"id":"j2","label":"故事沒味道了，但還玩得下去"},{"id":"j3","label":"抽掉文化，這個遊戲就沒得玩了"},{"id":"j4","label":"說不準"}],"expected":"j2","expectedText":"參考看法：「找線索→湊東西→推理」這個流程，抽掉文化還在，所以遊戲還玩得下去。但「線索是什麼意思」（朱筆墨斗是誰的、神怎麼回答、什麼問法會被笑）要靠文化知識才讀得懂；抽掉之後，謎題只剩「照字面對答案」，變得像數字鎖。你的看法不一樣也行，寫下理由就好。","reasonPlaceholder":"用一句話寫理由","followups":["切到「抽掉文化版」玩一次：哪一個謎變得最簡單？為什麼？","如果把「問土地公」換成「問證人」，你還需要先想怎麼問嗎？"]},"rating":{"weights":{"hint":6,"wrong":4,"retry":5,"laugh":2},"grades":[{"min":90,"seal":"甲","title":"神探書記","stars":3,"line":"幾乎沒繞路。天庭想把你調去查更大的案子。"},{"min":70,"seal":"乙","title":"稱職書記","stars":2,"line":"有繞路也有靠提示，但案子是你自己查清楚的。"},{"min":0,"seal":"丙","title":"見習書記","stars":1,"line":"多走了一些路，也多問了幾次。查案本來就是這樣，下一次會更順。"}]}}</script>
<script type="application/json" id="data-skin">{"schema":"puzzle-template/1","meta":{"id":"puzzle-xfs-skin","title":"冠不見了","subtitle":"封神查案・解謎（線索推理）樣板","versionLabel":"抽掉文化版","bannerNote":"這一版把文化抽掉了：名牌代替造像、普通問答代替擲筊。故事和人名留著，但解謎不再需要任何文化知識。","disclaimer":"遊戲為示意與簡化，不是民俗儀式教學。","reminder":"小提醒：「小上帝」的「小」，原書先說是一個地名——赤崁樓東邊的小鎮，神和廟後來才跟著叫。","tags":{"orig":"原著","folk":"民間","made":"工坊創作","adapt":"改編","field":"田野"},"tagHelp":{"orig":"許丙丁《小封神》書裡有寫","folk":"民間信仰裡常見的說法","made":"這個遊戲自己加的，原書沒有","adapt":"照原書的意思改寫過","field":"你自己去現場看到、問到的"},"kicker":"天庭稽查書記・案卷之一","tagline":"冠不見了，人被吊在樹上。你只有一個下午。","playTime":"約 10 分鐘","skinOf":"puzzle-xfs"},"intro":{"title":"冠不見了","text":["天庭收到一張狀紙：小上帝說，他的通天冠被一個獠牙大漢搶走了（「冠被搶」是這個遊戲的讀法），還把一個人吊在榕樹上示眾。","你是天庭派來的稽查書記（這個角色是工坊編的）。今天要查清楚：冠到底怎麼了？該放的人，也要放。","故事改自許丙丁《小封神》第二回。案子裡的線索，有的來自原書，有的是工坊補的，每一張卡都有標示。"],"rules":["到「現場」各處走走，撿東西、看線索","到「線索」頁，把兩樣東西湊在一起看","到「謎題」頁解開三個謎，最後結案"]},"scenes":[{"id":"s_temple","name":"小上帝廟前","desc":"一間簡陋的廟，三分不像寺、四分不像宮。康元帥和趙元帥站在門口，肚子叫得很大聲。","tag":["orig","made"],"finds":[{"kind":"item","id":"i_testimony","label":"聽康、趙兩位元帥怎麼說","at":[18,64],"icon":"🗣️","say":"康元帥（紅臉）搶著說：「冠被一個獠牙大漢搶了！」趙元帥（青臉）在旁邊猛點頭，眼睛卻不敢看你。你把這段話記在口供紙上。"},{"kind":"look","id":"l_zhao","label":"仔細看看趙元帥","at":[82,64],"icon":"👀","text":"趙元帥縮著脖子，兩手一直揣在袖子裡。你問他話，他先看康元帥一眼，才敢開口。（他看起來有心事。）"},{"kind":"look","id":"l_plaque","label":"抬頭看看匾額","at":[50,33],"icon":"🔍","text":"匾額的漆掉了一半，「小上帝廟」四個字只剩輪廓。這間廟很窮，連匾都沒錢重漆。"},{"kind":"look","id":"l_burner","label":"看看門口的香爐","at":[50,80],"icon":"🕯️","text":"香爐裡只有一炷香，快燒完了。看來平常沒什麼人來拜。"}],"art":"temple","short":"廟前"},{"id":"s_banyan","name":"榕樹下","desc":"一棵大榕樹。樹頂吊著一個人，樹根旁散落著幾樣東西。","tag":["orig","made"],"finds":[{"kind":"clue","id":"K2","label":"抬頭看看被吊的人","at":[66,60],"icon":"👀"},{"kind":"item","id":"i_rope","label":"摸摸吊人的繩索","at":[66,24],"icon":"🪢"},{"kind":"item","id":"i_brush","label":"撿起樹根旁的毛筆","at":[30,90],"icon":"🖌️"},{"kind":"item","id":"i_ink","label":"撿起旁邊的墨斗","at":[46,88],"icon":"📏"},{"kind":"look","id":"l_bark","label":"看看榕樹的鬚根","at":[17,52],"icon":"🔍","text":"榕樹的鬚根垂了一地，風一吹就晃。這棵樹很老了，平常大概有人在樹下乘涼。"}],"art":"banyan","short":"榕樹下"},{"id":"s_pawn","name":"打銀街・同裕當店","desc":"打銀街上的同裕當店。櫃台後面沒有人，只有一本攤開的帳冊壓在算盤下。","tag":["orig","made"],"finds":[{"kind":"item","id":"i_ledger","label":"翻看攤開的帳冊","at":[64,62],"icon":"📒"},{"kind":"look","id":"l_abacus","label":"看看櫃台上的算盤","at":[28,60],"icon":"🧮","text":"算盤的珠子停在「五千」的位置，像是剛算完就走了。"},{"kind":"look","id":"l_sign","label":"看看大招牌","at":[50,17],"icon":"🔍","text":"招牌上一個大大的「當」字。當店就是拿東西抵押換錢的地方，之後可以拿錢去贖。（圖鑑裡也有寫。）"},{"kind":"look","id":"l_dark","label":"探頭看櫃台後面","at":[85,50],"icon":"👀","text":"櫃台後面黑黑的，沒有人。門口的簾子還在晃，好像有人剛走。"}],"art":"pawn","short":"當店"},{"id":"s_gate","name":"媽祖宮口","desc":"天上聖母（媽祖）廟的門口。廟門關得緊緊的，四周靜悄悄。","tag":["orig","made"],"finds":[{"kind":"item","id":"i_cloth","label":"看看門前地上的布","at":[50,88],"icon":"🎲"},{"kind":"item","id":"i_incense","label":"撿起地上的三枚銅板","at":[13,78],"icon":"🪙"},{"kind":"look","id":"l_door","label":"看看緊閉的廟門","at":[50,44],"icon":"🔍","text":"廟門關得緊緊的，裡面一點聲音都沒有。"},{"kind":"look","id":"l_empty","label":"看看門邊兩側的空位","at":[17,54],"icon":"👀","text":"門邊兩側，原本該站著人的位置，今天是空的。"}],"art":"gate","short":"廟口"},{"id":"s_earth","name":"路邊的小攤","desc":"路邊的一個小攤，老闆天天看著街上來來往往的人，什麼事都知道一點。","tag":["made"],"opens":{"clues":["K3","K4"]},"lockedText":"還沒有理由去問人。先把當店和媽祖廟口都看過。","finds":[{"kind":"item","id":"i_bei","label":"拿起攤上的紙筆","at":[70,78],"icon":"📝","needs":"i_incense","needHint":"老闆說：先放下錢，才肯借紙筆。你手上有銅板嗎？（先去媽祖廟口找找，找到後在道具欄選好它，再點這裡。）","say":"你放下銅板，老闆才把紙筆遞給你。"},{"kind":"look","id":"l_burner","label":"看看攤上的錢罐","at":[34,74],"icon":"🪙","text":"錢罐裡叮叮噹噹，老闆說問一次放一枚。","uses":{"i_incense":"你把銅板放進錢罐，老闆點點頭：「問吧。」"}},{"kind":"look","id":"l_god","label":"看看老闆","at":[50,46],"icon":"👀","text":"老闆笑瞇瞇的，天天看著街上來來往往的人，什麼事都知道一點。"}],"art":"stall","short":"小攤"}],"items":[{"id":"i_testimony","name":"口供紙","desc":"記下康、趙兩位元帥說法的紙。","clue":"K1","icon":"📜"},{"id":"i_brush","name":"朱筆","desc":"筆尖還是紅的，掉在樹根旁。","icon":"🖌️"},{"id":"i_ink","name":"墨斗","desc":"木頭做的，線還繞在裡面。","icon":"📏"},{"id":"i_rope","name":"吊人的繩索","desc":"很粗的一條繩，原書叫它捆妖索。","icon":"🪢"},{"id":"i_ledger","name":"當店帳冊","desc":"同裕當店今天那一頁的帳。","clue":"K3","icon":"📒"},{"id":"i_cloth","name":"賭攤布","desc":"畫著格子的布，旁邊散著幾枚錢。","clue":"K4","icon":"🎲"},{"id":"i_bei","name":"紙筆","desc":"拿來記問話的紙和筆。","icon":"📝"},{"id":"i_incense","name":"三枚銅板","desc":"三枚銅板，問一次放一枚。","icon":"🪙"}],"clues":[{"id":"K1","title":"康趙的口供","tag":["orig","adapt"],"text":"康元帥、趙元帥回廟稟報：「是在媽祖宮口，被一個獠牙大漢千里眼搶去了。」（原書沒寫被搶的是什麼；這個遊戲讀成「冠被搶」。）你看了看廟裡，冷冷清清，三位神明都像沒吃飽。","src":"P1 第二回 PDF頁6（原句）；「冠被搶」為改編：P3 頁41 讀成冠、頁70 讀成錢，兩說並存"},{"id":"K2","title":"吊在榕樹上的人","tag":["made"],"text":"榕樹頂上吊著一個人，瘦得像柴，委屈得直掉眼淚。他胸前掛著一塊名牌，寫著「魁星」。","src":"抽掉文化版：名牌直接寫出身分"},{"id":"K3","title":"當店帳冊","tag":["orig","made"],"text":"同裕當店的帳冊，這一頁寫著：「收　銅鍍金通天冠一頂；付　五千錢。」經手人欄寫著：康元帥、趙元帥。","src":"P1 第二回 PDF頁4（紅面康、青面趙）、頁5（店名、銅鍍金、五千錢）；穿盔甲來自民間造像；帳冊格式為工坊創作（待確認）"},{"id":"K4","title":"媽祖廟口的賭攤","tag":["orig","made"],"text":"媽祖廟門前，廟門關得緊緊的。地上鋪著一塊畫了格子的賭攤布，旁邊散著幾枚錢。平常站在媽祖兩旁的兩位護法，今天不在原位。","src":"P1 第二回 PDF頁5–6（廟口賭戲、關廟門）；賭攤布為工坊創作"},{"id":"K5","title":"成套的筆墨","tag":["made"],"text":"一支朱筆和一個墨斗，是一套文具。","src":"抽掉文化版：普通文具"},{"id":"K6","title":"攤販的回答","tag":["made"],"text":"你向路邊的攤販問了幾件事，他這樣回答：","src":"工坊創作（問神的情節）","compose":"oracle"}],"combos":[{"a":"i_brush","b":"i_ink","gives":"K5"},{"a":"i_testimony","b":"i_ledger","msg":"口供說冠被搶走了；帳冊卻寫著冠已經當出去、收了五千錢。兩邊不可能同時是真的。"},{"a":"i_ledger","b":"i_cloth","msg":"當店付出去的五千錢，和賭攤布旁邊的錢……會是同一筆嗎？先記在心裡。"},{"a":"i_rope","b":"i_brush","msg":"繩子綁的是人，不是筆。這樣湊不出什麼。"},{"a":"i_bei","b":"i_ledger","msg":"紙筆不是拿來對帳的。想知道什麼，直接問人。"},{"a":"i_testimony","b":"i_cloth","msg":"口供說千里眼搶了東西。可是廟口這裡，被拿走的好像只有錢。先記在心裡。"},{"a":"i_incense","b":"i_bei","msg":"銅板和紙筆是一起用的：先放下錢，老闆才讓你問。"},{"a":"i_ink","b":"i_rope","msg":"墨斗的線可以彈出一條直線，可是拿來綁人不行。"}],"comboDefault":"這兩樣湊不出什麼。換兩樣試試。","codex":[],"fieldwork":[],"puzzles":[{"id":"p1","type":"identify","title":"吊在樹上的人是誰？","prompt":"康趙說搶冠的是「千里眼」，小上帝就把榕樹上這個人吊起來示眾。他真的是千里眼嗎？先選他是誰，再選你憑什麼這樣認。","needsClues":["K2"],"lockedText":"先去榕樹下看看被吊的人。","whoLabel":"他是誰？","who":[{"id":"w_qianli","label":"千里眼","fb":"他胸前的名牌不是這個名字。再看一次線索卡。"},{"id":"w_shunfeng","label":"順風耳","fb":"他胸前的名牌不是這個名字。再看一次線索卡。"},{"id":"w_kuixing","label":"魁星"},{"id":"w_zhao","label":"趙元帥","fb":"他胸前的名牌不是這個名字。再看一次線索卡。"}],"answerWho":"w_kuixing","reasonLabel":"你憑什麼這樣認？","reasons":[{"id":"r_face","label":"他的樣子，跟康趙形容的一模一樣。","fb":"臉色不能當證據，名牌上寫的才是名字。"},{"id":"r_tools","label":"他胸前的名牌寫著名字。"},{"id":"r_hung","label":"他被吊在樹上，所以他一定做了壞事。","fb":"被吊只代表小上帝在氣頭上，不代表這個人做過什麼。"},{"id":"r_rope","label":"吊他用的是一條粗繩，所以他是壞人。","fb":"用什麼繩子吊他，不能證明他是誰。"}],"answerReason":"r_tools","mismatchText":"認的人和理由對不上。再想想：你的理由真的指向你選的那個人嗎？","okText":"對。名牌寫得清清楚楚：被吊的是魁星，不是千里眼——小上帝抓錯人了。","onSolve":{"appendClue":{"id":"K2","text":"【已認出：這位被吊的，是魁星。】"}},"hints":["看看被吊的人身上有沒有寫著什麼。","名牌上寫的是誰的名字？","選「魁星」，理由選名牌那一個。"]},{"id":"p2","type":"oracle","title":"問路邊的攤販","prompt":"口供和帳冊對不起來，錢又不知去向。去問路邊的攤販吧——他只回答「是」或「不是」，次數有限，問法要問得出是非。","needsClues":["K3","K4"],"needsItems":["i_bei","i_incense"],"lockedText":"要先認出被吊的是誰，再備好紙筆和銅板，並且看過當店和媽祖廟口，才知道要問什麼。","oracle":{"mode":"plain","incense":3,"laughLimit":2,"strictYesNo":true,"questions":[{"id":"y1","text":"冠被搶走了嗎？","form":"yesno","answer":false,"means":"冠不是被搶走的。"},{"id":"y2","text":"冠是被人拿去換錢了嗎？","form":"yesno","answer":true,"means":"冠是被人拿去換錢的。"},{"id":"y3","text":"換來的錢，還在拿去換錢的人手上嗎？","form":"yesno","answer":false,"means":"錢已經不在他們手上了。"},{"id":"y4","text":"那筆錢是在媽祖宮口的賭攤輸掉的嗎？","form":"yesno","answer":true,"means":"錢是在媽祖宮口的賭攤輸掉的。"},{"id":"y5","text":"被吊在樹上的那位偷了冠嗎？","form":"yesno","answer":false,"means":"被吊的人沒偷冠。你抬頭看了一眼，他還在晃。"},{"id":"y6","text":"康、趙兩位元帥說的是實話嗎？","form":"yesno","answer":false,"means":"康趙說的不是實話。"},{"id":"y7","text":"是小上帝自己叫人把冠拿去當的嗎？","form":"yesno","answer":true,"means":"是小上帝自己叫人拿去當的。"},{"id":"o1","text":"冠到底去哪裡了？","form":"open"},{"id":"o2","text":"冠是被搶走，還是被拿去當？","form":"open"},{"id":"o3","text":"請直接告訴我是誰幹的。","form":"open"}],"solveWhen":["y4","y7"],"laughText":"這樣問我答不出來，換個問法。","yesText":"是。","noText":"不是。","repeatText":"這個問過了，他的答案不會變。","emptyText":"次數用完了，他說：「明天再來。」（問到的答案你都記下了。）","tiredText":"他不想再回答了。先歇一下再重新來。"},"okText":"兩件關鍵事都問到了：是小上帝自己叫人拿冠去當；錢是在媽祖廟口的賭攤輸掉的。攤販的回答已記成線索。","onSolve":{"giveClue":"K6"},"hints":["還缺什麼消息？想想口供和帳冊哪裡對不起來。","挑跟冠、跟錢有關的問題問。","你還缺兩件事：誰叫人把冠拿去當？錢後來在哪裡不見的？"],"needsPuzzles":["p1"]},{"id":"p3","type":"accuse","title":"結案","prompt":"把案子說清楚。你是書記，沒有憑據不下筆：每一題選一個答案，再勾出支持它的線索卡。","needsPuzzles":["p1","p2"],"lockedText":"先解開前兩個謎，才有資格結案。","evidenceLabel":"證據（勾出支持這個答案的線索卡）","rows":[{"id":"a1","q":"通天冠現在在哪裡？","options":[{"id":"a1a","label":"被獠牙大漢搶走了","fb":"「被搶」只是口供，帳冊和攤販都不是這麼說。"},{"id":"a1b","label":"在同裕當店裡（當出去了）"},{"id":"a1c","label":"在媽祖廟的廟門裡","fb":"賭攤上輸掉的是錢，不是冠。"}],"answer":"a1b","must":["K3"]},{"id":"a2","q":"誰說了謊？","options":[{"id":"a2a","label":"魁星","fb":"狀紙還在排隊蓋章。魁星是被冤枉的那個，連話都說不出來。"},{"id":"a2b","label":"康元帥和趙元帥"},{"id":"a2c","label":"當店","fb":"帳冊寫得清清楚楚，說謊的不在當店。"}],"answer":"a2b","must":["K1","K3"]},{"id":"a3","q":"是誰叫人把冠拿去當的？","options":[{"id":"a3a","label":"小上帝自己"},{"id":"a3b","label":"千里眼","fb":"千里眼只是在廟口贏了錢，冠不是他叫人當的。"},{"id":"a3c","label":"路邊的攤販","fb":"攤販只是被你問話的那位。"}],"answer":"a3a","must":["K6"]},{"id":"a4","q":"那筆五千錢，最後輸給了誰？","options":[{"id":"a4a","label":"魁星","fb":"魁星那時候是被吊著的，沒碰過那筆錢。"},{"id":"a4b","label":"千里眼和順風耳（媽祖廟口的護法）"},{"id":"a4c","label":"同裕當店","fb":"當店是付錢給他們的那一方，錢不是輸給當店。"}],"answer":"a4b","must":["K4","K6"]}],"okText":"結案！每一題都有證據撐著。","missingEvidenceText":"答案對了，但還缺證據：請勾出能證明它的線索卡。","hints":["每一題要選一個答案，再勾出能證明它的線索卡。找不到證據的答案，先別選。","哪些人說的話，和物證對不起來？口供和帳冊放在一起看。","帳冊的經手人欄寫的是誰？再看看攤販回答了什麼。"]}],"ending":{"title":"案情說明","lines":[{"text":"冠沒有被搶。小上帝窮得沒飯吃，叫康、趙二帥把銅鍍金的通天冠拿到打銀街的同裕當店，當了五千錢。","tag":["orig"]},{"text":"二帥路過媽祖廟口，見千里眼、順風耳在「拋璉寶」，想賭贏好贖回冠，結果五千錢輸得精光。沒辦法，只好糊裡糊塗回稟：「在媽祖宮口，被獠牙大漢千里眼搶去了。」","tag":["orig","adapt"]},{"text":"小上帝聽了，氣得赤腳提劍衝出去，把路過的魁星當成千里眼，吊在榕樹上。","tag":["orig"]},{"text":"有趣的是：康趙那句「被千里眼搶了」，其實半真半假——錢，確實是被千里眼贏走的；「冠」不是。（這一句是工坊的讀法。）","tag":["made"]},{"text":"這個遊戲裡的筆墨、帳冊、賭攤布、攤販問話，是工坊為了讓你「查」出來而補的，原書沒有。「冠被搶」的說法也是工坊的讀法（原書沒寫被搶的是什麼）。","tag":["made"]},{"text":"你遞上結案書，魁星被放了下來。他揉揉手腕，什麼也沒說——倒是小上帝，這回換他說不出話了。","tag":["made"]}],"storyPrompt":"挑一個人（小上帝、康趙、魁星），用一句話說他的故事：他想要什麼？被什麼卡住？最後怎樣？","storyPlaceholder":"例：（挑一個人）他想要……，卡在……，最後……","storyMax":80},"judge":{"title":"玩完之後，想一想","question":"把這個遊戲裡的文化抽掉（神明換成普通人、問神換成普通問答），這個遊戲還玩得下去嗎？","options":[{"id":"j1","label":"照樣玩得下去"},{"id":"j2","label":"故事沒味道了，但還玩得下去"},{"id":"j3","label":"抽掉文化，這個遊戲就沒得玩了"},{"id":"j4","label":"說不準"}],"expected":"j2","expectedText":"參考看法：「找線索→湊東西→推理」這個流程，抽掉文化還在，所以遊戲還玩得下去。但「線索是什麼意思」（朱筆墨斗是誰的、神怎麼回答、什麼問法會被笑）要靠文化知識才讀得懂；抽掉之後，謎題只剩「照字面對答案」，變得像數字鎖。你的看法不一樣也行，寫下理由就好。","reasonPlaceholder":"用一句話寫理由","followups":["回到「文化版」玩一次：哪一個謎多了一層意思？為什麼？","你想加進一條新線索：它要靠哪一個在地知識才讀得懂？"]},"rating":{"weights":{"hint":6,"wrong":4,"retry":5,"laugh":2},"grades":[{"min":90,"seal":"甲","title":"神探書記","stars":3,"line":"幾乎沒繞路。天庭想把你調去查更大的案子。"},{"min":70,"seal":"乙","title":"稱職書記","stars":2,"line":"有繞路也有靠提示，但案子是你自己查清楚的。"},{"min":0,"seal":"丙","title":"見習書記","stars":1,"line":"多走了一些路，也多問了幾次。查案本來就是這樣，下一次會更順。"}]}}</script>

<script>
/* 〈冠不見了〉解謎樣板：機制模組一覽（每個模組：init(cfg, root)／step(state, action)／render(state)）
   cover     讀 meta、intro                 封面與序幕（狀紙）
   explore   讀 scenes、items               場景探索：點熱點找東西、用道具、換地點
   inventory 讀 items、combos、comboDefault 道具欄與湊東西
   notebook  讀 clues、codex、fieldwork     線索筆記本與圖鑑
   puzzle    讀 puzzles                     三種謎：認人、問神（擲筊）、結案
   hint      讀 puzzles[].hints             三層提示
   scoring   讀 rating                      資源計分與評價（權重與等第都在 JSON）
   ending    讀 ending、judge               案情重現、故事一句話、文化抽掉反思
   feedback  讀 meta                        音效、提示字、解開特效
   視覺語言只用 :root 的 --tk-* token（surface/panel/ink/muted/accent/accent-ink/line/font-title/font-body/radius/shadow） */
(function(){
'use strict';

/* ---------- 小工具 ---------- */
function h(tag, props, kids){
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function(k){
    var v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  });
  (kids || []).forEach(function(c){
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}
function $(s){ return document.querySelector(s); }
function byId(arr, id){ for (var i=0;i<arr.length;i++) if (arr[i].id === id) return arr[i]; return null; }
function has(arr, v){ return arr.indexOf(v) >= 0; }

var toastTimer = null;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ---------- 聲音（預設關，Web Audio 合成） ---------- */
var soundOn = false, ac = null;
function tone(f, d, type, vol, when){
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + (when || 0);
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || 0.1, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.03);
  } catch (e) {}
}
function sfx(kind){
  var cult = (mode === 'culture');
  if (kind === 'click') tone(cult ? 520 : 700, .06, cult ? 'triangle' : 'square', .06);
  else if (kind === 'get') { tone(cult ? 392 : 660, .12, 'triangle', .1); tone(cult ? 587 : 880, .18, 'triangle', .1, .1); }
  else if (kind === 'clue') { [523, 659, 784, 1047].forEach(function(f, i){ tone(f, .16, 'triangle', .09, i * .07); }); }
  else if (kind === 'look') tone(cult ? 330 : 480, .09, 'sine', .07);
  else if (kind === 'throw') { tone(180, .05, 'square', .08); tone(150, .05, 'square', .08, .16); tone(120, .06, 'square', .08, .32); }
  else if (kind === 'yes') { tone(523, .16, 'sine', .12); tone(784, .28, 'sine', .12, .12); }
  else if (kind === 'no') { tone(150, .3, 'triangle', .14); }
  else if (kind === 'laugh') { tone(440, .1, 'sawtooth', .06); tone(520, .1, 'sawtooth', .06, .1); tone(400, .16, 'sawtooth', .06, .2); }
  else if (kind === 'win') { [392,494,587,784].forEach(function(f,i){ tone(f, .3, 'triangle', .12, i*.12); }); }
  else if (kind === 'stamp') { tone(90, .22, 'square', .16); tone(60, .3, 'sine', .18, .02); }
  else if (kind === 'page') tone(cult ? 260 : 400, .08, 'triangle', .05);
  else if (kind === 'bad') tone(200, .2, 'square', .08);
}

/* ---------- 資料 ---------- */
var BUILT = { culture: JSON.parse($('#data-culture').textContent), skin: JSON.parse($('#data-skin').textContent) };
var mode = 'culture';     // culture | skin | custom
var data = BUILT.culture;
var S = null;
var pendingSwitch = null, pendingTimer = null;

function newState(){
  var st = {
    stage: 'cover', page: 0, tab: 'scene', view: null, scene: (data.scenes[0] || {}).id,
    items: [], clues: [], newClues: [], appended: {}, taken: {}, usedOn: {},
    sel: [], comboMsg: '', log: [], hintsUsed: {}, hintShown: {},
    puz: {}, oracle: null, acc: { sel: {}, ev: {}, fb: {}, msg: '' },
    field: {}, story: '', judge: { id: null, reason: '' }, ended: false, ts: Date.now(),
    wrong: 0, codexOpen: {}, reveal: null, endTs: 0
  };
  data.puzzles.forEach(function(p){ st.puz[p.id] = { solved: false, tries: 0, who: null, reason: null, fb: '' }; });
  var op = data.puzzles.filter(function(p){ return p.type === 'oracle'; })[0];
  st.oracle = { incense: op ? op.oracle.incense : 0, laughs: 0, asked: {}, order: [], retries: 0, tired: false, last: null, lastMsg: '', throwKey: 0 };
  return st;
}

function tagName(k){ return (data.meta.tags && data.meta.tags[k]) || k; }
function tagEls(list){
  if (!list || !list.length) return null;
  return h('div', { class: 'tags' }, list.map(function(k){
    var known = has(['orig','folk','made','adapt','field'], k);
    return h('span', { class: 'tag ' + (known ? k : 'other'), title: (data.meta.tagHelp && data.meta.tagHelp[k]) || '', text: tagName(k) });
  }));
}

/* ---------- 取得線索與道具 ---------- */
function giveClue(id, quiet){
  if (has(S.clues, id)) return false;
  S.clues.push(id); S.newClues.push(id);
  var c = byId(data.clues, id);
  if (!quiet) { toast('新線索：' + (c ? c.title : id)); sfx('clue'); }
  return true;
}
function giveItem(id){
  if (has(S.items, id)) return null;
  S.items.push(id);
  var it = byId(data.items, id);
  var gotClue = false;
  if (it && it.clue) gotClue = giveClue(it.clue, true);
  if (gotClue) sfx('clue'); else sfx('get');
  return { item: it, clue: gotClue ? byId(data.clues, it.clue) : null };
}
function sceneOpen(sc){
  if (!sc.opens) return true;
  return (sc.opens.clues || []).every(function(c){ return has(S.clues, c); });
}
function puzzleState(p){
  if (S.puz[p.id].solved) return { st: 'solved' };
  var miss = (p.needsClues || []).some(function(c){ return !has(S.clues, c); })
          || (p.needsItems || []).some(function(c){ return !has(S.items, c); })
          || (p.needsPuzzles || []).some(function(c){ return !S.puz[c].solved; });
  return miss ? { st: 'locked' } : { st: 'open' };
}
function hintTotal(){ var n = 0; Object.keys(S.hintsUsed).forEach(function(k){ n += S.hintsUsed[k]; }); return n; }
function leftIn(sc){
  var n = 0;
  (sc.finds || []).forEach(function(f){ if (!S.taken[sc.id + ':' + f.id]) n++; });
  return n;
}

/* ---------- 解開特效（不擋點擊） ---------- */
function celebrate(title, sub){
  sfx('stamp'); setTimeout(function(){ sfx('win'); }, 300);
  var old = document.querySelector('.cele'); if (old) old.remove();
  var el = h('div', { class: 'cele', 'aria-hidden': 'true' }, [h('div', { class: 'st' }, [title, sub ? h('small', { text: sub }) : null])]);
  var cols = ['var(--red2)', 'var(--gold)', 'var(--jade)', 'var(--blue)', 'var(--t-made)'];
  for (var i = 0; i < 26; i++) {
    var a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 190;
    var p = h('i', { style: 'background:' + cols[i % cols.length] + ';--dx:' + Math.round(Math.cos(a) * r) + 'px;--dy:' + Math.round(Math.sin(a) * r) + 'px;--rot:' + Math.round(Math.random() * 720) + 'deg;animation-delay:' + (Math.random() * .25).toFixed(2) + 's' });
    el.appendChild(p);
  }
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.remove(); }, 2700);
}

/* ---------- 版面骨架 ---------- */
function renderChrome(){
  var m = data.meta;
  document.body.classList.toggle('skin', mode === 'skin');
  document.body.classList.toggle('playing', S.stage === 'play');
  $('#gTitle').textContent = m.title;
  $('#gVer').textContent = (mode === 'custom' ? '我的版本' : m.versionLabel);
  $('#gSub').textContent = m.subtitle;
  $('#gBanner').textContent = m.bannerNote;
  $('#btnCulture').className = (mode === 'culture' ? 'on' : '');
  $('#btnSkin').className = (mode === 'skin' ? 'on' : '');
  var foot = $('#foot'); foot.textContent = '';
  foot.appendChild(h('div', { text: m.disclaimer }));
  if (m.reminder) foot.appendChild(h('div', { text: m.reminder }));
  var lg = h('div', { class: 'legend' }, Object.keys(m.tags || {}).map(function(k){
    return h('span', {}, [h('span', { class: 'tag ' + (has(['orig','folk','made','adapt','field'], k) ? k : 'other'), text: m.tags[k] }), ' ' + ((m.tagHelp && m.tagHelp[k]) || '')]);
  }));
  foot.appendChild(lg);

  var tabs = $('#tabs'); tabs.textContent = '';
  tabs.hidden = (S.stage !== 'play');
  var defs = [['scene','現場'],['clue','筆記本'],['codex','圖鑑'],['puzzle','謎題']];
  if (!data.codex || !data.codex.length) defs = defs.filter(function(d){ return d[0] !== 'codex'; });
  defs.forEach(function(d){
    var b = h('button', { type: 'button', class: S.tab === d[0] ? 'on' : '', 'data-tab': d[0], onclick: function(){ S.tab = d[0]; S.view = null; if (d[0] === 'clue') S.newClues = []; sfx('click'); render(); window.scrollTo(0, 0); } }, [d[1]]);
    if (d[0] === 'clue' && S.clues.length) b.appendChild(h('span', { class: 'badge' + (S.newClues.length ? ' new' : ''), text: String(S.clues.length) }));
    if (d[0] === 'puzzle' && S.tab !== 'puzzle' && data.puzzles.some(function(p){ return puzzleState(p).st === 'open'; })) b.appendChild(h('i', { class: 'dot', title: '有謎可以解了' }));
    tabs.appendChild(b);
  });
}

function render(){
  var y = window.pageYOffset || 0;
  renderChrome();
  var v = $('#view'); v.textContent = '';
  if (S.stage === 'cover' || S.stage === 'story') MOD.cover.render(S);
  else if (S.tab === 'scene') { MOD.explore.render(S); MOD.inventory.render(S); }
  else if (S.tab === 'clue') { MOD.inventory.renderBench(S); MOD.notebook.render(S); }
  else if (S.tab === 'codex') MOD.notebook.renderCodex(S);
  else MOD.puzzle.render(S);
  if (y) window.scrollTo(0, y);
}
function act(mod, action){
  MOD[mod].step(S, action);
  render();
  if (action.top) window.scrollTo(0, 0);
  if (action.scroll) { var t = $(action.scroll); if (t && t.scrollIntoView) t.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
}

/* ---------- 封面與序幕 ---------- */
function viewCover(v){
  var m = data.meta;
  var cv = h('div', { class: 'cover' });
  cv.insertAdjacentHTML('beforeend', ART.cover());
  cv.appendChild(h('div', { class: 'ct' }, [h('div', { class: 'k', text: m.kicker || '天庭稽查書記・案卷之一' }), h('div', { class: 't', text: m.title }), h('div', { class: 's', text: m.tagline || '' })]));
  var bar = h('div', { class: 'coverbar' }, [
    h('div', { class: 'facts' }, [h('span', { text: m.playTime || '約 10 分鐘' }), h('span', { text: data.scenes.length + ' 個地點' }), h('span', { text: data.puzzles.length + ' 個謎' }), h('span', { text: '有提示、不會卡死' })]),
    h('button', { class: 'primary big', type: 'button', id: 'btnStart', onclick: function(){ act('cover', { type: 'start', top: true }); } }, ['開始查案']),
    h('p', { class: 'muted', style: 'text-align:center;margin:0', text: '可以先按上面的「聲音」打開音效。右上角能切換「文化版／抽掉文化版」，玩完再比一比。' })
  ]);
  cv.appendChild(bar);
  v.appendChild(cv);
}
function viewStory(v){
  var pages = data.intro.text.map(function(t){ return { who: '狀紙', t: t }; });
  var last = pages.length;           // 最後一頁＝查案方式
  var n = last + 1, i = Math.min(S.page, last);
  var sc = h('div', { class: 'scroll' });
  if (i < last) {
    sc.appendChild(h('div', { class: 'who', text: data.intro.title + '　' + (i + 1) + '／' + n }));
    sc.appendChild(h('div', { class: 'pg', 'data-page': String(i), text: pages[i].t }));
  } else {
    sc.appendChild(h('div', { class: 'who', text: '查案方式　' + n + '／' + n }));
    var box = h('div', { class: 'pg', 'data-page': String(i) });
    box.appendChild(h('ol', { class: 'steps' }, data.intro.rules.map(function(r){ return h('li', { text: r }); })));
    box.appendChild(h('p', { class: 'muted', text: '小技巧：場景裡亮晶晶的圓點可以點。選好道具欄的東西再點，就是「用」它。' }));
    sc.appendChild(box);
  }
  v.appendChild(sc);
  var dots = h('div', { class: 'dots' }); for (var k = 0; k < n; k++) dots.appendChild(h('i', { class: k === i ? 'on' : '' }));
  v.appendChild(dots);
  var row = h('div', { class: 'pair', style: 'justify-content:space-between' });
  row.appendChild(h('button', { type: 'button', class: 'ghost', id: 'btnSkipStory', onclick: function(){ act('cover', { type: 'enter', top: true }); } }, ['略過']));
  if (i < last) row.appendChild(h('button', { type: 'button', class: 'primary', id: 'btnNext', onclick: function(){ act('cover', { type: 'next' }); } }, ['下一頁']));
  else row.appendChild(h('button', { type: 'button', class: 'primary', id: 'btnEnter', onclick: function(){ act('cover', { type: 'enter', top: true }); } }, ['進入現場']));
  v.appendChild(row);
}
function enterPlay(){
  S.stage = 'play'; S.tab = 'scene'; S.ts = Date.now();
  var sc = byId(data.scenes, S.scene) || data.scenes[0];
  S.reveal = { ic: '🏮', hd: sc.name, tx: sc.desc };
  sfx('click'); render(); window.scrollTo(0, 0);
}

/* ---------- 現場：插畫＋熱點＋地圖＋道具欄 ---------- */
function goalText(){
  if (!S.clues.length && !S.items.length) return '先在各處走走，點亮晶晶的圓點找線索。';
  var open = data.puzzles.filter(function(p){ return puzzleState(p).st === 'open'; });
  if (open.length) return '可以去「謎題」頁解：' + open[0].title;
  var left = 0; data.scenes.forEach(function(sc){ if (sceneOpen(sc)) left += leftIn(sc); });
  if (left) return '還有 ' + left + ' 個地方沒查過，看看地圖上的紅色數字。';
  if (data.puzzles.every(function(p){ return S.puz[p.id].solved; })) return '三個謎都解開了，到「謎題」頁看案情說明。';
  return '試試把兩樣道具湊在一起看，或翻翻圖鑑。';
}
function exploreTap(sc, f){
  var key = sc.id + ':' + f.id;
  var sel = S.sel.length === 1 ? S.sel[0] : null;
  var taken = !!S.taken[key];
  var head = f.label;
  if (sel && f.uses && f.uses[sel] && !taken) {
    var k2 = key + '+' + sel;
    S.reveal = { ic: '✋', hd: head + '（用「' + byId(data.items, sel).name + '」）', tx: f.uses[sel] };
    S.usedOn[k2] = true; sfx('look'); return;
  }
  if (taken) {
    S.reveal = { ic: f.icon || KIND_ICON[f.kind], hd: head + '（看過了）', tx: f.again || f.text || f.say || '這裡你已經看過了。' };
    sfx('click'); return;
  }
  if (f.needs && sel !== f.needs) {
    S.reveal = { ic: '🔒', hd: head, tx: f.needHint || '好像需要拿一樣東西來用。先在道具欄選好它，再點這裡。' };
    sfx('bad'); return;
  }
  S.taken[key] = true;
  var rv = { ic: f.icon || KIND_ICON[f.kind], hd: head, tx: '' };
  if (f.kind === 'item') {
    var r = giveItem(f.id);
    rv.ic = itemIcon(r.item);
    rv.tx = (f.say ? f.say + '　' : '') + '得到「' + (r.item ? r.item.name : f.id) + '」：' + (r.item ? r.item.desc : '');
    if (r.clue) { rv.nw = '新線索卡：' + r.clue.title; rv.isNew = true; }
    toast('得到：' + (r.item ? r.item.name : f.id));
  } else if (f.kind === 'clue') {
    var got = giveClue(f.id, true);
    var c = byId(data.clues, f.id);
    sfx('clue');
    rv.ic = '🧾'; rv.tx = (f.say ? f.say + '　' : '') + (c ? c.title : '');
    if (got) { rv.nw = '新線索卡：' + (c ? c.title : f.id); rv.isNew = true; }
  } else {
    rv.tx = f.text || '看不出什麼特別的。'; sfx('look');
  }
  S.reveal = rv;
}
function viewScene(v){
  var sc = byId(data.scenes, S.scene) || data.scenes[0];
  if (!sceneOpen(sc)) { S.scene = data.scenes[0].id; sc = data.scenes[0]; }
  /* 地圖 */
  var map = h('nav', { class: 'map', 'aria-label': '地點' });
  data.scenes.forEach(function(s){
    var open = sceneOpen(s);
    var left = open ? leftIn(s) : 0;
    var b = h('button', { type: 'button', class: (s.id === S.scene ? 'on' : '') + (open ? '' : ' lock'), 'data-scene': s.id, title: open ? null : '還沒開放', onclick: function(){ act('explore', { type: 'goto', scene: s.id }); } }, [open ? '' : '🔒 ', s.short || s.name]);
    if (left) b.appendChild(h('span', { class: 'n', text: '還有 ' + left }));
    else if (open && (s.finds || []).length) b.appendChild(h('span', { class: 'n', style: 'color:var(--ok)', text: '查完 ✓' }));
    map.appendChild(b);
  });
  v.appendChild(map);
  /* 舞台 */
  var stage = h('div', { class: 'stage', 'data-art': sc.art || 'generic' });
  stage.insertAdjacentHTML('afterbegin', sceneArt(sc));
  var fl = sc.finds || [];
  fl.forEach(function(f, i){
    var pos = spotPos(sc, i, fl.length);
    var key = sc.id + ':' + f.id;
    var taken = !!S.taken[key];
    var it = f.kind === 'item' ? byId(data.items, f.id) : null;
    var ic = taken ? '✓' : (f.icon || (it && it.icon) || KIND_ICON[f.kind] || '❔');
    var b = h('button', { type: 'button', class: 'spot' + (f.kind === 'look' ? ' look' : '') + (taken ? ' done' : ''), 'data-find': key, 'aria-label': f.label + (taken ? '（看過了）' : ''), title: f.label,
      style: 'left:' + pos[0] + '%;top:' + pos[1] + '%', onclick: function(){ act('explore', { type: 'tap', scene: sc.id, find: f.id }); } }, [ic]);
    stage.appendChild(b);
  });
  v.appendChild(stage);
  v.appendChild(h('div', { class: 'cap', text: sc.name + '｜點亮晶晶的圓點調查；✓ 是查過了' }));
  if (sc.tag) v.appendChild(tagEls(sc.tag));
  /* 揭示列 */
  if (S.reveal) {
    var R = S.reveal;
    v.appendChild(h('div', { class: 'reveal' + (R.isNew ? ' new' : ''), id: 'reveal', role: 'status' }, [
      h('div', { class: 'ic', text: R.ic || '🔍' }),
      h('div', {}, [h('div', { class: 'hd', text: R.hd || '' }), h('div', { class: 'tx', text: R.tx || '' }), R.nw ? h('span', { class: 'nw', text: R.nw }) : null])
    ]));
  }
  v.appendChild(h('div', { class: 'goal', id: 'goal' }, [h('b', { text: '目標：' }), goalText()]));
}
function renderBag(v){
  var bag = h('div', { class: 'bag', id: 'bag' }, [h('div', { class: 'hd', text: '道具欄（點一樣＝拿在手上，再去點場景上的東西；點兩樣＝湊在一起看）' })]);
  var row = h('div', { class: 'row' });
  if (!S.items.length) row.appendChild(h('span', { class: 'muted', text: '還是空的。' }));
  S.items.forEach(function(id){
    var it = byId(data.items, id);
    row.appendChild(h('button', { type: 'button', class: 'chip' + (has(S.sel, id) ? ' sel' : ''), 'data-inv': id, 'aria-pressed': has(S.sel, id) ? 'true' : 'false', title: it.desc, onclick: function(){ act('inventory', { type: 'toggle', id: id }); } }, [h('span', { class: 'e', text: itemIcon(it) }), it.name]));
  });
  bag.appendChild(row);
  if (S.items.length >= 2) {
    var names = S.sel.map(function(id){ return byId(data.items, id).name; });
    bag.appendChild(h('div', { class: 'bagact' }, [
      h('button', { type: 'button', class: 'primary', id: 'btnCombineBar', disabled: S.sel.length !== 2, onclick: function(){ act('inventory', { type: 'combine', from: 'bar' }); } }, ['湊在一起看']),
      h('span', { class: 'muted', text: S.sel.length === 2 ? names.join(' ＋ ') : (S.sel.length === 1 ? '手上拿著「' + names[0] + '」' : '') })
    ]));
  } else if (S.sel.length === 1) {
    bag.appendChild(h('div', { class: 'bagact' }, [h('span', { class: 'muted', text: '手上拿著「' + byId(data.items, S.sel[0]).name + '」' })]));
  }
  v.appendChild(bag);
}
function toggleSel(id){
  if (has(S.sel, id)) S.sel = S.sel.filter(function(x){ return x !== id; });
  else { S.sel.push(id); if (S.sel.length > 2) S.sel.shift(); }
  sfx('click');
}

/* ---------- 筆記本（線索卡＋湊東西＋推理紀錄） ---------- */
function clueText(c){
  var t = c.text;
  if (c.compose === 'oracle') {
    var op = data.puzzles.filter(function(p){ return p.type === 'oracle'; })[0];
    var lines = S.oracle.order.map(function(qid){
      var q = byId(op.oracle.questions, qid), r = S.oracle.asked[qid];
      var head = op.oracle.mode === 'bei' ? (r === 'yes' ? '聖筊（是）' : '陰筊（不是）') : (r === 'yes' ? '是' : '不是');
      return '・問「' + q.text + '」→ ' + head + '。' + (q.means || '');
    });
    t = t + '\n' + lines.join('\n');
  }
  if (S.appended[c.id]) t = t + '\n' + S.appended[c.id];
  return t;
}
function renderBench(v){
  var box = h('div', { class: 'card' }, [h('h2', { text: '湊東西工作台（選兩樣，湊在一起看）' })]);
  if (!S.items.length) box.appendChild(h('p', { class: 'muted', text: '還沒有道具。到「現場」走走。' }));
  var its = h('div', { class: 'items' });
  S.items.forEach(function(id){
    var it = byId(data.items, id);
    its.appendChild(h('button', { type: 'button', class: has(S.sel, id) ? 'sel' : '', 'data-item': id, onclick: function(){ act('inventory', { type: 'toggle', id: id }); } }, [itemIcon(it) + ' ' + it.name, h('small', { text: it.desc })]));
  });
  box.appendChild(its);
  if (S.items.length >= 2) {
    var sel = S.sel.map(function(id){ return byId(data.items, id).name; });
    var row = h('div', { class: 'pair', style: 'margin-top:10px' }, [
      h('button', { type: 'button', id: 'btnCombine', class: 'primary', disabled: S.sel.length !== 2, onclick: function(){ act('inventory', { type: 'combine', from: 'bench' }); } }, ['湊在一起看']),
      h('span', { class: 'muted', text: S.sel.length === 2 ? sel.join(' ＋ ') : '再選 ' + (2 - S.sel.length) + ' 樣' })
    ]);
    box.appendChild(row);
  }
  if (S.comboMsg) box.appendChild(h('div', { class: 'msg', id: 'comboMsg', text: S.comboMsg }));
  v.appendChild(box);
}
function renderClues(v){
  v.appendChild(h('h2', { text: '線索卡（' + S.clues.length + '／' + data.clues.length + '）', style: 'margin:14px 0 4px' }));
  if (!S.clues.length) v.appendChild(h('p', { class: 'muted', text: '還沒有線索卡。' }));
  S.clues.forEach(function(id){
    var c = byId(data.clues, id);
    var card = h('div', { class: 'card note' + (has(S.newClues, id) ? ' new' : ''), 'data-clue': id }, [h('h3', { text: c.title })]);
    card.appendChild(tagEls(c.tag));
    card.appendChild(h('p', { text: clueText(c), style: 'white-space:pre-wrap' }));
    v.appendChild(card);
  });
  if (S.log.length) {
    var lg = h('div', { class: 'card', id: 'logBox' }, [h('h3', { text: '我的推理紀錄（湊東西得到的發現）' })]);
    S.log.slice().reverse().forEach(function(l){ lg.appendChild(h('div', { class: 'logline', text: l })); });
    v.appendChild(lg);
  }
}
function doCombine(){
  var a = S.sel[0], b = S.sel[1];
  var hit = null;
  data.combos.forEach(function(c){ if ((c.a === a && c.b === b) || (c.a === b && c.b === a)) hit = c; });
  if (!hit) { S.comboMsg = data.comboDefault || '湊不出什麼。'; sfx('bad'); }
  else if (hit.gives) {
    if (has(S.clues, hit.gives)) S.comboMsg = '這個你已經湊過了。';
    else { giveClue(hit.gives); var cc = byId(data.clues, hit.gives); S.comboMsg = hit.msg || ('湊出新線索：' + cc.title + '（在下面）'); S.log.push('湊出線索「' + cc.title + '」'); }
  } else {
    S.comboMsg = hit.msg; sfx('click');
    var ln = byId(data.items, a).name + ' ＋ ' + byId(data.items, b).name + '：' + hit.msg;
    if (!has(S.log, ln) && !hit.noLog) S.log.push(ln);
  }
}

/* ---------- 圖鑑 ---------- */
function viewCodex(v){
  v.appendChild(h('p', { class: 'muted', text: '不認得的人和東西，來這裡找（已翻 ' + Object.keys(S.codexOpen).length + '／' + data.codex.length + ' 條）。每一條都標了出處的種類。' }));
  data.codex.forEach(function(cx){
    var d = h('details', { class: 'cx', 'data-cx': cx.id }, [h('summary', { text: cx.name })]);
    d.addEventListener('toggle', function(){ if (d.open) S.codexOpen[cx.id] = true; });
    var inn = h('div', { class: 'in' }, [tagEls(cx.tag), h('p', { text: cx.text })]);
    if (cx.field) {
      var f = byId(data.fieldwork || [], cx.field);
      if (f) {
        inn.appendChild(h('div', { class: 'msg' }, [
          h('div', {}, [h('span', { class: 'tag field', text: tagName('field') }), ' ' + f.prompt]),
          h('textarea', { 'data-field': f.id, placeholder: f.placeholder || '', oninput: function(e){ S.field[f.id] = e.target.value; } }),
          h('div', { class: 'muted', text: f.note || '' })
        ]));
        var ta = inn.querySelector('textarea'); ta.value = S.field[f.id] || '';
      }
    }
    d.appendChild(inn);
    v.appendChild(d);
  });
}

  return '<svg class="art" viewBox="' + (vb || '0 0 400 260') + '" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + label + '" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
}

    '<circle cx="0" cy="-8" r="10" fill="' + face + '"/>' +
    (opt.hat ? '<path d="M-13 -12 Q0 -30 13 -12 Z" fill="' + opt.hat + '"/><rect x="-14" y="-13" width="28" height="3" fill="' + opt.hat + '"/>' : '') +
    '<circle cx="-3.5" cy="-9" r="1.3" fill="#2a211a"/><circle cx="3.5" cy="-9" r="1.3" fill="#2a211a"/>' +
    (opt.fang ? '<path d="M-4 -3 L-2.5 2 L-1 -3 Z M1 -3 L2.5 2 L4 -3 Z" fill="#fff"/>' : '<path d="M-3 -3 Q0 -1 3 -3" stroke="#2a211a" stroke-width="1.2" fill="none"/>') +

var KIND_ICON = { item: '🔎', clue: '🧾', look: '👀' };
function itemIcon(it){ return (it && it.icon) || '📦'; }
function spotPos(sc, i, n){
  var f = sc.finds[i];
  if (f.at && f.at.length === 2) return f.at;
  return [Math.round(100 * (i + 0.5) / n), (i % 2) ? 74 : 50];
}


/* ---------- 謎題 ---------- */
var HINT_LV = ['先看哪裡', '用什麼知識', '幾乎給答案'];
function hintBlock(p){
  var used = S.hintsUsed[p.id] || 0;
  var box = h('div', { class: 'hintbox' });
  var row = h('div', { class: 'row' }, [
    h('button', { type: 'button', class: 'ghost', 'data-hint': p.id, disabled: used >= p.hints.length, onclick: function(){ act('hint', { type: 'use', id: p.id }); } }, [used >= p.hints.length ? '提示用完了' : '要提示嗎？（已用 ' + used + '／' + p.hints.length + '）']),
    h('span', { class: 'muted', text: used >= p.hints.length ? '' : '第 ' + (used + 1) + ' 層：' + HINT_LV[used] + '（提示會記在結算，不會卡關）' })
  ]);
  box.appendChild(row);
  for (var i = 0; i < used; i++) box.appendChild(h('div', { class: 'msg' }, [h('div', { class: 'lv', text: '提示 ' + (i + 1) + '・' + (HINT_LV[i] || '') }), h('div', { text: p.hints[i] })]));
  return box;
}
function cluePanel(ids, label){
  var d = h('details', { class: 'cx', 'data-board': label }, [h('summary', { text: label })]);
  var inn = h('div', { class: 'in' });
  ids.forEach(function(id){
    var c = byId(data.clues, id);
    if (!c) return;
    inn.appendChild(h('div', { style: 'margin:8px 0' }, [h('b', { text: c.title }), tagEls(c.tag), h('div', { text: clueText(c), style: 'white-space:pre-wrap;font-size:14px' })]));
  });
  d.appendChild(inn);
  return d;
}
function chainBar(){
  var cur = null;
  data.puzzles.forEach(function(p){ if (!cur && !S.puz[p.id].solved) cur = p.id; });
  return h('div', { class: 'chain', 'aria-label': '謎題進度' }, data.puzzles.map(function(p, i){
    var cls = S.puz[p.id].solved ? 'on' : (p.id === cur ? 'cur' : '');
    return h('span', { class: cls, text: (S.puz[p.id].solved ? '✓ ' : '') + '謎 ' + (i + 1) + '・' + p.title });
  }));
}
function viewPuzzle(v){
  if (S.view === 'ending') return viewEnding(v);
  if (S.view) {
    var p = byId(data.puzzles, S.view);
    v.appendChild(h('button', { type: 'button', class: 'ghost', onclick: function(){ S.view = null; render(); } }, ['← 回謎題清單']));
    var card = h('div', { class: 'card' }, [h('h2', { text: p.title }), h('p', { text: p.prompt })]);
    v.appendChild(card);
    if (!S.puz[p.id].solved && p.type === 'identify' && (p.needsClues || []).length) v.appendChild(cluePanel(p.needsClues, '看一眼手上的線索'));
    if (!S.puz[p.id].solved && p.type === 'accuse') v.appendChild(cluePanel(S.clues, '看一眼全部線索卡'));
    if (p.type === 'identify') puzIdentify(v, p);
    else if (p.type === 'oracle') puzOracle(v, p);
    else puzAccuse(v, p);
    if (!S.puz[p.id].solved) v.appendChild(hintBlock(p));
    return;
  }
  var solvedAll = data.puzzles.every(function(p){ return S.puz[p.id].solved; });
  v.appendChild(chainBar());
  data.puzzles.forEach(function(p, i){
    var ps = puzzleState(p);
    var card = h('div', { class: 'card' + (ps.st === 'locked' ? ' lock' : '') }, [
      h('h2', { text: (ps.st === 'locked' ? '🔒 ' : '') + '謎 ' + (i + 1) + '：' + p.title })
    ]);
    if (ps.st === 'solved') card.appendChild(h('span', { class: 'stamp', text: '已解開' }));
    if (ps.st === 'locked') card.appendChild(h('p', { class: 'muted', text: p.lockedText || '還不能解。' }));
    if (ps.st !== 'locked') card.appendChild(h('div', { style: 'margin-top:8px' }, [h('button', { type: 'button', class: ps.st === 'open' ? 'primary' : '', 'data-puzzle': p.id, onclick: function(){ S.view = p.id; sfx('click'); render(); window.scrollTo(0,0); } }, [ps.st === 'solved' ? '再看一次' : '來解這個謎'])]));
    v.appendChild(card);
  });
  if (solvedAll) v.appendChild(h('div', { class: 'card' }, [h('button', { type: 'button', class: 'primary', id: 'btnEnding', onclick: function(){ S.view = 'ending'; S.ended = true; if (!S.endTs) S.endTs = Date.now(); render(); window.scrollTo(0,0); } }, ['看案情說明'])]));
}

function radioGroup(name, opts, curId, onPick){
  return h('div', {}, opts.map(function(o){
    var inp = h('input', { type: 'radio', name: name, value: o.id });
    if (curId === o.id) inp.checked = true;
    var lab = h('label', { class: 'opt' + (curId === o.id ? ' on' : ''), 'data-opt': o.id }, [inp, h('span', { text: o.label })]);
    inp.addEventListener('change', function(){ onPick(o.id); });
    return lab;
  }));
}

function identifySubmit(p){
  var st = S.puz[p.id];
  st.tries++;
  var wOk = st.who === p.answerWho, rOk = st.reason === p.answerReason;
  if (wOk && rOk) {
    st.solved = true;
    if (p.onSolve && p.onSolve.appendClue) S.appended[p.onSolve.appendClue.id] = p.onSolve.appendClue.text;
    celebrate('解開了', p.title);
  } else {
    sfx('bad'); S.wrong++;
    var w = byId(p.who, st.who), r = byId(p.reasons, st.reason);
    if (!wOk) st.fb = (w && w.fb) || p.mismatchText || '再想想。';
    else st.fb = (r && r.fb) || p.mismatchText || '再想想。';
  }
}
function puzIdentify(v, p){
  var st = S.puz[p.id];
  if (st.solved) { v.appendChild(h('div', { class: 'msg ok', text: p.okText })); return; }
  var card = h('div', { class: 'card' });
  card.appendChild(h('h3', { text: p.whoLabel || '他是誰？' }));
  card.appendChild(radioGroup('who', p.who, st.who, function(id){ st.who = id; st.fb = ''; render(); }));
  card.appendChild(h('h3', { text: p.reasonLabel || '你憑什麼這樣認？', style: 'margin-top:10px' }));
  card.appendChild(radioGroup('reason', p.reasons, st.reason, function(id){ st.reason = id; st.fb = ''; render(); }));
  card.appendChild(h('div', { style: 'margin-top:10px' }, [h('button', { type: 'button', class: 'primary', id: 'btnSubmitP', disabled: !(st.who && st.reason), onclick: function(){ act('puzzle', { type: 'identify', id: p.id }); } }, ['送出'])]));
  if (st.fb) card.appendChild(h('div', { class: 'msg bad', id: 'fbP', text: st.fb }));
  v.appendChild(card);
}

/* 擲筊 */
function beiSVG(face){
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 78 50');
  var p = document.createElementNS(NS, 'path');
  if (face === 'flat') { p.setAttribute('d', 'M4 14 C4 44 74 44 74 14 Z'); p.setAttribute('fill', '#e8c37a'); p.setAttribute('stroke', '#6b4a14'); p.setAttribute('stroke-width', '3'); }

}

function validate(d){
  var errs = [], warns = [];
  function need(c, m){ if (!c) errs.push(m); }
  ['scenes','items','clues','puzzles'].forEach(function(k){ need(Array.isArray(d[k]) && d[k].length, '缺少 ' + k + '（要是清單）'); });
  need(d.meta && d.meta.title, '缺少 meta.title');
  need(d.intro && Array.isArray(d.intro.text), '缺少 intro.text');
  need(d.ending && Array.isArray(d.ending.lines), '缺少 ending.lines');
  need(d.judge && d.judge.options, '缺少 judge');
  if (errs.length) return { errs: errs, warns: warns };
  var ids = {};
  function reg(list, label){ list.forEach(function(x){ var k = label + ':' + x.id; if (!x.id) errs.push(label + ' 有一筆沒有 id'); else if (ids[k]) errs.push(label + ' 的 id 重複：' + x.id); ids[k] = 1; }); }
  reg(d.scenes,'scene'); reg(d.items,'item'); reg(d.clues,'clue'); reg(d.puzzles,'puzzle'); reg(d.codex || [],'codex');
  function clue(id, where){ if (!byId(d.clues, id)) errs.push(where + ' 指到不存在的線索：' + id); }
  function item(id, where){ if (!byId(d.items, id)) errs.push(where + ' 指到不存在的道具：' + id); }
  d.scenes.forEach(function(sc){
    (sc.finds||[]).forEach(function(f){ if (f.kind === 'item') item(f.id, '現場「' + sc.name + '」'); else if (f.kind === 'clue') clue(f.id, '現場「' + sc.name + '」'); else if (f.kind === 'look') { if (!f.text) errs.push('現場「' + sc.name + '」有一個 look 沒有 text'); } else errs.push('現場「' + sc.name + '」有一筆 finds 的 kind 不是 item、clue 或 look'); if (f.needs) item(f.needs, '現場「' + sc.name + '」needs'); });
    if (sc.opens) (sc.opens.clues||[]).forEach(function(c){ clue(c, '現場「' + sc.name + '」opens'); });
  });
  d.items.forEach(function(it){ if (it.clue) clue(it.clue, '道具「' + it.name + '」'); });
  (d.combos||[]).forEach(function(c){ item(c.a, 'combos'); item(c.b, 'combos'); if (c.gives) clue(c.gives, 'combos'); if (!c.gives && !c.msg) errs.push('combos 有一筆既沒有 gives 也沒有 msg'); });
  d.puzzles.forEach(function(p){
    var w = '謎「' + p.title + '」';
    (p.needsClues||[]).forEach(function(c){ clue(c, w); });
    (p.needsItems||[]).forEach(function(c){ item(c, w); });
    (p.needsPuzzles||[]).forEach(function(c){ if (!byId(d.puzzles, c)) errs.push(w + ' 指到不存在的謎：' + c); });
    if (!Array.isArray(p.hints) || p.hints.length !== 3) warns.push(w + ' 的提示最好是 3 層');
    if (p.type === 'identify') {
      if (!byId(p.who||[], p.answerWho)) errs.push(w + ' 的 answerWho 不在 who 裡');
      if (!byId(p.reasons||[], p.answerReason)) errs.push(w + ' 的 answerReason 不在 reasons 裡');
    } else if (p.type === 'oracle') {
      var qs = (p.oracle && p.oracle.questions) || [];
      (p.oracle.solveWhen||[]).forEach(function(q){ if (!byId(qs, q)) errs.push(w + ' 的 solveWhen 指到不存在的問題：' + q); else if (byId(qs,q).form === 'open' && p.oracle.strictYesNo) errs.push(w + ' 的 solveWhen 含「開放式問題」，在嚴格模式下永遠問不出來：' + q); });
      if (p.onSolve && p.onSolve.giveClue) clue(p.onSolve.giveClue, w);
    } else if (p.type === 'accuse') {
      (p.rows||[]).forEach(function(r){ if (!byId(r.options, r.answer)) errs.push(w + ' 的 ' + r.id + ' answer 不在 options 裡'); (r.must||[]).forEach(function(c){ clue(c, w + ' ' + r.id + ' must'); }); });
    } else errs.push(w + ' 的 type 不認得：' + p.type);
  });
  if (d.clues.length < 4 || d.clues.length > 8) warns.push('線索卡 ' + d.clues.length + ' 張；建議 4–6 張。');
  var hasField = d.clues.some(function(c){ return has(c.tag||[], 'field'); }) || (d.codex||[]).some(function(c){ return has(c.tag||[], 'field'); });
  if (!hasField) warns.push('提醒：至少放一張你自己田野得來的線索（tag 加上 "field"），這是 AI 幫不了你的部分。');
  return { errs: errs, warns: warns };
}
