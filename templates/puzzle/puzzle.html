    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){
      if (a.type === 'start') { st.stage = 'story'; st.page = 0; sfx('page'); st.scrollTop = true; }
      else if (a.type === 'next') { st.page++; sfx('page'); }
      else if (a.type === 'enter') { enterPlay(); }
    },
    render: function(st){ if (st.stage === 'cover') viewCover(this.root); else viewStory(this.root); }
  },
  explore: {
    reads: ['scenes', 'items'],
    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){
      var sc = byId(this.cfg.scenes, a.scene);
      if (a.type === 'goto') {
        if (!sceneOpen(sc)) { st.reveal = { ic: '🔒', hd: sc.name, tx: sc.lockedText || '還不能去。' }; sfx('bad'); }
        else if (sc.id !== st.scene) { st.scene = sc.id; st.reveal = { ic: '🚶', hd: '來到：' + sc.name, tx: sc.desc }; sfx('page'); }
      } else if (a.type === 'tap') exploreTap(sc, byId(sc.finds, a.find));
    },
    render: function(st){ viewScene(this.root); }
  },
  inventory: {
    reads: ['items', 'combos', 'comboDefault'],
    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){
      if (a.type === 'toggle') toggleSel(a.id);
      else if (a.type === 'combine') { doCombine(); if (a.from === 'bar') st.reveal = { ic: '🧩', hd: '湊在一起', tx: st.comboMsg }; }
    },
    render: function(st){ renderBag(this.root); },
    renderBench: function(st){ renderBench(this.root); }
  },
  notebook: {
    reads: ['clues', 'codex', 'fieldwork'],
    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){ if (a.type === 'clearNew') st.newClues = []; },
    render: function(st){ renderClues(this.root); },
    renderCodex: function(st){ viewCodex(this.root); }
  },
  puzzle: {
    reads: ['puzzles'],
    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){
      var p = byId(this.cfg.puzzles, a.id);
      if (a.type === 'identify') identifySubmit(p);
      else if (a.type === 'ask') askQ(p, byId(p.oracle.questions, a.q));
      else if (a.type === 'relight') relight(p);
      else if (a.type === 'accuse') accuseSubmit(p);
    },
    render: function(st){ viewPuzzle(this.root); }
  },
  hint: {
    reads: ['puzzles[].hints'],
    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){
      if (a.type === 'use') { st.hintsUsed[a.id] = (st.hintsUsed[a.id] || 0) + 1; sfx('click'); }
    },
    render: function(st, p){ return hintBlock(p); }
  },
  scoring: {
    reads: ['rating'],
    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){ if (a.type === 'wrong') st.wrong++; else if (a.type === 'retry') st.oracle.retries++; },
    render: function(st){ return resultCard(); }
  },
  ending: {
    reads: ['ending', 'judge'],
    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){ if (a.type === 'story') st.story = a.text; else if (a.type === 'judge') st.judge.id = a.id; },
    render: function(st){ viewEnding(this.root); }
  },
  feedback: {
    reads: ['meta'],
    init: function(cfg, root){ this.cfg = cfg; this.root = root; },
    step: function(st, a){ if (a.type === 'sfx') sfx(a.kind); else if (a.type === 'toast') toast(a.text); else if (a.type === 'celebrate') celebrate(a.title, a.sub); },
    render: function(st){ }
  }
};
function initModules(){
  Object.keys(MOD).forEach(function(k){ MOD[k].init(pick(MOD[k].reads.map(function(r){ return r.split('[')[0]; })), $('#view')); });
}

/* ---------- 啟動 ---------- */
$('#btnCulture').addEventListener('click', function(){ sfx('click'); switchMode('culture'); });
$('#btnSkin').addEventListener('click', function(){ sfx('click'); switchMode('skin'); });
$('#btnRemix').addEventListener('click', function(){ if (S.stage !== 'play') S.stage = 'play'; if (S.tab !== 'scene' || S.view) { S.tab = 'scene'; S.view = null; } render(); openRemix(); });
$('#btnSound').addEventListener('click', function(){
  soundOn = !soundOn; this.textContent = '聲音：' + (soundOn ? '開' : '關'); this.setAttribute('aria-pressed', String(soundOn));
  if (soundOn) { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); } catch (e) {} sfx('get'); }
});
window.__puzzle = { MOD: MOD, render: render, get S(){ return S; }, get data(){ return data; }, get mode(){ return mode; }, validate: validate, askQ: askQ, startGame: startGame, BUILT: BUILT };
startGame('culture', BUILT.culture);
})();
