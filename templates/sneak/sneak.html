<style>
:root{
  /* 外觀 token：夜巷燈籠（正本第五節「潛行 sneak」）。樣式只准用這十一個。 */
  --tk-surface:#121619; --tk-panel:#1e252a; --tk-ink:#d9e2e4; --tk-muted:#8fa2a8;
  --tk-accent:#ff9d2e; --tk-accent-ink:#121619; --tk-line:#34434b;
  --tk-font-title:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --tk-font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --tk-radius:0px;
  --tk-shadow:0 0 0 1px var(--tk-line), 0 0 22px color-mix(in srgb, var(--tk-accent) 20%, transparent);
  color-scheme:dark;
}
:root{
  /* 以下全由 token 推出來，不再寫死顏色 */
  --floor:color-mix(in srgb, var(--tk-panel) 70%, var(--tk-line));
  --wall:var(--tk-surface);
  --thr:color-mix(in srgb, var(--tk-accent) 38%, var(--tk-panel));
  --room:color-mix(in srgb, var(--tk-accent) 12%, var(--tk-panel));
  --sight:color-mix(in srgb, var(--tk-accent) 55%, transparent);
  --ear:color-mix(in srgb, var(--tk-ink) 16%, transparent);
  --chip:color-mix(in srgb, var(--tk-panel) 80%, var(--tk-line));
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tk-surface);color:var(--tk-ink);font-family:var(--tk-font-body);line-height:1.6}
main{max-width:760px;margin:0 auto;padding:14px 16px 48px}
h1,h2{font-family:var(--tk-font-title);font-weight:900;letter-spacing:.06em}
h1{font-size:1.5rem;margin:.2em 0 0;display:flex;align-items:center;gap:.5em}

h2{font-size:1.1rem;margin:1.2em 0 .4em;border-bottom:2px solid var(--tk-accent);padding-bottom:.15em;display:inline-block}
.sub{color:var(--tk-muted);font-size:.92rem;margin:0 0 .6em}
.card{background:var(--tk-panel);border:1px solid var(--tk-line);border-radius:var(--tk-radius);box-shadow:var(--tk-shadow);padding:12px 14px;margin:12px 0}
.tabs{display:flex;gap:0;flex-wrap:wrap;margin:12px 0;border-bottom:3px solid var(--tk-line)}
button{font:inherit;color:inherit;cursor:pointer}
.tab{min-height:44px;padding:8px 14px;border:0;border-radius:var(--tk-radius);background:transparent;color:var(--tk-muted);font-family:var(--tk-font-title);font-weight:900;margin-bottom:-3px;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--tk-accent);border-bottom-color:var(--tk-accent)}
.btn{min-height:44px;padding:8px 14px;border-radius:var(--tk-radius);border:1px solid var(--tk-line);background:var(--chip);color:var(--tk-ink)}
.btn:hover{border-color:var(--tk-accent)}
.btn.primary{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent);font-weight:900}
.btn:disabled{opacity:.35;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.cc{border:1px solid var(--tk-line);border-left:5px solid var(--tk-accent);border-radius:var(--tk-radius);padding:8px 10px;background:var(--tk-surface);font-size:.92rem}
.cc b{font-size:1rem;font-family:var(--tk-font-title);font-weight:900}
.no{display:inline-block;font-size:.78rem;background:var(--tk-accent);color:var(--tk-accent-ink);padding:0 6px;margin-right:4px;font-weight:700}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--tk-line);padding:0 5px;color:var(--tk-muted);margin-left:4px}
.status{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{background:var(--chip);border:1px solid var(--tk-line);padding:2px 10px;font-size:.9rem}
.pill.hot{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent);font-weight:700}
.boardwrap{display:flex;justify-content:center;margin:8px 0}
.board{display:grid;gap:1px;user-select:none;background:var(--tk-line);border:1px solid var(--tk-line);box-shadow:var(--tk-shadow)}
.cell{display:flex;align-items:center;justify-content:center;font-size:.92rem;position:relative;background:var(--floor)}
.cell.w{background:var(--wall)}
.cell.t{background:var(--thr);font-weight:900}
.cell.i{background:var(--room)}
.cell.ear::after{content:"";position:absolute;inset:0;background:var(--ear)}
.cell.s::before{content:"";position:absolute;inset:0;background:var(--sight)}
.cell .who{position:relative;z-index:2;font-size:1.1rem}
.cell.me{outline:3px solid var(--tk-accent);outline-offset:-3px;box-shadow:0 0 12px var(--tk-accent)}
.legend{font-size:.82rem;color:var(--tk-muted);text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center;margin:10px 0}
.pad .btn{min-height:48px;padding:0;font-size:1.2rem}
.pad .btn.on{background:var(--tk-accent);color:var(--tk-accent-ink)}
.extra{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.log{font-size:.9rem;max-height:9.5em;overflow:auto;border-top:1px dashed var(--tk-line);margin-top:8px;padding-top:6px}

.panel{border:2px solid var(--tk-accent);border-radius:var(--tk-radius);box-shadow:var(--tk-shadow);padding:12px;margin:12px 0;background:var(--tk-panel)}

.note{font-size:.85rem;color:var(--tk-muted)}
.err{color:var(--tk-accent);font-size:.9rem;white-space:pre-wrap}
.hidden{display:none !important}
code{background:var(--chip);padding:0 4px;font-size:.88em;word-break:break-all}
.small{font-size:.86rem}
</style>

age": "你踩到紅色方塊。（血 -1）", "heard": "", "heardDamage": "跳的聲音被聽到了。（血 -1）", "jump": "你跳過紅色方塊。", "enterRoom": "你進了小屋。", "altarGive": "箱子裡有一顆煙霧彈。（煙霧彈 +1）", "altarRefuse": "", "hide": "你丟出煙霧彈。（三回合內沒人看得到你）", "cure": "", "wait": "你等了一回合。", "damage": "血 -1", "caught": "{who}看見你了。遊戲結束。"}, "voices": {}, "ruleList": [{"text": "紅色方塊：踩到扣 1 滴血；可以跳過去，可是跳會出聲，被聽到也扣血。", "needs": []}, {"text": "小屋裡的箱子有煙霧彈，丟了可以隱身三回合。", "needs": []}, {"text": "千里眼看直線、順風耳聽跳的聲音、黃巾力士來回巡。", "needs": []}, {"text": "被看見或血用完就結束。", "needs": []}], "endings": {"win": [{"maxNotice": 99, "text": "你到了終點。過關！"}], "caught": "{who}看見你了。遊戲結束。", "hp": "血用完了。遊戲結束。", "after": ""}}}, "remix": {"title": "怎麼改做", "steps": [{"n": 1, "name": "換內容", "task": "把三個區域換成你去過的三個地方（例如你家附近的廟、巷子、市場），改每個區域的名字和進場那一句話。地圖可以先不動。", "where": "versions.rule.zoneNames、zoneEnter、voices 的文字", "prompt": "這是一個潛行遊戲的資料檔（JSON）。請保留所有欄位名稱和結構，地圖 map 不要動，只把 versions.rule 裡的 zoneNames、zoneEnter、voices 的文字改成發生在【寫你的三個地方】。每個 voices 的選項保留三個，effect 只能是 none／notice／shock。只回傳 JSON。"}, {"n": 2, "name": "換規則：把一張文化卡從「皮」變成「規則」", "task": "打開「換皮版」那一版（versions.skin）。挑一張禁忌卡（例如 #20 廟門的進出方向），把它變成一條真的規則：在 skin 的 rules 把 doorDirection 改成 true，再替龍門、虎門寫訊息（wrongIn、rightIn…），最後在 ruleList 加一條規則、needs 寫上卡的編號。玩一次換皮版，看看這條規則有沒有真的改變你怎麼走。", "where": "versions.skin.rules、msgs、tiles、ruleList", "prompt": "請修改這份 JSON 的 versions.skin：把 rules.doorDirection 改成 true；tiles 的 L 改成「龍」、H 改成「虎」；msgs 加上 wrongIn、wrongOut、rightIn、rightOut、altarRefuse 五句（用一般遊戲的口氣，例如「走錯門了」）；ruleList 加一條「小屋要從右邊的門進、左邊的門出，走錯門拿不到煙霧彈」，needs 寫 [20]。其他地方不要動。只回傳 JSON。"}, {"n": 3, "name": "換形式", "task": "把你的禁忌搬進另一個樣板。例如「擲筊問路」（爬塔）：踩到禁忌的那一層，擲筊的結果變差；或「遶境不能停」（跑酷）：路線上有不能踩的線。", "where": "另一個樣板的 JSON", "prompt": "這是我做的潛行遊戲資料，裡面有三條禁忌規則（ruleList 中 needs 有編號的那幾條）。請依照【另一個樣板名稱】樣板的格式，把這三條禁忌改寫成那個樣板裡的規則，保留卡片編號。回傳新的 JSON。"}], "addOne": "想多加一關？在 zones 最後面複製一個區域：map 每一列一樣長；# 是牆、. 是地、T 是門檻、L／H 是龍門虎門、I 是廟裡、A 是香爐、V 是聲音、X 是收驚的香爐、S 是起點、E 是出口（最後一關用 K 當終點）。守望的人三種：eye（站著轉頭看）、patrol（照 path 走，每一步只能走一格）、ear（聽 radius 格內的跨步聲）。存好之後按「載入我的版本」，錯誤會告訴你是哪一列、哪一格。"}, "compose": {"skin": "sneak", "modules": {"核心動作": "移動與跨越", "資源計分": "被盯上與香", "時間回合": "守望者輪值回合", "空間": "格狀廟宇地圖", "角色": "千里眼・順風耳・黃巾力士", "事件選擇": "夜裡的聲音", "勝負": "送茶到終點／被看見", "回饋": "提示文字與紀錄"}}}</script>
<script>// 夜巡不踩線：潛行躲避樣板的遊戲規則（瀏覽器與 node 共用，不碰畫面）
// 規則全部由 JSON 的 rules 開關決定；「換皮版」與「玩法版」用的是同一支程式。
(function (root) {
  const DIRS = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const key = (r, c) => r + "," + c;

  function tile(zone, r, c) {
    const row = zone.map[r];
    if (!row || c < 0 || c >= row.length) return "#";
    return row[c];
  }
  const isThreshold = (ch) => ch === "T" || ch === "L" || ch === "H";
  const isInterior = (ch) => ch === "I" || ch === "A";
  const walkable = (ch) => ch !== "#";

  function findChar(zone, ch) {
    for (let r = 0; r < zone.map.length; r++) {
      const c = zone.map[r].indexOf(ch);
      if (c >= 0) return [r, c];
    }
    return null;
  }

  function newGame(cfg) {
    const s = {
      z: 0, t: 0, p: findChar(cfg.zones[0], "S"),
      notice: 0, hp: cfg.rules.hp == null ? null : cfg.rules.hp,
      incense: cfg.rules.startIncense || 0, shock: false, hidden: 0,
      templeBad: {}, altarTaken: {}, voicesDone: {}, pending: null, over: null,
      log: [], stats: { thresholdSteps: 0, heard: 0, wrongDoor: 0, badWords: 0, shocked: 0, turns: 0 }
    };
    say(s, cfg.zones[0].enterMsg);
    return s;
  }

  function say(s, msg) { if (msg) { s.log.push(msg); if (s.log.length > 40) s.log.shift(); } }

  function watcherAt(w, t) {
    if (w.kind === "eye") return { pos: w.pos, face: w.dirs[t % w.dirs.length] };
    if (w.kind === "patrol") {
      const n = w.path.length;
      const pos = w.path[t % n];
      const prev = w.path[(t - 1 + n) % n];
      let face = "R";
      const dr = pos[0] - prev[0], dc = pos[1] - prev[1];
      if (dr < 0) face = "U"; else if (dr > 0) face = "D"; else if (dc < 0) face = "L"; else if (dc > 0) face = "R";
      return { pos, face };
    }
    return { pos: w.pos, face: null };
  }

  // 某一回合每個守望者看得到的格子（畫面畫視線、規則判定被看見，都用這一支）
  function sightTiles(cfg, s, t) {
    const zone = cfg.zones[s.z];
    const grow = cfg.rules.noticeGrowsSight ? s.notice : 0;
    const out = [];
    (zone.watchers || []).forEach((w, wi) => {
      if (w.kind === "ear") return;
      const st = watcherAt(w, t);
      const [dr, dc] = DIRS[st.face];
      let r = st.pos[0], c = st.pos[1];
      out.push({ wi, r, c, self: true });
      for (let i = 0; i < w.range + grow; i++) {
        r += dr; c += dc;
        if (!walkable(tile(zone, r, c))) break;
        out.push({ wi, r, c });
      }
    });
    return out;
  }

  function penalty(cfg, s, kind, msgKey) {
    const M = cfg.msgs;
    if (cfg.rules.penaltyMode === "damage") { s.hp -= 1; say(s, M[msgKey + "Damage"] || M.damage); }
    else { s.notice += 1; say(s, M[msgKey]); }
    if (kind) s.stats[kind] += 1;
  }

  function checkSeen(cfg, s) {
    if (s.hidden > 0) return;
    const zone = cfg.zones[s.z];
    const hit = sightTiles(cfg, s, s.t).find((x) => x.r === s.p[0] && x.c === s.p[1]);
    if (hit) s.over = { type: "caught", by: zone.watchers[hit.wi].name };
  }

  function advance(cfg, s) {
    const n = s.shock && cfg.rules.shock ? 2 : 1;
    for (let i = 0; i < n && !s.over; i++) {
      s.t += 1; s.stats.turns += 1;
      if (s.hidden > 0) s.hidden -= 1;
      checkSeen(cfg, s);
    }
    if (!s.over && s.hp != null && s.hp <= 0) s.over = { type: "hp" };
  }

  function noise(cfg, s, positions) {
    (cfg.zones[s.z].watchers || []).forEach((w) => {
      if (w.kind !== "ear") return;
      if (positions.some((p) => Math.abs(p[0] - w.pos[0]) + Math.abs(p[1] - w.pos[1]) <= w.radius)) penalty(cfg, s, "heard", "heard");
    });
  }

  // 現在可以做哪些動作（畫面用來開關按鈕；求解器用來列舉）
  function legal(cfg, s) {
    const out = [];
    if (s.over) return out;
    if (s.pending) { s.pending.options.forEach((_, i) => out.push({ type: "voice", i })); return out; }
    const zone = cfg.zones[s.z], R = cfg.rules;
    for (const d of Object.keys(DIRS)) {
      const [dr, dc] = DIRS[d];
      const t1 = tile(zone, s.p[0] + dr, s.p[1] + dc);
      if (walkable(t1)) out.push({ type: "move", d });
      if (isThreshold(t1) && !(s.shock && R.shock)) {
        const t2 = tile(zone, s.p[0] + 2 * dr, s.p[1] + 2 * dc);
        if (walkable(t2) && !isThreshold(t2)) out.push({ type: "jump", d });
      }
    }
    out.push({ type: "wait" });
    const here = tile(zone, s.p[0], s.p[1]);
    if (isInterior(here) && s.incense > 0 && s.hidden === 0 && !(R.doorDirection && s.templeBad[s.z])) out.push({ type: "hide" });
    if (here === "X" && R.shock && s.shock && s.incense > 0) out.push({ type: "cure" });
    return out;
  }

  function act(cfg, s0, a) {
    const s = clone(s0);
    if (s.over) return s;
    const R = cfg.rules, M = cfg.msgs, zone = cfg.zones[s.z];
    if (s.pending) {
      if (a.type !== "voice") return s;
      const opt = s.pending.options[a.i];
      if (!opt) return s;
      say(s, opt.reply);
      if (opt.effect === "notice") { s.notice += 1; s.stats.badWords += 1; }
      if (opt.effect === "shock") { s.shock = true; s.stats.shocked += 1; }
      s.pending = null;
      return s;
    }
    if (!legal(cfg, s).some((x) => x.type === a.type && x.d === a.d)) return s;
    const wasIn = isInterior(tile(zone, s.p[0], s.p[1]));
    if (a.type === "move" || a.type === "jump") {
      const [dr, dc] = DIRS[a.d];
      const t1 = tile(zone, s.p[0] + dr, s.p[1] + dc);
      const door = (t1 === "L" || t1 === "H") ? t1 : null;
      if (a.type === "jump") {
        const n2 = [s.p[0] + 2 * dr, s.p[1] + 2 * dc];
        say(s, M.jump);
        noise(cfg, s, [s.p, n2]);
        s.p = n2;
      } else {
        s.p = [s.p[0] + dr, s.p[1] + dc];
        if (isThreshold(t1)) penalty(cfg, s, "thresholdSteps", "threshold");
      }
      const nowCh = tile(zone, s.p[0], s.p[1]);
      const nowIn = isInterior(nowCh);
      if (!wasIn && nowIn) {
        if (R.doorDirection && door === "H") { s.templeBad[s.z] = true; penalty(cfg, s, "wrongDoor", "wrongIn"); }
        else say(s, R.doorDirection && door === "L" ? M.rightIn : M.enterRoom);
      }
      if (wasIn && !nowIn && R.doorDirection) {
        if (door === "L") penalty(cfg, s, "wrongDoor", "wrongOut");
        else if (door === "H") say(s, M.rightOut);
      }
      if (nowCh === "A" && !s.altarTaken[s.z]) {
        if (R.doorDirection && s.templeBad[s.z]) say(s, M.altarRefuse);
        else { s.incense += 1; s.altarTaken[s.z] = true; say(s, M.altarGive); }
      }
      const vk = s.z + "-" + key(s.p[0], s.p[1]);
      if (nowCh === "V" && !s.voicesDone[vk]) {
        s.voicesDone[vk] = true;
        const v = (zone.voices || []).find((x) => x.at[0] === s.p[0] && x.at[1] === s.p[1]);
        if (R.voiceMode === "choice" && v) { s.pending = clone(v); say(s, v.prompt); }
        else if (R.voiceMode === "trap") penalty(cfg, s, "badWords", "trap");
      }
      if (nowCh === "E") {
        if (s.hp != null && s.hp <= 0) { s.over = { type: "hp" }; return s; }
        s.z += 1; s.t = 0; s.hidden = 0;
        s.p = findChar(cfg.zones[s.z], "S");
        say(s, cfg.zones[s.z].enterMsg);
        return s;
      }
      if (nowCh === "K") { s.over = (s.hp != null && s.hp <= 0) ? { type: "hp" } : { type: "win" }; return s; }
    } else if (a.type === "hide") {
      s.incense -= 1; s.hidden = 3; say(s, M.hide);
    } else if (a.type === "cure") {
      s.incense -= 1; s.shock = false; say(s, M.cure);
    } else if (a.type === "wait") {
      say(s, M.wait);
    }
    advance(cfg, s);
    if (s.over && s.over.type === "caught") say(s, (M.caught || "").replace("{who}", s.over.by));
    return s;
  }

  // 「抽掉文化」檢查：每一條規則記著它靠哪幾張文化卡；抽掉文化後還剩幾條
  function cultureCheck(cfg) {
    const rules = cfg.ruleList || [];
    const need = rules.filter((r) => (r.needs || []).length > 0).length;
    let verdict = "same";
    if (need > 0) verdict = need * 2 >= rules.length ? "collapse" : "story";
    return { total: rules.length, needCulture: need, remain: rules.length - need, verdict };
  }

  function validate(cfg) {
    const errs = [];
    if (!cfg || !Array.isArray(cfg.zones) || !cfg.zones.length) return ["zones 必須是至少一個區域的清單"];
    if (!cfg.rules) errs.push("缺 rules");
    if (!cfg.msgs) errs.push("缺 msgs（畫面上的提示文字）");
    cfg.zones.forEach((z, i) => {
      const name = "zones[" + i + "]";
      if (!Array.isArray(z.map) || !z.map.length) { errs.push(name + ".map 是空的"); return; }
      const w = z.map[0].length;
      z.map.forEach((row, r) => { if (row.length !== w) errs.push(name + ".map 第 " + r + " 列有 " + row.length + " 格，和第 0 列的 " + w + " 格不一樣"); });
      if (!findChar(z, "S")) errs.push(name + " 沒有起點 S");
      const last = i === cfg.zones.length - 1;
      if (last && !findChar(z, "K")) errs.push(name + " 是最後一區，要有終點 K");
      if (!last && !findChar(z, "E")) errs.push(name + " 要有出口 E 通往下一區");
      (z.watchers || []).forEach((wt, j) => {
        const wn = name + ".watchers[" + j + "]";
        if (!["eye", "patrol", "ear"].includes(wt.kind)) { errs.push(wn + ".kind 要是 eye／patrol／ear 其中一種"); return; }
        if (wt.kind === "patrol" && (!Array.isArray(wt.path) || wt.path.length < 2)) { errs.push(wn + ".path 至少要兩格"); return; }
        if (wt.kind === "eye" && (!Array.isArray(wt.dirs) || !wt.dirs.length || wt.dirs.some((d) => !DIRS[d]))) errs.push(wn + ".dirs 要是 U／D／L／R 組成的清單");
        const pts = wt.kind === "patrol" ? wt.path : [wt.pos];
        pts.forEach((p) => { if (!Array.isArray(p) || !walkable(tile(z, p[0], p[1]))) errs.push(wn + " 站在牆上或地圖外：" + JSON.stringify(p)); });
        if (wt.kind === "patrol") wt.path.forEach((p, k) => {
          const q = wt.path[(k + 1) % wt.path.length];
          if (Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) !== 1) errs.push(wn + ".path 第 " + k + " 格到下一格不是相鄰的一步");
        });
      });
      (z.voices || []).forEach((v, j) => {
        if (!Array.isArray(v.at) || tile(z, v.at[0], v.at[1]) !== "V") errs.push(name + ".voices[" + j + "] 的位置不是 V 格");
        if (!Array.isArray(v.options) || v.options.length < 2) errs.push(name + ".voices[" + j + "] 至少要兩個選項");
      });
    });
    return errs;
  }

  // 把 JSON 裡「共用的地圖」和「某一版的規則與文字」組成一份可以玩的設定
  function compose(data, vkey) {
    const v = data.versions[vkey];
    if (!v) throw new Error("找不到版本 " + vkey);
    const names = v.names || {};
    return {
      key: vkey, label: v.label,
      rules: v.rules, msgs: v.msgs, ruleList: v.ruleList || [], endings: v.endings || {}, tiles: v.tiles || {},
      zones: data.zones.map((z) => ({
        id: z.id, map: z.map,
        name: (v.zoneNames || {})[z.id] || z.id,
        enterMsg: (v.zoneEnter || {})[z.id] || "",
        voices: ((v.voices || {})[z.id]) || [],
        watchers: (z.watchers || []).map((w) => Object.assign({}, w, { name: names[w.id] || w.id, icon: (v.icons || {})[w.id] || "?" }))
      }))
    };
  }

  const api = { DIRS, compose, newGame, act, legal, sightTiles, watcherAt, tile, cultureCheck, validate, isThreshold, isInterior };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.SneakEngine = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
(function(){
"use strict";
const E = window.SneakEngine;
const ORIG = JSON.parse(document.getElementById("data").textContent);
let DATA = JSON.parse(JSON.stringify(ORIG));
let vkey = "rule", cfg = null, S = null, jumpMode = false;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TAGS = () => DATA.meta.tags || {};

function renderHeader(){
  $("title").textContent = DATA.meta.title;
  $("subtitle").textContent = DATA.meta.subtitle;
  $("kind").textContent = DATA.meta.cardKind;
  $("kindHint").textContent = DATA.meta.cardKindHint;
  $("cards").innerHTML = DATA.cards.map((c) => `<div class="cc"><span class="no">#${esc(c.no)}</span><b>${esc(c.v)}</b><span class="tag">${esc(TAGS()[c.tag] || c.tag)}</span><div>${esc(c.note)}</div><div class="note">在這個遊戲裡：${esc(c.here)}</div></div>`).join("");
  $("story").innerHTML = DATA.meta.story.map((p) => `<p style="margin:.2em 0">${esc(p)}</p>`).join("");
  $("disclaimer").textContent = DATA.meta.disclaimer;
}

/* ==================================================================
   八個模組（同一支規則核心 SneakEngine 之上分段）。
   每一段都有 init(cfg, root)／step(state, action)／render(state)：
   init＝接上這一版的設定與畫面容器；step＝只做這一段的事，回傳新的 state（或這一段算出的結果）；
   render＝只畫這一段負責的那塊畫面。
   JSON 的 compose.modules 只是宣告「這個樣板每一段用的是哪一種變體」，W12 才拿來拼接。
   ================================================================== */
const MOD = {};
const MOD_NAMES = ["核心動作", "資源計分", "時間回合", "空間", "角色", "事件選擇", "勝負", "回饋"];
let endMarked = false;

/* ---------- 模組 1：核心動作（走、跨、等、上香） ---------- */
MOD["核心動作"] = {
  init(c, root) { this.cfg = c; this.root = root; jumpMode = false; },
  step(state, action) { return E.act(this.cfg, state, action); },
  render(state) {
    const legal = E.legal(this.cfg, state);
    const has = (t, d) => legal.some((x) => x.type === t && (d === undefined || x.d === d));
    ["U", "D", "L", "R"].forEach((d) => {
      this.root.querySelector(`[data-act="${d}"]`).disabled = !!(state.over || state.pending || !(jumpMode ? has("jump", d) : has("move", d)));
    });
    $("waitBtn").disabled = !!(state.over || state.pending);
    const canJump = ["U", "D", "L", "R"].some((d) => has("jump", d));
    const ja = DATA.versions[vkey].actions || {};
    $("jumpBtn").textContent = ja.jump || "跨";
    $("jumpHint").textContent = `先按「${ja.jump || "跨"}」，再按方向：一步越過前面那一格${this.cfg.rules.penaltyMode === "notice" ? "門檻" : "紅色方塊"}。`;
    if (!canJump && jumpMode) jumpMode = false;
    $("jumpBtn").disabled = !canJump || !!state.over || !!state.pending;
    $("jumpBtn").classList.toggle("on", jumpMode);
    $("jumpBtn").setAttribute("aria-pressed", String(jumpMode));
    $("hideBtn").textContent = ja.hide || ""; $("hideBtn").classList.toggle("hidden", !has("hide"));
    $("cureBtn").textContent = ja.cure || ""; $("cureBtn").classList.toggle("hidden", !has("cure"));
  }
};

/* ---------- 模組 2：資源計分（被盯上／香／血／受驚） ---------- */
MOD["資源計分"] = {
  init(c, root) { this.cfg = c; this.root = root; },
  step(state) {   // 只讀：把這一刻的資源與分數算成一份
    return { notice: state.notice, incense: state.incense, hp: state.hp, shock: state.shock, hidden: state.hidden };
  },
  render(state) {
    const V = DATA.versions[vkey], lab = V.status || {}, sc = this.step(state), R = this.cfg.rules, st = [];
    if (R.hp != null) st.push(`<span class="pill ${sc.hp <= 1 ? "hot" : ""}">${esc(lab.hp || "血")}：${"❤".repeat(Math.max(0, sc.hp))}${"·".repeat(Math.max(0, R.hp - sc.hp))}</span>`);
    if (R.penaltyMode === "notice") st.push(`<span class="pill ${sc.notice ? "hot" : ""}">${esc(lab.notice)}：${sc.notice}</span>`);
    st.push(`<span class="pill">${esc(lab.incense)}：${sc.incense}</span>`);
    if (R.shock && sc.shock) st.push(`<span class="pill hot">${esc(lab.shock)}</span>`);
    if (sc.hidden) st.push(`<span class="pill">躲著：還有 ${sc.hidden} 回合</span>`);
    this.root.querySelector("#statusRes").innerHTML = st.join("");
  }
};

/* ---------- 模組 3：時間回合（每走一步守望者動一格；受驚時動兩格） ---------- */
MOD["時間回合"] = {
  init(c, root) { this.cfg = c; this.root = root; },
  step(state) {   // 只讀：走完這一步之後，守望者會再動幾格
    return { turn: state.stats.turns, t: state.t, perStep: (state.shock && this.cfg.rules.shock) ? 2 : 1 };
  },
  render(state) {
    const zone = this.cfg.zones[state.z];
    $("zoneName").textContent = zone.name + `（${state.z + 1}／${this.cfg.zones.length}）`;
    $("statusTurn").innerHTML = `<span class="pill">回合 ${this.step(state).turn}</span>`;
  }
};

/* ---------- 模組 4：空間（格狀地圖：牆、門檻、廟裡） ---------- */
MOD["空間"] = {
  init(c, root) { this.cfg = c; this.root = root; },
  step(state, action) {   // 只讀：這個動作的目標格是什麼
    if (!action || !action.d) return null;
    const d = E.DIRS[action.d], n = action.type === "jump" ? 2 : 1;
    const p = [state.p[0] + d[0] * n, state.p[1] + d[1] * n];
    return { pos: p, ch: E.tile(this.cfg.zones[state.z], p[0], p[1]) };
  },
  cellSize(state) {
    const cols = this.cfg.zones[state.z].map[0].length;
    const avail = Math.min(document.documentElement.clientWidth, 760) - 32 - 28;
    return Math.max(26, Math.min(44, Math.floor((avail - (cols - 1) * 1) / cols)));
  },
  render(state) {
    const zone = this.cfg.zones[state.z], size = this.cellSize(state), rows = zone.map.length, cols = zone.map[0].length;
    const b = $("board");
    b.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
    b.style.gridAutoRows = size + "px";
    const sight = MOD["角色"].step(state).sight;
    const ears = MOD["角色"].step(state).ears;
    const who = MOD["角色"].step(state).who;
    let html = "";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const ch = zone.map[r][c], k = r + "," + c;
      let cls = "cell";
      if (ch === "#") cls += " w"; else if (E.isThreshold(ch)) cls += " t"; else if (E.isInterior(ch)) cls += " i";
      if (sight.has(k) && ch !== "#") cls += " s";
      if (ears.some((w) => Math.abs(w.pos[0] - r) + Math.abs(w.pos[1] - c) <= w.radius) && ch !== "#") cls += " ear";
      const me = state.p[0] === r && state.p[1] === c;
      if (me) cls += " me";
      let glyph = ch === "#" || ch === "." ? "" : ((this.cfg.tiles || {})[ch] != null ? this.cfg.tiles[ch] : ch);
      if (who[k]) glyph = `<span class="who">${who[k]}</span>`;
      if (me) glyph = `<span class="who">🍵</span>`;
      html += `<div class="${cls}" data-rc="${k}">${glyph}</div>`;
    }
    b.innerHTML = html;
  }
};

/* ---------- 模組 5：角色（千里眼、順風耳、黃巾力士：誰站哪、看哪裡、聽哪裡） ---------- */
MOD["角色"] = {
  init(c, root) { this.cfg = c; this.root = root; },
  step(state) {   // 只讀：這一刻每個守望者的位置、走完這一步後會被看到的格子、耳朵的範圍
    const zone = this.cfg.zones[state.z], n = (state.shock && this.cfg.rules.shock) ? 2 : 1;
    const sight = new Set();
    for (let k = 1; k <= n; k++) E.sightTiles(this.cfg, state, state.t + k).forEach((x) => { if (!x.self) sight.add(x.r + "," + x.c); });
    const who = {};
    zone.watchers.forEach((w) => { const p = E.watcherAt(w, state.t).pos; who[p[0] + "," + p[1]] = w.icon; });
    return { sight, who, ears: zone.watchers.filter((w) => w.kind === "ear") };
  },
  render(state) {
    const ears = this.step(state).ears;
    $("legend").textContent = "你＝🍵　亮色格＝你走完這一步後，會被看到的地方" + (ears.length ? "　灰白格＝" + ears.map((w) => w.name).join("、") + "聽得到跨步聲的範圍" : "");
  }
};

/* ---------- 模組 6：事件選擇（夜裡的聲音：三個選項，各有後果） ---------- */
MOD["事件選擇"] = {
  init(c, root) { this.cfg = c; this.root = root; },
  step(state, action) {   // 選一個選項；沒有待選的事件就原樣回傳
    if (!state.pending || !action || action.type !== "voice") return state;
    return E.act(this.cfg, state, action);
  },
  render(state) {
    if (state.pending) {
      $("voicePanel").classList.remove("hidden");
      $("voicePrompt").textContent = state.pending.prompt;
      $("voiceOpts").innerHTML = state.pending.options.map((o, i) => `<button class="btn" data-voice="${i}">${esc(o.text)}</button>`).join("");
    } else $("voicePanel").classList.add("hidden");
  }
};

/* ---------- 模組 7：勝負（送到終點，或被看見、血用完） ---------- */
MOD["勝負"] = {
  init(c, root) { this.cfg = c; this.root = root; },
  step(state) {   // 只讀：結局是哪一種、標題與結尾文字
    if (!state.over) return null;
    const en = this.cfg.endings || {};
    let title = "", text = "";
    if (state.over.type === "win") {
      title = vkey === "rule" ? "清茶送到了" : "過關";
      const list = en.win || [];
      const pick = list.find((x) => state.notice <= x.maxNotice) || list[list.length - 1] || { text: "" };
      text = pick.text;
    } else if (state.over.type === "caught") { title = "被看見了"; text = (en.caught || "").replace("{who}", state.over.by); }
    else { title = "血用完了"; text = en.hp || ""; }
    return { type: state.over.type, title: `${this.cfg.label}｜${title}`, text, after: en.after || "" };
  },
  render(state) {
    const r = this.step(state);
    if (!r) { $("endPanel").classList.add("hidden"); $("controls").classList.remove("hidden"); return; }
    $("endTitle").textContent = r.title;
    $("endText").textContent = r.text;
    const s = state.stats, parts = [`走了 ${s.turns} 回合`];
    if (s.thresholdSteps) parts.push(`踩到 ${s.thresholdSteps} 次`);
    if (s.heard) parts.push(`被聽到 ${s.heard} 次`);
    if (s.wrongDoor) parts.push(`走錯門 ${s.wrongDoor} 次`);
    if (s.badWords) parts.push(`講錯話 ${s.badWords} 次`);
    if (s.shocked) parts.push(`受驚 ${s.shocked} 次`);
    $("endStats").textContent = parts.join("・");
    $("endAfter").textContent = r.after;
    const other = vkey === "rule" ? "skin" : "rule";
    $("toOther").textContent = `去玩另一版：${DATA.versions[other].label}`;
    $("toOther").dataset.to = other;
    $("endPanel").classList.remove("hidden");
    $("controls").classList.add("hidden");
    if (!endMarked) {
      endMarked = true;
      try { if (window.CT_HOOK) CT_HOOK.markPlayed(vkey); } catch (e) { /* 助教出錯不能影響樣板 */ }
      setTimeout(() => $("endPanel").scrollIntoView({ behavior: "smooth", block: "start" }), 30);
    }
  }
};

/* ---------- 模組 8：回饋（每一步的一句話提示與紀錄） ---------- */
MOD["回饋"] = {
  init(c, root) { this.cfg = c; this.root = root; },
  step(state) { return state.log.slice(-6); },   // 只讀：最近六句
  render(state) {
    $("log").innerHTML = this.step(state).map((m) => `<p>${esc(m)}</p>`).join("");
    $("log").scrollTop = 1e6;
  }
};

function initModules() { MOD_NAMES.forEach((n) => MOD[n].init(cfg, $("play"))); }
function render(){ ["時間回合", "資源計分", "角色", "空間", "核心動作", "事件選擇", "回饋", "勝負"].forEach((n) => MOD[n].render(S)); }

function startVersion(k){
  vkey = k; cfg = E.compose(DATA, k); S = E.newGame(cfg); jumpMode = false; endMarked = false;
  $("vIntro").innerHTML = `<b>${esc(cfg.label)}：</b>${esc(DATA.versions[k].intro)}`;
  initModules();
  render();
}

function doAct(a){
  if (!S || S.over) return;
  S = (a.type === "voice" ? MOD["事件選擇"] : MOD["核心動作"]).step(S, a);
  render();
}

function setTab(t){
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  $("play").classList.toggle("hidden", t === "remix");
  $("remix").classList.toggle("hidden", t !== "remix");
  if (t !== "remix") { $("controls").classList.remove("hidden"); startVersion(t); }
  else renderRemix();
}

function renderRemix(){
  const R = DATA.remix;
  $("remixSteps").innerHTML = `<h2 style="margin-top:0">${esc(R.title)}：三階，一次只做一階</h2>` + R.steps.map((s) => `
    <div style="margin:.6em 0 1em"><b>第 ${s.n} 階・${esc(s.name)}</b><p class="small" style="margin:.2em 0">${esc(s.task)}</p>
    <p class="note" style="margin:.2em 0">要改的地方：<code>${esc(s.where)}</code></p>
    <p class="small" style="margin:.2em 0">貼給 Claude／Gemini 的參考指令：</p><textarea rows="4" readonly>${esc(s.prompt)}</textarea></div>`).join("");
  const F = DATA.field;
  $("fieldCard").innerHTML = `<h2 style="margin-top:0">${esc(F.title)}</h2><p class="small">${esc(F.why)}</p>` +
    F.prompts.map((p) => `<p class="small" style="margin:.5em 0 .2em"><b>${esc(p.q)}</b> <span class="tag">田野</span></p><textarea rows="2" data-field="${esc(p.id)}" placeholder="去現場看、去問之後再寫"></textarea>`).join("") +
    `<p class="note">這幾格只存在你這個頁面裡；要留下來，請複製到你的作業。</p>`;
  $("addOne").textContent = R.addOne;
}

function exportData(){ $("dataBox").value = JSON.stringify(DATA, null, 2); $("importMsg").textContent = "已取出。整份複製起來。"; }
function importData(){
  let d;
  try { d = JSON.parse($("dataBox").value); } catch (e) { $("importMsg").textContent = "這不是完整的 JSON：" + e.message; return; }
  const errs = [];
  if (!d.versions || !d.versions.rule || !d.versions.skin) errs.push("versions 裡要有 rule 和 skin 兩版");
  else ["rule", "skin"].forEach((k) => { try { E.validate(E.compose(d, k)).forEach((x) => errs.push(`[${d.versions[k].label || k}] ${x}`)); } catch (e) { errs.push(`[${k}] ${e.message}`); } });
  ["meta", "cards", "remix", "field"].forEach((k) => { if (!d[k]) errs.push("缺少 " + k); });
  if (errs.length) { $("importMsg").textContent = "載入不了，請修這幾處：\n" + errs.join("\n"); return; }
  DATA = d; renderHeader(); $("importMsg").textContent = "載入成功！回到上面的分頁去玩你的版本。";
}

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) return setTab(t.dataset.tab);
  if (t.dataset.voice != null) return doAct({ type: "voice", i: Number(t.dataset.voice) });
  const a = t.dataset.act;
  if (a === "jump") { jumpMode = !jumpMode; return render(); }
  if (["U", "D", "L", "R"].includes(a)) { const ty = jumpMode ? "jump" : "move"; jumpMode = false; return doAct({ type: ty, d: a }); }
  if (a === "wait" || a === "hide" || a === "cure") return doAct({ type: a });
  if (t.id === "restart") return startVersion(vkey);
  if (t.id === "again") return startVersion(vkey);
  if (t.id === "toOther") { setTab(t.dataset.to); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (t.id === "exportBtn") return exportData();
  if (t.id === "importBtn") return importData();
  if (t.id === "resetData") { DATA = JSON.parse(JSON.stringify(ORIG)); renderHeader(); exportData(); $("importMsg").textContent = "已回到原本的資料。"; }
});
document.addEventListener("keydown", (ev) => {
  if (!S || $("play").classList.contains("hidden") || /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  const m = { ArrowUp: "U", ArrowDown: "D", ArrowLeft: "L", ArrowRight: "R" }[ev.key];
  if (m) { ev.preventDefault(); const ty = jumpMode ? "jump" : "move"; jumpMode = false; doAct({ type: ty, d: m }); }
  else if (ev.key === " ") { ev.preventDefault(); doAct({ type: "wait" }); }
  else if (ev.key === "j" || ev.key === "J") { jumpMode = !jumpMode; render(); }
});
window.addEventListener("resize", () => { if (S && !$("play").classList.contains("hidden")) render(); });

renderHeader();
setTab("skin");
// 給自動測試用的入口（不影響遊戲）
window.__sneak = { get state(){ return S; }, get cfg(){ return cfg; }, get modules(){ return MOD; } };
})();
</script>
