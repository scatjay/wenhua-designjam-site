<!doctype html><meta charset="utf-8"><title>Astra W3 evolution</title><style>body{font-family:system-ui;margin:24px}svg{border:1px solid #ddd} .b{fill:#5b8def}</style><h1>W3 集體共創演進（v0）</h1><p>去識別化、唯讀；未經人工雙編碼／ncodeR 驗證。</p><h2>規則組合 entropy</h2><svg id="e" width="800" height="250"></svg><h2>W3 code 節點權重</h2><svg id="n" width="800" height="350"></svg><script>const D={"entropy": [{"date": "2026-09-23", "n": 28, "distinct": 17, "shannon": 3.7368}], "nodes": [["rule_design_evaluation", 351], ["coalition_betrayal", 328], ["role_evaluator", 241], ["reflection_experience", 154], ["rule_change_experiment", 120], ["role_initiator", 93], ["uncertainty_conflict", 64], ["strategy_inference", 55], ["role_clarifier", 40], ["role_elaborator", 2]]};let e=document.querySelector('#e'),a=D.entropy;if(!a.length)e.outerHTML='<p>目前沒有足夠 room timestamp。</p>';else{let m=Math.max(...a.map(x=>x.shannon),1),p=a.map((x,i)=>[40+i*720/Math.max(a.length-1,1),210-x.shannon/m*170]);e.innerHTML='<polyline fill="none" stroke="#d14" points="'+p.map(x=>x.join(',')).join(' ')+'"/>'+p.map((x,i)=>'<text x="'+x[0]+'" y="235" font-size="10">'+a[i].date+'</text>').join('')}let n=document.querySelector('#n'),z=D.nodes,m=Math.max(...z.map(x=>x[1]),1);n.innerHTML=z.map((x,i)=>'<text x="10" y="'+(25+i*26)+'">'+x[0]+'</text><rect class="b" x="190" y="'+(i*26+10)+'" width="'+x[1]/m*550+'" height="16"/><text x="'+(200+x[1]/m*550)+'" y="'+(i*26+23)+'">'+x[1]+'</text>').join('')</script>
