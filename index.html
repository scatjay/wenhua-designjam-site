<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>學習單總入口 · 文化遊戲松／遊戲設計學</title>
<style>
/* 跟 unit1/w2/sf3k 同一套：冷灰藍底、16px、-apple-system/PingFang TC、圓角 16。
   三週各有專屬色，總入口保持中性藍灰，讓三個單元卡自己說話。
   W1 橘 #e0821f ｜ W2 藍 #2f6690 ｜ W3 紫 #7a3f92 */
:root{
  --bg:#f7f9fa; --panel:#ffffff; --panel2:#eaf0f3; --ink:#202a30; --ink-soft:#54646e;
  --line:#cfdae1; --accent:#2f6690;
  --w1:#e0821f; --w1-soft:#fbead2;
  --w2:#2f6690; --w2-soft:#e5eff6;
  --w3:#7a3f92; --w3-soft:#f2e7f6;
  --shadow:0 1px 2px rgba(40,32,10,.06), 0 6px 18px rgba(40,32,10,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px}
.wrap{max-width:660px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;font-weight:800;margin:0 0 6px}
.sub{color:var(--ink-soft);font-size:15px;margin:0 0 20px;line-height:1.7}
.kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.unit{display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:1.5px solid var(--line);border-left-width:6px;border-radius:16px;padding:16px 18px;
  margin:11px 0;box-shadow:var(--shadow)}
.unit:active{transform:translateY(1px)}
.unit .nm{font-size:17px;font-weight:800;margin:0 0 5px}
.unit .ds{font-size:14px;color:var(--ink-soft);line-height:1.7}
.unit.w1{border-left-color:var(--w1)} .unit.w1 .kicker{color:var(--w1)}
.unit.w2{border-left-color:var(--w2)} .unit.w2 .kicker{color:var(--w2)}
.unit.w3{border-left-color:var(--w3)} .unit.w3 .kicker{color:var(--w3)}
.unit.now{border-color:var(--w3);background:var(--w3-soft)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;
  background:var(--w3);color:#fff;margin-left:7px;vertical-align:1px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  box-shadow:var(--shadow);margin:18px 0 8px;display:flex;gap:16px;align-items:center}
.qrbox{flex:0 0 auto;padding:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;line-height:0}
/* 🔴 寫死尺寸：容器 id 要跟下面 HTML 完全一致，選擇器打錯的話規則從加進去那刻就是死的 */
.qrbox #hub-qr svg{display:block;width:112px;height:112px}
.qrcap{font-size:14px;color:var(--ink-soft);line-height:1.7}
.qrcap b{color:var(--ink)}
.foot{font-size:13px;color:var(--ink-soft);margin-top:24px;border-top:1px solid var(--line);
  padding-top:12px;line-height:1.8}
code{font-family:ui-monospace,Menlo,monospace;font-size:.86em;background:var(--panel2);
  padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>學習單總入口</h1>
  <p class="sub"><b>文化遊戲松實作</b>（通識・綜合實踐領域）／<b>遊戲設計學</b>（夜四技多樂一甲）<br>
    授課 楊智傑 · 多媒體與電腦娛樂科學系</p>

  <div class="box">
    <div class="qrbox"><div id="hub-qr"></div></div>
    <div class="qrcap">
      <b>用手機掃這個 QR</b><br>
      每個單元都會先請你確認 Google 帳號和信封編號，<b>綁一次就好</b>，之後所有單元都認得你。
    </div>
  </div>

  <!-- 單元清單由 js/bind_gate.js 的 UNITS 生成（加一週＝改那個陣列一行，不用動這裡） -->
  <div id="hub-units"></div>

  <p class="foot">
    找不到自己的編號？問老師，或在任何一頁右上角的小圓標點一下重新綁定。<br>
    網址：<code>scatjay.github.io/wenhua-designjam-site</code>
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.5.2/qrcode.min.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyBwPR0oE5VK0eBlqq8JY1B56UXy3R9cyng",
  authDomain:"gen-lang-client-0929530380.firebaseapp.com",
  databaseURL:"https://gen-lang-client-0929530380-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"gen-lang-client-0929530380"
});
/* 🔴 qrcode-generator 的全域是小寫 qrcode，不要包 if(window.QRCode) 守衛 —— 換版後那會永遠是 false，
   QR 靜默不出現（2026-09-22 學習單就是這樣壞了三輪才抓到）。 */
(function(){
  var q = qrcode(0,'M');
  q.addData(location.origin + location.pathname.replace(/[^/]*$/,''));
  q.make();
  document.getElementById('hub-qr').innerHTML = q.createSvgTag(4,6);
})();
window.DJ_BIND_UNIT = 'hub';
</script>
<script src="js/gate_i18n.js?v=202609230713"></script>
<script src="js/bind_gate.js?v=202609230713"></script>
</body>
</html>
