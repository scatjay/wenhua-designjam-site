<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>擲筊問路</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Chiron+Hei+HK:wght@700&display=swap">
<style>
:root{
  /* 外觀 token：塔羅紫黑（正本第五節「爬塔 roguelike」）。樣式只准用這十一個。 */
  --tk-surface:#1a1024; --tk-panel:#2a1b3a; --tk-ink:#efe3ff; --tk-muted:#a794c4;
  --tk-accent:#b388ff; --tk-accent-ink:#1a1024; --tk-line:#4a3562;
  --tk-font-title:"Chiron Hei HK","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --tk-font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --tk-radius:8px;
  --tk-shadow:0 6px 20px color-mix(in srgb, var(--tk-accent) 22%, transparent);
  color-scheme:dark;
}
:root{
  /* 以下全由 token 推出來，不寫死顏色 */
  --chip:color-mix(in srgb, var(--tk-panel) 70%, var(--tk-line));
  --frame:color-mix(in srgb, var(--tk-accent) 45%, transparent);
  --deep:color-mix(in srgb, var(--tk-surface) 60%, var(--tk-panel));
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%, color-mix(in srgb, var(--tk-accent) 14%, var(--tk-surface)) 0%, var(--tk-surface) 60%) fixed;background-color:var(--tk-surface);color:var(--tk-ink);font:16px/1.6 var(--tk-font-body)}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 48px}
h1{font-family:var(--tk-font-title);font-weight:700;font-size:1.6rem;letter-spacing:.14em;margin:6px 0 0;text-align:center}
h1::before,h1::after{content:"✦";color:var(--tk-accent);font-size:.7em;margin:0 .6em;vertical-align:.15em}
.sub{color:var(--tk-muted);font-size:.9rem;margin:0 0 10px;text-align:center}
button{font:inherit;min-height:44px;min-width:44px;padding:8px 12px;border-radius:var(--tk-radius);border:1px solid var(--tk-line);background:var(--tk-panel);color:var(--tk-ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--tk-accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent);font-weight:700}
button.primary{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent);font-weight:700;box-shadow:var(--tk-shadow)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--tk-panel);border:1px solid var(--tk-line);outline:1px solid var(--frame);outline-offset:-5px;border-radius:var(--tk-radius);box-shadow:var(--tk-shadow);padding:14px;margin:12px 0}
.w2{border-left:4px solid var(--tk-accent)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.85rem;margin:2px 4px 2px 0}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--tk-line);border-radius:6px;padding:0 5px;margin-left:6px;color:var(--tk-muted)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;font-family:var(--tk-font-title);font-weight:700}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.hud div{background:var(--tk-panel);border:1px solid var(--tk-line);border-radius:var(--tk-radius);padding:4px 2px;font-size:.85rem;color:var(--tk-muted)}
.hud b{display:block;font-size:1.2rem;color:var(--tk-ink);font-family:var(--tk-font-title)}
.log{max-height:220px;overflow:auto;font-size:.9rem;padding-left:18px;margin:0}
.log li{margin:2px 0}
.msg{min-height:1.4em;color:var(--tk-accent);font-size:.9rem}
textarea,input[type=text]{width:100%;font:inherit;padding:8px;border-radius:var(--tk-radius);border:1px solid var(--tk-line);background:var(--deep);color:var(--tk-ink)}
textarea.json{height:260px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{border:1px solid var(--tk-line);padding:4px 6px;text-align:left}
th{color:var(--tk-accent)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--deep);border:1px solid var(--tk-line);border-radius:var(--tk-radius);padding:8px;font-size:.82rem}
.hide{display:none!important}
.big-end{font-size:1.4rem;margin:0;font-family:var(--tk-font-title);font-weight:700}
.small{font-size:.82rem;color:var(--tk-muted)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-family:var(--tk-font-title)}

.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.goal{grid-column:1/-1;text-align:center;background:var(--chip);border:1px solid var(--tk-accent);border-radius:var(--tk-radius);padding:6px;font-family:var(--tk-font-title);font-weight:700}
.node{border:1px solid var(--tk-line);outline:1px solid var(--frame);outline-offset:-4px;border-radius:var(--tk-radius);padding:8px 8px;font-size:.78rem;background:var(--tk-panel);min-height:64px;line-height:1.3;overflow:hidden;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.node .nm{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.node.can{border-color:var(--tk-accent);box-shadow:var(--tk-shadow)}
.node.here{background:var(--tk-accent);color:var(--tk-accent-ink)}
.node.past{opacity:.55}
.node.fog{color:var(--tk-muted);background:repeating-linear-gradient(135deg,var(--deep) 0 6px,var(--tk-panel) 6px 7px)}
.fl{grid-column:1/-1;font-size:.72rem;color:var(--tk-muted);margin-top:2px;letter-spacing:.2em}
.cand{display:grid;gap:8px}
.cand .card{margin:0}
.jiao{display:inline-flex;gap:4px;vertical-align:middle;margin-right:6px}
.jiao svg{width:30px;height:22px}
.res-sheng{color:var(--tk-accent);font-weight:700} .res-yin{color:var(--tk-muted);text-decoration:line-through} .res-xiao{color:var(--tk-ink)}
.route li{margin:2px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">擲筊問路</h1>
  <p class="sub" id="subtitle"></p>
  <div class="row" role="group" aria-label="版本">
    <button data-act="__m_culture" id="m_culture">文化規則版</button>
    <button data-act="__m_skin" id="m_skin">普通爬塔版</button>
  </div>
  <div class="card w2">
    <b>這一關練的 W2 文化卡：<span id="w2kind"></span></b>
    <div class="small" id="w2hint"></div>
    <div id="w2cards"></div>
  </div>
  <div class="tabs" role="tablist">
    <button data-act="__tab_play" id="tab_play" class="on">玩</button>
    <button data-act="__tab_remix" id="tab_remix">怎麼改做</button>
    <button data-act="__tab_data" id="tab_data">資料檔</button>
  </div>

  <section id="pane_play">
    <p id="intro" class="small"></p>
    <div class="hud" id="hud"><span id="hudTime" style="display:contents"></span><span id="hudRes" style="display:contents"></span></div>
    <p class="small" id="throwNote"></p>
    <div id="lastThrow" class="card hide" aria-live="polite"></div>

    <div id="chooseBox">
      <b>下一個路口，走哪一條？</b>
      <div class="cand" id="cands"></div>
    </div>

    <div id="nodeBox" class="card hide">
      <p id="nodeText"></p>
      <div class="row">
        <button data-act="__node_ask" id="nodeAsk"></button>
        <button data-act="__node_do" id="nodeDo" class="primary"></button>
        <button data-act="__node_skip" id="nodeSkip">不用了，繼續走</button>
      </div>
    </div>

    <div id="endBox" class="card hide">
      <p class="big-end" id="endTitle"></p>
      <p id="endText"></p>
      <p class="small" id="endStyle"></p>
      <b>這一路</b>
      <ol class="route small" id="route"></ol>
      <div class="row" style="margin-top:6px">
        <button data-act="__restart">再走一次（新的路）</button>
        <button data-act="__other" id="otherBtn">換另一版玩</button>
      </div>
      <div id="compare" class="card hide"></div>
    </div>

    <b>地圖（下面是起點，往上走）</b>
    <div class="map" id="map"></div>

    <details class="card">
      <summary>一路上發生了什麼（紀錄）</summary>
      <ol class="log" id="log"></ol>
    </details>
  </section>

  <section id="pane_remix" class="hide"></section>

  <section id="pane_data" class="hide">
    <div class="card">
      <b>試跑 100 局</b>
      <p class="small">用三種機器玩家各玩 100 局，看你改的規則讓誰比較會贏。</p>
      <button data-act="__trial" class="primary">試跑 100 局</button>
      <div id="trialOut"></div>
    </div>
    <div class="card">
      <b>我的資料檔</b>
      <p class="small">整份資料檔在這裡。改完按「載入」就會照你的版本玩；可以整份複製給 Claude／Gemini 請它幫忙改。</p>
      <textarea class="json" id="jsonBox" spellcheck="false" aria-label="資料檔"></textarea>
      <div class="row">
        <button data-act="__load" class="primary">載入</button>
        <button data-act="__reset">還原成原本的</button>
        <button data-act="__save">存成檔案</button>
      </div>
      <div class="msg" id="loadMsg"></div>
    </div>
  </section>
</div>

<script>
/* 擲筊問路 引擎（純邏輯，不碰畫面）。瀏覽器：window.RL；Node：module.exports。
   資料來自 roguelike.json 的一個版本（versions.culture 或 versions.skin）。 */
(function (root) {
  'use strict';

  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function validate(v) {
    var e = [];
    if (!v || typeof v !== 'object') return ['資料檔不是物件'];
    ['meta', 'rules', 'start', 'kinds', 'throw', 'endings'].forEach(function (k) { if (!v[k]) e.push('缺少欄位：' + k); });
    if (e.length) return e;
    if (!(v.meta.floors >= 2)) e.push('meta.floors 至少 2');
    if (!(v.meta.lanes >= 2 && v.meta.lanes <= 4)) e.push('meta.lanes 要在 2 到 4 之間');
    var sum = 0;
    for (var k in v.kinds) { if (typeof v.kinds[k].weight !== 'number') e.push('kinds.' + k + '.weight 要是數字'); sum += v.kinds[k].weight || 0; }
    if (sum <= 0) e.push('kinds 的 weight 加起來要大於 0');
    ['good', 'bad'].forEach(function (q) {
      var t = v.throw[q];
      if (!t) e.push('throw 缺少 ' + q);
      else { var s = (t.sheng || 0) + (t.xiao || 0) + (t.yin || 0); if (Math.abs(s - 1) > 0.001) e.push('throw.' + q + ' 三個機率加起來要等於 1（現在是 ' + s.toFixed(2) + '）'); }
    });
    if (!Array.isArray(v.endings) || !v.endings.length) e.push('endings 至少一個');
    return e;
  }

  function pickW(rand, items) {
    var sum = 0; items.forEach(function (x) { sum += x[1]; });
    var r = rand() * sum;
    for (var i = 0; i < items.length; i++) { r -= items[i][1]; if (r <= 0) return items[i][0]; }
    return items[items.length - 1][0];
  }

  function buildMap(v, rand) {
    var M = v.meta, floors = [], kinds = [];
    for (var k in v.kinds) kinds.push([k, v.kinds[k].weight]);
    for (var f = 0; f < M.floors; f++) {
      var row = [];
      for (var l = 0; l < M.lanes; l++) {
        var kind = f === 0 ? 'alley' : pickW(rand, kinds);
        var K = v.kinds[kind];
        var bad = kind === 'alley' ? rand() < (v.rules.danger_p || 0.45) : !!K.bad;
        var names = K.names || [K.label];
        var slow = kind === 'alley' && !!v.rules.slow_p && rand() < v.rules.slow_p;
        row.push({ f: f, l: l, kind: kind, bad: bad, slow: slow, name: names[Math.floor(rand() * names.length)], asked: [], askedQ: [], visited: false });
      }
      floors.push(row);
    }
    // 保證整張圖至少有 min 個廟與壇（讓玩家一定碰得到）
    (v.rules.ensure || []).forEach(function (en) {
      var have = 0; floors.forEach(function (r) { r.forEach(function (n) { if (n.kind === en.kind) have++; }); });
      var guard = 0;
      while (have < en.min && guard++ < 50) {
        var f = 1 + Math.floor(rand() * (M.floors - 1)), l = Math.floor(rand() * M.lanes), n = floors[f][l];
        if (n.kind === 'alley') { var K = v.kinds[en.kind]; n.kind = en.kind; n.bad = !!K.bad; n.name = (K.names || [K.label])[Math.floor(rand() * (K.names || [1]).length)]; have++; }
      }
    });
    return floors;
  }

  function newGame(v, seed) {
    var rand = rng(seed);
    var g = { v: v, seed: seed, rand: rand, floors: buildMap(v, rand), floor: -1, lane: -1,
      soul: v.start.soul, incense: v.start.incense, fright: 0, night: 0, yinStreak: 0,
      phase: 'choose', here: null, log: [], route: [], result: null, lastThrow: null };
    g.log.push({ text: v.meta.intro, tag: v.meta.intro_tag || '' });
    return g;
  }

  function candidates(g) {
    var M = g.v.meta, f = g.floor + 1;
    if (f >= M.floors) return [];
    var out = [];
    for (var l = 0; l < M.lanes; l++) if (g.floor < 0 || Math.abs(l - g.lane) <= 1) out.push(g.floors[f][l]);
    return out;
  }

  function throwFor(g, node, q) {
    var v = g.v, R = v.rules, flag = q === 'pass' ? node.slow : node.bad;
    var p = R.informed ? (flag ? v.throw.bad : v.throw.good) : v.throw.good;
    var x = g.rand();
    if (!R.three_state) return x < (v.throw.coin || 0.5) ? 'sheng' : 'yin';
    return x < p.sheng ? 'sheng' : (x < p.sheng + p.xiao ? 'xiao' : 'yin');
  }

  // 某個問法的最新結果（同一個問法問到聖筊或陰筊就定了；笑筊還可以再問）
  function lastQ(n, q) {
    for (var i = n.asked.length - 1; i >= 0; i--) if ((n.askedQ[i] || 'safe') === q) return n.asked[i];
    return '';
  }
  // 這一條路現在可以問哪幾種問法：第一次只問「平安嗎」；擲過之後兩種問法都可以選（已經定了的不能再問）
  function questions(g, node) {
    var R = g.v.rules, T = g.v.throw;
    if (node.asked.length >= (R.max_asks_per_node || 3)) return [];
    if (!R.three_state) return node.asked.length ? [] : ['safe'];
    var qs = node.asked.length ? ['safe', 'pass'] : ['safe'];
    if (!R.slow_p) qs = ['safe'];
    return qs.filter(function (q) { var l = lastQ(node, q); return l !== 'sheng' && !(l === 'yin' && R.yin_settles); });
  }

  // 擲筊問一條路。回傳 {ok, res, text}
  function ask(g, lane, q) {
    q = q || 'safe';
    var v = g.v, R = v.rules, T = v.throw;
    if (g.phase !== 'choose') return { ok: false, text: '現在不能擲' };
    var node = candidates(g).filter(function (n) { return n.l === lane; })[0];
    if (!node) return { ok: false, text: '這條走不到' };
    var max = R.max_asks_per_node || 3;
    if (node.asked.length >= max) return { ok: false, text: T.too_many || '同一條路已經問很多次了' };
    if (R.three_state) {
      var lq = lastQ(node, q);
      if (lq === 'yin' && R.yin_settles) return { ok: false, text: T.yin_settled || '已經不認可了，再問也是一樣' };
      if (lq === 'sheng') return { ok: false, text: T.sheng_settled || '已經同意了' };
    } else if (node.asked.length) return { ok: false, text: T.too_many || '每格只能擲一次' };
    var res = throwFor(g, node, q);
    node.asked.push(res); node.askedQ.push(q);
    g.night += (R.night_per_throw || 0);
    var text = (T.labels[res] || res);
    if (res === 'yin') g.yinStreak++; else g.yinStreak = 0;
    g.lastThrow = { lane: lane, res: res, q: q };
    var line = '問「' + node.name + '」' + (R.slow_p ? '（' + (q === 'pass' ? '走得過去嗎' : '平安嗎') + '）' : '') + '：' + text;
    if (R.streak_fright && g.yinStreak >= R.streak_fright) {
      g.fright += 1; g.soul -= 1; g.yinStreak = 0;
      line += '。' + (T.streak_text || '連續陰筊，阿弟仔更不安了') + '（驚 +1、魂 −1）';
    }
    g.log.push({ text: line, tag: T.tag || '' });
    checkLose(g);
    return { ok: true, res: res, text: text };
  }

  function go(g, lane) {
    if (g.phase !== 'choose') return '現在不能走';
    var node = candidates(g).filter(function (n) { return n.l === lane; })[0];
    if (!node) return '這條走不到';
    var v = g.v, R = v.rules, K = v.kinds[node.kind];
    g.floor = node.f; g.lane = node.l; node.visited = true; g.here = node;
    g.night += (R.night_per_step || 1);
    var last = node.asked[node.asked.length - 1] || '';
    var rec = { name: node.name, kind: node.kind, asked: node.asked.slice(), askedQ: node.askedQ.slice(), what: '' };
    g.route.push(rec);
    if (node.slow && R.three_state) {
      g.night += (R.slow_night || 2);
      if (R.slow_hurt) g.soul -= R.slow_hurt;
      g.log.push({ text: node.name + '：路不好走，繞了一圈（夜 +' + (R.slow_night || 2) + (R.slow_hurt ? '、魂 −' + R.slow_hurt : '') + '）', tag: '遊戲設計' });
    }
    g.yinStreak = 0;
    if (node.kind === 'alley') {
      if (R.coin_bonus && last) {
        // 普通版：成功＝獎勵加倍，失敗＝扣血
        if (last === 'sheng') { g.incense += 2; rec.what = '成功：獎勵加倍'; g.log.push({ text: node.name + '：成功，撿到 2 支香', tag: '遊戲設計' }); }
        else { g.soul -= 1; rec.what = '失敗：扣 1 血'; g.log.push({ text: node.name + '：失敗，扣 1 血', tag: '遊戲設計' }); }
      } else if (node.bad) {
        var d = v.events.bad[Math.floor(g.rand() * v.events.bad.length)];
        var hurt = (R.fright_on_bad ? (R.bad_hurt || 0) : 1) + (g.night >= (R.late_night || 99) ? 1 : 0);
        if (R.fright_on_bad) g.fright += 1;
        g.soul -= hurt;
        rec.what = d.short || '出事了';
        g.log.push({ text: node.name + '：' + d.text + '（' + (R.fright_on_bad ? '驚 +1' : '') + (hurt ? (R.fright_on_bad ? '、' : '') + '魂 −' + hurt : '') + '）' + (g.night >= (R.late_night || 99) ? (v.meta.late_text || '') : ''), tag: d.tag || '' });
      } else {
        var s = v.events.good[Math.floor(g.rand() * v.events.good.length)];
        g.incense += s.incense || 0; g.soul = Math.min(v.start.soul_max, g.soul + (s.soul || 0));
        rec.what = s.short || '平安';
        g.log.push({ text: node.name + '：' + s.text, tag: s.tag || '' });
      }
      if (node.slow && R.three_state) rec.what += '（路不好走）';
      afterStep(g);
    } else {
      g.phase = 'node';
      g.log.push({ text: node.name + '：' + K.arrive, tag: K.tag || '' });
    }
    return '';
  }

  // 在廟或壇裡：做那件事（收驚／補血）或離開
  function nodeAct(g, doIt) {
    if (g.phase !== 'node') return '';
    var v = g.v, node = g.here, K = v.kinds[node.kind], rec = g.route[g.route.length - 1];
    if (doIt) {
      if (g.incense < K.cost) return v.meta.no_incense || '香不夠';
      g.incense -= K.cost;
      if (K.fright_to != null) g.fright = K.fright_to;
      if (K.fright_add) g.fright += K.fright_add;
      if (K.soul) g.soul = Math.min(v.start.soul_max, g.soul + K.soul);
      g.log.push({ text: K.done_text, tag: K.tag || '' });
      rec.what = K.short_done || K.act;
    } else {
      rec.what = K.short_skip || '沒進去';
    }
    afterStep(g);
    return '';
  }

  // 在廟或壇門口先擲筊問：這裡可以收驚嗎？

      $('nodeText').innerHTML = esc(K.icon + ' ' + n.name) + '：' + esc(K.arrive) + tag(K.tag) + (n.nodeAsked && n.nodeAsked.length ? '<br>' + n.nodeAsked.map(function (r) { return jiao(r) + esc(resWord(r)); }).join('　') : '');
      var la = n.nodeAsked && n.nodeAsked[n.nodeAsked.length - 1];
      $('nodeAsk').classList.toggle('hide', !R.three_state);
      $('nodeAsk').textContent = '擲筊問：' + K.ask_q;
      $('nodeAsk').disabled = la === 'sheng' || la === 'yin' || (n.nodeAsked || []).length >= 3;
      $('nodeDo').textContent = K.act;
      $('nodeDo').disabled = g.incense < K.cost;
    }
  };

  /* ---------- 模組 6：事件選擇（下一個路口，走哪一條） ---------- */
  MOD['事件選擇'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g, a) { return RL.go(g, a.lane); },
    render: function (g) {
      var v = this.v, R = v.rules;
      $('chooseBox').classList.toggle('hide', g.phase !== 'choose');
      if (g.phase !== 'choose') return;
      $('cands').innerHTML = RL.candidates(g).map(function (n) {
        var K = v.kinds[n.kind], last = n.asked[n.asked.length - 1];
        var QL = { safe: '平安嗎？', pass: '走得過去嗎？' };
        var qs = RL.questions(g, n), btns = '';
        if (!R.three_state) btns = '<button data-act="__ask" data-l="' + n.l + '" data-q="safe"' + (qs.length ? '' : ' disabled') + '>擲一次（成功／失敗）</button>';
        else if (!qs.length) btns = '<button data-act="__ask" data-l="' + n.l + '" data-q="safe" disabled>不用再問了</button>';
        else btns = qs.map(function (q) { return '<button data-act="__ask" data-l="' + n.l + '" data-q="' + q + '">擲筊問：' + (q === 'safe' && !n.asked.length ? '這條路' : '') + QL[q] + '</button>'; }).join('');
        var hist = n.asked.length ? '<div class="small">' + n.asked.map(function (r, i) { return (R.slow_p ? (n.askedQ[i] === 'pass' ? '走得過去嗎：' : '平安嗎：') : '') + jiao(r) + '<span class="res-' + r + '">' + esc(resWord(r)) + '</span>'; }).join('　') + '</div>' : '';
        var hint = last === 'xiao' ? '<div class="small">笑筊：神明還沒表態。把問題問清楚——想問哪一個？</div>' : (last === 'yin' && R.three_state ? '<div class="small">' + esc(v.throw.yin_settled) + '</div>' : '');
        return '<div class="card"><b>' + esc(K.icon + ' ' + n.name) + '</b>' + tag(K.tag) + hist + hint +
          '<div class="row" style="margin-top:6px">' + btns +
          '<button data-act="__go" data-l="' + n.l + '" class="primary">走這條</button></div></div>';
      }).join('');
    }
  };

  /* ---------- 模組 7：勝負（平安到家，或魂散在路上） ---------- */
  MOD['勝負'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g) { return g.phase === 'ended' ? g.result : null; },   // 只讀
    render: function (g) {
      var r = this.step(g), v = this.v;
      $('endBox').classList.toggle('hide', !r);
      if (!r) return;
      S.played[S.mode] = { title: r.title, win: r.win, soul: r.soul, fright: r.fright, steps: g.route.length, style: r.style ? r.style.name : '' };
      $('endTitle').innerHTML = (r.win ? '🌕 ' : '🌑 ') + esc(r.title) + tag(r.tag);
      $('endText').textContent = r.text;
      $('endStyle').textContent = r.style ? '這一路的你：' + r.style.name + '（' + r.style.text + '，共擲了 ' + r.style.asks + ' 次。沒有好壞，只是你這一路的樣子）' : '';
      $('route').innerHTML = g.route.map(function (x) {
        return '<li>' + esc(v.kinds[x.kind].icon + ' ' + x.name) + (x.asked.length ? '　' + x.asked.map(function (a, i) { return (v.rules.slow_p && x.askedQ ? (x.askedQ[i] === 'pass' ? '過得去' : '平安') + ':' : '') + resWord(a); }).join('→') : '　（沒問）') + '　→ ' + esc(x.what) + '</li>';
      }).join('');
      $('otherBtn').textContent = S.mode === 'culture' ? '換普通爬塔版玩' : '換文化規則版玩';
      var A = S.played.culture, B = S.played.skin, cmp = $('compare');
      if (A && B) {
        cmp.classList.remove('hide');
        cmp.innerHTML = '<b>比一比兩個版本</b><table><tr><th></th><th>文化規則版</th><th>普通爬塔版</th></tr>' +
          '<tr><td>結局</td><td>' + esc(A.title) + '</td><td>' + esc(B.title) + '</td></tr>' +
          '<tr><td>這一路的你</td><td>' + esc(A.style || '－') + '</td><td>' + esc(B.style || '－') + '</td></tr></table>' +
          '<p class="small">兩邊的結局不一樣的話，回頭找找：文化規則版裡哪些事是普通版沒有的？（笑筊要把問題問清楚、換個問法、陰筊照樣能走但比較會出事、收驚婆和壇不一樣、驚會一路跟著你）</p>';
      } else cmp.classList.add('hide');
      if (!playedMarked) {
        playedMarked = true;
        try { if (window.CT_HOOK) CT_HOOK.markPlayed(S.mode === 'culture' ? 'rule' : 'skin'); } catch (e) { /* 助教出錯不能影響樣板 */ }
      }
    }
  };

  /* ---------- 模組 8：回饋（一路上發生了什麼） ---------- */
  MOD['回饋'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g) { return g.log.slice().reverse(); },   // 只讀：新的在最上面
    render: function (g) {
      $('log').innerHTML = this.step(g).map(function (l) { return '<li>' + esc(l.text) + tag(l.tag) + '</li>'; }).join('');
    }
  };

  function initModules() { MOD_NAMES.forEach(function (n) { MOD[n].init(V(), $('pane_play')); }); }

  function render() {
    var g = S.g;
    header();
    ['時間回合', '資源計分', '空間', '核心動作', '角色', '事件選擇', '勝負', '回饋'].forEach(function (n) { MOD[n].render(g); });
    $('hud').style.gridTemplateColumns = 'repeat(' + $('hud').querySelectorAll('div').length + ',1fr)';
  }

  function renderRemix() {
    var R = S.data.remix, F = S.data.field || {};
    var h = '<div class="card"><p>' + esc(R.intro) + '</p></div>';
    R.steps.forEach(function (st) {
      h += '<div class="card"><b>' + esc(st.title) + '</b><p class="small">' + esc(st.goal) + '</p><p>' + esc(st.task) + '</p>' +
        (st.field ? '<p>🔎 ' + esc(st.field) + '</p>' : '') + '<p class="small">可以貼給 Claude／Gemini 的指令：</p><pre>' + esc(st.prompt) + '</pre>' +
        '<button data-act="__copy" data-text="' + esc(st.prompt) + '">複製指令</button></div>';
    });
    h += '<div class="card"><b>' + esc(R.field_title) + '</b><p class="small">' + esc(R.field_note) + '</p>';
    R.field_items.forEach(function (f) { h += '<label class="small" for="f_' + f.key + '">' + esc(f.label) + '</label><input type="text" id="f_' + f.key + '" data-field="' + f.key + '" value="' + esc(F[f.key] || '') + '">'; });
    h += '<p class="small">填的內容會跟著資料檔一起存（「資料檔」分頁按「存成檔案」）。</p></div>';
    h += '<div class="card"><b>' + esc(R.extend_title) + '</b><p>' + esc(R.extend_text) + '</p><pre>' + esc(R.extend_json) + '</pre></div>';
    h += '<div class="card"><b>這一單元多學的一個工具串接</b><p>' + esc(R.tool_chain) + '</p></div>';
    $('pane_remix').innerHTML = h;
  }

  function showTab(t) {
    ['play', 'remix', 'data'].forEach(function (x) { $('pane_' + x).classList.toggle('hide', x !== t); $('tab_' + x).className = x === t ? 'on' : ''; });
    if (t === 'remix') renderRemix();
    if (t === 'data') $('jsonBox').value = JSON.stringify(S.data, null, 1);
  }

  function trialOut() {
    var bots = [['random', '亂點'], ['generic', '一般爬塔玩法（不擲筊，看到能補的就進去）'], ['wise', '懂這些規矩']];
    var h = '<table><tr><th>玩家</th><th>文化規則版</th><th>普通爬塔版</th></tr>';
    bots.forEach(function (b) {
      var a = RL.trial(S.data.versions.culture, 100, b[0], 1), c = RL.trial(S.data.versions.skin, 100, b[0], 1);
      h += '<tr><td>' + b[1] + '</td><td>' + a.wins + '%</td><td>' + c.wins + '%</td></tr>';
    });
    $('trialOut').innerHTML = h + '</table><p class="small">勝率是機器算的；好不好玩，要你自己玩一局才知道。</p>';
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('button'); if (!el) return;
    var g = S.g, act = el.dataset.act;
    switch (act) {
      case '__m_culture': S.mode = 'culture'; newGame(); break;
      case '__m_skin': S.mode = 'skin'; newGame(); break;
      case '__tab_play': showTab('play'); break;
      case '__tab_remix': showTab('remix'); break;
      case '__tab_data': showTab('data'); break;
      case '__ask': MOD['核心動作'].step(g, { type: 'ask', lane: +el.dataset.l, q: el.dataset.q || 'safe' }); render(); break;
      case '__go': MOD['事件選擇'].step(g, { lane: +el.dataset.l }); render(); window.scrollTo(0, $('hud').offsetTop - 10); break;
      case '__node_ask': MOD['核心動作'].step(g, { type: 'nodeAsk' }); render(); break;
      case '__node_do': MOD['角色'].step(g, { doIt: true }); render(); break;
      case '__node_skip': MOD['角色'].step(g, { doIt: false }); render(); break;
      case '__restart': S.seed++; newGame(); window.scrollTo(0, 0); break;
      case '__other': S.mode = S.mode === 'culture' ? 'skin' : 'culture'; newGame(); window.scrollTo(0, 0); break;
      case '__trial': trialOut(); break;
      case '__load':
        try {
          var d = JSON.parse($('jsonBox').value), errs = [];
          ['culture', 'skin'].forEach(function (k) { if (!d.versions || !d.versions[k]) errs.push('缺少 versions.' + k); else RL.validate(d.versions[k]).forEach(function (e) { errs.push(k + '：' + e); }); });
          if (errs.length) { $('loadMsg').textContent = '沒有載入，請修正：' + errs.join('；'); break; }
          if (!d.remix) d.remix = DEFAULT_DATA.remix;
          S.data = d; $('loadMsg').textContent = '載入了。回「玩」分頁就是你的版本。'; newGame();
        } catch (e) { $('loadMsg').textContent = '資料檔格式錯了（' + e.message + '），常見原因：少了逗號或引號。'; }
        break;
      case '__reset': S.data = JSON.parse(JSON.stringify(DEFAULT_DATA)); $('jsonBox').value = JSON.stringify(S.data, null, 1); $('loadMsg').textContent = '還原了。'; newGame(); break;
      case '__save':
        var blob = new Blob([JSON.stringify(S.data, null, 1)], { type: 'application/json' });
        var a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'roguelike.json'; a2.click();
        setTimeout(function () { URL.revokeObjectURL(a2.href); }, 1000); break;
      case '__copy':
        if (navigator.clipboard) navigator.clipboard.writeText(el.dataset.text).then(function () { el.textContent = '已複製'; }, function () { el.textContent = '請手動選取複製'; });
        break;
    }
  });
  document.addEventListener('input', function (ev) {
    var k = ev.target.dataset && ev.target.dataset.field;
    if (k) { S.data.field = S.data.field || {}; S.data.field[k] = ev.target.value; store('field', S.data.field); }
  });
  newGame();
})();
</script>
