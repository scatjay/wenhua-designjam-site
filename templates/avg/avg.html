@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]) body.skin{ --bg:#1a1d22; --paper:#23272d; --ink:#e6e9ed; --ink2:#a4adb7; --accent:#6aa3da; --accent2:#6aa3da; --line:#6d7782; --btn:#2c3138; }
}
:root[data-theme=dark] body.skin{ --bg:#1a1d22; --paper:#23272d; --ink:#e6e9ed; --ink2:#a4adb7; --accent:#6aa3da; --accent2:#6aa3da; --line:#6d7782; --btn:#2c3138; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU","Microsoft JhengHei","PingFang TC",serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
body.skin{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
.banner{font-size:11.5px;line-height:1.45;color:var(--ink2);padding:8px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
.banner b{color:var(--ink)}
.wrap{max-width:430px;margin:0 auto;padding:0 16px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 4px}
h1{font-size:20px;margin:0;letter-spacing:.12em}
h1 small{font-size:11px;letter-spacing:0;color:var(--ink2);font-weight:400;display:block}
button,summary,.btn{font:inherit;color:var(--ink)}
button{cursor:pointer}
#mute{min-width:48px;min-height:48px;border:1.5px solid var(--line);background:var(--btn);border-radius:24px;padding:0 12px;font-size:12px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 6px}
.seg button{flex:1;min-height:48px;border:0;background:var(--btn);font-size:14px;padding:4px 6px}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:700}
.hint{font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.status{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:8px;min-height:48px;font-size:13px}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:2px 10px;border-radius:15px;border:1px solid var(--line);background:var(--btn)}
.chip.low{border-color:var(--bad);color:var(--bad);font-weight:700}
.gauge{display:inline-flex;gap:3px;margin:0 6px}
.gauge i{width:13px;height:11px;border:1.5px solid var(--line);border-radius:3px 3px 6px 6px;background:transparent}
.gauge i.on{background:var(--accent2);border-color:var(--accent2)}
.sbtn{min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--btn);border-radius:10px;font-size:13px}
.sbtn:disabled{opacity:.45;cursor:default}
.hintbox{background:var(--paper);border:1.5px dashed var(--accent2);border-radius:10px;padding:8px 10px;margin:0 0 8px;font-size:13.5px}
#card{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 0 var(--shadow)}
#head{padding:10px 12px 8px;color:#fff;transition:background .3s}
#head h2{margin:0 0 6px;font-size:15px;letter-spacing:.08em;text-shadow:0 1px 2px rgba(0,0,0,.45)}
#cast{display:flex;gap:6px;flex-wrap:wrap}
.cm{display:flex;flex-direction:column;align-items:center;width:62px;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.av{border-radius:50%;background:rgba(255,255,255,.88);border:2px solid rgba(255,255,255,.9);display:block}
#log{padding:10px 12px 4px}
.ln{display:flex;gap:8px;margin:0 0 10px;align-items:flex-start;animation:fi .25s ease-out}
.ln .who{font-size:12px;color:var(--ink2);margin-bottom:1px}
.ln .bubble{background:var(--btn);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:6px 10px}
.ln.narr .bubble{background:transparent;border:0;border-left:3px solid var(--line);border-radius:0;padding:0 0 0 10px;color:var(--ink)}
.ln.narr{font-style:normal}
.ln.me .bubble{border-color:var(--accent);background:var(--btn)}
.pick{margin:0 0 10px;padding:6px 10px;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;animation:fi .25s ease-out}
.pick.bad{background:var(--bad)}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#fw{padding:0 12px}
.fwcard{border:1.5px dashed var(--accent2);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:13.5px;background:var(--btn)}
.fwcard b{color:var(--accent2)}
.fwcard input{width:100%;min-height:44px;margin-top:6px;padding:6px 8px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.fwcard code{display:block;margin-top:6px;font-size:12px;white-space:pre-wrap}
#actions{padding:4px 12px 14px;display:flex;flex-direction:column;gap:8px}
.go{min-height:50px;width:100%;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.choice{min-height:50px;width:100%;text-align:left;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--btn);font-size:15px}
.choice:disabled{opacity:.62;cursor:default;background:transparent;border-style:dashed}
.why{font-size:12.5px;color:var(--bad);margin:-4px 4px 2px}
.lockic::before{content:"🔒 "}
details{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 10px}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-size:14px}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:8px}
details p,details li{font-size:13.5px}
.k{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;color:#fff;margin-right:4px;line-height:19px}
.k-原著{background:var(--k-orig)} .k-改編{background:var(--k-adapt)} .k-工坊創作{background:var(--k-ws)}
.srcl{list-style:none;padding:0;margin:0 0 8px}
.srcl li{margin:0 0 6px}
.chars{display:grid;grid-template-columns:1fr;gap:10px;padding:0;margin:0;list-style:none}
.chars li{display:flex;gap:10px}
#endpanel{margin:12px 0;padding:12px;border:2px solid var(--accent);border-radius:14px;background:var(--paper)}
#endpanel h3{margin:0 0 4px;font-size:18px;letter-spacing:.08em}
#endpanel .tag{display:inline-block;margin-bottom:8px;padding:0 10px;border-radius:12px;background:var(--accent);color:#fff;font-size:12px;line-height:22px}
#endpanel h4{margin:12px 0 4px;font-size:14px}
#endpanel ul{margin:0;padding-left:20px}
#endpanel li{font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button,.row .btn{flex:1 1 140px;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--btn);font-size:14px;padding:4px 8px}
.row .primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.opt button{flex:1 1 45%;min-height:46px}
.opt button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
textarea{width:100%;min-height:84px;padding:8px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--btn);color:var(--ink)}
.btn.file{display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center}
.lintok{color:var(--good)} .linterr{color:var(--bad)} .lintwarn{color:var(--accent2)}
.foot{font-size:11.5px;color:var(--ink2);margin:14px 0 0}
</style>
</head>

<div class="banner" id="banner"></div>
<div class="wrap">
  <div class="top">
    <h1 id="gtitle"></h1>
    <button id="mute" aria-pressed="true" aria-label="開關聲音">🔇 靜音</button>
  </div>
  <div class="seg" role="group" aria-label="選擇版本">
    <button id="m-skin" aria-pressed="false">文化只是皮</button>
    <button id="m-cult" aria-pressed="true">文化長在規則裡</button>
  </div>
  <p class="hint" id="modehint"></p>
  <div class="status" id="status"></div>
  <div class="hintbox" id="hintbox" hidden></div>

  <div id="card">
    <div id="head"><h2 id="stitle"></h2><div id="cast"></div></div>
    <div id="log" aria-live="polite"></div>
    <div id="fw"></div>
    <div id="actions"></div>
  </div>

  <details id="srcd"><summary>這一幕哪些是原著、哪些是我們加的？</summary><ul class="srcl" id="srcl"></ul></details>

  <div id="endpanel" hidden></div>

  <details id="rulesd"><summary>這個樣板用了哪些文化卡？</summary><ul id="cardsl"></ul><p id="cardsnote" class="hint"></p></details>
  <details id="charsd"><summary>人物介紹</summary><ul class="chars" id="charsl"></ul></details>
  <details id="toolsd"><summary>改作工具：載入我的 JSON、檢查故事</summary>
    <p class="hint">改好 <b>avg.json</b> 以後，按下面的按鈕選那個檔，就能直接玩你改過的版本。</p>
    <div class="row">
      <label class="btn file">載入我的 JSON<input id="fileIn" type="file" accept=".json,application/json" hidden></label>
      <button id="resetStory">還原預設故事</button>
    </div>
    <div id="lintout" class="hint" style="margin-top:10px"></div>
  </details>
  <p class="foot" id="foot"></p>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var KW={'true':1,'false':1,'null':1,'undefined':1,'Math':1};
var DEFAULT_TEXT=document.getElementById('story-data').textContent;
var S=null, mode='culture', st=null;
var ui={phase:'',items:[],shown:0,undo:[],hintShown:false,warn:[]};

function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function R(m){var r=(S.rules||{})[m||mode]||{};return r;}

/* ---------- 條件式 ---------- */
var cache={};
function ctxOf(s){
  return new Proxy({},{
    has:function(t,k){return typeof k==='string' && !(k in globalThis);},
    get:function(t,k){
      if(typeof k!=='string') return undefined;
      if(k==='face') return s.meters.face;
      if(k==='favor') return s.meters.favor;
      if(k==='mode') return s.mode;
      return s.flags[k]===undefined?false:s.flags[k];
    }
  });
}
function ev(expr,s){
  if(expr===undefined||expr===null||expr==='') return true;
  var f=cache[expr];
  if(!f){
    try{ f=new Function('c','with(c){return !!('+expr+')}'); }
    catch(e){ f=function(){return false;}; ui.warn.push('條件寫錯了：'+expr); }
    cache[expr]=f;
  }
  try{ return f(ctxOf(s)); }catch(e){ ui.warn.push('條件算不出來：'+expr); return false; }
}

/* ---------- 核心：狀態與規則（不碰畫面） ---------- */
function newState(m){
  var r=R(m);
  var s={mode:m,scene:null,flags:clone(S.flags_init||{}),meters:{face:(r.face&&r.face.on)?r.face.start:3,favor:0},
         hint:r.hint_uses||0,visited:{},locked:{},chosen:[]};
  enter(s,S.meta.start);
  return s;
}
function applyFx(s,o){
  var r=R(s.mode),k;
  if(o.set) for(k in o.set) s.flags[k]=o.set[k];
  if(s.mode==='culture'){
    if(o.cset) for(k in o.cset) s.flags[k]=o.cset[k];
    if(o.add) for(k in o.add){
      if(r[k]&&r[k].on){
        var mx=(k==='face')?(r.face.max||5):(r.favor.cap||5);
        s.meters[k]=Math.max(0,Math.min(mx,s.meters[k]+o.add[k]));
      }
    }
  }
}
function enter(s,id){
  var r=R(s.mode);
  if(s.scene!==null && r.favor && r.favor.on && s.meters.favor>0){
    s.meters.favor=Math.min(r.favor.cap||5,s.meters.favor+(r.favor.grow_per_scene||0));
  }
  s.scene=id; s.visited[id]=1;
  var sc=S.scenes[id]; if(!sc) return;
  (sc.enter||[]).forEach(function(e){ if(ev(e.if,s)) applyFx(s,e); });
}
function linesOf(s){ var sc=S.scenes[s.scene]; return ((sc&&sc.lines)||[]).filter(function(l){return ev(l.if,s);}); }
function choicesOf(s){
  var sc=S.scenes[s.scene]||{}, r=R(s.mode), out=[];
  (sc.choices||[]).forEach(function(c,i){
    if(c.if && !ev(c.if,s)) return;
    var lock=null;
    if(s.mode==='culture'){
      if(c.requires && !ev(c.requires,s)) lock=c.lock||'現在還不行。';
      var g=r.rank_gate;
      if(!lock && g && g.on && c.address && S.characters[c.address] && S.characters.you){
        var gap=S.characters[c.address].rank-S.characters.you.rank;
        var bypass=(c.address===g.bypass_who && s.meters.favor>=g.bypass_favor);
        if(gap>g.max_gap && !bypass) lock=String(g.lock_text||'資歷差太多。').replace('{who}',S.characters[c.address].name);
      }
    }
    out.push({i:i,c:c,lock:lock});
  });
  return out;
}
function pick(s,i){
  var sc=S.scenes[s.scene], c=sc.choices[i];
  var o=(s.mode==='skin'&&c.skin)?Object.assign({},c,c.skin):c;
  applyFx(s,o);
  s.chosen.push(s.scene+':'+c.id);
  return {res:o.result||[],go:o.goto,taboo:!!(c.taboo&&s.mode==='culture'),tone:c.tone};
}
function nextOf(s){ var sc=S.scenes[s.scene]||{},n=sc.next||[],j; for(j=0;j<n.length;j++){ if(ev(n[j].if,s)) return n[j].goto; } return null; }
function faceLabel(s){ var r=R(s.mode); return (r.face&&r.face.labels&&r.face.labels[s.meters.face])||''; }

/* ---------- 檢查故事（給改作的人用） ---------- */
function lint(story){
  var errs=[],warns=[],sc=story.scenes||{},ids=Object.keys(sc),chars=story.characters||{};
  var known={face:1,favor:1,mode:1};
  Object.keys(story.flags_init||{}).forEach(function(k){known[k]=1;});
  function words(e){return String(e||'').match(/[A-Za-z_][A-Za-z0-9_]*/g)||[];}
  function chkExpr(e,w){ words(e).forEach(function(x){ if(!KW[x]&&!known[x]) warns.push(w+' 的條件用到沒登記的旗標「'+x+'」（會被當成 false）'); }); }
  function chkSet(o,w){ if(!o) return; Object.keys(o).forEach(function(k){ if(!known[k]) warns.push(w+' 設定了沒登記的旗標「'+k+'」（請加進 flags_init）'); }); }
  if(!story.meta||!story.meta.start||!sc[story.meta.start]) errs.push('meta.start 指到的場景不存在');
  var ends=0;
  ids.forEach(function(id){
    var s=sc[id],w='場景「'+id+'」';
    if(s.end) ends++;
    (s.cast||[]).forEach(function(c){ if(!chars[c]) errs.push(w+' 的 cast 有不存在的人物「'+c+'」'); });
    (s.lines||[]).forEach(function(l,i){
      if(l.who!=='narr'&&!chars[l.who]) errs.push(w+' 第 '+(i+1)+' 句的 who「'+l.who+'」不是人物也不是 narr');
      chkExpr(l.if,w+' 第 '+(i+1)+' 句');
    });
    (s.choices||[]).forEach(function(c){
      var cw=w+' 的選項「'+(c.id||c.text)+'」';
      if(!c.goto||!sc[c.goto]) errs.push(cw+' 的 goto 指到不存在的場景「'+c.goto+'」');
      if(c.address&&!chars[c.address]) errs.push(cw+' 的 address 不是人物「'+c.address+'」');
      chkExpr(c.if,cw); chkExpr(c.requires,cw); chkSet(c.set,cw); chkSet(c.cset,cw);
      if(c.skin) chkSet(c.skin.set,cw);
      Object.keys(c.add||{}).forEach(function(k){ if(k!=='face'&&k!=='favor') warns.push(cw+' 的 add 只認 face 與 favor，「'+k+'」不會有作用'); });
    });
    (s.next||[]).forEach(function(n){ if(!sc[n.goto]) errs.push(w+' 的 next 指到不存在的場景「'+n.goto+'」'); chkExpr(n.if,w+' 的 next'); });
    (s.enter||[]).forEach(function(e){ chkExpr(e.if,w+' 的 enter'); chkSet(e.set,w+' 的 enter'); });
    if(!s.end&&!(s.next&&s.next.length)&&!(s.choices&&s.choices.length)) errs.push(w+' 是死路：沒有選項、沒有 next、也不是結局');
  });
  var seen={},q=[story.meta&&story.meta.start];
  while(q.length){ var x=q.pop(); if(!x||seen[x]||!sc[x]) continue; seen[x]=1;
    (sc[x].choices||[]).forEach(function(c){q.push(c.goto);}); (sc[x].next||[]).forEach(function(n){q.push(n.goto);}); }
  ids.forEach(function(id){ if(!seen[id]) warns.push('場景「'+id+'」沒有任何選項或 next 連得到它'); });
  if(!ends) errs.push('沒有任何結局場景（scene 裡要有 end 欄位）');
  return {errs:errs,warns:warns,info:{scenes:ids.length,reachable:Object.keys(seen).length,endings:ends}};
}

/* ---------- 把所有玩法走一遍（驗收用） ---------- */
function explore(m){
  var seen={},endings={},dead=0,avail={},lockedOnly={},memo={};
  function key(s){return s.scene+'|'+JSON.stringify(s.flags)+'|'+s.meters.face+','+s.meters.favor;}
  function settle(s){
    var guard=0;
    while(guard++<50){
      var sc=S.scenes[s.scene];
      if(!sc) return 'dead';
      if(sc.end) return 'end';
      if(choicesOf(s).length) return 'choice';
      var n=nextOf(s);
      if(!n) return 'dead';
      enter(s,n);
    }
    return 'dead';
  }
  function walk(s){
    var k=key(s); if(memo[k]) return memo[k];
    var kind=settle(s); k=key(s); if(memo[k]) return memo[k];
    var res={};
    if(kind==='end'){ res[s.scene]=1; }
    else if(kind==='dead'){ dead++; res.__dead=1; }
    else{
      choicesOf(s).forEach(function(ch){
        var id=s.scene+':'+ch.c.id;
        if(ch.lock){ if(!avail[id]) lockedOnly[id]=ch.lock; return; }
        avail[id]=1; delete lockedOnly[id];
        var t=clone(s); var p=pick(t,ch.i); enter(t,p.go);
        var sub=walk(t); for(var e in sub) res[e]=(res[e]||0)+sub[e];
      });
    }
    memo[k]=res; seen[k]=1; return res;
  }
  var prev=ui.warn.length;
  var s0=newState(m); var res=walk(s0);
  var allIds=[]; Object.keys(S.scenes).forEach(function(id){ (S.scenes[id].choices||[]).forEach(function(c){ allIds.push(id+':'+c.id); }); });
  return {mode:m,states:Object.keys(seen).length,paths:res,deadEnds:dead,
          neverAvailable:allIds.filter(function(i){return !avail[i];}),
          lockedSomewhere:Object.keys(lockedOnly),warnAdded:ui.warn.length-prev};
}

/* ---------- 聲音（預設靜音，按了才建立 AudioContext） ---------- */
var AC=null,muted=true;
function tone(f,t0,dur,type,vol,f2){
  var o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,AC.currentTime+t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+t0+dur);
  g.gain.setValueAtTime(0.0001,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+dur); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+dur+0.05);
}
function gong(){ var c=AC.currentTime,o=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
  o.frequency.value=150; m.frequency.value=150*3.5; mg.gain.setValueAtTime(220,c); mg.gain.exponentialRampToValueAtTime(5,c+1.4);
  g.gain.setValueAtTime(0.0001,c); g.gain.exponentialRampToValueAtTime(0.2,c+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c+1.5);
  m.connect(mg); mg.connect(o.frequency); o.connect(g); g.connect(AC.destination); o.start(c); m.start(c); o.stop(c+1.6); m.stop(c+1.6); }
function wood(){ var c=AC.currentTime,n=Math.floor(AC.sampleRate*0.06),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(); s.buffer=b; f.type='bandpass'; f.frequency.value=1100; f.Q.value=6; g.gain.value=0.22;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(c); }
function sfx(k){
  if(muted) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var cul=(mode==='culture');
    if(k==='click'){ if(cul) wood(); else tone(660,0,0.08,'sine',0.12); }
    else if(k==='good'){ if(cul){ tone(659,0,0.35,'triangle',0.12); tone(784,0.12,0.5,'triangle',0.12);} else tone(523,0,0.2,'sine',0.12); }
    else if(k==='bad'){ if(cul) tone(140,0,0.5,'sine',0.2,70); else tone(220,0,0.2,'square',0.06); }
    else if(k==='taboo'){ if(cul) gong(); else tone(220,0,0.2,'square',0.06); }
  }catch(e){}
}

/* ---------- 畫面 ---------- */
function avatar(id,mood,size){

  if(c.portrait) return '<img class="av" width="'+size+'" height="'+size+'" src="'+esc(c.portrait)+'" alt="'+esc(c.name)+'">';
  var L=c.look||{},face=L.face||'#e0c39a',cloth=L.cloth||'#667788',hc='#2a2420',g='';
  g+='<path d="M6 64 Q8 44 32 42 Q56 44 58 64Z" fill="'+cloth+'"/>';
  if(L.hair==='loose') g+='<path d="M13 36 Q9 8 32 7 Q55 8 51 36 L48 54 L16 54Z" fill="'+hc+'"/>';
  g+='<ellipse cx="32" cy="30" rx="14.5" ry="16.5" fill="'+face+'"/>';
  if(L.hair==='loose') g+='<path d="M17 27 Q19 12 32 12 Q45 12 47 27 Q40 19 32 19 Q24 19 17 27Z" fill="'+hc+'"/>';
  if(L.hair==='helmet') g+='<path d="M16 27 Q16 8 32 8 Q48 8 48 27 Q40 20 32 20 Q24 20 16 27Z" fill="#7b838c"/><circle cx="32" cy="7" r="2.6" fill="#b4352a"/>';
  if(L.hair==='cap') g+='<path d="M16 26 Q18 10 32 10 Q46 10 48 26Z" fill="#3b3128"/><rect x="14" y="24" width="36" height="4" rx="2" fill="#a97b1e"/>';
  if(L.hair==='topknot') g+='<circle cx="32" cy="8" r="5" fill="'+hc+'"/><path d="M17 27 Q19 12 32 12 Q45 12 47 27 Q40 20 32 20 Q24 20 17 27Z" fill="'+hc+'"/>';
  if(L.beard) g+='<path d="M19 36 Q32 58 45 36 Q41 50 32 52 Q23 50 19 36Z" fill="#26211c"/>';
  var brow='#2a2420',m=mood||'normal',b='',mo='';
  if(m==='angry') b='<path d="M21 22 L29 26 M43 22 L35 26" stroke="'+brow+'" stroke-width="2" stroke-linecap="round"/>';
  else if(m==='sad'||m==='worry') b='<path d="M21 26 L29 23 M43 26 L35 23" stroke="'+brow+'" stroke-width="2" stroke-linecap="round"/>';
  else b='<path d="M22 24 L29 24 M35 24 L42 24" stroke="'+brow+'" stroke-width="2" stroke-linecap="round"/>';
  g+=b+'<circle cx="26" cy="30" r="1.9" fill="#222"/><circle cx="38" cy="30" r="1.9" fill="#222"/>';
  var mc=L.beard?'#f3e3d0':'#7a2f25';
  if(m==='grin') mo='M26 38 Q32 45 38 38';
  else if(m==='angry'||m==='sad') mo='M27 42 Q32 38 37 42';
  else if(m==='worry') mo='M28 41 Q32 39 36 41';
  else mo='M27 40 L37 40';
  g+='<path d="'+mo+'" stroke="'+mc+'" stroke-width="2" fill="none" stroke-linecap="round"/>';
  if(L.tusk) g+='<path d="M27 40 L29 46 L31 40Z M33 40 L35 46 L37 40Z" fill="#fffdf5"/>';
  if(L.extra==='sword') g+='<rect x="52" y="40" width="4" height="24" fill="#c7ccd1"/><rect x="49" y="38" width="10" height="3" fill="#a97b1e"/>';
  if(L.extra==='pen') g+='<path d="M50 62 L57 34" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>';
  if(L.extra==='tea') g+='<path d="M43 55 h11 v4 q0 6 -5.5 6 q-5.5 0 -5.5 -6z" fill="#f2efe6" stroke="#8a8a8a"/>';
  return '<svg class="av" width="'+size+'" height="'+size+'" viewBox="0 0 64 64" role="img" aria-label="'+esc(c.name)+'">'+g+'</svg>';
}
function nameOf(id){ return id==='narr'?'':((S.characters[id]||{}).name||id); }

function renderBanner(){
  var cards=(S.meta.cards||[]).map(function(c){return c.name;}).join('、');
  $('#banner').innerHTML='<b>樣板｜故事導向 AVG</b>　示範內容：小封神《'+esc(S.meta.title)+'》　用到的文化卡：'+esc(cards)+'<span style="display:block">人物是色塊示意圖，不是神像造像。</span>';
  $('#gtitle').innerHTML=esc(S.meta.title)+'<small>'+esc(S.meta.subtitle||'')+'</small>';
  document.title=S.meta.title+'｜故事導向 AVG 樣板';
  $('#foot').textContent=S.meta.disclaimer||'';
  $('#cardsl').innerHTML=(S.meta.cards||[]).map(function(c){return '<li><b>'+esc(c.name)+'</b>：'+esc(c.note)+'</li>';}).join('');
  $('#cardsnote').textContent=(mode==='culture')?'「文化長在規則裡」這一版，這些文化卡都是玩的時候真的會用到的規則。':'「文化只是皮」這一版，這些文化卡只剩名字，規則被拿掉了。';
  $('#charsl').innerHTML=Object.keys(S.characters).map(function(id){var c=S.characters[id];
    return '<li>'+avatar(id,'normal',56)+'<div><b>'+esc(c.name)+'</b> <span class="k k-'+esc(c.src)+'">'+esc(c.src)+'</span><br><span style="font-size:13px">'+esc(c.note)+'</span></div></li>';}).join('');
}
function renderStatus(){
  var r=R(mode),h='';
  if(mode==='culture'){
    var fl=faceLabel(st);
    var gg='';for(var gi=1;gi<=(r.face.max||5);gi++) gg+='<i'+(gi<=st.meters.face?' class="on"':'')+'></i>';
    h+='<span class="chip'+(st.meters.face<=1?' low':'')+'" title="像壺裡的茶，用掉就少一點">上帝爺的面子<span class="gauge" role="img" aria-label="壺裡還剩多少">'+gg+'</span>'+esc(fl)+'</span>';
    var fv=(r.favor&&r.favor.labels&&r.favor.labels[st.meters.favor])||'';
    if(st.meters.favor>0&&fv) h+='<span class="chip">'+esc(fv)+'</span>';
    var sc=S.scenes[st.scene]||{};
    h+='<button class="sbtn" id="askHint"'+((st.hint>0&&sc.hint&&!sc.end)?'':' disabled')+'>問長輩（剩 '+st.hint+' 次）</button>';
  }else{
    h+='<span class="chip">這一版：選什麼都沒有代價</span>';
    h+='<button class="sbtn" id="undoBtn"'+(ui.undo.length?'':' disabled')+'>↶ 回上一步</button>';
  }
  $('#status').innerHTML=h;
  var a=$('#askHint'); if(a) a.onclick=function(){ var sc=S.scenes[st.scene]; if(st.hint>0&&sc.hint){ st.hint--; ui.hintShown=true; $('#hintbox').hidden=false; $('#hintbox').textContent='👵 '+sc.hint; sfx('click'); renderStatus(); } };
  var u=$('#undoBtn'); if(u) u.onclick=function(){ doUndo(); };
}
function renderHead(sc){
  var bg=sc.bg||['#6a6a6a','#3a3a3a'];
  $('#head').style.background='linear-gradient(135deg,'+bg[0]+','+bg[1]+')';
  $('#stitle').textContent=sc.title||'';
  $('#cast').innerHTML=(sc.cast||[]).map(function(id){return '<div class="cm">'+avatar(id,'normal',48)+'<span>'+esc(nameOf(id))+'</span></div>';}).join('');
  $('#srcl').innerHTML=(sc.src||[]).map(function(x){return '<li><span class="k k-'+esc(x.k)+'">'+esc(x.k)+'</span>'+esc(x.t)+'</li>';}).join('')||'<li>這一幕還沒有填出處（scene.src）。</li>';
}
function renderFieldwork(sc){
  var box=$('#fw'); box.innerHTML='';
  (sc.fieldwork||[]).forEach(function(fid){
    var f=(S.fieldwork||[]).filter(function(x){return x.id===fid;})[0]; if(!f) return;
    var d=document.createElement('div'); d.className='fwcard';
    function paint(){
      d.innerHTML='<b>📓 田野筆記（要靠你自己去看、去問）</b><br>'+esc(f.ask)+
        (f.value?'<br><i>你寫的：'+esc(f.value)+'</i><code>"value": '+esc(JSON.stringify(f.value))+'</code>':'')+
        '<input type="text" aria-label="我的田野筆記" placeholder="寫下你親眼看到、親耳聽到的一件事" value="'+esc(f.value||'')+'">'+
        '<div class="row"><button type="button">'+(f.value?'更新筆記':'記進故事')+'</button></div>';
      d.querySelector('button').onclick=function(){ f.value=d.querySelector('input').value.trim(); sfx('click'); paint(); };
    }
    paint(); box.appendChild(d);
  });
}
function addLine(l){
  var d=document.createElement('div'); var isN=(l.who==='narr');
  d.className='ln '+(isN?'narr':(l.who==='you'?'me':'say'));
  if(isN) d.innerHTML='<div class="bubble">'+esc(l.text)+'</div>';
  else d.innerHTML=avatar(l.who,l.mood,40)+'<div><div class="who">'+esc(nameOf(l.who))+'</div><div class="bubble">'+esc(l.text)+'</div></div>';
  $('#log').appendChild(d);
  try{ d.scrollIntoView({block:'nearest'}); }catch(e){}
}
function addPick(text,tone){
  var d=document.createElement('div'); d.className='pick'+(tone==='bad'?' bad':''); d.textContent='你選了：'+text; $('#log').appendChild(d);
}
function setActions(nodes){ var a=$('#actions'); a.innerHTML=''; nodes.forEach(function(n){a.appendChild(n);}); }
function goBtn(text,fn){ var b=document.createElement('button'); b.className='go'; b.textContent=text; b.onclick=function(){sfx('click');fn();}; return b; }

function showScene(instant){
  var sc=S.scenes[st.scene];
  $('#log').innerHTML=''; $('#hintbox').hidden=true; ui.hintShown=false; $('#endpanel').hidden=true;
  if(!sc){
    $('#stitle').textContent='找不到這一幕'; $('#cast').innerHTML='';
    $('#log').innerHTML='<div class="ln narr"><div class="bubble">故事裡沒有叫「'+esc(st.scene)+'」的場景。請檢查 goto 有沒有打錯字。</div></div>';
    setActions([goBtn('回到開頭',function(){restart();})]); renderStatus(); return;
  }
  renderHead(sc); renderFieldwork(sc);
  ui.items=linesOf(st); ui.shown=0; ui.phase='lines';
  if(instant){ while(ui.shown<ui.items.length) addLine(ui.items[ui.shown++]); afterLines(); }
  else { revealNext(); }
  renderStatus();
}
function revealNext(){
  if(ui.shown<ui.items.length) addLine(ui.items[ui.shown++]);
  if(ui.shown<ui.items.length){ setActions([goBtn('▶ 繼續',revealNext)]); }
  else afterLines();
}
function afterLines(){
  var sc=S.scenes[st.scene];
  if(ui.phase==='result'){ setActions([goBtn('▶ 繼續',function(){ gotoScene(ui.pendingGo); })]); return; }
  if(sc.end){ setActions([]); showEnd(sc); return; }
  var ch=choicesOf(st);
  if(ch.length){
    var nodes=[];
    ch.forEach(function(x){
      var b=document.createElement('button'); b.className='choice'; b.textContent=x.c.text;
      if(x.lock){
        b.disabled=true; b.setAttribute('aria-disabled','true'); b.classList.add('lockic');
        var key=st.scene+':'+x.c.id; st.locked[key]={text:x.c.text,why:x.lock,scene:st.scene};
        nodes.push(b);
        var w=document.createElement('div'); w.className='why'; w.textContent=x.lock; nodes.push(w);
      }else{
        b.onclick=function(){ choose(x.i); };
        nodes.push(b);
      }
    });
    setActions(nodes); ui.phase='choose'; renderStatus(); return;
  }
  var n=nextOf(st);
  if(n){ setActions([goBtn('▶ 繼續',function(){ gotoScene(n); })]); }
  else { setActions([]); $('#log').insertAdjacentHTML('beforeend','<div class="ln narr"><div class="bubble">（這一幕沒有選項，也沒有 next——故事走到死路了。）</div></div>'); }
}
function choose(i){
  var sc=S.scenes[st.scene], c=sc.choices[i];
  if(st.mode==='skin') ui.undo.push(clone(st));
  var before=st.meters.face;
  var p=pick(st,i);
  addPick(c.text,c.tone);
  if(p.taboo){ sfx('taboo'); }
  else if(st.mode==='culture' && st.meters.face<before){ sfx('bad'); }
  else if(c.tone==='good'){ sfx('good'); }
  else sfx('click');
  ui.pendingGo=p.go;
  renderStatus();
  if(p.res.length){
    ui.phase='result'; ui.items=p.res.map(function(t){return {who:'narr',text:t};}); ui.shown=0;
    if(p.taboo){ var tb=document.createElement('div'); tb.className='pick bad'; tb.textContent='（這件事做了就回不去了）'; $('#log').appendChild(tb); }
    revealNext();
  }else{
    gotoScene(p.go);
  }
}
function gotoScene(id){ enter(st,id); ui.phase=''; showScene(false); }
function doUndo(){ if(!ui.undo.length) return; st=ui.undo.pop(); sfx('click'); showScene(true); }

function showEnd(sc){
  var e=sc.end, p=$('#endpanel'), r=R(mode);
  var chosen=st.chosen.map(function(k){ var a=k.split(':'),s=S.scenes[a[0]]; var c=((s&&s.choices)||[]).filter(function(x){return x.id===a[1];})[0]; return c?c.text:k; });
  var lk=Object.keys(st.locked).map(function(k){return st.locked[k];});
  var h='<h3>'+esc(e.title)+'</h3><span class="tag">'+esc(e.tag||'')+'</span>';
  h+='<h4>你這一路的選擇</h4><ul>'+chosen.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
  if(mode==='culture'){
    h+='<h4>被鎖起來的選項</h4>';
    h+=lk.length?'<ul>'+lk.map(function(x){return '<li>'+esc(x.text)+'<br><small>鎖住的原因：'+esc(x.why)+'</small></li>';}).join('')+'</ul><p class="hint">想知道它們怎麼解鎖？再玩一次，換一條路。</p>':'<p class="hint">這一輪沒有任何選項被鎖住。</p>';
  }
  h+='<h4>玩完想一想</h4><p><b>把文化抽掉，這個遊戲還玩得下去嗎？</b></p><div class="row opt" id="judge">'+
    ['照樣玩','故事沒了，但玩法還在','玩法也垮了','說不準'].map(function(t){return '<button type="button" aria-pressed="false">'+t+'</button>';}).join('')+'</div>';
  var qs=(mode==='culture')?
    ['剛才有沒有哪個選項，你本來想選、卻被鎖起來了？是什麼把它鎖住的？','上帝爺的面子是在哪一步被用掉的？你當時看得出來嗎？','如果把「面子」改成一條看得見的血量條，故事會變好還是變差？']:
    ['這一版你有回上一步重來過嗎？重來的時候，你失去了什麼？','你是不是每次都選同一個選項？為什麼？','抽掉那些規則以後，剩下的是什麼？'];
  h+='<ul style="margin-top:8px">'+qs.map(function(q){return '<li>'+esc(q)+'</li>';}).join('')+'</ul>';
  h+='<h4>一句話故事（不計分，想寫再寫）</h4><textarea aria-label="一句話故事" placeholder="誰想要什麼？卡到什麼？最後怎樣？"></textarea>';
  h+='<div class="row"><button id="again" class="primary" type="button">再玩一次（這一版）</button><button id="other" type="button">換玩「'+(mode==='culture'?'文化只是皮':'文化長在規則裡')+'」</button></div>';
  p.innerHTML=h; p.hidden=false;
  Array.prototype.forEach.call(p.querySelectorAll('#judge button'),function(b){ b.onclick=function(){ Array.prototype.forEach.call(p.querySelectorAll('#judge button'),function(o){o.setAttribute('aria-pressed','false');}); b.setAttribute('aria-pressed','true'); sfx('click'); try{ if(window.CT_HOOK){ var hv=(mode==='culture')?'rule':'skin', ix=['照樣玩','故事沒了，但玩法還在','玩法也垮了','說不準'].indexOf(b.textContent); CT_HOOK.markPlayed(hv); if(ix>=0) CT_HOOK.judged(hv,ix+1); } }catch(er){} }; });
  $('#again').onclick=function(){ restart(); };
  $('#other').onclick=function(){ setMode(mode==='culture'?'skin':'culture'); };
  sfx(e.tag==='原著的路'?'bad':'good');
  try{ p.scrollIntoView({block:'nearest'}); }catch(er){}
}

function hintText(){
  var r=R(mode);
  $('#modehint').textContent=(mode==='culture')?
    '文化長在規則裡：誰能對誰開口、面子會被用掉、做錯的事回不去。':
    '文化只是皮：故事一樣，但誰都能說話、什麼都不會被用掉，做錯了還能回上一步。';
}
function restart(){ ui.undo=[]; ui.warn=[]; st=newState(mode); renderBanner(); hintText(); showScene(false); }
function setMode(m){
  mode=m; document.body.classList.toggle('skin',m==='skin');
  $('#m-skin').setAttribute('aria-pressed',String(m==='skin')); $('#m-cult').setAttribute('aria-pressed',String(m==='culture'));
  sfx('click'); restart();
}
function runLint(){
  var L=lint(S),h='';
  if(!L.errs.length&&!L.warns.length) h+='<div class="lintok">✓ 檢查通過：'+L.info.scenes+' 個場景、'+L.info.reachable+' 個走得到、'+L.info.endings+' 個結局。</div>';
  L.errs.forEach(function(x){h+='<div class="linterr">✗ '+esc(x)+'</div>';});
  L.warns.forEach(function(x){h+='<div class="lintwarn">！ '+esc(x)+'</div>';});
  $('#lintout').innerHTML=h; return L;
}
function loadStory(text,label){
  var obj;
  try{ obj=JSON.parse(text); }catch(e){ $('#lintout').innerHTML='<div class="linterr">✗ 這個檔案不是正確的 JSON：'+esc(e.message)+'</div>'; return false; }
  var L=lint(obj);
  if(L.errs.length){ var h='<div class="linterr">✗ 沒有載入，先修好這些：</div>'; L.errs.forEach(function(x){h+='<div class="linterr">✗ '+esc(x)+'</div>';}); $('#lintout').innerHTML=h; return false; }
  S=obj; cache={}; restart(); runLint(); if(label) $('#lintout').insertAdjacentHTML('afterbegin','<div>已載入：'+esc(label)+'</div>');
  return true;
}

/* ---------- 啟動 ---------- */
$('#m-skin').onclick=function(){ setMode('skin'); };
$('#m-cult').onclick=function(){ setMode('culture'); };
$('#mute').onclick=function(){ muted=!muted; var b=$('#mute'); b.setAttribute('aria-pressed',String(muted)); b.textContent=muted?'🔇 靜音':'🔊 有聲'; if(!muted){ sfx('click'); } };
$('#fileIn').onchange=function(ev){ var f=ev.target.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ loadStory(String(rd.result),f.name); }; rd.readAsText(f); };
$('#resetStory').onclick=function(){ loadStory(DEFAULT_TEXT,'預設故事'); };
try{
  var q=new URLSearchParams(location.search); if(q.get('mode')==='skin') mode='skin';
}catch(e){}
S=JSON.parse(DEFAULT_TEXT);
document.body.classList.toggle('skin',mode==='skin');
$('#m-skin').setAttribute('aria-pressed',String(mode==='skin')); $('#m-cult').setAttribute('aria-pressed',String(mode==='culture'));
restart(); runLint();

window.__AVG={
  explore:function(m){ return explore(m); },
  lint:function(o){ return lint(o||S); },
  state:function(){ return clone(st); },
  mode:function(){ return mode; },
  setMode:setMode, restart:restart,
  story:function(){ return S; }
};
})();
</script>
