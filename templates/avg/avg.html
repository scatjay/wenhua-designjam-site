<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap">
<title>通天冠｜故事導向 AVG 樣板</title>
<style>
/* ===== 通天冠（avg）視覺語言：布袋戲舞台＋章回小說書頁。顏色只在 :root 與 body.skin 的變數區塊裡出現，元件只用 --tk-* 與 --av-* ===== */
:root{
  /* 共用語意 token（名稱固定，值各樣板自己定） */
  --tk-surface:#150d0b; --tk-panel:#efe0bd; --tk-ink:#2a1c10; --tk-muted:#6b5538;
  --tk-accent:#a8281f; --tk-accent-ink:#fff4dc; --tk-line:#9c7d4c;
  --tk-font-title:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;
  --tk-font-body:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;
  --tk-radius:3px; --tk-shadow:0 14px 34px rgba(0,0,0,.6);
  /* 私有變數（通天冠專用） */
  --av-stage-text:#f0e2c0; --av-stage-muted:#c9b48a; --av-spot:rgba(255,214,150,.24); --av-spot-hi:rgba(255,236,190,.34);
  --av-curtain:#5a1119; --av-curtain-hi:#8a1d27; --av-gold:#e3b560; --av-gold-dim:#a97b1e;
  --av-black-a:rgba(0,0,0,.38); --av-shade:rgba(40,25,10,.28); --av-shade-dark:rgba(0,0,0,.5);
  --av-btn:#f8edcf; --av-page-shade:rgba(120,80,30,.18); --av-fiber:rgba(120,90,40,.06); --av-av-bg:#f6ead0;
  --av-good:#2f6b4f; --av-bad:#b4352a; --av-warn:#a97b1e; --av-on-bad:#fff4dc;
  --av-k-orig:#2f6b4f; --av-k-adapt:#a8650f; --av-k-ws:#6b4fa0;
  --av-face:#e0c39a; --av-cloth:#667788; --av-hair:#2a2420; --av-helm:#7b838c; --av-knob:#b4352a; --av-cap:#3b3128; --av-capband:#a97b1e;
  --av-beard:#26211c; --av-eye:#222222; --av-mouth:#7a2f25; --av-mouth-b:#f3e3d0; --av-tusk:#fffdf5; --av-blade:#c7ccd1; --av-pen:#c0392b;
  --av-cup:#f2efe6; --av-cup-edge:#8a8a8a; --av-scene-a:#6a6a6a; --av-scene-b:#3a3a3a;
  --av-cover-a:#3d2f22;
}
body.skin{
  --tk-surface:#eceff3; --tk-panel:#ffffff; --tk-ink:#22262b; --tk-muted:#5c6670;
  --tk-accent:#3a6ea5; --tk-accent-ink:#ffffff; --tk-line:#9aa5b1;
  --tk-font-title:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --tk-font-body:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --tk-radius:10px; --tk-shadow:0 2px 8px rgba(0,0,0,.15);
  --av-stage-text:#22262b; --av-stage-muted:#5c6670; --av-spot:rgba(255,255,255,0); --av-spot-hi:rgba(255,255,255,0);
  --av-curtain:rgba(255,255,255,0); --av-curtain-hi:rgba(255,255,255,0); --av-gold:#3a6ea5; --av-gold-dim:#9aa5b1;
  --av-black-a:rgba(255,255,255,.7); --av-shade:rgba(0,0,0,.12); --av-btn:#ffffff; --av-page-shade:rgba(0,0,0,0); --av-fiber:rgba(0,0,0,0);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(ellipse 90% 55% at 50% 0%,var(--av-spot),transparent 72%),var(--tk-surface);background-attachment:fixed;color:var(--av-stage-text);
  font-family:var(--tk-font-body);font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%;overflow-wrap:anywhere;min-height:100vh}
/* 舞台：頂上的布幔與兩側的簾 */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:30px;z-index:3;pointer-events:none;
  background:linear-gradient(var(--av-curtain-hi),var(--av-curtain));border-bottom:3px solid var(--av-gold);box-shadow:0 6px 14px var(--av-shade-dark)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--av-curtain) 0 9px,var(--av-curtain-hi) 9px 15px) left top/12px 100% no-repeat,
             repeating-linear-gradient(90deg,var(--av-curtain) 0 9px,var(--av-curtain-hi) 9px 15px) right top/12px 100% no-repeat}
@media (min-width:900px){
  body::after{background:repeating-linear-gradient(90deg,var(--av-curtain) 0 18px,var(--av-curtain-hi) 18px 30px) left top/9vw 100% no-repeat,
             repeating-linear-gradient(90deg,var(--av-curtain-hi) 0 12px,var(--av-curtain) 12px 30px) right top/9vw 100% no-repeat}
}
.banner{margin-top:30px;font-size:11.5px;line-height:1.5;color:var(--av-stage-muted);padding:8px 18px;border-bottom:1px solid var(--av-gold-dim);position:relative;z-index:1;text-align:center}
.banner b{color:var(--av-gold)}
.wrap{max-width:460px;margin:0 auto;padding:0 18px 40px;position:relative;z-index:1}
@media (min-width:900px){.wrap{max-width:780px}}
.top{position:relative;text-align:center;padding:16px 0 6px}
h1{font-family:var(--tk-font-title);font-size:2.1rem;margin:0;letter-spacing:.4em;padding:0 54px 0 calc(54px - .4em);font-weight:900;color:var(--av-gold);text-shadow:0 2px 10px var(--av-shade-dark)}
h1 small{font-size:.8rem;letter-spacing:.14em;color:var(--av-stage-muted);font-weight:400;display:block;margin-top:2px;text-shadow:none}
button,summary,.btn{font:inherit;color:var(--tk-ink)}
button{cursor:pointer}
#mute{position:absolute;right:0;top:14px;min-width:48px;min-height:48px;border:1.5px solid var(--av-gold-dim);background:var(--av-black-a);color:var(--av-stage-text);border-radius:24px;padding:0 10px;font-size:12px}
.seg{display:flex;border:1.5px solid var(--av-gold-dim);border-radius:var(--tk-radius);overflow:hidden;margin:8px 0 6px;background:var(--av-black-a)}
.seg button{flex:1;min-height:48px;border:0;background:transparent;color:var(--av-stage-text);font-size:14px;padding:4px 6px;letter-spacing:.06em}
.seg button[aria-pressed=true]{background:var(--tk-accent);color:var(--tk-accent-ink);font-weight:700}
.hint{font-size:12.5px;color:var(--av-stage-muted);margin:0 0 8px;text-align:center}
.status{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;background:var(--av-black-a);border:1px solid var(--av-gold-dim);border-radius:var(--tk-radius);padding:6px 8px;margin-bottom:10px;min-height:48px;font-size:13px;color:var(--av-stage-text)}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:2px 10px;border-radius:15px;border:1px solid var(--av-gold-dim);background:transparent;color:var(--av-stage-text)}
.chip.low{border-color:var(--av-bad);color:var(--av-gold);font-weight:700}
.gauge{display:inline-flex;gap:3px;margin:0 6px}
.gauge i{width:13px;height:11px;border:1.5px solid var(--av-gold-dim);border-radius:3px 3px 6px 6px;background:transparent}
.gauge i.on{background:var(--av-gold);border-color:var(--av-gold)}
.sbtn{min-height:44px;padding:0 12px;border:1.5px solid var(--av-gold-dim);background:transparent;color:var(--av-stage-text);border-radius:var(--tk-radius);font-size:13px}
.sbtn:disabled{opacity:.45;cursor:default}
.hintbox{background:var(--av-black-a);border:1.5px dashed var(--av-gold);border-radius:var(--tk-radius);padding:8px 10px;margin:0 0 10px;font-size:13.5px;color:var(--av-stage-text)}
/* 書頁 */
#card{position:relative;color:var(--tk-ink);border:1px solid var(--tk-line);border-radius:var(--tk-radius);overflow:hidden;box-shadow:var(--tk-shadow);
  background:linear-gradient(90deg,var(--av-page-shade) 0,transparent 5%,transparent 95%,var(--av-page-shade) 100%),repeating-linear-gradient(0deg,var(--av-fiber) 0 1px,transparent 1px 4px),var(--tk-panel)}
#head{position:relative;padding:14px 16px 10px;color:var(--tk-accent-ink);text-align:center;border-bottom:3px double var(--av-gold);transition:background .3s}
#head::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% -20%,var(--av-spot-hi),transparent 68%)}
#head h2{position:relative;margin:0 0 8px;font-family:var(--tk-font-title);font-size:1.2rem;font-weight:900;letter-spacing:.32em;text-shadow:0 2px 4px var(--av-shade-dark)}
#cast{position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cm{display:flex;flex-direction:column;align-items:center;width:62px;font-size:11px;text-shadow:0 1px 2px var(--av-shade-dark)}
.av{border-radius:var(--tk-radius);background:var(--av-av-bg);border:2px solid var(--av-gold);display:block}
#log{padding:20px 20px 6px;font-size:1.06rem;line-height:2.05}
@media (min-width:900px){#log{padding:26px 44px 8px;font-size:1.14rem}}
.ln{display:flex;gap:10px;margin:0 0 14px;align-items:flex-start;animation:ink .7s ease-out}
.ln>div{min-width:0;flex:1}
.ln .who{font-family:var(--tk-font-title);font-size:13px;line-height:1.5;color:var(--tk-accent);letter-spacing:.18em;margin-bottom:1px;font-weight:600}
.ln .who::before{content:"【"}.ln .who::after{content:"】"}
.ln .bubble{background:transparent;border:0;border-radius:0;padding:0}
.ln.narr{display:block}
.ln.narr .bubble{color:var(--tk-ink);text-indent:2em}
.ln.narr:first-child .bubble{text-indent:0}
.ln.narr:first-child .bubble::first-letter{float:left;font-family:var(--tk-font-title);font-weight:900;font-size:2.6em;line-height:1;color:var(--tk-accent);padding:3px 8px 0 0}
.ln.me .bubble{border-left:3px solid var(--tk-accent);padding-left:10px}
.pick{margin:2px 0 14px;padding:6px 8px;border-top:1px dashed var(--tk-line);border-bottom:1px dashed var(--tk-line);color:var(--tk-accent);text-align:center;font-size:14.5px;letter-spacing:.06em;font-weight:600;animation:ink .5s ease-out}
.pick.bad{color:var(--av-bad)}
@keyframes ink{from{opacity:0;filter:blur(3px);transform:translateY(3px)}to{opacity:1;filter:none;transform:none}}
.cur::after{content:"▍";color:var(--tk-accent);opacity:.7;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
#fw{padding:0 20px}
.fwcard{border:1.5px dashed var(--av-gold-dim);border-radius:var(--tk-radius);padding:8px 10px;margin:0 0 10px;font-size:13.5px;background:var(--av-btn);color:var(--tk-ink)}
.fwcard b{color:var(--tk-accent)}
.fwcard input{width:100%;min-height:44px;margin-top:6px;padding:6px 8px;font:inherit;border:1px solid var(--tk-line);border-radius:var(--tk-radius);background:var(--tk-panel);color:var(--tk-ink)}
.fwcard code{display:block;margin-top:6px;font-size:12px;white-space:pre-wrap}
#actions{padding:4px 20px 18px;display:flex;flex-direction:column;gap:9px;counter-reset:ch}
@media (min-width:900px){#actions{padding:4px 44px 22px}}
.pickhead{font-family:var(--tk-font-title);color:var(--tk-muted);text-align:center;letter-spacing:.3em;font-size:13px;margin:4px 0 0}
.pickhead::before,.pickhead::after{content:"";display:inline-block;width:2.2em;border-top:1px solid var(--tk-line);vertical-align:middle;margin:0 .8em}
.go{align-self:flex-end;min-height:48px;padding:0 22px;border:0;border-radius:var(--tk-radius);background:var(--tk-accent);color:var(--tk-accent-ink);font-family:var(--tk-font-title);font-size:15px;font-weight:700;letter-spacing:.2em;box-shadow:2px 3px 0 var(--av-shade)}
.choice{counter-increment:ch;position:relative;min-height:52px;width:100%;text-align:left;padding:10px 14px 10px 48px;border:1.5px solid var(--tk-line);border-radius:var(--tk-radius);background:var(--av-btn);color:var(--tk-ink);font-size:15px;line-height:1.7;box-shadow:2px 3px 0 var(--av-shade)}
.choice::before{content:counter(ch,cjk-ideographic);position:absolute;left:11px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--tk-accent);color:var(--tk-accent-ink);font-size:13px;line-height:26px;text-align:center;font-family:var(--tk-font-title)}
.choice:disabled{opacity:.62;cursor:default;background:transparent;border-style:dashed;box-shadow:none}
.choice.lockic::before{content:"鎖";background:var(--tk-muted)}
.why{font-size:12.5px;color:var(--av-bad);margin:-4px 4px 2px}
/* 開場書封與換幕 */
.ovl{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--av-stage-text)}
.ovl.cover{background:radial-gradient(ellipse at 50% 30%,var(--av-curtain-hi),var(--av-curtain) 55%,var(--tk-surface));overflow:auto;animation:ink .8s ease-out}
.cvf{display:flex;flex-direction:row-reverse;gap:18px;align-items:flex-start;max-width:520px;width:100%;padding:24px 20px;border:2px solid var(--av-gold);outline:1px solid var(--av-gold-dim);outline-offset:6px;background:var(--av-black-a);text-align:left}
.cvt{display:flex;flex-direction:row-reverse;gap:10px;align-items:flex-start;font-family:var(--tk-font-title);flex:none}
.cvtitle{writing-mode:vertical-rl;font-size:3.7rem;line-height:1.1;letter-spacing:.28em;font-weight:900;color:var(--av-gold);text-shadow:0 3px 12px var(--av-shade-dark)}
.cvs{writing-mode:vertical-rl;font-size:.92rem;letter-spacing:.3em;margin:6px 0 0;color:var(--av-stage-text)}
.cvb{flex:1;min-width:0;font-size:.98rem;line-height:1.95}
.cvb p{margin:.3em 0}
.cvq{font-family:var(--tk-font-title);color:var(--av-gold);letter-spacing:.2em}
.cvn{color:var(--av-stage-muted);font-size:.86rem}
.ovl .fig{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.ovl button{min-height:48px;padding:10px 26px;font-family:var(--tk-font-title);font-size:1.1rem;letter-spacing:.3em;border-radius:var(--tk-radius);border:1px solid var(--av-gold);background:var(--tk-accent);color:var(--tk-accent-ink);font-weight:700;margin-top:12px;cursor:pointer}
.ovl.chap{background:transparent;cursor:pointer;padding:0;overflow:hidden}
.ovl.chap::before,.ovl.chap::after{content:"";position:absolute;top:0;bottom:0;width:50.4%;z-index:0;background:repeating-linear-gradient(90deg,var(--av-curtain) 0 16px,var(--av-curtain-hi) 16px 26px);box-shadow:0 0 40px var(--av-shade-dark)}
.ovl.chap::before{left:0;border-right:3px solid var(--av-gold);animation:cl 3s ease-in-out forwards}
.ovl.chap::after{right:0;border-left:3px solid var(--av-gold);animation:cr 3s ease-in-out forwards}
@keyframes cl{0%{transform:translateX(-100%)}20%{transform:none}68%{transform:none}100%{transform:translateX(-100%)}}
@keyframes cr{0%{transform:translateX(100%)}20%{transform:none}68%{transform:none}100%{transform:translateX(100%)}}
.ct{position:relative;z-index:1;writing-mode:vertical-rl;display:flex;gap:20px;align-items:flex-start;font-family:var(--tk-font-title);color:var(--av-gold);animation:ct 3s ease-in-out forwards;opacity:0}
.ct p,.ct h2{margin:0}
.ct .cw{font-size:1rem;letter-spacing:.4em;color:var(--av-stage-text)}
.ct .cn{font-size:1.2rem;letter-spacing:.3em}
.ct h2{font-size:2.3rem;letter-spacing:.24em;font-weight:900;text-shadow:0 2px 10px var(--av-shade-dark)}
@keyframes ct{0%,16%{opacity:0}28%,60%{opacity:1}74%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ovl.chap::before,.ovl.chap::after{animation:none}.ct{animation:none;opacity:1}.ln,.pick{animation:none}}
/* 附屬面板 */
.ach{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ach span{border:1px solid var(--tk-line);border-radius:14px;padding:3px 10px;font-size:.9rem}.ach span.on{background:var(--av-gold-dim);color:var(--tk-accent-ink);border-color:var(--av-gold-dim)}.ach span.off{opacity:.55}
details{margin:12px 0;border:1px solid var(--av-gold-dim);border-radius:var(--tk-radius);background:var(--av-black-a);color:var(--av-stage-text);padding:0 12px}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-size:14px;color:var(--av-stage-text)}
details[open]>summary{border-bottom:1px solid var(--av-gold-dim);margin-bottom:8px}
details p,details li{font-size:13.5px}
.k{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;color:var(--tk-accent-ink);margin-right:4px;line-height:19px}
.k-原著{background:var(--av-k-orig)} .k-改編{background:var(--av-k-adapt)} .k-工坊創作{background:var(--av-k-ws)}
.srcl{list-style:none;padding:0;margin:0 0 8px}
.srcl li{margin:0 0 6px}
.chars{display:grid;grid-template-columns:1fr;gap:10px;padding:0;margin:0;list-style:none}
.chars li{display:flex;gap:10px}
#endpanel{position:relative;margin:16px 0;padding:22px 16px 14px;border:3px double var(--tk-line);border-radius:var(--tk-radius);color:var(--tk-ink);box-shadow:var(--tk-shadow);
  background:repeating-linear-gradient(0deg,var(--av-fiber) 0 1px,transparent 1px 4px),var(--tk-panel)}
#endpanel .finis{margin:0 0 4px;text-align:center;font-family:var(--tk-font-title);letter-spacing:.4em;color:var(--tk-muted);font-size:13px}
#endpanel .seal{position:absolute;right:14px;top:-16px;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:var(--tk-accent);color:var(--tk-accent-ink);font-family:var(--tk-font-title);font-size:26px;font-weight:900;transform:rotate(6deg);border-radius:var(--tk-radius);box-shadow:2px 3px 0 var(--av-shade)}
#endpanel h3{margin:0 0 6px;font-family:var(--tk-font-title);font-size:1.4rem;letter-spacing:.2em;text-align:center}
#endpanel .tag{display:block;width:max-content;margin:0 auto 10px;padding:0 12px;border-radius:12px;background:var(--tk-accent);color:var(--tk-accent-ink);font-size:12px;line-height:22px}
#endpanel h4{margin:14px 0 4px;font-size:14px;font-family:var(--tk-font-title);color:var(--tk-accent);letter-spacing:.12em}
#endpanel ul{margin:0;padding-left:20px}
#endpanel li{font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button,.row .btn{flex:1 1 140px;min-height:48px;border:1.5px solid var(--tk-line);border-radius:var(--tk-radius);background:var(--av-btn);color:var(--tk-ink);font-size:14px;padding:4px 8px}
details .row button,details .row .btn{background:transparent;color:var(--av-stage-text);border-color:var(--av-gold-dim)}
.row .primary{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent);font-weight:700}
.opt button{flex:1 1 45%;min-height:46px}
.opt button[aria-pressed=true]{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent)}
textarea{width:100%;min-height:84px;padding:8px;font:inherit;border:1px solid var(--tk-line);border-radius:var(--tk-radius);background:var(--av-btn);color:var(--tk-ink)}
.btn.file{display:flex;align-items:center;justify-content:center;cursor:pointer;text-align:center}
.lintok{color:var(--av-good)} .linterr{color:var(--av-bad)} .lintwarn{color:var(--av-gold)}
.foot{font-size:11.5px;color:var(--av-stage-muted);margin:14px 0 0;text-align:center}
#card .hint,#endpanel .hint{color:var(--tk-muted);text-align:left}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<div class="wrap">
  <div class="top">
    <h1 id="gtitle"></h1>
    <button id="mute" aria-pressed="true" aria-label="開關聲音">🔇 靜音</button>
  </div>
  <div class="seg" role="group" aria-label="選擇版本">
    <button id="m-skin" aria-pressed="false">文化只是皮</button>
    <button id="m-cult" aria-pressed="true">文化長在規則裡</button>
  </div>
  <p class="hint" id="modehint"></p>
  <div class="status" id="status"></div>
  <div class="hintbox" id="hintbox" hidden></div>

  <div id="card">
    <div id="head"><h2 id="stitle"></h2><div id="cast"></div></div>
    <div id="log" aria-live="polite"></div>
    <div id="fw"></div>
    <div id="actions"></div>
  </div>

  <details id="srcd"><summary>這一幕哪些是原著、哪些是我們加的？</summary><ul class="srcl" id="srcl"></ul></details>

  <div id="endpanel" hidden></div>

  <details id="rulesd"><summary>這個樣板用了哪些文化卡？</summary><ul id="cardsl"></ul><p id="cardsnote" class="hint"></p></details>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var KW={'true':1,'false':1,'null':1,'undefined':1,'Math':1};
var DEFAULT_TEXT=document.getElementById('story-data').textContent;
var S=null, mode='culture', st=null;
var ui={phase:'',items:[],shown:0,undo:[],hintShown:false,warn:[]};
/* ---------- 積木模組登錄：每個模組只讀 JSON 裡屬於自己的那一段，介面固定 init(cfg,root)／step(state,action)／render(state) ---------- */
var TK={mods:{},order:[],
  reg:function(m){ TK.mods[m.id]=m; TK.order.push(m.id); return m; },
  initAll:function(story){ TK.order.forEach(function(id){ var m=TK.mods[id]; m.init(story[m.section],m.root?document.querySelector(m.root):null); }); },
  list:function(){ return TK.order.map(function(id){ var m=TK.mods[id]; return {id:id,section:m.section,root:m.root||null,api:['init','step','render'].filter(function(k){return typeof m[k]==='function';})}; }); }
};

function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function R(m){var r=(S.rules||{})[m||mode]||{};return r;}

/* ---------- 條件式 ---------- */
var cache={};
function ctxOf(s){
  return new Proxy({},{
    has:function(t,k){return typeof k==='string' && !(k in globalThis);},
    get:function(t,k){
      if(typeof k!=='string') return undefined;
      if(k==='face') return s.meters.face;
      if(k==='favor') return s.meters.favor;
      if(k==='mode') return s.mode;
      return s.flags[k]===undefined?false:s.flags[k];
    }
  });
}
function ev(expr,s){
  if(expr===undefined||expr===null||expr==='') return true;
  var f=cache[expr];
  if(!f){
    try{ f=new Function('c','with(c){return !!('+expr+')}'); }
    catch(e){ f=function(){return false;}; ui.warn.push('條件寫錯了：'+expr); }
    cache[expr]=f;
  }
  try{ return f(ctxOf(s)); }catch(e){ ui.warn.push('條件算不出來：'+expr); return false; }
}

/* ---------- 核心：狀態與規則（不碰畫面） ---------- */
function newState(m){
  var r=R(m);
  var s={mode:m,scene:null,flags:clone(S.flags_init||{}),meters:{face:(r.face&&r.face.on)?r.face.start:3,favor:0},
         hint:r.hint_uses||0,visited:{},locked:{},chosen:[]};
  enter(s,S.meta.start);
  return s;
}
function applyFx(s,o){
  var r=R(s.mode),k;
  if(o.set) for(k in o.set) s.flags[k]=o.set[k];
  if(s.mode==='culture'){
    if(o.cset) for(k in o.cset) s.flags[k]=o.cset[k];
    if(o.add) for(k in o.add){
      if(r[k]&&r[k].on){
        var mx=(k==='face')?(r.face.max||5):(r.favor.cap||5);
        s.meters[k]=Math.max(0,Math.min(mx,s.meters[k]+o.add[k]));
      }
    }
  }
}
function enter(s,id){
  var r=R(s.mode);
  if(s.scene!==null && r.favor && r.favor.on && s.meters.favor>0){
    s.meters.favor=Math.min(r.favor.cap||5,s.meters.favor+(r.favor.grow_per_scene||0));
  }
  s.scene=id; s.visited[id]=1;
  var sc=S.scenes[id]; if(!sc) return;
  (sc.enter||[]).forEach(function(e){ if(ev(e.if,s)) applyFx(s,e); });
}
function linesOf(s){ var sc=S.scenes[s.scene]; return ((sc&&sc.lines)||[]).filter(function(l){return ev(l.if,s);}); }
function choicesOf(s){
  var sc=S.scenes[s.scene]||{}, r=R(s.mode), out=[];
  (sc.choices||[]).forEach(function(c,i){
    if(c.if && !ev(c.if,s)) return;
    var lock=null;
    if(s.mode==='culture'){
      if(c.requires && !ev(c.requires,s)) lock=c.lock||'現在還不行。';
      var g=r.rank_gate;
      if(!lock && g && g.on && c.address && S.characters[c.address] && S.characters.you){
        var gap=S.characters[c.address].rank-S.characters.you.rank;
        var bypass=(c.address===g.bypass_who && s.meters.favor>=g.bypass_favor);
        if(gap>g.max_gap && !bypass) lock=String(g.lock_text||'資歷差太多。').replace('{who}',S.characters[c.address].name);
      }
    }
    out.push({i:i,c:c,lock:lock});
  });
  return out;
}
function pick(s,i){
  var sc=S.scenes[s.scene], c=sc.choices[i];
  var o=(s.mode==='skin'&&c.skin)?Object.assign({},c,c.skin):c;
  applyFx(s,o);
  s.chosen.push(s.scene+':'+c.id);
  return {res:o.result||[],go:o.goto,taboo:!!(c.taboo&&s.mode==='culture'),tone:c.tone};
}
function nextOf(s){ var sc=S.scenes[s.scene]||{},n=sc.next||[],j; for(j=0;j<n.length;j++){ if(ev(n[j].if,s)) return n[j].goto; } return null; }
function faceLabel(s){ var r=R(s.mode); return (r.face&&r.face.labels&&r.face.labels[s.meters.face])||''; }

/* ---------- 檢查故事（給改作的人用） ---------- */
function lint(story){
  var errs=[],warns=[],sc=story.scenes||{},ids=Object.keys(sc),chars=story.characters||{};
  var known={face:1,favor:1,mode:1};
  Object.keys(story.flags_init||{}).forEach(function(k){known[k]=1;});
  function words(e){return String(e||'').match(/[A-Za-z_][A-Za-z0-9_]*/g)||[];}
  function chkExpr(e,w){ words(e).forEach(function(x){ if(!KW[x]&&!known[x]) warns.push(w+' 的條件用到沒登記的旗標「'+x+'」（會被當成 false）'); }); }
  function chkSet(o,w){ if(!o) return; Object.keys(o).forEach(function(k){ if(!known[k]) warns.push(w+' 設定了沒登記的旗標「'+k+'」（請加進 flags_init）'); }); }
  if(!story.meta||!story.meta.start||!sc[story.meta.start]) errs.push('meta.start 指到的場景不存在');
  var ends=0;
  ids.forEach(function(id){
    var s=sc[id],w='場景「'+id+'」';
    if(s.end) ends++;
    (s.cast||[]).forEach(function(c){ if(!chars[c]) errs.push(w+' 的 cast 有不存在的人物「'+c+'」'); });
    (s.lines||[]).forEach(function(l,i){
      if(l.who!=='narr'&&!chars[l.who]) errs.push(w+' 第 '+(i+1)+' 句的 who「'+l.who+'」不是人物也不是 narr');
      chkExpr(l.if,w+' 第 '+(i+1)+' 句');
    });
    (s.choices||[]).forEach(function(c){
      var cw=w+' 的選項「'+(c.id||c.text)+'」';
      if(!c.goto||!sc[c.goto]) errs.push(cw+' 的 goto 指到不存在的場景「'+c.goto+'」');
      if(c.address&&!chars[c.address]) errs.push(cw+' 的 address 不是人物「'+c.address+'」');
      chkExpr(c.if,cw); chkExpr(c.requires,cw); chkSet(c.set,cw); chkSet(c.cset,cw);
      if(c.skin) chkSet(c.skin.set,cw);
      Object.keys(c.add||{}).forEach(function(k){ if(k!=='face'&&k!=='favor') warns.push(cw+' 的 add 只認 face 與 favor，「'+k+'」不會有作用'); });
    });
    (s.next||[]).forEach(function(n){ if(!sc[n.goto]) errs.push(w+' 的 next 指到不存在的場景「'+n.goto+'」'); chkExpr(n.if,w+' 的 next'); });
    (s.enter||[]).forEach(function(e){ chkExpr(e.if,w+' 的 enter'); chkSet(e.set,w+' 的 enter'); });
    if(!s.end&&!(s.next&&s.next.length)&&!(s.choices&&s.choices.length)) errs.push(w+' 是死路：沒有選項、沒有 next、也不是結局');
  });
  var seen={},q=[story.meta&&story.meta.start];
  while(q.length){ var x=q.pop(); if(!x||seen[x]||!sc[x]) continue; seen[x]=1;
    (sc[x].choices||[]).forEach(function(c){q.push(c.goto);}); (sc[x].next||[]).forEach(function(n){q.push(n.goto);}); }
  ids.forEach(function(id){ if(!seen[id]) warns.push('場景「'+id+'」沒有任何選項或 next 連得到它'); });
  if(!ends) errs.push('沒有任何結局場景（scene 裡要有 end 欄位）');
  return {errs:errs,warns:warns,info:{scenes:ids.length,reachable:Object.keys(seen).length,endings:ends}};
}

/* ---------- 把所有玩法走一遍（驗收用） ---------- */
function explore(m){
  var seen={},endings={},dead=0,avail={},lockedOnly={},memo={};
  function key(s){return s.scene+'|'+JSON.stringify(s.flags)+'|'+s.meters.face+','+s.meters.favor;}
  function settle(s){
    var guard=0;
    while(guard++<50){
      var sc=S.scenes[s.scene];
      if(!sc) return 'dead';
      if(sc.end) return 'end';
      if(choicesOf(s).length) return 'choice';
      var n=nextOf(s);
      if(!n) return 'dead';
      enter(s,n);
    }
    return 'dead';
  }
  function walk(s){
    var k=key(s); if(memo[k]) return memo[k];
    var kind=settle(s); k=key(s); if(memo[k]) return memo[k];
    var res={};
    if(kind==='end'){ res[s.scene]=1; }
    else if(kind==='dead'){ dead++; res.__dead=1; }
    else{
      choicesOf(s).forEach(function(ch){
        var id=s.scene+':'+ch.c.id;
        if(ch.lock){ if(!avail[id]) lockedOnly[id]=ch.lock; return; }
        avail[id]=1; delete lockedOnly[id];
        var t=clone(s); var p=pick(t,ch.i); enter(t,p.go);
        var sub=walk(t); for(var e in sub) res[e]=(res[e]||0)+sub[e];
      });
    }
    memo[k]=res; seen[k]=1; return res;
  }
  var prev=ui.warn.length;
  var s0=newState(m); var res=walk(s0);
  var allIds=[]; Object.keys(S.scenes).forEach(function(id){ (S.scenes[id].choices||[]).forEach(function(c){ allIds.push(id+':'+c.id); }); });
  return {mode:m,states:Object.keys(seen).length,paths:res,deadEnds:dead,
          neverAvailable:allIds.filter(function(i){return !avail[i];}),
          lockedSomewhere:Object.keys(lockedOnly),warnAdded:ui.warn.length-prev};
}

/* ---------- 聲音（預設靜音，按了才建立 AudioContext） ---------- */
var AC=null,muted=true;
function tone(f,t0,dur,type,vol,f2){
  var o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,AC.currentTime+t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+t0+dur);
  g.gain.setValueAtTime(0.0001,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(vol,AC.currentTime+t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t0+dur); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+dur+0.05);
}
function gong(){ var c=AC.currentTime,o=AC.createOscillator(),m=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
  o.frequency.value=150; m.frequency.value=150*3.5; mg.gain.setValueAtTime(220,c); mg.gain.exponentialRampToValueAtTime(5,c+1.4);
  g.gain.setValueAtTime(0.0001,c); g.gain.exponentialRampToValueAtTime(0.2,c+0.02); g.gain.exponentialRampToValueAtTime(0.0001,c+1.5);
  m.connect(mg); mg.connect(o.frequency); o.connect(g); g.connect(AC.destination); o.start(c); m.start(c); o.stop(c+1.6); m.stop(c+1.6); }
function wood(){ var c=AC.currentTime,n=Math.floor(AC.sampleRate*0.06),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0),i;
  for(i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(); s.buffer=b; f.type='bandpass'; f.frequency.value=1100; f.Q.value=6; g.gain.value=0.22;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(c); }
function sfx(k){
  if(muted) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var cul=(mode==='culture');
    if(k==='click'){ if(cul) wood(); else tone(660,0,0.08,'sine',0.12); }
    else if(k==='good'){ if(cul){ tone(659,0,0.35,'triangle',0.12); tone(784,0.12,0.5,'triangle',0.12);} else tone(523,0,0.2,'sine',0.12); }
    else if(k==='bad'){ if(cul) tone(140,0,0.5,'sine',0.2,70); else tone(220,0,0.2,'square',0.06); }
    else if(k==='taboo'){ if(cul) gong(); else tone(220,0,0.2,'square',0.06); }
    else if(k==='chap'){ if(cul) gong(); }
  }catch(e){}
}

/* ---------- 畫面 ---------- */
function avatar(id,mood,size){
  var c=S.characters[id]; if(!c) return '';
  if(c.portrait) return '<img class="av" width="'+size+'" height="'+size+'" src="'+esc(c.portrait)+'" alt="'+esc(c.name)+'">';
  var L=c.look||{},face=L.face||'var(--av-face)',cloth=L.cloth||'var(--av-cloth)',hc='var(--av-hair)',g='';

      var b=document.createElement('button'); b.className='choice'; b.textContent=x.c.text;
      if(x.lock){
        b.disabled=true; b.setAttribute('aria-disabled','true'); b.classList.add('lockic');
        var key=state.scene+':'+x.c.id; state.locked[key]={text:x.c.text,why:x.lock,scene:state.scene};
        nodes.push(b);
        var w=document.createElement('div'); w.className='why'; w.textContent=x.lock; nodes.push(w);
      }else{
        b.onclick=function(){ choose(x.i); };
        nodes.push(b);
      }
    });
    var ph=document.createElement('div'); ph.className='pickhead'; ph.textContent='且看你如何抉擇'; nodes.unshift(ph);
    setActions(nodes); ui.phase='choose'; renderStatus();
  }});
TK.reg({id:'資源計分',section:'rules',root:'#status',
  init:function(cfg,root){ this.cfg=cfg||{}; this.root=root; },
  step:function(state,a){ if(a.type==='fx') applyFx(state,a.fx); return state; },
  render:function(state){ renderStatus(); }});
TK.reg({id:'時間回合',section:'meta',root:null,
  init:function(cfg,root){ this.cfg=cfg||{}; },
  step:function(state,a){ if(a.type==='enter') enter(state,a.id); return state; },
  render:function(state){ var sc=S.scenes[state.scene]; return chapterCard(sc,null); }});
TK.reg({id:'空間',section:'scenes',root:'#head',
  init:function(cfg,root){ this.cfg=cfg||{}; this.root=root; },
  step:function(state,a){ return state; },
  render:function(state){ renderHead(S.scenes[state.scene]); renderFieldwork(S.scenes[state.scene]); }});
TK.reg({id:'角色',section:'characters',root:'#cast',
  init:function(cfg,root){ this.cfg=cfg||{}; this.root=root; },
  step:function(state,a){ return state; },
  render:function(state){ var sc=S.scenes[state.scene]||{}; $('#cast').innerHTML=(sc.cast||[]).map(function(id){return '<div class="cm">'+avatar(id,'normal',48)+'<span>'+esc(nameOf(id))+'</span></div>';}).join(''); }});
TK.reg({id:'事件選擇',section:'scenes',root:'#log',
  init:function(cfg,root){ this.cfg=cfg||{}; this.root=root; },
  step:function(state,a){ if(a.type==='advance') revealNext(); return state; },
  render:function(state){ if(ui.shown<ui.items.length) addLine(ui.items[ui.shown++]); }});
TK.reg({id:'勝負',section:'scenes',root:'#endpanel',
  init:function(cfg,root){ this.cfg=cfg||{}; this.root=root; },
  step:function(state,a){ return state; },
  render:function(state){ return showEndImpl(S.scenes[state.scene]); }});
TK.reg({id:'回饋',section:'achievements',root:null,
  init:function(cfg,root){ this.cfg=cfg||null; },
  step:function(state,a){ if(a.type==='sfx') sfx(a.k); return state; },
  render:function(state){ return achBlock(); }});
