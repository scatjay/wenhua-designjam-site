<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文化遊戲松 Design Jam · 完整卡池</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#faf8f2; --panel:#ffffff; --ink:#2b2820; --ink-soft:#5c5648; --line:#ddd7c6;
    --accent:#c2711f;
    --green:#3f7a34; --green-soft:#e9f3e3;
    --blue:#2f6690; --blue-soft:#e5eff6;
    --purple:#7a3f92; --purple-soft:#f2e7f6;
    --red:#b8452f; --red-soft:#fbe9e3;
    --shadow:0 1px 2px rgba(40,32,10,.06), 0 6px 18px rgba(40,32,10,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;font-weight:800;margin:4px 0 2px}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 20px;line-height:1.6}
  .back{display:inline-block;margin-bottom:14px;color:var(--accent);font-weight:700;text-decoration:none;font-size:14px}
  .section{margin-bottom:34px}
  .section h2{font-size:17px;margin:0 0 4px}
  .section .n{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px}
  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .cardbox{border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .cardbox .v{font-size:14.5px;font-weight:800;margin-bottom:4px;line-height:1.4}
  .cardbox .d{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;opacity:.75;margin-bottom:6px}
  .cardbox .note{font-size:13px;line-height:1.6;opacity:.9}
  .producer{background:var(--green-soft);border:1px solid var(--green);color:var(--green)}
  .producer .v{color:var(--ink)}
  .engineer{background:var(--blue-soft);border:1px solid var(--blue);color:var(--blue)}
  .engineer .v{color:var(--ink)}
  .marketing{background:var(--purple-soft);border:1px solid var(--purple);color:var(--purple)}
  .marketing .v{color:var(--ink)}
  .creative{background:var(--red-soft);border:1px solid var(--red);color:var(--red)}
  .creative .v{color:var(--ink)}
  .cardbox.custom{outline:2px dashed var(--accent);outline-offset:2px}
  .cardbox .by{font-size:11px;color:var(--accent);font-weight:800;margin-top:6px}
  .addbox{background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:18px 20px;margin-bottom:28px}
  .addbox h2{font-size:16px;margin:0 0 10px}
  .addbox label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin:10px 0 4px}
  .addbox select,.addbox input,.addbox textarea{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
  .addbox button{margin-top:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-weight:800;cursor:pointer}
  .addbox .st{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
  .usebadge{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;opacity:.75}
  .lookupbox{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:28px}
  .lookupbox h2{font-size:16px;margin:0 0 10px}
  .lookupbox .row{display:flex;gap:8px}
  .lookupbox input{flex:1;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
  .lookupbox button{background:var(--panel2, #f2efe4);border:1.5px solid var(--line);border-radius:8px;padding:0 18px;font-weight:800;cursor:pointer}
  .lookupbox .result{margin-top:12px;font-size:13.5px;line-height:1.8}
  .lookupbox .result .hit{background:var(--bg);border-radius:8px;padding:6px 10px;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 回配對頁面</a>
  <h1>完整卡池 · 文化遊戲松 Design Jam</h1>
  <p class="sub">目前遊戲裡所有角色的所有卡片內容，方便瀏覽全貌、也方便楊老師比對更新。虛線外框的是同學新增的自訂卡，會即時加進抽卡池裡增加多元性。</p>

  <div class="addbox">
    <h2>➕ 新增一張你的卡片</h2>
    <label>你的編號</label>
    <input type="number" id="addEnv" min="1" max="60" placeholder="例如 17">
    <label>要加進哪個角色的卡池</label>
    <select id="addRole">
      <option value="producer">🟢 執行製作人（時程與資源）</option>
      <option value="engineer">🔵 首席工程師（形式／平台）</option>
      <option value="marketing">🟣 行銷主管（客群／情感訴求）</option>
      <option value="creative">🔴 創意總監（類型 × 台南文化元素）</option>
    </select>
    <label>卡片內容（例如：夜市攤販／獵奇感，或 直播互動遊戲）</label>
    <input type="text" id="addV" maxlength="60" placeholder="卡片內容，60字以內">
    <label>一句補充說明（選填）</label>
    <textarea id="addNote" maxlength="200" style="min-height:60px" placeholder="這張卡在提示什麼、怎麼用"></textarea>
    <button id="addBtn">加進卡池</button>
    <div class="st" id="addStatus"></div>
  </div>

  <div class="lookupbox">
    <h2>🔍 查我抽過哪些卡</h2>
    <div class="row">
      <input type="number" id="lookupEnv" min="1" max="60" placeholder="輸入你的編號">
      <button id="lookupBtn">查詢</button>
    </div>
    <div class="result" id="lookupResult"></div>
  </div>

  <div id="sections"></div>
</div>
<script>
const PRODUCER = [
  {v:"30分鐘／只能純聊天講故事／新手一人", d:"時程與資源", note:"沒有工具可用，只能用嘴巴把遊戲講成一個故事，逼你想清楚核心體驗是什麼。"},
  {v:"1天／Gemini免費額度／新手一人", d:"時程與資源", note:"一天內只夠做出最小可玩雛形，別想著做完整內容。"},
  {v:"3天／Gemini免費額度／兩個新手", d:"時程與資源", note:"多一個人手，但都沒經驗，分工比技術更重要。"},
  {v:"1週／AI Studio額度／一個有經驗", d:"時程與資源", note:"有個懂AI工具的人帶路，一週足夠做出可以展示的prototype。"},
  {v:"2週／Claude Code訂閱／兩個有經驗", d:"時程與資源", note:"資源最寬裕的組合，可以真的把功能做出來，不只是紙上談兵。"},
  {v:"1學期／全部工具開放／團隊支援", d:"時程與資源", note:"這是這門課實際的資源規模——用這張卡想像最終成品可以做到多完整。"},
  {v:"現場5分鐘／無限資源／傳說等級", d:"時程與資源", note:"故意荒謬的組合：資源無限但時間逼死人，練習「先講重點」的能力。"},
];
const ENGINEER = [
  {v:"手機直向 App", d:"形式／平台", note:"單手滑、通勤也能玩，介面要簡單、關卡要短。"},
  {v:"網頁互動小說", d:"形式／平台", note:"純文字＋選擇分支，不用畫面資源就能做出敘事深度。"},
  {v:"實境走讀 App（AR疊圖）", d:"形式／平台", note:"玩家要實際走到那個地點才能觸發內容，適合結合真實的台南場景。"},
  {v:"桌遊 Print & Play", d:"形式／平台", note:"印出來就能玩，不用寫程式，考驗規則設計本身夠不夠有趣。"},
  {v:"對話式聊天機器人", d:"形式／平台", note:"整個遊戲就是一場對話，玩法藏在你怎麼設計AI的回應邏輯裡。"},
  {v:"短影音互動劇", d:"形式／平台", note:"像抖音一樣滑，每支影片是一個選擇點，適合快節奏的敘事。"},
  {v:"語音導覽＋關卡", d:"形式／平台", note:"用耳朵玩的遊戲，畫面不重要，聲音設計跟節奏才是關鍵。"},
  {v:"迷宮解謎印刷單張", d:"形式／平台", note:"一張紙搞定，適合在課堂現場立刻發下去測試。"},
  {v:"教室黑板真人版", d:"形式／平台", note:"完全不用任何載具，靠肢體和口頭規則就要讓遊戲成立。"},
];
const MARKETING = [
  {v:"國小校外教學團 ／ 好奇心", d:"客群／情感訴求", note:"要讓沒有耐心的小朋友願意一直玩，規則要秒懂。"},
  {v:"觀光客 ／ 打卡拍照慾", d:"客群／情感訴求", note:"玩家想要的是「拍出來好看」，遊戲要製造上鏡的瞬間。"},
  {v:"在地阿公阿嬤 ／ 懷舊感", d:"客群／情感訴求", note:"要喚起記憶中的台南，而不是介紹一個陌生城市給他們認識。"},
  {v:"大學生揪團 ／ 競爭好勝", d:"客群／情感訴求", note:"要有排行榜或PK機制，讓朋友之間可以互相比較。"},
  {v:"家庭親子 ／ 溫馨陪伴", d:"客群／情感訴求", note:"大人小孩都要能一起玩，不能只顧一邊的程度。"},
  {v:"恐怖片愛好者 ／ 驚嚇刺激", d:"客群／情感訴求", note:"要能把台南的老屋、傳說轉成真的會讓人心跳加速的東西。"},
  {v:"美食愛好者 ／ 口水直流", d:"客群／情感訴求", note:"用視覺和描述勾起食慾，小吃不只是背景是主角。"},
  {v:"歷史控 ／ 考據癖", d:"客群／情感訴求", note:"這群人會挑你的考據錯誤，內容細節要禁得起檢驗。"},
  {v:"隨便路過的人 ／ 五分鐘殺時間", d:"客群／情感訴求", note:"完全沒有動機，遊戲要在前10秒就抓住他，不然直接關掉。"},
];
const CREATIVE = [
  {v:"解謎 × 五條港", d:"類型 × 台南文化元素", note:"用五條港的貿易路線、水道結構本身當謎題素材。"},
  {v:"模擬經營 × 廟宇遶境", d:"類型 × 台南文化元素", note:"玩家要管理一場遶境活動的人力、路線、香火資源。"},
  {v:"恐怖 × 老屋", d:"類型 × 台南文化元素", note:"老屋的歷史感本身就是恐怖素材，不用硬加鬼怪。"},
  {v:"節奏音樂 × 度小月／小吃", d:"類型 × 台南文化元素", note:"配合打拍子動作模擬「做小吃」的節奏感（切、煮、擺盤）。"},
  {v:"卡牌對戰 × 小封神神怪", d:"類型 × 台南文化元素", note:"把小封神裡的神怪角色設計成有屬性、技能的對戰卡片。"},
  {v:"收集養成 × 運河生態", d:"類型 × 台南文化元素", note:"蒐集運河沿岸的生物或地景，養成/圖鑑式的長期黏著。"},
  {v:"派對遊戲 × 孔廟／文昌祠", d:"類型 × 台南文化元素", note:"多人同樂、輕鬆競賽，用考生拜文昌帝君的情境包裝。"},
  {v:"敘事抉擇 × 安平古堡", d:"類型 × 台南文化元素", note:"用古堡的歷史轉折（荷蘭/明鄭/清）設計玩家的分支選擇。"},
  {v:"潛行動作 × 中西區巷弄", d:"類型 × 台南文化元素", note:"利用巷弄的狹窄、轉角、視線死角設計躲避/潛行關卡。"},
];
const SECTIONS = [
  {key:"producer", title:"🟢 執行製作人", deck:PRODUCER, dfl:"時程與資源"},
  {key:"engineer", title:"🔵 首席工程師", deck:ENGINEER, dfl:"形式／平台"},
  {key:"marketing", title:"🟣 行銷主管", deck:MARKETING, dfl:"客群／情感訴求"},
  {key:"creative", title:"🔴 創意總監", deck:CREATIVE, dfl:"類型 × 台南文化元素"},
];

const firebaseConfig = {
  apiKey: "AIzaSyBwPR0oE5VK0eBlqq8JY1B56UXy3R9cyng",
  authDomain: "gen-lang-client-0929530380.firebaseapp.com",
  databaseURL: "https://gen-lang-client-0929530380-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gen-lang-client-0929530380",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const NS = "whgm";
const custom = {producer:[], engineer:[], marketing:[], creative:[]};

const root = document.getElementById("sections");
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// 全班抽卡紀錄——用來算「這張卡被抽過幾次」＋查某個編號抽過哪些卡
let allRounds = {};
let usageCount = {}; // `${role}::${cardValue}` -> 次數

function recomputeUsage() {
  usageCount = {};
  Object.values(allRounds).forEach(r => {
    Object.entries(r.players || {}).forEach(([env, p]) => {
      const card = (r.cards || {})[p.role];
      if (!card) return;
      const key = p.role + "::" + card.v;
      usageCount[key] = (usageCount[key] || 0) + 1;
    });
  });
}

function renderAll() {
  root.innerHTML = "";
  SECTIONS.forEach(s => {
    const customList = custom[s.key] || [];
    const total = s.deck.length + customList.length;
    const sec = document.createElement("div");
    sec.className = "section";
    const badge = (v) => {
      const n = usageCount[s.key + "::" + v] || 0;
      return n > 0 ? `<div class="usebadge">🎲 全班已抽過 ${n} 次</div>` : "";
    };
    const baseHtml = s.deck.map(c =>
      `<div class="cardbox ${s.key}"><div class="v">${escapeHtml(c.v)}</div><div class="d">${escapeHtml(c.d)}</div><div class="note">💡 ${escapeHtml(c.note)}</div>${badge(c.v)}</div>`
    ).join("");
    const customHtml = customList.map(c =>
      `<div class="cardbox ${s.key} custom"><div class="v">${escapeHtml(c.v)}</div><div class="d">${escapeHtml(c.d)}</div>${c.note ? `<div class="note">💡 ${escapeHtml(c.note)}</div>` : ""}<div class="by">✨ #${c.addedBy} 新增</div>${badge(c.v)}</div>`
    ).join("");
    sec.innerHTML = `<h2>${s.title}</h2><div class="n">${total} 張卡（含 ${customList.length} 張同學新增）</div>` +
      `<div class="cardgrid">${baseHtml}${customHtml}</div>`;
    root.appendChild(sec);
  });
}

SECTIONS.forEach(s => {
  db.ref(`${NS}/customCards/${s.key}`).on("value", snap => {
    custom[s.key] = Object.values(snap.val() || {});
    renderAll();
  });
});
db.ref(`${NS}/rounds`).on("value", snap => {
  allRounds = snap.val() || {};
  recomputeUsage();
  renderAll();
});
renderAll();

const ROLE_TITLE = {producer:"🟢 執行製作人", engineer:"🔵 首席工程師", marketing:"🟣 行銷主管", creative:"🔴 創意總監"};
document.getElementById("lookupBtn").onclick = () => {
  const env = parseInt(document.getElementById("lookupEnv").value, 10);
  const resEl = document.getElementById("lookupResult");
  if (!env || env < 1 || env > 60) { resEl.textContent = "請輸入 1-60 的編號"; return; }
  const hits = [];
  Object.values(allRounds).forEach(r => {
    const p = (r.players || {})[env];
    if (!p) return;
    const card = (r.cards || {})[p.role];
    if (!card) return;
    hits.push({role: p.role, v: card.v, t: r.createdAt});
  });
  hits.sort((a, b) => a.t - b.t);
  if (!hits.length) { resEl.innerHTML = `<div class="hit">#${env} 還沒有抽過任何卡</div>`; return; }
  resEl.innerHTML = `<div style="margin-bottom:6px">#${env} 總共玩過 ${hits.length} 輪：</div>` +
    hits.map((h, i) => `<div class="hit">第${i+1}輪　${ROLE_TITLE[h.role]}：${escapeHtml(h.v)}</div>`).join("");
};

document.getElementById("addBtn").onclick = () => {
  const env = parseInt(document.getElementById("addEnv").value, 10);
  const role = document.getElementById("addRole").value;
  const v = document.getElementById("addV").value.trim();
  const note = document.getElementById("addNote").value.trim();
  const statusEl = document.getElementById("addStatus");
  if (!env || env < 1 || env > 60) { statusEl.textContent = "請輸入你的編號（1-60）"; return; }
  if (!v) { statusEl.textContent = "請輸入卡片內容"; return; }
  const dfl = SECTIONS.find(s => s.key === role).dfl;
  const data = {v, d: dfl, addedBy: env, t: Date.now()};
  if (note) data.note = note;
  db.ref(`${NS}/customCards/${role}`).push(data)
    .then(() => {
      statusEl.textContent = "✅ 新卡已加入卡池，其他人可能會抽到囉！";
      document.getElementById("addV").value = "";
      document.getElementById("addNote").value = "";
    })
    .catch(e => { statusEl.textContent = "送出失敗：" + e.message; });
};
</script>
</body>
</html>
