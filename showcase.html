<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>文化遊戲松 · 大家的作品輪播</title>
<style>
  :root{
    --bg:#faf8f2; --panel:#ffffff; --panel2:#f2efe4; --ink:#2b2820; --ink-soft:#5c5648;
    --line:#ddd7c6; --accent:#c2711f;
    --green:#3f7a34; --green-soft:#e9f3e3;
    --blue:#2f6690; --blue-soft:#e5eff6;
    --purple:#7a3f92; --purple-soft:#f2e7f6;
    --red:#b8452f; --red-soft:#fbe9e3;
    --shadow:0 1px 2px rgba(40,32,10,.06), 0 6px 18px rgba(40,32,10,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
       overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  button{font:inherit;color:inherit}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 20px 0;color:var(--ink-soft);font-size:15px;font-weight:700}
  .top a{color:var(--accent);text-decoration:none}
  .top .count{font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
  .bar{height:6px;background:var(--panel2);margin:10px 20px 0;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 20px;min-height:0}
  .card{width:100%;max-width:1500px;background:var(--panel);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);
        padding:clamp(18px,3vw,56px);display:flex;flex-direction:column;gap:clamp(12px,1.6vw,26px);
        opacity:1;transition:opacity .35s ease;max-height:100%;overflow:hidden}
  .card.out{opacity:0}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border-radius:999px;padding:6px 16px;font-size:clamp(13px,1.15vw,22px);font-weight:800;background:var(--panel2);color:var(--ink-soft)}
  .chip.wk{background:var(--accent);color:#fff}
  .chip.green{background:var(--green-soft);color:var(--green)}
  .chip.blue{background:var(--blue-soft);color:var(--blue)}
  .chip.purple{background:var(--purple-soft);color:var(--purple)}
  .chip.red{background:var(--red-soft);color:var(--red)}
  .title{margin:0;font-weight:800;line-height:1.25;overflow-wrap:anywhere;font-size:clamp(26px,3.2vw,64px)}
  .body{margin:0;line-height:1.55;overflow-wrap:anywhere;font-size:clamp(19px,1.9vw,38px);
        display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
  .lines{display:grid;gap:clamp(8px,1vw,18px);margin:0;padding:0;list-style:none}
  .lines li{background:var(--panel2);border-radius:18px;padding:clamp(10px,1.2vw,20px) clamp(14px,1.6vw,28px);
            font-size:clamp(19px,1.9vw,38px);line-height:1.45;overflow-wrap:anywhere}
  .lines b{display:block;color:var(--accent);font-size:.6em;margin-bottom:2px}
  .by{margin-top:auto;color:var(--ink-soft);font-weight:800;font-size:clamp(15px,1.4vw,26px)}
  @media (min-width:900px){
    .title{font-size:clamp(48px,3.4vw,68px)}
    .body,.lines li{font-size:clamp(32px,2vw,40px)}
  }
  .empty,.err{max-width:900px;text-align:center;color:var(--ink-soft);font-size:clamp(20px,2.4vw,40px);line-height:1.6;padding:24px}
  .err button,.empty button{margin-top:18px}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px 14px 14px;transition:opacity .3s}
  .ctl .grp{display:flex;gap:6px;align-items:center}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer;min-height:40px}
  .btn:hover{border-color:var(--accent)}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.small{padding:6px 10px;font-size:13px;min-height:32px}
  .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
  .hide-btn{position:fixed;right:12px;bottom:12px;opacity:.55;border:1px dashed var(--line);background:var(--panel);border-radius:10px;
            font-size:13px;padding:6px 10px;cursor:pointer;z-index:5}
  .hide-btn:hover{opacity:1}
  @media (max-width:700px){.ctl{padding-bottom:58px}.top{font-size:13px}}
  body.fs.idle .ctl,body.fs.idle .top,body.fs.idle .hide-btn{opacity:0;pointer-events:none}
  body.fs.idle{cursor:none}
</style>
</head>
<body>
<div class="top">
  <span>文化遊戲松 · 大家做出來的東西（名字都藏起來了）</span>
  <span class="count" id="count"></span>
</div>
<div class="bar"><i id="prog"></i></div>
<div class="stage" id="stage"></div>

<div class="ctl" id="ctl">
  <div class="grp" id="filters"></div>
  <span class="sep"></span>
  <div class="grp">
    <button class="btn" id="prev" title="上一張（←）">◀ 上一張</button>
    <button class="btn" id="pp" title="暫停／繼續（空白鍵）">⏸ 暫停</button>
    <button class="btn" id="next" title="下一張（→）">下一張 ▶</button>
  </div>
  <span class="sep"></span>
  <div class="grp" id="speeds"></div>
  <span class="sep"></span>
  <div class="grp">
    <button class="btn" id="fs" title="全螢幕（F）">全螢幕</button>
    <button class="btn small" id="unhide" hidden>還原隱藏的卡</button>
  </div>
</div>
<button class="hide-btn" id="hidecard" title="只在這台電腦跳過這一張，不影響別人">這張不要</button>

<script src="showcase_deid.js?v=202611041000"></script>
<script>
(function () {
  'use strict';
  var D = window.ShowcaseDeid;
  var DB = 'https://gen-lang-client-0929530380-default-rtdb.asia-southeast1.firebasedatabase.app/whgm';
  var REFRESH_MS = 60000;        // 每 60 秒更新
  var NESTED_EVERY = 5;          // 以編號分組的節點，每 5 次（5 分鐘）才完整重抓
  var SPEEDS = [['慢', 14000], ['中', 9000], ['快', 5000]];
  var ROLES = ['creative', 'engineer', 'marketing', 'producer'];
  // 唯讀來源：flat＝依時間排序的 push id，可以只抓新的；nested＝依編號分組
  var SOURCES = [
    { id: 'rounds', path: 'rounds', flat: true },
    { id: 'c_creative', path: 'customCards/creative', flat: true },
    { id: 'c_engineer', path: 'customCards/engineer', flat: true },
    { id: 'c_marketing', path: 'customCards/marketing', flat: true },
    { id: 'c_producer', path: 'customCards/producer', flat: true },
    { id: 'w2culture', path: 'customCards/w2culture', flat: true },
    { id: 'jams', path: 'analysis/w2/jams', flat: true },
    { id: 'feedback', path: 'feedback', flat: true },
    { id: 'w2cards', path: 'analysis/w2/cards', flat: false },
    { id: 'cardDesigns', path: 'analysis/w3game/cardDesigns', flat: false }
  ];

  function $(id) { return document.getElementById(id); }
  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // 本機隨機鹽：只存在這台電腦，代號因此無法由原始碼反推
  var salt = safeGet('showcase_salt');
  if (!salt) { salt = Math.random().toString(36).slice(2) + Date.now().toString(36); safeSet('showcase_salt', salt); }
  var hidden = {};
  try { (JSON.parse(safeGet('showcase_hidden') || '[]') || []).forEach(function (k) { hidden[k] = 1; }); } catch (e) {}

  var raw = {};            // 各來源的原始資料
  var lastKey = {};        // flat 來源最後一個 key
  var all = [];            // 全部可顯示的卡
  var skipped = {};
  var week = 'all';
  var speedIdx = 1;
  var paused = false;
  var elapsed = 0;
  var idx = 0;
  var cur = null;          // 目前卡片物件
  var tick = 0;
  var stats = { bytes: 0, requests: 0, log: [], shown: [] };
  window.__showcase = { stats: stats, get cards() { return all; }, get skipped() { return skipped; }, get current() { return cur; } };

  // ---------- 讀取（唯讀 REST） ----------
  function fetchJson(path, query) {
    var url = DB + '/' + path + '.json' + (query || '');
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      var n = new TextEncoder().encode(t).length;
      stats.bytes += n; stats.requests++;
      stats.log.push({ path: path, q: query || '', bytes: n });
      return JSON.parse(t);
    });
  }
  function fullFetch(src) {
    return fetchJson(src.path).then(function (d) {
      raw[src.id] = d || (src.flat ? {} : null);
      if (src.flat && d) { var ks = Object.keys(d).sort(); lastKey[src.id] = ks[ks.length - 1]; }
    });
  }
  function incFetch(src) {
    var lk = lastKey[src.id];
    if (!lk) return fullFetch(src);
    var q = '?orderBy=%22%24key%22&startAt=' + encodeURIComponent('"' + lk + '"');
    return fetchJson(src.path, q).then(function (d) {
      if (!d) return;
      raw[src.id] = raw[src.id] || {};
      Object.keys(d).forEach(function (k) { raw[src.id][k] = d[k]; });
      var ks = Object.keys(raw[src.id]).sort(); lastKey[src.id] = ks[ks.length - 1];
    });
  }
  function load(first) {
    tick++;
    var doNested = first || tick % NESTED_EVERY === 0;
    var jobs = SOURCES.map(function (s) {
      if (first) return fullFetch(s).then(ok, bad(s));
      if (s.flat) return incFetch(s).then(ok, bad(s));
      return doNested ? fullFetch(s).then(ok, bad(s)) : Promise.resolve(ok());
    });
    var fails = [];
    function ok() { return true; }
    function bad(s) { return function (e) { fails.push(s.id + ':' + e.message); return false; }; }
    return Promise.all(jobs).then(function () {
      rebuild();
      return fails;
    });
  }

  // ---------- 組卡 ----------
  function rebuild() {
    var data = {
      rounds: raw.rounds, w2culture: raw.w2culture, jams: raw.jams, w2cards: raw.w2cards,
      cardDesigns: raw.cardDesigns, feedback: raw.feedback,
      custom: { creative: raw.c_creative, engineer: raw.c_engineer, marketing: raw.c_marketing, producer: raw.c_producer }
    };
    var res = D.buildCards(data, { salt: salt });
    skipped = res.skipped;
    var prevKey = cur && cur.key;
    all = D.interleave(res.cards);
    renderFilters();
    var list = visible();
    if (prevKey) { var i = list.findIndex(function (c) { return c.key === prevKey; }); if (i >= 0) idx = i; }
    if (!cur) show(0, true); else updateCount();
    if (!list.length) showEmpty();
  }
  function visible() {
    return all.filter(function (c) { return !hidden[c.key] && (week === 'all' || String(c.week) === String(week)); });
  }

  // ---------- 顯示 ----------
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function renderCard(c) {
    var h = '<div class="chips">' + c.chips.map(function (x) { return '<span class="chip ' + x.cls + '">' + esc(x.t) + '</span>'; }).join('') + '</div>';
    h += '<h1 class="title">' + esc(c.title) + '</h1>';
    if (c.lines) h += '<ul class="lines">' + c.lines.map(function (l) { return '<li><b>' + esc(l.label) + '</b>' + esc(l.text) + '</li>'; }).join('') + '</ul>';
    else if (c.body) h += '<p class="body">' + esc(c.body) + '</p>';
    h += '<div class="by">' + esc(c.author) + '</div>';
    return h;
  }
  function updateCount() {
    var n = visible().length;
    $('count').textContent = n ? ((idx + 1) + ' / ' + n) : '';
    $('unhide').hidden = !Object.keys(hidden).length;
  }
  function show(i, instant) {
    var list = visible();
    if (!list.length) { cur = null; showEmpty(); return; }
    idx = ((i % list.length) + list.length) % list.length;
    var c = list[idx];
    var stage = $('stage');
    function put() {
      stage.innerHTML = '<article class="card" data-key="' + c.key + '" data-type="' + c.type + '" data-src="' + c.src + '">' + renderCard(c) + '</article>';
      cur = c; elapsed = 0; updateCount();
      stats.shown.push({ type: c.type, src: c.src, week: c.week, title: c.title });
    }
    var old = stage.firstElementChild;
    if (old && old.classList.contains('card') && !instant) {
      old.classList.add('out'); setTimeout(put, 300);
    } else put();
  }
  function showEmpty() {
    var msg = week === 'all' ? '這週還沒有人交，先去玩一輪，你的作品就會出現在這裡。' : '這個週次還沒有可以展示的作品，先看看別週的吧。';
    $('stage').innerHTML = '<div class="empty">' + msg + '<br><button class="btn" id="retry0">重新整理</button></div>';
    $('retry0').onclick = function () { start(); };
    $('count').textContent = ''; cur = null;
  }
  function showError(fails) {
    $('stage').innerHTML = '<div class="err">資料讀取失敗（' + esc(fails.slice(0, 2).join('、')) + '）。<br>可能是網路不穩，等一下再試一次。<br><button class="btn on" id="retry1">重試</button></div>';
    $('retry1').onclick = function () { start(); };
    $('count').textContent = '';
  }

  // ---------- 控制 ----------
  function renderFilters() {
    var weeks = {};
    all.forEach(function (c) { if (!hidden[c.key]) weeks[c.week] = 1; });
    var opts = [['all', '全部']].concat(Object.keys(weeks).sort(function (a, b) { return a - b; }).map(function (w) { return [w, '第' + w + '週']; }));
    $('filters').innerHTML = opts.map(function (o) { return '<button class="btn' + (String(week) === o[0] ? ' on' : '') + '" data-w="' + o[0] + '">' + o[1] + '</button>'; }).join('');
  }
  function renderSpeeds() {
    $('speeds').innerHTML = '<span style="font-size:14px;color:var(--ink-soft);font-weight:700">速度</span>' +
      SPEEDS.map(function (s, i) { return '<button class="btn' + (i === speedIdx ? ' on' : '') + '" data-s="' + i + '">' + s[0] + '</button>'; }).join('');
  }
  function setPaused(p) { paused = p; $('pp').textContent = p ? '▶ 繼續' : '⏸ 暫停'; $('pp').classList.toggle('on', p); }
  function next(d) { show(idx + d); }
  function toggleFs() {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  }
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    if (document.fullscreenElement) idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3500);
  }
  document.addEventListener('fullscreenchange', function () {
    document.body.classList.toggle('fs', !!document.fullscreenElement); wake();
  });
  ['mousemove', 'mousedown', 'touchstart'].forEach(function (e) { document.addEventListener(e, wake, { passive: true }); });

  $('filters').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    week = b.getAttribute('data-w'); idx = 0; renderFilters(); show(0, true);
  });
  $('speeds').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    speedIdx = +b.getAttribute('data-s'); renderSpeeds();
  });
  $('prev').onclick = function () { next(-1); };
  $('next').onclick = function () { next(1); };
  $('pp').onclick = function () { setPaused(!paused); };
  $('fs').onclick = toggleFs;
  $('hidecard').onclick = function () {
    if (!cur) return;
    hidden[cur.key] = 1; safeSet('showcase_hidden', JSON.stringify(Object.keys(hidden)));
    var i = idx; cur = null; renderFilters(); show(i, true);
  };
  $('unhide').onclick = function () {
    hidden = {}; safeSet('showcase_hidden', '[]'); rebuild();
  };
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { next(1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { next(-1); e.preventDefault(); }
    else if (e.key === ' ' || e.code === 'Space') { setPaused(!paused); e.preventDefault(); }
    else if (e.key === 'f' || e.key === 'F') { toggleFs(); }
    wake();
  });

  // 計時：每 100 毫秒累加，暫停時不動
  setInterval(function () {
    if (paused || !cur) { return; }
    elapsed += 100;
    var dur = SPEEDS[speedIdx][1];
    $('prog').style.width = Math.min(100, elapsed / dur * 100) + '%';
    if (elapsed >= dur) next(1);
  }, 100);

  // ---------- 啟動與定時更新 ----------
  function start() {
    $('stage').innerHTML = '<div class="empty">正在讀取大家的作品…</div>';
    load(true).then(function (fails) {
      if (fails.length && !all.length) showError(fails);
      else if (!all.length) showEmpty();
    }, function (e) { showError([String(e && e.message || e)]); });
  }
  setInterval(function () {
    if (document.hidden) return;
    load(false).catch(function () {});
  }, REFRESH_MS);

  renderSpeeds(); renderFilters(); setPaused(false);
  start();
})();
</script>
</body>
</html>
