<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封神廟牌局｜樣板</title>
<meta name="color-scheme" content="dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --tk-surface:#101a33; --tk-panel:#1c2a4d; --tk-ink:#f1e9d2; --tk-muted:#a3b0d3;
  --tk-accent:#e0b84a; --tk-accent-ink:#101a33; --tk-line:#3b4c7e;
  --tk-font-title:"Chiron Sung HK","Noto Serif TC","Songti TC","PMingLiU",serif;
  --tk-font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --tk-radius:10px; --tk-shadow:0 3px 0 var(--tk-line);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--tk-surface);color:var(--tk-ink);font:16px/1.55 var(--tk-font-body);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(color-mix(in srgb,var(--tk-ink) 16%,transparent) 1px,transparent 1.6px);background-size:30px 30px}
#app{max-width:520px;margin:0 auto;padding:10px 12px 40px}
h1,h2,h3{font-family:var(--tk-font-title);font-weight:700;letter-spacing:.04em}
h1{font-size:21px;margin:0;color:var(--tk-accent)}
h2{font-size:18px;margin:14px 0 6px}
h3{font-size:15px;margin:10px 0 4px;color:var(--tk-accent)}
p{margin:6px 0}
.small{font-size:13px;color:var(--tk-muted)}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.banner{font-size:12.5px;color:var(--tk-muted);background:var(--tk-panel);border:1px solid var(--tk-line);border-radius:var(--tk-radius);padding:6px 10px;margin:8px 0}
button,.btn{font:inherit;min-height:44px;padding:8px 14px;border-radius:var(--tk-radius);border:1px solid var(--tk-line);background:var(--tk-panel);color:var(--tk-ink);cursor:pointer;touch-action:manipulation;box-shadow:var(--tk-shadow)}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible{outline:3px solid var(--tk-accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--tk-line);border-radius:var(--tk-radius);overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:var(--tk-panel);box-shadow:none}
.seg button.on{background:var(--tk-accent);color:var(--tk-accent-ink);font-weight:700}
.box{background:var(--tk-panel);border:1px solid var(--tk-line);border-radius:var(--tk-radius);padding:10px 12px;margin:10px 0;outline:1px solid color-mix(in srgb,var(--tk-accent) 50%,transparent);outline-offset:-5px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;background:var(--tk-panel);border:2px solid var(--tk-line);border-radius:var(--tk-radius);padding:4px;text-align:center;min-height:44px;display:block;width:100%}
.tile.sel{border-color:var(--tk-accent);box-shadow:0 0 0 2px var(--tk-accent) inset}
.tile svg{display:block;width:100%;height:auto;border-radius:6px}
.tile .nm{font-family:var(--tk-font-title);font-weight:700;font-size:14px;line-height:1.25;margin-top:2px}
.tile .st{font-size:12px;color:var(--tk-muted)}
.badge{position:absolute;top:6px;left:6px;font-size:11px;background:var(--tk-surface);color:var(--tk-accent);border:1px solid var(--tk-accent);border-radius:6px;padding:0 5px;line-height:18px}
.chip{display:inline-block;font-size:12.5px;background:var(--tk-surface);border:1px solid var(--tk-line);border-radius:999px;padding:1px 9px;margin:2px 3px 2px 0}
.chip.plus{background:color-mix(in srgb,var(--tk-accent) 28%,var(--tk-surface));border-color:var(--tk-accent)}
.chip.minus{border-style:dashed;color:var(--tk-muted)}
.hrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:6px 0;padding:6px 8px;border:2px solid var(--tk-line);border-radius:var(--tk-radius);background:var(--tk-panel);min-height:56px}
.hrow.sel{border-color:var(--tk-accent)}
.hrow svg{width:38px;height:46px;flex:none;border-radius:5px}
.hrow .t{flex:1;min-width:0}
.hrow .t b{display:block;font-size:15px}
.hrow .t span{font-size:12.5px;color:var(--tk-muted)}
.slot{border:2px dashed var(--tk-line);border-radius:var(--tk-radius);padding:8px;min-height:56px;display:flex;align-items:center;gap:8px}
.slot svg{width:34px;height:41px;border-radius:5px;flex:none}
.pts{display:flex;gap:6px;font-size:20px;color:var(--tk-accent)}
.score{font-family:var(--tk-font-title);font-size:26px;font-weight:800;color:var(--tk-accent)}
.good{color:var(--tk-accent)}.bad{color:var(--tk-muted)}.warn{color:var(--tk-accent)}
.rl{border-left:4px solid var(--tk-line);padding:2px 0 2px 8px;margin:6px 0;font-size:14px}
.rl.p{border-color:var(--tk-accent)}.rl.n{border-left-style:dashed;border-color:var(--tk-muted)}
.tag{font-size:11.5px;border:1px solid var(--tk-line);border-radius:5px;padding:0 5px;color:var(--tk-muted);margin-left:4px;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border-bottom:1px solid var(--tk-line);padding:4px 4px;text-align:left;vertical-align:top}
details>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.err{background:var(--tk-surface);color:var(--tk-ink);border:2px dashed var(--tk-accent);border-radius:var(--tk-radius);padding:8px 10px;font-size:13.5px;margin:8px 0}
.skinchip{display:inline-block;font-weight:800;border-radius:6px;padding:0 6px;color:var(--tk-accent-ink);background:var(--tk-accent)}
.t火{background:var(--tk-accent)}.t木{background:var(--tk-ink)}.t水{background:var(--tk-muted)}
.pick{min-height:44px}.pick.on{outline:3px solid var(--tk-accent)}
input[type=file]{display:none}
.mute{flex:0 0 44px;padding:0}
@media (max-width:420px){.grid{gap:6px}}
</style>
</head>

    rec.ev.res[0].lines.concat(rec.ev.res[1].lines).forEach(l => { if (l.r && (l.k === "rel") && (!best || Math.abs(l.d) > Math.abs(best.l.d) || (Math.abs(l.d) === Math.abs(best.l.d) && l.r.void_all))) best = { rec, l }; });
  }
  const names = b.log.map(r => r.my.main && r.my.main.name).filter(Boolean);
  if (!best) return "這場沒有任何一條相剋出場，兩邊只比硬實力。故事還沒有長出來——下一場試試讓兩張有淵源的牌站在一起。";
  const r = best.l.r;
  const who = (best.rec.ev.res[0].lines.indexOf(best.l) >= 0) ? "你" : "對手";
  return "第 " + best.rec.round + " 合，" + who + "靠「" + r.name + "」" + (r.void_all ? "讓所有關係都作廢" : (r.steal ? "把法器搶了過來" : "多拿了分數")) + "——" + r.text.replace(/。$/, "") + "。" + (myWon ? "你贏了這場。" : "這場你輸了，但你知道下次該帶哪張牌。");
}

/* ◆ 模組 4／8 空間＋6／8 事件選擇＋7／8 勝負：一輪遊戲（收集 → 出陣 → 對戰 → 抽新卡） */
function newRun() {
  S = { coll: DATA.start.slice(), stage: 0, wins: 0, final: false, lastLineup: [], history: [], relHits: {} };
  UI.sel = []; UI.screen = "collect"; UI.msg = "";
  autoPick();
}
function autoPick() {
  const n = DATA.rules.lineup_size;
  const sorted = S.coll.map(id => CARDS[id]).sort((a, b) => ((isGod(b) ? b.power : (b.bonus || 0) + 1) - cost(b) * .3) - ((isGod(a) ? a.power : (a.bonus || 0) + 1) - cost(a) * .3));
  const gods = sorted.filter(isGod).slice(0, 3), rest = sorted.filter(c => gods.indexOf(c) < 0).slice(0, n - gods.length);
  UI.sel = gods.concat(rest).slice(0, n).map(c => c.id);
}
function rewardChoices() {
  const pool = DATA.cards.filter(c => S.coll.indexOf(c.id) < 0 && c.id !== DATA.final.win_card);
  return shuffle(pool).slice(0, DATA.rules.reward_choices).map(c => c.id);
}
function applyLossPenalty() {
  const v = V();
  if (v.loss_penalty !== "lowest_root" || S.coll.length <= DATA.rules.min_collection) return null;
  const gods = B.me.playedGods.filter(c => S.coll.indexOf(c.id) >= 0);
  if (!gods.length) return null;
  gods.sort((a, b) => a.root - b.root);
  const g = gods[0];
  S.coll = S.coll.filter(id => id !== g.id);
  return g;
}

/* ◆ 模組 8／8 回饋：聲音（預設靜音；取消靜音才建立 AudioContext） */
function tone(f, d, type, vol, delay) {
  if (MUTED) return;
  if (!ACX) { try { ACX = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  const t0 = ACX.currentTime + (delay || 0), o = ACX.createOscillator(), g = ACX.createGain();
  o.type = type || "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.min(vol || .12, .2), t0 + .01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(ACX.destination); o.start(t0); o.stop(t0 + d + .02);
}
function sfx(kind) {
  if (MUTED) return;
  const rich = VER === "culture";
  if (kind === "tap") return tone(rich ? 520 : 440, .06, rich ? "triangle" : "square", .08);
  if (kind === "win") return rich ? [392, 523, 659, 784].forEach((f, i) => tone(f, .35, "triangle", .12, i * .09)) : [440, 550].forEach((f, i) => tone(f, .12, "square", .08, i * .1));
  if (kind === "lose") return rich ? [330, 262, 196].forEach((f, i) => tone(f, .4, "sawtooth", .07, i * .12)) : tone(200, .25, "square", .08);
  if (kind === "culture") { if (rich) { tone(180, .9, "sine", .16); tone(181.5, .9, "sine", .12); tone(540, .5, "triangle", .06, .02); } else tone(660, .08, "square", .06); }
}

}
function softRefreshBattle() {
  // 手牌選擇時只換內容，不跳回頁首
  const y = window.scrollY; const app = $("#app");
  app.innerHTML = MOD["核心動作"].render(S); window.scrollTo(0, y);
}

/* ◆ 模組 1／8 核心動作：操作 */
function placeCard(c) {
  if (UI.pickMain === c) { UI.pickMain = null; return; }
  if (UI.pickAtt === c) { UI.pickAtt = null; return; }
  const left = B.me.incense;
  if (isGod(c) && !UI.pickMain) { UI.pickMain = c; }
  else if (!UI.pickAtt) { UI.pickAtt = c; }
  else if (isGod(c) && !UI.pickMain) UI.pickMain = c;
  else UI.pickAtt = c;
  UI.msg = "";
  if (cost(UI.pickMain) + cost(UI.pickAtt) > left) { UI.msg = "香火不夠：這兩張要 " + (cost(UI.pickMain) + cost(UI.pickAtt)) + " 點，你只剩 " + left + " 點。"; if (UI.pickAtt === c) UI.pickAtt = null; else UI.pickMain = null; }
}
function startStage() {
  S.lastLineup = UI.sel.slice();
  startBattle(S.stage, UI.sel);
  UI.pickMain = null; UI.pickAtt = null; UI.msg = ""; UI.reward = null; UI.lostCard = null;
  UI.screen = "battle";
}
function onClick(e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act !== "mute") MOD["回饋"].step(S, { type: "sfx", kind: "tap" });
  switch (act) {
    case "mute": MUTED = !MUTED; if (!MUTED) sfx("tap"); render(); return;
    case "ver": VER = t.dataset.v; if (UI.screen === "battle" || UI.screen === "round") { /* 對戰中不切 */ } if (UI.screen === "final" || UI.screen === "result") { S = null; UI.screen = "title"; } if (UI.screen === "collect") { newRun(); } render(); return;
    case "start": newRun(); render(); return;
    case "loadjson": $("#fileIn").click(); return;
    case "tog": { const i = UI.sel.indexOf(id); if (i >= 0) UI.sel.splice(i, 1); else if (UI.sel.length < DATA.rules.lineup_size) UI.sel.push(id); const y = window.scrollY; $("#app").innerHTML = screenCollect(); window.scrollTo(0, y); return; }
    case "auto": MOD["空間"].step(S, { type: "auto" }); render(); return;
    case "fight": MOD["時間回合"].step(S, { type: "start" }); render(); return;
    case "hand": MOD["核心動作"].step(S, { type: "place", card: id === "_filler" ? FILLER : CARDS[id] }); softRefreshBattle(); return;
    case "clear": MOD["核心動作"].step(S, { type: "clear" }); softRefreshBattle(); return;
    case "commit": {
      if (!UI.pickMain) return;
      const rec = MOD["核心動作"].step(S, { type: "commit" });
      if (rec.ev.res[0].lines.concat(rec.ev.res[1].lines).some(l => l.k === "rel" && l.d)) sfx("culture");
      UI.pickMain = UI.pickAtt = null; UI.msg = ""; UI.screen = "round"; render(); return;
    }
    case "next": {
      if (MOD["時間回合"].step(S, { type: "advance" })) { render(); return; }
      UI.reward = null; UI.lostCard = null;
      if (B.outcome === "win") { S.wins++; sfx("win"); }
      else if (B.outcome === "lose") { sfx("lose"); UI.lostCard = MOD["事件選擇"].step(S, { type: "lose" }); }
      UI.screen = "result"; render(); return;
    }
    case "reward": {
      MOD["事件選擇"].step(S, { type: "reward", id: id }); UI.reward = [];
      S.stage++;
      if (S.stage >= DATA.opponents.length) { MOD["勝負"].step(S, { type: "final" }); }
      else { UI.screen = "collect"; UI.sel = S.lastLineup.filter(x => S.coll.indexOf(x) >= 0); if (UI.sel.length < DATA.rules.lineup_size) autoPick(); }
      render(); return;
    }
    case "retry": UI.sel = S.lastLineup.filter(x => S.coll.indexOf(x) >= 0); if (UI.sel.length < DATA.rules.lineup_size) autoPick(); UI.screen = "collect"; render(); return;
    case "restart": newRun(); render(); return;
  }
}

/* ============ 資料載入：http 讀旁邊的 cards.json；雙擊開檔時用內嵌的那份；也可以手動載入 ============ */
async function boot() {
  const embedded = JSON.parse($("#cards-data").textContent);
  let d = embedded;
  if (/^https?:$/.test(location.protocol)) {
    try { const r = await fetch("cards.json", { cache: "no-store" }); if (r.ok) d = await r.json(); } catch (e) { /* 用內嵌的 */ }
  }
  let probs = validateData(d);
  if (probs.length) { UI.problems = probs; d = embedded; }
  Object.keys(MOD).forEach(k => MOD[k].init(d, $("#app")));
  document.addEventListener("click", onClick);
  document.addEventListener("change", e => {
    if (e.target.id !== "fileIn" || !e.target.files[0]) return;
    const fr = new FileReader();
    fr.onload = () => {
      try { const nd = JSON.parse(fr.result), p = validateData(nd); if (p.length) { UI.problems = p; } else { UI.problems = []; setData(nd); } } catch (err) { UI.problems = ["這個檔案不是正確的 JSON：" + err.message]; }
      UI.screen = "title"; render();
    };
    fr.readAsText(e.target.files[0]);
  });
  render();
  window.__cg = { get data() { return DATA; }, cards: () => CARDS, setVer: v => { VER = v; }, ver: () => VER, evaluate, chooseLineup, validateData, newSide, simulate, artSVG, cleanSVG, state: () => ({ S, B, UI }), setData };
}
/* ============ 自動模擬（驗收用：電腦打電腦，不碰畫面） ============ */
function simulate(n, opt) {
  opt = opt || {};
  const out = { games: 0, win: 0, lose: 0, draw: 0, rounds: 0, relHits: {}, perStage: [0, 0, 0].map(() => ({ g: 0, w: 0 })), errors: 0 };
  for (let g = 0; g < n; g++) {
    try {
      let coll = DATA.start.slice();
      for (let st = 0; st < DATA.opponents.length; st++) {
        const pol = opt.policy || "aware";
        // 出陣：挑力高香火低的 5 張，保證至少 1 神明
        const ids = shuffle(coll).slice(0, 12);
        const sorted = ids.map(id => CARDS[id]).sort((a, b) => ((isGod(b) ? b.power : 1) - cost(b) * .3) - ((isGod(a) ? a.power : 1) - cost(a) * .3));
        let lineup = sorted.slice(0, DATA.rules.lineup_size).map(c => c.id);
        if (!lineup.some(id => isGod(CARDS[id]))) lineup[0] = sorted.find(isGod).id;
        startBattle(st, lineup);
        let guard = 0;
        while (!B.done && guard++ < 10) {
          const left = DATA.rules.rounds - B.round + 1;
          const c = chooseLineup(B.me, { main: B.aiShown.main, att: null, pawned: B.ai.pawned }, left, pol);
          const rec = commitRound(c.main, c.att);
          out.rounds++;
          rec.ev.res.forEach(r => r.lines.forEach(l => { if (l.r) out.relHits[l.r.id] = (out.relHits[l.r.id] || 0) + 1; }));
        }
        out.perStage[st].g++;
        if (B.outcome === "win") { out.perStage[st].w++; const pool = DATA.cards.filter(c => coll.indexOf(c.id) < 0 && c.id !== DATA.final.win_card); if (pool.length) coll.push(pool[rnd(pool.length)].id); }
        else { if (B.outcome === "lose") out.lose++; else out.draw++; break; }
        if (st === DATA.opponents.length - 1) out.win++;
      }
      out.games++;
    } catch (e) { out.errors++; out.lastError = String(e && e.stack || e); }
  }
  return out;
}

/* ============ 八個機制模組（名稱與其他樣板同名；每段 init(cfg, root)／step(state, action)／render(state)） ============
   核心動作 讀 rules.lineup_size／incense   出牌：主將＋隨侍
   資源計分 讀 rules、relations            力＋法器＋相剋
   時間回合 讀 rules.rounds／win_points     三合兩勝
   空間     讀 start、rules.lineup_size    收藏格與出陣席位
   角色     讀 cards、opponents            26 張卡與對手牌組
   事件選擇 讀 rules.reward_choices        贏了挑新牌、輸了行政整理
   勝負     讀 final                       三關後的審判
   回饋     讀 meta、rules_text            一句話故事、聲音
   視覺語言只用 :root 的 --tk-* token（surface／panel／ink／muted／accent／accent-ink／line／font-title／font-body／radius／shadow） */
var MOD = {
  "核心動作": {
    init: function (cfg, root) { UI.pickMain = null; UI.pickAtt = null; UI.msg = ""; },
    step: function (state, action) {
      if (action.type === "place") { placeCard(action.card); return null; }
      if (action.type === "clear") { UI.pickMain = UI.pickAtt = null; UI.msg = ""; return null; }
      if (action.type === "commit") return UI.pickMain ? commitRound(UI.pickMain, UI.pickAtt) : null;
      return null;
    },
    render: function (state) { return screenBattle(); }
  },
  "資源計分": {
    init: function (cfg, root) { },
    step: function (state, action) { return action.type === "score" ? evaluate(action.me, action.op) : null; },
    render: function (state) { return previewHTML(); }
  },
  "時間回合": {
    init: function (cfg, root) { B = null; },
    step: function (state, action) {
      if (action.type === "start") { startStage(); return true; }
      if (action.type === "advance") { if (B.done) return false; UI.screen = "battle"; return true; }
      return null;
    },
    render: function (state) { return screenRound(); }
  },
  "空間": {
    init: function (cfg, root) { UI.sel = []; },
    step: function (state, action) { if (action.type === "auto") { autoPick(); return true; } return null; },
    render: function (state) { return screenCollect(); }
  },
  "角色": {
    init: function (cfg, root) { setData(cfg); },
    step: function (state, action) { return action.type === "draw" ? rewardChoices() : null; },
    render: function (state) { return collRows(); }
  },
  "事件選擇": {
    init: function (cfg, root) { UI.reward = null; UI.lostCard = null; },
    step: function (state, action) {
      if (action.type === "reward") { S.coll.push(action.id); return true; }
      if (action.type === "lose") return applyLossPenalty();
      return null;
    },
    render: function (state) { return screenResult(); }
  },
  "勝負": {
    init: function (cfg, root) { },
    step: function (state, action) {
      if (action.type === "final") {
        S.coll.push(DATA.final.win_card); UI.screen = "final"; MOD["回饋"].step(S, { type: "sfx", kind: "win" });
        try { if (window.CT_HOOK) window.CT_HOOK.markPlayed(VER === "culture" ? "rule" : "skin"); } catch (e) { }
        return true;
      }
      return null;
    },
    render: function (state) { return screenFinal(); }
  },
  "回饋": {
    init: function (cfg, root) { MUTED = true; },
    step: function (state, action) { if (action.type === "sfx") { sfx(action.kind); return true; } return null; },
    render: function (state) { return screenTitle(); }
  }
};
boot();
</script>
