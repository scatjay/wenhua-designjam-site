<style>

:root{

  --t-gray1:#7a7a7a; --t-gray2:#5f5f5f; --t-gray3:#949494; --t-gray4:#6c6c6c; --t-gray5:#868686; --t-gray6:#535353;
}
*{box-sizing:border-box}

#app{max-width:520px;margin:0 auto;padding:12px 8px 40px}

.tag{display:inline-block;border:1px solid var(--tk-muted);border-radius:6px;padding:0 6px;font-size:.78rem;margin-right:4px;color:var(--tk-muted)}
.foot{color:var(--tk-muted);font-size:.8rem;margin-top:18px}
.legend{display:grid;grid-template-columns:1fr;gap:4px;font-size:.9rem}.legend div{display:flex;gap:8px;align-items:center}.legend .chip{width:26px;height:26px;font-size:.8rem}
.ach{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ach span{border:2px solid var(--tk-line);border-radius:999px;padding:2px 10px;font-size:.88rem}.ach span.on{background:var(--tk-accent);color:var(--tk-accent-ink)}.ach span.off{opacity:.55}

   空間 space          地圖大小、海在哪一排、相鄰、一橫排＝一條港   boards[].rows/cols/sea_col
   角色 actor          手上的兩塊、每種板塊的名字圖示顏色          tiles、boards[].tiles
   事件選擇 event      第二盤第 9 手立碑、每盤開場章節卡          boards[].stele_turn/stele_text/intro/new
   勝負 verdict        目標分、星等、再蓋一次、結局              boards[].goal、stars、endings、reflect
   回饋 feedback       訊息文字、水與木頭的音效                  place_rules[].why、rules_text
   動作（action）：{type:'go'} 開始這一盤｜{type:'pick',i} 拿起一塊｜{type:'place',t,r,c}｜{type:'discard'}｜{type:'next'} 下一盤｜{type:'retry'} 這一盤再蓋一次

// ===================== 引擎（不碰畫面，可單獨模擬；node 的 _sim.js 只載入這一段） =====================
function readData(id){ var t=document.getElementById(id).textContent.replace(/<!--\/?DATA_(RULE|SKIN)-->/g,''); return E.prep(JSON.parse(t)); }
var RULE_TYPES={adj_any:1,turf:1}, SCORE_TYPES={base:1,per_adj:1,if_adj_all:1}, DIRS={left:1,vertical:1,any:1};
var cur=null;
function Bof(D,S){ return D.boards[S.bi]; }

var Core={ id:'core', name:'核心動作', reads:'place_rules, boards[].rows/cols/sea_col, tiles', cfg:null,
  init:function(cfg,root){ Core.cfg=cfg; },
  canPlace:function(D,S,t,r,c){ var B=Bof(D,S);
    if(r<0||c<0||r>=B.rows||c>=B.cols) return {ok:false,why:'超出地圖了。'};
    if(S.board[r][c]!==null) return {ok:false,why:S.board[r][c]==='sea'?'這一格是海。':'這一格已經有東西了。',occupied:true};
    var rules=(D.place_rules&&D.place_rules[t])||[];
    for(var i=0;i<rules.length;i++){ var R=rules[i];
      if(R.type==='adj_any'){ var hit=false; Space.nbrs(R.dir).forEach(function(d){ var v=Space.at(D,S,S.board,r+d[0],c+d[1]); if(v&&R.of.indexOf(v)>=0) hit=true; }); if(!hit) return {ok:false,why:R.why}; }
      else if(R.type==='turf'){ if(!Event.turfActive(D,S)) continue; var b2=S.board.map(function(x){return x.slice();}); b2[r][c]=t; var rs=Space.rowSurnames(D,S,b2); for(var k=0;k<rs.length;k++){ if(rs[k].length>1) return {ok:false,why:R.why}; } } }
    return {ok:true}; },
  step:function(S,a){ var D=cur; if(S.mode!=='play') return;
    if(a.type==='place'){ var v=Core.canPlace(D,S,a.t,a.r,a.c); S.last=v; if(!v.ok){ S.rejects++; S.ev.push('reject'); return; } S.board[a.r][a.c]=a.t; S.turn++; S.placed++; S.ev.push(a.t==='canal'?'canal':'place'); }
    else if(a.type==='discard'){ S.turn++; S.discards++; S.last={ok:true,discard:true}; S.ev.push('discard'); } }
};
var Space={ id:'space', name:'空間', reads:'boards[].rows/cols/sea_col', cfg:null,
  init:function(cfg,root){ Space.cfg=cfg; },
  at:function(D,S,b,r,c){ var B=Bof(D,S); if(r<0||c<0||r>=B.rows||c>=B.cols) return null; return b[r][c]; },
  nbrs:function(dir){ if(dir==='left') return [[0,-1]]; if(dir==='vertical') return [[-1,0],[1,0]]; return [[-1,0],[1,0],[0,-1],[0,1]]; },
  rowSurnames:function(D,S,b){ var B=Bof(D,S), out=[]; for(var r=0;r<B.rows;r++){ var s={}; for(var c=0;c<B.cols;c++){ if(b[r][c]!=='canal') continue; [r-1,r+1].forEach(function(rr){ var t=Space.at(D,S,b,rr,c); if(t==='dockA'||t==='dockB') s[t]=1; }); } out.push(Object.keys(s)); } return out; },
  newBoard:function(D,S){ var B=Bof(D,S); S.board=[]; for(var r=0;r<B.rows;r++){ S.board.push([]); for(var c=0;c<B.cols;c++) S.board[r].push(c===B.sea_col?'sea':null); } S.turn=0; S.rejects=0; S.discards=0; S.placed=0; S.last=null; },
  step:function(S,a){ }
};
var Actor={ id:'actor', name:'角色', reads:'tiles, boards[].tiles', cfg:null,
  init:function(cfg,root){ Actor.cfg=cfg; },
  step:function(S,a){ if(S.mode==='play'&&a.type==='pick') S.pick=a.i; if(a.type==='place'||a.type==='discard') S.pick=null; }
};
var Time={ id:'time', name:'時間回合', reads:'boards[].turns, boards[].deck, boards[].tiles', cfg:null,
  init:function(cfg,root){ Time.cfg=cfg; },
  // 舊格式（單一地圖）自動包成一盤
  prep:function(D){ if(!D||typeof D!=='object') return D; if(!D.boards&&D.board&&D.deck){ D.boards=[{id:'b1',name:D.title,rows:D.board.rows,cols:D.board.cols,sea_col:D.board.sea_col,turns:D.turns,goal:0,tiles:Object.keys(D.tiles||{}),stele_turn:D.stele_turn||0,stele_text:D.stele_text||'',intro:'',new:[],deck:D.deck}]; } return D; },
  offer:function(D,S){ var B=Bof(D,S); return B.deck[S.turn]||[]; },
  done:function(D,S){ return S.turn>=Bof(D,S).turns; },
  step:function(S,a){ var D=cur;
    if(a.type==='go'&&S.mode==='card'){ Space.newBoard(D,S); S.mode='play'; S.ev.push('start'); }
    if(S.mode==='play'&&(a.type==='place'||a.type==='discard')&&Time.done(D,S)){ S.mode='boardend'; } }
};
var Event={ id:'event', name:'事件選擇', reads:'boards[].stele_turn, boards[].stele_text, boards[].intro/new', cfg:null,
  init:function(cfg,root){ Event.cfg=cfg; },
  turfActive:function(D,S){ var B=Bof(D,S); return B.stele_turn>0 && (S.turn+1)<B.stele_turn; },
  step:function(S,a){ var D=cur, B=Bof(D,S); if(S.mode!=='play') return; if(B.stele_turn>0 && S.turn+1===B.stele_turn && (a.type==='place'||a.type==='discard')){ S.ev.push('stele'); S.lastEvent='stele'; } }
};
var Resource={ id:'resource', name:'資源計分', reads:'score_rules', cfg:null,
  init:function(cfg,root){ Resource.cfg=cfg; },
  score:function(D,S,b){ var B=Bof(D,S), total=0, by={}, order=[];
    function add(label,p){ if(!p) return; total+=p; if(!(label in by)){by[label]=0;order.push(label);} by[label]+=p; }
    for(var r=0;r<B.rows;r++) for(var c=0;c<B.cols;c++){ var t=b[r][c]; if(!t||t==='sea') continue;
      ((D.score_rules&&D.score_rules[t])||[]).forEach(function(R){
        if(R.type==='base') add(R.label,R.pts);
        else if(R.type==='per_adj'){ var n=0; Space.nbrs('any').forEach(function(d){ var v=Space.at(D,S,b,r+d[0],c+d[1]); if(v&&R.of.indexOf(v)>=0) n++; }); add(R.label,n*R.pts); }
        else if(R.type==='if_adj_all'){ var all=R.groups.every(function(g){ return Space.nbrs('any').some(function(d){ var v=Space.at(D,S,b,r+d[0],c+d[1]); return v&&g.indexOf(v)>=0; }); }); if(all) add(R.label,R.pts); } }); }
    return {total:total, items:order.map(function(l){return {label:l,pts:by[l]};})}; },
  step:function(S,a){ if(S.board) S.score=Resource.score(cur,S,S.board).total; }
};
var Verdict={ id:'verdict', name:'勝負', reads:'boards[].goal, stars, endings, reflect', cfg:null,
  init:function(cfg,root){ Verdict.cfg=cfg; },
  starsFor:function(D,B,score){ var s=D.stars||{one:1,two:1.25,three:1.5}; if(!B.goal) return 0; return score>=B.goal*s.three?3:(score>=B.goal*s.two?2:(score>=B.goal*s.one?1:0)); },
  step:function(S,a){ var D=cur, B=Bof(D,S);
    if(S.mode==='boardend'&&!S.ended){ S.ended=true; var sc=S.score||0, st=Verdict.starsFor(D,B,sc); S.results[S.bi]={score:sc,goal:B.goal,stars:st,rejects:S.rejects,discards:S.discards,placed:S.placed,tries:S.tries[S.bi]||1,items:Resource.score(D,S,S.board).items}; S.ev.push(st>0?'win':'lose'); }
    if(S.mode==='boardend'&&a.type==='retry'){ S.tries[S.bi]=(S.tries[S.bi]||1)+1; S.ended=false; Space.newBoard(D,S); S.mode='play'; S.ev.push('start'); }
    else if(S.mode==='boardend'&&a.type==='next'){ if(S.bi+1>=D.boards.length){ S.mode='done'; S.ev.push('end'); } else { S.bi++; S.ended=false; S.mode='card'; S.ev.push('card'); } } },
  totals:function(D,S){ var t=0,st=0; S.results.forEach(function(r){ if(r){ t+=r.score; st+=r.stars; } }); return {score:t,stars:st,maxStars:D.boards.length*3}; },
  ending:function(D,total){ return D.endings.slice().sort(function(a,b){return b.min-a.min;}).filter(function(x){return total>=x.min;})[0]||{title:'',text:''}; }
};
var Feedback={ id:'feedback', name:'回饋', reads:'place_rules[].why, rules_text', cfg:null,
  init:function(cfg,root){ Feedback.cfg=cfg; },
  step:function(S,a){ if(S.ev.length>40) S.ev=S.ev.slice(-40); }
};
var MODS=[Core,Space,Actor,Time,Event,Resource,Verdict,Feedback];

var E={
  M:{core:Core,space:Space,actor:Actor,time:Time,event:Event,resource:Resource,verdict:Verdict,feedback:Feedback}, MODS:MODS, rng:Math.random,
  prep:Time.prep,
  init:function(D,root){ cur=D; MODS.forEach(function(m){ m.init(D,root); }); return D; },
  newState:function(D){ if(cur!==D) E.init(D); var S={bi:0,mode:'card',board:null,turn:0,rejects:0,discards:0,placed:0,score:0,last:null,ended:false,results:[],tries:[],ev:[],lastEvent:''}; return S; },
  act:function(D,S,a){ if(cur!==D) E.init(D); for(var i=0;i<MODS.length;i++) MODS[i].step(S,a); },
  // 舊名字（驗收腳本與外部用）
  at:function(D,b,r,c){ return null; },
  canPlace:function(D,S,t,r,c){ return Core.canPlace(D,S,t,r,c); },
  place:function(D,S,t,r,c){ E.act(D,S,{type:'place',t:t,r:r,c:c}); return S.last; },
  discard:function(D,S){ E.act(D,S,{type:'discard'}); },
  offer:function(D,S){ return Time.offer(D,S); },
  score:function(D,S,b){ return Resource.score(D,S,b||S.board); },
  totals:function(D,S){ return Verdict.totals(D,S); },
  validate:function(D){
    var e=[]; if(!D||typeof D!=='object') return ['整份資料不是一個 { } 物件。']; E.prep(D);
    ['title','boards','tiles','place_rules','score_rules','rules_text','endings','reflect'].forEach(function(k){ if(!(k in D)) e.push('少了「'+k+'」這一段。'); });
    if(e.length) return e;
    if(!Array.isArray(D.boards)||!D.boards.length) return ['boards 至少要有一盤。'];
    D.boards.forEach(function(B,bi){ var w='第 '+(bi+1)+' 盤';
      if(!(B.rows>=3&&B.rows<=8)) e.push(w+'的 rows 要在 3 到 8 之間，現在是 '+B.rows+'。');
      if(!(B.cols>=3&&B.cols<=7)) e.push(w+'的 cols 要在 3 到 7 之間（手機才排得下），現在是 '+B.cols+'。');
      if(!(B.sea_col>=0&&B.sea_col<B.cols)) e.push(w+'的 sea_col 要是 0 到 cols−1 的數字。');
      if(!Array.isArray(B.deck)||B.deck.length<B.turns) e.push(w+'的 deck 至少要有 '+B.turns+' 手（turns 寫幾手，deck 就要有幾組）。');
      (B.deck||[]).forEach(function(p,i){ if(!Array.isArray(p)||p.length<1) e.push(w+' deck 第 '+(i+1)+' 手要是一個 [ ] 清單。'); else p.forEach(function(t){ if(!D.tiles[t]) e.push(w+' deck 第 '+(i+1)+' 手用了不存在的板塊「'+t+'」。'); }); }); });
    Object.keys(D.tiles).forEach(function(t){ var T=D.tiles[t]; if(!T.name) e.push('板塊「'+t+'」沒有 name。'); if(!T.icon) e.push('板塊「'+t+'」沒有 icon（一兩個字）。'); });
    Object.keys(D.place_rules).forEach(function(t){ if(!D.tiles[t]) e.push('place_rules 寫了不存在的板塊「'+t+'」。'); (D.place_rules[t]||[]).forEach(function(R,i){ if(!RULE_TYPES[R.type]) e.push('「'+t+'」的第 '+(i+1)+' 條放置規則 type「'+R.type+'」看不懂（只能用 adj_any、turf）。'); if(R.type==='adj_any'){ if(!DIRS[R.dir]) e.push('「'+t+'」的 adj_any 要寫 dir：left、vertical 或 any。'); (R.of||[]).forEach(function(o){ if(o!=='sea'&&!D.tiles[o]) e.push('「'+t+'」的放置規則提到不存在的「'+o+'」。'); }); } if(!R.why) e.push('「'+t+'」的第 '+(i+1)+' 條放置規則沒有 why（放不下時要告訴玩家為什麼）。'); }); });
    Object.keys(D.score_rules).forEach(function(t){ if(!D.tiles[t]) e.push('score_rules 寫了不存在的板塊「'+t+'」。'); (D.score_rules[t]||[]).forEach(function(R,i){ if(!SCORE_TYPES[R.type]) e.push('「'+t+'」的第 '+(i+1)+' 條得分規則 type「'+R.type+'」看不懂（只能用 base、per_adj、if_adj_all）。'); if(typeof R.pts!=='number') e.push('「'+t+'」的第 '+(i+1)+' 條得分規則 pts 要是數字。'); if(!R.label) e.push('「'+t+'」的第 '+(i+1)+' 條得分規則沒有 label。'); }); });
    if(!Array.isArray(D.endings)||!D.endings.length) e.push('endings 至少要有一個結局。'); else if(!D.endings.some(function(x){return x.min===0;})) e.push('endings 要有一個 min 是 0 的結局（不然低分時沒有結局）。');
    if(!D.reflect||!Array.isArray(D.reflect.options)||D.reflect.options.length<2) e.push('reflect.options 至少要兩個選項。');
    return e; },
  // 模擬：informed＝知道規則、每手挑分數最高的位置；blind＝看不懂規則，隨便選一塊、隨便點一格，被擋就再試（最多 tries 次）。沒達標就再蓋一次（最多 2 次）。
  simulate:function(D,policy,seed,tries){ E.prep(D); var s=seed||1; function rnd(){ s=(s*1103515245+12345)%2147483648; return s/2147483648; }
    var S=E.newState(D), guard=0, per=[], rej=0, dis=0; E.init(D);
    while(S.mode!=='done'&&guard++<5000){
      if(S.mode==='card'){ E.act(D,S,{type:'go'}); continue; }
      if(S.mode==='boardend'){ var res=S.results[S.bi]; rej+=res.rejects; dis+=res.discards; if(res.stars===0&&(S.tries[S.bi]||1)<3){ E.act(D,S,{type:'retry'}); } else { per[S.bi]=res.score; E.act(D,S,{type:'next'}); } continue; }
      var B=D.boards[S.bi], off=Time.offer(D,S), placed=false;
      if(policy==='informed'){ var best=null; off.forEach(function(t){ for(var r=0;r<B.rows;r++) for(var c=0;c<B.cols;c++){ if(!Core.canPlace(D,S,t,r,c).ok) continue; var b2=S.board.map(function(x){return x.slice();}); b2[r][c]=t; var sc=Resource.score(D,S,b2).total; if(!best||sc>best.sc) best={t:t,r:r,c:c,sc:sc}; } });
        if(best){ E.act(D,S,{type:'place',t:best.t,r:best.r,c:best.c}); placed=true; } }
      else { for(var k=0;k<(tries||6)&&!placed;k++){ var t=off[Math.floor(rnd()*off.length)], r=Math.floor(rnd()*B.rows), c=Math.floor(rnd()*B.cols); if(S.board[r][c]!==null){k--; if(++guard>5000) break; continue;} E.act(D,S,{type:'place',t:t,r:r,c:c}); if(S.last&&S.last.ok) placed=true; } }
      if(!placed&&S.mode==='play') E.act(D,S,{type:'discard'});
      S.ev.length=0;
    }
    var T=E.totals(D,S); return {per:per, total:per.reduce(function(a,b){return a+(b||0);},0), stars:T.stars, rejects:rej, discards:dis, finished:S.mode==='done', tries:S.tries.slice()}; }
};

  var keys=Object.keys(d.tiles), i=keys.indexOf(t), T=d.tiles[t];

  return {name:T.name,icon:T.icon,color:T.color||'gray1',meaning:T.meaning||''}; }

// ---- 回饋：音效（程式合成：水滴、木頭敲擊、紙張；這個樣板自己的聲音） ----
var AC=null;
function ac(){ if(AC||ui.mute) return AC; try{ var C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C(); }catch(e){} return AC; }
function tone(f0,f1,dur,type,vol,delay){ var c=ac(); if(!c||ui.mute) return; try{ var t=c.currentTime+(delay||0), o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=2400; o.type=type||'sine'; o.frequency.setValueAtTime(f0,t); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(fl); fl.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02); }catch(e){} }
function paper(dur,vol,delay){ var c=ac(); if(!c||ui.mute) return; try{ var t=c.currentTime+(delay||0), n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0); for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n)*(1-i/n); var s=c.createBufferSource(); s.buffer=b; var fl=c.createBiquadFilter(); fl.type='highpass'; fl.frequency.value=3000; var g=c.createGain(); g.gain.value=vol||0.12; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t); }catch(e){} }
var SFX={ place:function(){ tone(620,260,0.14,'sine',0.18); }, canal:function(){ tone(480,900,0.1,'sine',0.14); tone(520,1000,0.1,'sine',0.1,0.09); tone(560,1100,0.1,'sine',0.07,0.18); },
  reject:function(){ tone(150,110,0.09,'square',0.12); tone(150,110,0.09,'square',0.1,0.12); }, discard:function(){ paper(0.18,0.14); }, start:function(){ tone(392,392,0.4,'triangle',0.1); tone(587,587,0.5,'triangle',0.1,0.15); },
  stele:function(){ tone(180,120,0.12,'square',0.14); tone(180,120,0.12,'square',0.14,0.2); tone(180,120,0.12,'square',0.14,0.4); }, card:function(){ paper(0.25,0.12); tone(330,330,0.5,'triangle',0.08); },
  win:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,f,0.5,'triangle',0.12,i*0.14); }); }, lose:function(){ tone(330,220,0.5,'triangle',0.12); tone(262,196,0.6,'triangle',0.1,0.22); }, end:function(){ [392,523,659,784,1047].forEach(function(f,i){ tone(f,f,0.7,'triangle',0.12,i*0.16); }); } };
Feedback.flush=function(S){ var ev=S.ev.splice(0,S.ev.length); ev.forEach(function(n){ if(SFX[n]) SFX[n](); }); };

function render(){ var a=document.getElementById('app'); a.innerHTML = ui.screen==='title'?title():ui.screen==='home'?home():ui.screen==='play'?play():end(); bind(); }
function frame(inner){ return '<div class="chartframe">'+inner+'</div>'; }
function w2block(d){ return '<div class="panel"><span class="kind">W2 文化卡：'+esc(d.w2_kind.label)+'</span><p>'+esc(d.w2_kind.line)+'</p>'+d.w2_cards.map(function(c){ return '<div class="w2c"><b>#'+c.no+' '+esc(c.v)+'</b>：'+esc(c.note)+(c.more?'<small>'+esc(c.more)+'</small>':'')+'</div>'; }).join('')+'</div>'; }
function basis(d){ return '<details><summary>依據：哪些是原著、歷史資料、遊戲自己加的</summary><div class="panel">'+d.basis.map(function(b){ return '<p><span class="tag">'+esc(b.tag)+'</span>'+esc(b.text)+'</p>'; }).join('')+'</div></details>'; }
function soundBtn(){ return '<div class="row"><button data-act="mute" class="quiet">音效：'+(ui.mute?'關':'開')+'</button></div>'; }
function title(){ var d=DATA.rule; return '<section class="cartouche"><div class="compass" aria-hidden="true"><i></i><b>北</b></div><div class="sub">文化遊戲松樣板・板塊拼接</div><h1>'+esc(d.title)+'</h1><div class="waves" aria-hidden="true"></div>'+
  '<p class="lead">'+esc(d.tagline)+'</p><table class="legendtab"><tr><th>第一盤</th><td>港道開鑿</td><td>'+d.boards[0].turns+' 手</td></tr><tr><th>第二盤</th><td>兩姓搶港</td><td>'+d.boards[1].turns+' 手</td></tr><tr><th>第三盤</th><td>廟口人潮</td><td>'+d.boards[2].turns+' 手</td></tr></table><p class="sub">約 8–12 分鐘。每一手選一塊、放一格。</p></section>'+
  '<div class="row"><button class="primary big" data-act="start" data-ver="rule">開始繪製</button></div><div class="row"><button data-act="start" data-ver="skin">玩另一版（換皮版）</button><button data-act="home">W2 卡片・說明・改做</button></div>'+soundBtn(); }
function home(){ var d=DATA.rule;
  return '<h1>'+esc(d.title)+'</h1><div class="sub">板塊拼接・文化遊戲松樣板</div>'+w2block(d)+
  '<div class="panel"><h2>怎麼玩</h2><p>地圖最左邊一排是海。每一手會給你兩塊地，選一塊、點一格放下去。一共三盤，每盤有目標分，放完算分、拿星星。</p>'+
  '<p>這個樣板有兩版，玩法看起來一樣，差在<b>規則看不看「它是什麼」</b>。兩版都玩完，再回答同一題。</p>'+
  '<div class="row"><button class="primary" data-act="start" data-ver="rule">玩「玩法版」</button><button data-act="start" data-ver="skin">玩「換皮版」</button></div>'+
  (DATA.custom?'<div class="row"><button data-act="start" data-ver="custom">玩我改做的版本</button></div>':'')+'</div>'+
  remix()+basis(d)+soundBtn()+'<div class="foot">工坊創作的樣板；《小封神》相關內容只取故事裡的事實，標示在「依據」。</div>'; }
function remix(){ return '<details id="remix"><summary>我要改做（貼上自己的資料）</summary><div class="panel">'+
  '<p>整個遊戲的內容都在一份 JSON 裡：三盤各自的大小、手數、牌堆、目標分（boards），以及放置規則、得分規則。取出來、貼給 Claude 或 Gemini 改，再貼回來載入。改法看「怎麼改做」那一頁。</p>'+
  '<div class="row"><button data-act="dump" data-ver="rule">取出玩法版資料</button><button data-act="dump" data-ver="skin">取出換皮版資料</button></div>'+
  '<textarea id="remix-box" spellcheck="false" placeholder="把 JSON 貼在這裡"></textarea>'+
  '<div class="row"><button class="primary" data-act="load">載入我的版本</button></div>'+
  (ui.remixErr?'<div class="err">'+esc(ui.remixErr)+'</div>':'')+(ui.remixOk?'<div class="msg ok">'+esc(ui.remixOk)+'</div>':'')+'</div></details>'; }
function legend(d){ return '<details><summary>每一塊是什麼</summary><div class="legend">'+Object.keys(d.tiles).map(function(t){ var v=tileView(t); return '<div><span class="chip" style="'+bg(v)+'">'+esc(v.icon)+'</span><span><b>'+esc(v.name)+'</b>'+(v.meaning?'：'+esc(v.meaning):'')+'</span></div>'; }).join('')+'</div></details>'; }

Time.render=function(S){ var d=D(), B=d.boards[S.bi], n=d.boards.length, prev='';
  if(S.bi>0){ var r=S.results[S.bi-1]; if(r) prev='<div class="recap">上一盤　'+stars(r.stars)+'　'+r.score+' 分（目標 '+r.goal+'）</div>'; }
  var body=ui.strip?'<p>名字和規則都換成代號了。自己看，自己摸出怎麼放。</p>':'<p>'+esc(B.intro)+'</p>'+(B.new&&B.new.length?'<div class="newbox"><b>這一盤新的</b><ul>'+B.new.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>':'');
  return '<div class="overlay card-ovl" id="card"><div class="sub">第 '+(S.bi+1)+'／'+n+' 盤・'+B.turns+' 手・目標 '+B.goal+' 分</div><h2>'+esc(ui.strip?'第 '+(S.bi+1)+' 盤':B.name)+'</h2>'+prev+body+'<div class="row"><button class="primary" data-act="go">開始這一盤</button></div></div>'; };
Verdict.render=function(S){ var d=D(), B=d.boards[S.bi], r=S.results[S.bi]; var last=S.bi+1>=d.boards.length;
  var msg=r.stars>0?'達到目標了！':'還差 '+(r.goal-r.score)+' 分才到目標。';
  return '<div class="overlay" id="boardend"><div class="sub">這一盤結算</div><h2>'+stars(r.stars)+'　'+r.score+' 分／目標 '+r.goal+'</h2><p>'+msg+'　被擋下 '+r.rejects+' 次、丟掉 '+r.discards+' 塊'+(r.tries>1?'、第 '+r.tries+' 次蓋':'')+'。</p>'+
    '<div class="row">'+(r.stars===0?'<button class="primary" data-act="retry">這一盤再蓋一次</button><button data-act="next">'+(last?'先看結算':'先往下一盤')+'</button>':'<button class="primary" data-act="next">'+(last?'看結算':'下一盤')+'</button><button data-act="retry">想拿更多星，再蓋一次</button>')+'</div></div>'; };

function play(){ var d=D(), S=ui.S, B=d.boards[S.bi];
  if(S.mode==='card') return frame('<div class="hud"><b>'+esc(d.title)+'｜'+esc(ui.vlabel||'')+'</b></div>'+Time.render(S)+'<div class="row"><button data-act="home">回首頁</button></div>');
  var off=Time.offer(d,S), sc=S.score||0, boardEnd=S.mode==='boardend';
  var g=Space.render(S,boardEnd);
  var hand=boardEnd?'':Actor.render(S);
  var rules=d.rules_text.filter(function(x){ return !ui.strip||!x.culture; }), hidden=d.rules_text.length-rules.length;
  var stele=Event.render(S);
  var pct=Math.min(100,Math.round(sc/(B.goal*(d.stars?d.stars.three:1.5))*100)), gp=Math.round(100/(d.stars?d.stars.three:1.5));
  var meter='<div class="meter" aria-label="目標 '+B.goal+' 分"><i style="width:'+pct+'%"></i><b style="left:'+gp+'%"></b></div>';
  return frame('<div class="hud"><b>'+esc(d.title)+'｜'+esc(ui.vlabel||'')+'</b><span>'+esc(ui.strip?'第 '+(S.bi+1)+' 盤':B.name)+'・第 '+Math.min(S.turn+1,B.turns)+'／'+B.turns+' 手</span></div>'+
   '<div class="score">'+sc+' 分<span class="sub">　目標 '+B.goal+'</span></div>'+meter+
   '<div class="'+(ui.strip?'strip-on':'')+'">'+(ui.strip?'<div class="sub">🔍 名字、圖示、規則說明都換成代號了：換成別的東西，你的決定會變嗎？</div>':'')+stele+
   (boardEnd?Verdict.render(S):'<div class="sub">這一手給你兩塊，先選一塊：</div>'+hand)+g+Feedback.render(S)+
   '<div class="row"><button data-act="discard"'+(boardEnd?' disabled':'')+'>這兩塊都放不下：丟掉一塊</button><button data-act="strip">'+(ui.strip?'把名字圖示放回來':'把名字圖示換成代號試試看')+'</button><button data-act="mute" class="quiet">音效：'+(ui.mute?'關':'開')+'</button></div>'+
   '<details '+(S.turn===0?'open':'')+'><summary>規則</summary><ul class="rules">'+rules.map(function(x){return '<li>'+esc(x.text)+'</li>';}).join('')+(hidden?'<li class="sub">（還有 '+hidden+' 條規則是用名字和圖示講的，換成代號之後就看不到了。）</li>':'')+'</ul></details>'+
   legend(d)+'</div><div class="row"><button data-act="home">回首頁</button></div>'); }

var ACH=[{id:'three',t:'有一盤拿到三顆星',f:function(S){return S.results.some(function(r){return r&&r.stars===3;});}},{id:'first',t:'三盤都一次達標',f:function(S){return S.results.length>=3&&S.results.every(function(r,i){return r&&r.stars>0&&(S.tries[i]||1)===1;});}},
  {id:'clean',t:'有一盤沒被擋過',f:function(S){return S.results.some(function(r){return r&&r.rejects===0;});}},{id:'stele',t:'立碑後把兩姓碼頭排在一起',f:function(S){ var r=S.results[1]; return !!(r&&r.items.some(function(x){return /碑立之後/.test(x.label);})); }},
  {id:'busy',t:'廟口熱鬧加分拿到 4 分以上',f:function(S){ var r=S.results[2]; return !!(r&&r.items.some(function(x){return x.label==='廟口熱鬧'&&x.pts>=4;})); }},{id:'allstar',t:'總共 7 顆星以上',f:function(S){ return E.totals(D(),S).stars>=7; }}];
function achBlock(S){ var got=[]; try{ got=JSON.parse(store('tiles_ach')||'[]'); }catch(e){ got=[]; } var now=[];
  ACH.forEach(function(a){ if(a.f(S)){ now.push(a.id); if(got.indexOf(a.id)<0) got.push(a.id); } }); store('tiles_ach',JSON.stringify(got));
  return '<h2>成就（本機累計 '+got.length+'／'+ACH.length+'）</h2><div class="ach">'+ACH.map(function(a){ var on=now.indexOf(a.id)>=0, old=got.indexOf(a.id)>=0; return '<span class="'+(on?'on':(old?'':'off'))+'">'+(on?'★ ':(old?'☆ ':'？ '))+esc(on||old?a.t:'還沒解鎖')+'</span>'; }).join('')+'</div><p class="sub">★ 這一輪拿到　☆ 以前拿過　？ 再玩一次，換不同的蓋法。</p>'; }
function end(){ var d=D(), S=ui.S, T=E.totals(d,S), en=Verdict.ending(d,T.score), R=d.reflect, ansDone=ui.answer!==null;
  var story='我蓋了三盤港邊，共 '+T.score+' 分、'+T.stars+' 顆星'+(ui.strip?'（換成代號玩的）':'')+'。';
  var recs=d.boards.map(function(B,i){ var r=S.results[i]; if(!r) return '<li>'+esc(ui.strip?'第 '+(i+1)+' 盤':B.name)+'　沒有蓋完</li>'; var top=r.items.slice().sort(function(a,b){return b.pts-a.pts;})[0]; return '<li><b>'+esc(ui.strip?'第 '+(i+1)+' 盤':B.name)+'</b>　'+stars(r.stars)+'<br><span class="sub">'+r.score+' 分（目標 '+r.goal+'）・被擋 '+r.rejects+' 次・丟 '+r.discards+' 塊'+(r.tries>1?'・蓋了 '+r.tries+' 次':'')+(top?'・最多分：'+esc(top.label):'')+'</span></li>'; }).join('');
  return '<h1>'+esc(en.title)+'</h1><div class="sub">'+esc(ui.vlabel||'')+(ui.strip?'・換成代號':'')+'・'+T.score+' 分・'+T.stars+'／'+T.maxStars+' 顆星</div>'+
   '<div class="panel"><p>'+esc(en.text)+'</p><p><b>一句話故事：</b>'+esc(story)+'</p><h2>三盤回顧</h2><ul class="plain">'+recs+'</ul>'+(ui.ver==='rule'&&!ui.strip?achBlock(S):'')+'</div>'+
   '<div class="panel"><h2>給你的企劃用：這個遊戲好玩在哪</h2><p>'+esc(R.question)+'</p>'+R.options.map(function(o,i){ return '<button class="opt'+(ui.answer===i?' sel':'')+'" data-act="ans" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+
   '<p>寫一句為什麼，再想：要放進你的企劃，你會留下它、還是換掉它？</p><textarea id="why" placeholder="例：我最有感的是立碑讓規則改變，因為……">'+esc(ui.why)+'</textarea>'+(ansDone?'<div class="msg ok"><p>你選的是「'+esc(R.options[ui.answer])+'」。</p><p>'+esc(R.our_view)+'</p></div>':'')+'</div>'+
   '<div class="panel"><h2>'+esc(d.field.title)+'</h2><p>'+esc(d.field.prompt)+'</p><textarea id="field" placeholder="'+esc(d.field.placeholder)+'">'+esc(store('tiles_field')||'')+'</textarea><div class="row"><button data-act="field">記下來（只存在這台裝置）</button></div><div id="field-msg" class="sub"></div></div>'+
   '<div class="row"><button class="primary" data-act="again">再玩一次</button><button data-act="other">換另一版玩</button><button data-act="home">回首頁</button></div>'+basis(d); }
Space.render=function(S,boardEnd){ var d=D(), B=d.boards[S.bi], off=Time.offer(d,S);
  var cand={}; if(!boardEnd&&ui.sel!==null){ var t=off[ui.sel]; for(var r=0;r<B.rows;r++) for(var c=0;c<B.cols;c++) if(!ui.strip && Core.canPlace(d,S,t,r,c).ok) cand[r+','+c]=1; }
  var g='<div class="board" style="grid-template-columns:1rem repeat('+B.cols+',minmax(0,1fr))"><i></i>'; for(var c0=0;c0<B.cols;c0++) g+='<i class="ax">'+(c0+1)+'</i>';
  for(var r=0;r<B.rows;r++){ g+='<i class="ax">'+LETTERS[r]+'</i>'; for(var c=0;c<B.cols;c++){ var v=S.board[r][c];
    if(v==='sea'){ var sv=tileView('sea'); g+='<button class="cell sea" aria-label="'+esc(sv.name)+'" disabled>'+(ui.strip?'·':esc(sv.icon))+'</button>'; }
    else if(v){ var tv=tileView(v); g+='<button class="cell filled" data-r="'+r+'" data-c="'+c+'" aria-label="'+esc(tv.name)+'" style="'+bg(tv)+'">'+esc(tv.icon)+'</button>'; }
    else g+='<button class="cell'+(cand[r+','+c]?' cand':'')+'" data-act="cell" data-r="'+r+'" data-c="'+c+'" aria-label="空格 '+LETTERS[r]+(c+1)+'"></button>'; } }
  g+='</div>';
  return g; };
Core.render=function(S){ return ''; };
Actor.render=function(S){ var d=D(), off=Time.offer(d,S); return '<div class="hand">'+off.map(function(t,i){ var v=tileView(t); return '<button data-act="pick" data-i="'+i+'" class="'+(ui.sel===i?'sel':'')+'"><span class="chip" style="'+bg(v)+'">'+esc(v.icon)+'</span><span>'+esc(v.name)+'</span></button>'; }).join('')+'</div>'; };
Resource.render=function(S){ return String(S.score||0); };
Event.render=function(S){ var d=D(), B=d.boards[S.bi]; if(ui.strip||!(B.stele_turn>0)) return ''; return '<div class="stele">'+(Event.turfActive(d,S)?'【碑】還沒立碑：一條港只歸一姓搬。'+esc(B.stele_text):'【碑】'+esc(B.stele_text))+'</div>'; };

function start(ver,strip){ ui.ver=ver; ui.strip=!!strip; ui.vlabel=ver==='custom'?'我改做的版本':D().version_label; E.init(D()); ui.S=E.newState(D()); ui.sel=null; ui.msg=''; ui.msgCls=''; ui.answer=null; ui.why=''; ui.screen='play'; if(FAST) act2({type:'go'}); render(); window.scrollTo(0,0); }
function act2(a){ E.act(D(),ui.S,a); Feedback.flush(ui.S); }
function say(m,cls){ ui.msg=m; ui.msgCls=cls||''; }
function bind(){ document.querySelectorAll('[data-act]').forEach(function(el){ el.addEventListener('click',function(){ act(el.getAttribute('data-act'),el); }); }); }
function act(a,el){ var d=D(), S=ui.S; ac();
  if(a==='mute'){ ui.mute=!ui.mute; store('tiles_mute',ui.mute?'1':'0'); el.textContent='音效：'+(ui.mute?'關':'開'); return; }
  if(a==='start'){ start(el.getAttribute('data-ver'),false); return; }
  if(a==='home'){ ui.screen='home'; ui.strip=false; render(); return; }
  if(a==='go'){ act2({type:'go'}); ui.msg=''; render(); window.scrollTo(0,0); return; }
  if(a==='next'||a==='retry'){ act2({type:a}); ui.sel=null; ui.msg=''; ui.msgCls=''; if(S.mode==='done'){ ui.screen='end'; render(); window.scrollTo(0,0); return; } render(); window.scrollTo(0,0); return; }
  if(a==='pick'){ ui.sel=+el.getAttribute('data-i'); E.act(d,S,{type:'pick',i:ui.sel}); var t=Time.offer(d,S)[ui.sel]; var tv=tileView(t); say('你拿了「'+tv.name+'」'+(tv.meaning?'：'+tv.meaning:'')+'點一個空格放下去。',''); render(); return; }
  if(a==='cell'){ if(ui.sel===null){ say('先在上面選一塊，再點格子。','bad'); render(); return; }
    var t2=Time.offer(d,S)[ui.sel], r=+el.getAttribute('data-r'), c=+el.getAttribute('data-c'); var before=S.turn; act2({type:'place',t:t2,r:r,c:c});
    if(S.turn===before){ say('放不下：'+(ui.strip?'這裡不能放。':S.last.why),'bad'); render(); var b=document.querySelector('[data-r="'+r+'"][data-c="'+c+'"]'); if(b) b.classList.add('bad'); return; }
    ui.sel=null; say(S.lastEvent==='stele'&&!ui.strip?'放好了。下一手起，官府立碑，規則改變了！':'放好了。','ok'); S.lastEvent=''; render(); return; }
  if(a==='discard'){ act2({type:'discard'}); ui.sel=null; say('丟掉一塊，這一手過了。',''); render(); return; }
  if(a==='strip'){ ui.strip=!ui.strip; say(ui.strip?'名字和圖示換成代號了。規則還是一樣，只是你看不到它為什麼。':'名字和圖示放回來了。',''); render(); return; }
  if(a==='ans'){ ui.why=(document.getElementById('why')||{}).value||ui.why; ui.answer=+el.getAttribute('data-i'); render(); return; }
  if(a==='field'){ var f=document.getElementById('field').value.trim(); var m=document.getElementById('field-msg'); if(f.length<(d.field.min_chars||10)){ m.textContent='再多寫一點（至少 '+(d.field.min_chars||10)+' 個字），寫你在哪裡、看到什麼。'; return; } store('tiles_field',f); m.textContent='記下來了。之後改做時，把它變成一條放置規則。'; return; }
  if(a==='again'){ start(ui.ver,ui.strip); return; }
  if(a==='again-strip'){ start(ui.ver,!ui.strip); return; }
  if(a==='other'){ start(ui.ver==='rule'?'skin':'rule',false); return; }
  if(a==='dump'){ var box=document.getElementById('remix-box'); box.value=JSON.stringify(DATA[el.getAttribute('data-ver')],null,2); ui.remixErr=''; return; }
  if(a==='load'){ var txt=document.getElementById('remix-box').value, obj=null; ui.remixOk=''; ui.remixErr='';
    try{ obj=JSON.parse(txt); }catch(e){ ui.remixErr='這不是正確的 JSON：'+e.message+'\n把這行紅字貼回給 AI，說「請修這個」。'; render(); document.getElementById('remix').open=true; return; }
    var errs=E.validate(obj); if(errs.length){ ui.remixErr=errs.join('\n')+'\n把上面的紅字貼回給 AI，說「請修這個」。'; render(); document.getElementById('remix').open=true; return; }
    DATA.custom=obj; ui.remixOk='載入成功。按「玩我改做的版本」。'; render(); document.getElementById('remix').open=true; return; }
}
window.__T={E:E, DATA:DATA, ui:ui, start:start, act:act2, modules:MODS.map(function(m){return {id:m.id,name:m.name,reads:m.reads,iface:['init','step','render'].filter(function(k){return typeof m[k]==='function';})};})};
render();
window.__tilesReady=true;
})();

</script>
