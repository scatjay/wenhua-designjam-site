<style>
/* ===== 走讀（walk）視覺語言：白天的手繪街區地圖＋田野筆記本。顏色只在 :root 的變數區塊裡出現，元件只用 --tk-* 與 --wk-* ===== */
:root{
  /* 共用語意 token（名稱固定，值各樣板自己定） */
  --tk-surface:#dff2fb; --tk-panel:#fffdf3; --tk-ink:#173f56; --tk-muted:#486e84;
  --tk-accent:#ffc933; --tk-accent-ink:#173f56; --tk-line:#173f56;
  --tk-font-title:"Iansui","Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --tk-font-body:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --tk-radius:16px; --tk-shadow:3px 4px 0 var(--tk-line);
  /* 私有變數（走讀專用） */
  --wk-sky:#bfe7f6; --wk-grid:rgba(23,63,86,.07); --wk-grass:#79c98b; --wk-grass-d:#2e9b5b; --wk-tomato:#e8452a; --wk-pink:#ff9db1;
  --wk-tape-a:rgba(255,201,51,.8); --wk-tape-b:rgba(255,157,177,.75); --wk-tape-c:rgba(121,201,139,.75);
  --wk-mapbg:#f7f0d9; --wk-water:#a5dcf0; --wk-park:#c3e8b8; --wk-block-a:#f8dcae; --wk-block-b:#f7c9c3; --wk-block-c:#d9d0f1; --wk-block-d:#fff0b8;
  --wk-road:#ffffff; --wk-road-edge:#cdbb8e; --wk-ok:#2e9b5b; --wk-bad:#c8321f; --wk-chip:#fff0b8; --wk-soft:rgba(23,63,86,.16);
  --wk-white:#ffffff; --wk-ground:#fff7de; --wk-lock:#e3e6e8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background-color:var(--tk-surface);
  background-image:linear-gradient(var(--wk-sky),transparent 260px),linear-gradient(var(--wk-grid) 1px,transparent 1px),linear-gradient(90deg,var(--wk-grid) 1px,transparent 1px);
  background-size:100% 100%,26px 26px,26px 26px;background-attachment:fixed;
  color:var(--tk-ink);font:16px/1.7 var(--tk-font-body);overflow-wrap:anywhere;-webkit-text-size-adjust:100%;color-scheme:light}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 60px}
.wrap[data-v=map]{max-width:1140px}
h1{font-family:var(--tk-font-title);font-size:26px;margin:4px 0 2px;line-height:1.25;letter-spacing:.02em}
h2{font-family:var(--tk-font-title);font-size:20px;margin:20px 0 8px;display:inline-block;background:linear-gradient(transparent 58%,var(--wk-tape-a) 58%);padding:0 4px}
.sub{color:var(--tk-muted);font-size:14px}
.card{position:relative;background:var(--tk-panel);border:2.5px solid var(--tk-line);border-radius:var(--tk-radius);padding:14px 16px;margin:14px 0;box-shadow:var(--tk-shadow);
  background-image:linear-gradient(var(--wk-grid) 1px,transparent 1px);background-size:100% 26px}
.card::before{content:"";position:absolute;top:-9px;left:22px;width:62px;height:18px;background:var(--wk-tape-a);transform:rotate(-4deg);border-left:2px dashed var(--wk-soft);border-right:2px dashed var(--wk-soft)}
.btn{display:block;width:100%;min-height:46px;padding:10px 16px;border:2.5px solid var(--tk-line);border-radius:999px;background:var(--wk-white);color:var(--tk-ink);font:inherit;font-weight:700;text-align:left;margin:9px 0;cursor:pointer;box-shadow:0 4px 0 var(--tk-line);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tk-line)}
.btn.pri{background:var(--tk-accent);color:var(--tk-accent-ink);text-align:center;letter-spacing:.04em}
.btn.ghost{text-align:center;font-weight:600;background:var(--wk-ground)}
.btn.on{background:var(--wk-park)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{min-height:58px;font-size:19px;font-family:var(--tk-font-title)}
.row{display:flex;gap:10px}
.row .btn{margin:8px 0;text-align:center}
.chip{display:inline-block;background:var(--wk-chip);border:2px solid var(--tk-line);border-radius:999px;padding:1px 11px;margin:3px 5px 3px 0;font-size:13px;font-weight:700}
.tag{display:inline-block;border-radius:8px;padding:0 8px;font-size:12px;font-weight:700;margin-right:6px;color:var(--tk-ink);background:var(--wk-park);border:1.5px solid var(--tk-line)}
.tag.art{background:var(--wk-tape-b)}.tag.sch{background:var(--wk-block-c)}
.st{float:right;font-size:13px;color:var(--tk-muted)}
.field{display:inline-block;font-size:13px;color:var(--tk-ink);font-weight:700;background:var(--wk-tape-b);padding:1px 10px;border-radius:8px;transform:rotate(-1deg);margin-bottom:6px}
input[type=text],textarea{width:100%;font:inherit;color:var(--tk-ink);background:var(--wk-white);border:2.5px solid var(--tk-line);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:104px}
.rw{color:var(--wk-ok);margin-top:6px}
.err{color:var(--wk-bad)}
.fb{color:var(--wk-bad);margin:6px 0;font-weight:700}
details{margin:14px 0}
summary{min-height:46px;display:flex;align-items:center;cursor:pointer;color:var(--tk-muted);font-weight:700}
input[type=file]{width:100%;min-height:46px;padding:8px 0}
img.pv{max-width:100%;border-radius:12px;margin-top:6px;border:2.5px solid var(--tk-line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.small{font-size:13px;color:var(--tk-muted)}
/* 封面：探險隊出發通知 */
.hero{position:relative;text-align:center;padding:34px 16px 26px;margin:10px 0 14px;border-radius:24px;border:3px solid var(--tk-line);overflow:hidden;box-shadow:var(--tk-shadow);
  background:radial-gradient(circle at 18% 22%,var(--wk-white) 0 14px,transparent 15px),radial-gradient(circle at 26% 26%,var(--wk-white) 0 18px,transparent 19px),radial-gradient(circle at 82% 16%,var(--wk-white) 0 15px,transparent 16px),radial-gradient(circle at 88% 20%,var(--wk-white) 0 11px,transparent 12px),linear-gradient(var(--wk-sky) 0 68%,var(--wk-grass) 68% 100%)}
.hero .cv{font-size:68px;line-height:1.1;display:inline-block;background:var(--tk-accent);border:3px solid var(--tk-line);border-radius:50%;width:112px;height:112px;line-height:104px;box-shadow:var(--tk-shadow);transform:rotate(-6deg)}
.hero h1{font-size:34px;margin:14px 0 4px;transform:rotate(-1.5deg);display:inline-block;background:var(--tk-panel);border:3px solid var(--tk-line);border-radius:12px;padding:2px 16px;box-shadow:var(--tk-shadow)}
.hero .tg{font-size:16px;color:var(--tk-ink);margin:8px 0 6px;font-weight:700}
.hero .sub{color:var(--tk-ink)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.cap-say{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.cap-say .face{flex:0 0 52px;height:52px;border-radius:50%;background:var(--tk-accent);border:2.5px solid var(--tk-line);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 3px 0 var(--tk-line)}
.cap-say .say{position:relative;background:var(--wk-white);border:2.5px solid var(--tk-line);border-radius:6px 18px 18px 18px;padding:8px 14px;font-weight:700}
.how{margin:8px 0;padding-left:0;list-style:none}
.how li{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.how b{flex:0 0 34px;height:34px;font-size:18px;text-align:center;background:var(--wk-chip);border:2px solid var(--tk-line);border-radius:50%;line-height:30px}
/* 進度列：隊員手冊 */
.hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px}
.hud .chip{margin:0;font-size:14px}
.tray{display:flex;gap:7px;margin:8px 0 4px;flex-wrap:wrap}
.slot{flex:1 1 0;min-width:64px;border:2.5px dashed var(--tk-line);border-radius:12px;text-align:center;padding:6px 2px;font-size:12px;color:var(--tk-muted);background:var(--wk-white);font-weight:700}
.slot .ic{display:block;font-size:24px;line-height:1.3}
.slot.got{border-style:solid;color:var(--tk-ink);background:var(--wk-chip);transform:rotate(-2deg)}
.slot.opt{opacity:.85}
/* 地圖：主角 */
.mapgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.mapgrid{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);align-items:start}.mapgrid .mapcol{grid-column:1;grid-row:1/span 2;position:sticky;top:12px}.mapgrid .mh{grid-column:2;grid-row:1}.mapgrid .mr{grid-column:2;grid-row:2}}
.mapbox{position:relative;border:3px solid var(--tk-line);border-radius:20px;overflow:hidden;box-shadow:var(--tk-shadow);transform:rotate(-.4deg);
  background-color:var(--wk-mapbg);background-image:linear-gradient(var(--wk-grid) 1px,transparent 1px),linear-gradient(90deg,var(--wk-grid) 1px,transparent 1px);background-size:20px 20px}
.mapbox::before,.mapbox::after{content:"";position:absolute;z-index:2;width:84px;height:22px;background:var(--wk-tape-b);pointer-events:none}
.mapbox::before{top:-4px;left:-14px;transform:rotate(-38deg)}
.mapbox::after{bottom:-4px;right:-14px;transform:rotate(-38deg);background:var(--wk-tape-c)}
.mapbox svg{display:block;width:100%;height:auto;max-height:78vh}
.mapbox .cap{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--tk-muted);font-weight:700}
.mapbox .ttl{position:absolute;left:12px;top:10px;font-family:var(--tk-font-title);font-size:13px;background:var(--tk-panel);border:2px solid var(--tk-line);border-radius:8px;padding:0 10px;transform:rotate(-2deg);z-index:1}
.node{cursor:pointer}
.node:focus{outline:none}
.node:focus-visible circle.nc{stroke:var(--wk-tomato);stroke-width:1.4}
.node .nc{stroke:var(--tk-line);stroke-width:.7;fill:var(--wk-white)}
.node.done .nc{fill:var(--wk-ok)}
.node.lock .nc{fill:var(--wk-lock);stroke-dasharray:1.2 1}
.node.next .nc{fill:var(--wk-tomato)}
.node.sel .ring{opacity:1}
.node .ring{fill:none;stroke:var(--tk-ink);stroke-width:.8;stroke-dasharray:1.6 1.2;opacity:0}
.node .num{font-size:4.6px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:var(--tk-ink);pointer-events:none}
.node.done .num,.node.next .num{fill:var(--wk-white)}
.node .lbl{font-size:3.7px;font-weight:800;text-anchor:middle;fill:var(--tk-ink);paint-order:stroke;stroke:var(--wk-mapbg);stroke-width:1.3px;stroke-linejoin:round;pointer-events:none}
.node .opt{font-size:2.8px;text-anchor:middle;fill:var(--tk-muted);paint-order:stroke;stroke:var(--wk-mapbg);stroke-width:1px;pointer-events:none}
.node.next .pulse{animation:pls 1.3s ease-out infinite}
.pulse{fill:var(--wk-tomato);opacity:0;transform-origin:center;transform-box:fill-box}
.stampc{fill:none;stroke:var(--wk-tomato);stroke-width:.6;stroke-dasharray:1.1 .7;transform-origin:center;transform-box:fill-box;transform:rotate(-14deg)}
.stampt{font-size:2.5px;font-weight:800;fill:var(--wk-tomato);text-anchor:middle;pointer-events:none}
@keyframes pls{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
#pl{transition:transform .55s ease-in-out}
.pawn{font-size:7px;text-anchor:middle;pointer-events:none}
.selcard h2{margin:0 0 2px}
.tip{display:flex;gap:10px;align-items:center;margin:6px 0 2px;font-weight:700}
.tip .face{flex:0 0 44px;height:44px;border-radius:50%;background:var(--tk-accent);border:2.5px solid var(--tk-line);display:flex;align-items:center;justify-content:center;font-size:24px}
.tip .say{background:var(--wk-white);border:2.5px solid var(--tk-line);border-radius:6px 16px 16px 16px;padding:5px 12px;font-size:14px}
/* 站上：現場 */
.scene{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;border:3px solid var(--tk-line);background:linear-gradient(var(--wk-sky) 0 55%,var(--wk-grass) 55% 100%);margin:10px 0;box-shadow:var(--tk-shadow)}
.scene .em{font-size:46px;line-height:1;background:var(--tk-panel);border:2.5px solid var(--tk-line);border-radius:50%;width:72px;height:72px;display:flex;align-items:center;justify-content:center;flex:none}
.scene .nm{font-family:var(--tk-font-title);font-size:22px;line-height:1.3;background:var(--tk-panel);border:2.5px solid var(--tk-line);border-radius:10px;padding:0 10px;display:inline-block}
.scene .sub{color:var(--tk-ink);font-weight:700;margin-top:4px}
.bub{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.bub .av{flex:0 0 46px;height:46px;border-radius:50%;background:var(--tk-accent);border:2.5px solid var(--tk-line);display:flex;align-items:center;justify-content:center;font-size:24px}
.bub .tx{background:var(--wk-white);border:2.5px solid var(--tk-line);border-radius:6px 18px 18px 18px;padding:9px 14px;max-width:calc(100% - 58px);box-shadow:0 3px 0 var(--tk-line)}
.bub .who{font-size:12px;color:var(--tk-muted);font-weight:800;display:block}
.bub.last .tx{animation:pop .22s ease-out}
.bub.me{flex-direction:row-reverse}.bub.me .tx{border-radius:18px 6px 18px 18px;background:var(--wk-chip)}
.dots{display:flex;gap:7px;align-items:center;margin:10px 0 2px}
.dots i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--tk-line);background:var(--wk-white);display:inline-block}
.dots i.d{background:var(--wk-ok)}
.dots i.c{background:var(--tk-accent)}
.dots span{font-size:13px;color:var(--tk-muted);margin-left:4px;font-weight:700}
.res{border-color:var(--wk-ok)}
.res .hd{font-weight:800;color:var(--wk-ok);font-family:var(--tk-font-title);font-size:19px}
.frag{position:relative;overflow:hidden;text-align:center;border:3px solid var(--tk-line);background:var(--wk-chip);border-radius:20px;padding:20px 16px 16px;margin:14px 0;box-shadow:var(--tk-shadow);animation:pop .3s ease-out}
.frag::after{content:"到此一遊";position:absolute;right:10px;top:10px;font-family:var(--tk-font-title);font-size:15px;color:var(--wk-tomato);border:3px double var(--wk-tomato);border-radius:50%;width:70px;height:70px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;transform:rotate(14deg);animation:stamp .35s .15s ease-in both}
.frag .ic{font-size:56px;line-height:1.1}
.frag .nm{font-family:var(--tk-font-title);font-size:21px;margin:4px 0}
.frag .got{font-size:12px;font-weight:800;color:var(--wk-ok);letter-spacing:.14em}
.frag p{margin:6px 0;text-align:left}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes stamp{0%{transform:rotate(14deg) scale(2.4);opacity:0}70%{transform:rotate(14deg) scale(.92);opacity:1}100%{transform:rotate(14deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#pl{transition:none}.frag,.frag::after,.bub.last .tx,.node.next .pulse{animation:none}}
/* 結算：探險結算單 */
.stars{font-size:34px;letter-spacing:5px;color:var(--tk-accent);text-align:center;margin:2px 0;-webkit-text-stroke:1.5px var(--tk-line)}
.rank{text-align:center;font-family:var(--tk-font-title);font-size:26px;margin:2px 0}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 2px}
.bd div{background:var(--wk-chip);border:2px solid var(--tk-line);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700}
.bd b{display:block;font-size:22px;font-family:var(--tk-font-title)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fgrid .frag{margin:0;animation:none;padding:14px 12px}
.fgrid .frag::after{display:none}
.fgrid .frag .ic{font-size:36px}
.fgrid .frag .nm{font-size:17px}
.fgrid .frag p{font-size:13px}
</style>
</head>

  var TK = {
    mods: {}, order: [],
    reg: function (m) { TK.mods[m.id] = m; TK.order.push(m.id); return m; },
    initAll: function (d) { TK.order.forEach(function (id) { var m = TK.mods[id]; m.init(d[m.section], m.root ? document.querySelector(m.root) : null); }); },
    list: function () { return TK.order.map(function (id) { var m = TK.mods[id]; return { id: id, section: m.section, root: m.root || null, api: ['init', 'step', 'render'].filter(function (k) { return typeof m[k] === 'function'; }) }; }); }
  };
  var BUILTIN = ['walk.json', 'walk_skin.json'];
  var LABEL = { 'walk.json': '玩法版', 'walk_skin.json': '換皮版' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- 資料檢查（學生改壞 JSON 時，在這裡看得到哪裡錯） ---------- */
  function validate(d) {
    var e = [], w = [], ids = {};
    function bad(m) { e.push(m); }
    if (!d || typeof d !== 'object') return { e: ['整份資料不是物件'], w: w };
    if (!d.meta || !d.meta.title) bad('meta.title 不能空白');
    if (!d.rules || ['gated', 'free'].indexOf(d.rules.mode) < 0) bad('rules.mode 只能是 "gated"（照順序）或 "free"（隨便走）');
    var flags = d.flags || {};
    if (!Array.isArray(d.stops) || !d.stops.length) { bad('stops 至少要有一站'); return { e: e, w: w }; }
    function chkFlags(list, where) { (list || []).forEach(function (f) { if (!has(flags, f)) bad(where + ' 用了沒有登記的旗標「' + f + '」（要先寫進 flags）'); }); }
    d.stops.forEach(function (s, i) {
      var p = '第 ' + (i + 1) + ' 站（' + (s.name || s.id || '沒有名字') + '）';
      if (!s.id || !/^[A-Za-z0-9_-]+$/.test(s.id)) bad(p + '：id 要用英文、數字或底線');
      else if (ids[s.id]) bad(p + '：id「' + s.id + '」重複了'); else ids[s.id] = 1;
      if (!s.name) bad(p + '：沒有 name');
      var hasLat = typeof s.lat === 'number', hasLon = typeof s.lon === 'number';
      if (hasLat !== hasLon) bad(p + '：lat 和 lon 要一起有、或一起是 null');
      if (s.map && (typeof s.map.x !== 'number' || typeof s.map.y !== 'number' || s.map.x < 0 || s.map.x > 100 || s.map.y < 0 || s.map.y > 80)) w.push(p + '：map 的 x 要在 0–100、y 要在 0–80 之間（這一站會被自動排位置）');
      if (s.frag && (!s.frag.name || !s.frag.text)) w.push(p + '：frag 要有 name 和 text（這一站會用預設碎片）');
      chkFlags(s.requires, p + ' 的 requires');
      if (s.on_complete) chkFlags(s.on_complete.grant, p + ' 的 on_complete.grant');
      if (!Array.isArray(s.tasks) || !s.tasks.length) { bad(p + '：tasks 至少要有一題'); return; }
      var tid = {};
      s.tasks.forEach(function (t, j) {
        var q = p + ' 的第 ' + (j + 1) + ' 題（' + (t.id || '沒有 id') + '）';
        if (!t.id || tid[t.id]) bad(q + '：id 沒填或重複'); else tid[t.id] = 1;
        if (!t.title) bad(q + '：沒有 title');
        chkFlags(t.show_if, q + ' 的 show_if');
        var ty = t.type;
        if (['choice', 'text', 'order', 'observe', 'decision'].indexOf(ty) < 0) { bad(q + '：type「' + ty + '」不認得（choice／text／order／observe／decision）'); return; }
        if (ty === 'choice') {
          if (!Array.isArray(t.options) || t.options.length < 2) bad(q + '：options 至少兩個');
          else if (t.options.indexOf(t.answer) < 0) bad(q + '：answer 要和其中一個選項一字不差');
        }
        if (ty === 'text' && (!Array.isArray(t.accept) || !t.accept.length)) bad(q + '：accept 要列出可以接受的答案');
        if (ty === 'order') {
          if (!Array.isArray(t.items) || !Array.isArray(t.answer) || t.items.length !== t.answer.length) bad(q + '：items 和 answer 數量要一樣');
          else t.answer.forEach(function (a) { if (t.items.indexOf(a) < 0) bad(q + '：answer 裡的「' + a + '」不在 items 裡'); });
        }
        if (ty === 'decision') {
          if (!Array.isArray(t.options) || t.options.length < 2) bad(q + '：options 至少兩個');
          else t.options.forEach(function (o) { if (!o.text) bad(q + '：每個選項要有 text'); chkFlags(o.grant, q + ' 的 grant'); });
        }
      });
    });
    if (!Array.isArray(d.endings) || !d.endings.length) bad('endings 至少要有一個');
    else {
      d.endings.forEach(function (en) {
        chkFlags(en.requires, '結局「' + (en.title || '') + '」的 requires');
        String(en.text || '').replace(/\{\{(\w+)\.(\w+)\}\}/g, function (m, sid, tid) {
          var st = d.stops.filter(function (x) { return x.id === sid; })[0], tk = st && (st.tasks || []).filter(function (x) { return x.id === tid; })[0];
          if (!tk || tk.type !== 'observe') bad('結局「' + (en.title || '') + '」的 ' + m + ' 要指到某一站的 observe 現場題（站id.題id）');
        });
      });
      if ((d.endings[d.endings.length - 1].requires || []).length) bad('最後一個結局的 requires 要是空的 []（當作沒有其他結局時的保底）');
    }
    if (!d.reflect || !d.reflect.question || !Array.isArray(d.reflect.choices)) bad('reflect 要有 question 和 choices');
    return { e: e, w: w };
  }

  /* ---------- 存檔（只存在這支手機的瀏覽器；讀不到也能玩） ---------- */
  function skey() { return 'walktpl:' + D.meta.id; }
  function fresh() { return { view: 'title', started: false, pos: 'start', sel: null, cur: null, at: {}, done: {}, flags: {}, ans: {}, wrong: {}, fb: {}, order: {}, completed: {}, pts: {}, talk: {}, talked: {}, pend: null, score: 0, sim: false, note: '', reflect: { c: -1, story: '' } }; }
  function load() { try { var r = localStorage.getItem(skey()); if (r) { var o = JSON.parse(r); if (o.view === 'home') o.view = 'map'; return Object.assign(fresh(), o); } } catch (x) { } return fresh(); }
  function save() { try { localStorage.setItem(skey(), JSON.stringify(ST)); } catch (x) { } }

  /* ---------- 狀態 ---------- */
  function sget(id) { return D.stops.filter(function (s) { return s.id === id; })[0]; }
  function locked(s) { return D.rules.mode === 'gated' && (s.requires || []).some(function (f) { return !ST.flags[f]; }); }
  function key(s, t) { return s.id + '.' + t.id; }
  function tasksOf(s) { return s.tasks.filter(function (t) { return !(t.show_if || []).some(function (f) { return !ST.flags[f]; }); }); }
  function stopDone(s) { return !!ST.at[s.id] && tasksOf(s).filter(function (t) { return !t.optional; }).every(function (t) { return ST.done[key(s, t)]; }); }
  function reqStops() { return D.stops.filter(function (s) { return !s.optional; }); }
  function allDone() { return reqStops().every(stopDone); }
  function grant(list) { (list || []).forEach(function (f) { ST.flags[f] = true; }); }
  function shortName(s) { return s.short || String(s.name).replace(/（.*?）/g, '').replace(/\(.*?\)/g, ''); }
  function fragOf(s) { var c = s.culture || {}; var f = s.frag || {}; return { icon: f.icon || '🧩', name: f.name || (shortName(s) + '的碎片'), text: f.text || c.note || '', origin: c.origin || '' }; }
  function afterTask(s) {
    if (stopDone(s) && !ST.completed[s.id]) {
      ST.completed[s.id] = true;
      var oc = s.on_complete || {};
      grant(oc.grant); ST.msg = oc.msg || '';
    }
    save();
  }
  function dist(a, b, c, d) {
    var R = 6371000, r = Math.PI / 180, dl = (c - a) * r, dn = (d - b) * r;
    var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dn / 2) * Math.sin(dn / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function norm(s) { return String(s).trim().toLowerCase().replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 65248); }).replace(/\s+/g, ''); }
  function nextStop() { var l = reqStops().filter(function (s) { return !stopDone(s) && !locked(s); }); return l[0] || null; }
  function doneCount() { return reqStops().filter(stopDone).length; }
  function fragCount() { return D.stops.filter(function (s) { return ST.completed[s.id]; }).length; }
  function pts(t) { return t.type === 'decision' ? 1 : 2; }

  /* ---------- 評價 ---------- */
  function tally() {
    var earned = 0, poss = 0, right = 0, quiz = 0, notes = 0, dec = 0;
    D.stops.forEach(function (s) {
      if (s.optional && !ST.at[s.id]) return;
      poss += 1; if (ST.completed[s.id]) earned += 1;

    var en = D.endings.filter(function (e) { return (e.requires || []).every(function (f) { return ST.flags[f]; }); })[0] || D.endings[D.endings.length - 1];
    var T = tally();
    var h = '<button class="btn ghost" data-act="home">← 回地圖</button><div class="hero" style="padding:18px 12px"><div class="cv" style="font-size:44px">🎬</div><h1 style="font-size:24px">' + esc(en.title) + '</h1><div>' + tagOf(en.origin || '工坊創作') + '</div></div>';
    h += '<div class="card">' + esc(fillText(en.text)) + '</div>';
    h += TK.mods['資源計分'].render(ST);
    h += '<h2>你的碎片冊</h2><div class="fgrid">' + D.stops.filter(function (s) { return ST.completed[s.id]; }).map(function (s) { var f = fragOf(s); return '<div class="frag"><div class="ic">' + esc(f.icon) + '</div><div class="nm">' + esc(f.name) + '</div><p>' + esc(f.text) + '</p></div>'; }).join('') + '</div>';
    h += TK.mods['事件選擇'].render(ST);
    var notes = [];
    D.stops.forEach(function (s) { s.tasks.forEach(function (t) { var k = key(s, t); if (t.type === 'observe' && ST.ans[k]) notes.push('<li><b>' + esc(shortName(s)) + '</b>：' + esc(ST.ans[k]) + '</li>'); }); });
    if (notes.length) h += '<h2>你在現場寫下的</h2><ul>' + notes.join('') + '</ul>';
    h += '<h2>寫下這一趟</h2><div class="card"><p><b>' + esc(D.reflect.story_prompt || '') + '</b></p><textarea id="story">' + esc(ST.reflect.story) + '</textarea>' +
      '<button class="btn pri" data-act="share">整理成一段文字，貼給老師或貼給 AI</button><textarea id="out" readonly hidden></textarea></div>';
    h += '<h2>再玩一次</h2><div class="small">換另一版玩，或把這一版重新走一遍，看看結局會不會不同。</div>' + switcher() + '<button class="btn ghost" data-act="reset">' + (ST.confirmReset ? '再按一次就清掉這一版的進度' : '重新開始這一版') + '</button>';
    APP.innerHTML = h;
  }
  function shareText() {
    var T = tally(), out = ['【' + D.meta.title + '／' + (D.meta.subtitle || '') + '】', '評價：' + T.rank.title + '（' + T.earned + ' / ' + T.poss + ' 分）、碎片 ' + fragCount() + ' / ' + D.stops.length];
    Object.keys(D.flags || {}).forEach(function (f) { if (ST.flags[f]) out.push('✓ ' + D.flags[f]); });
    D.stops.forEach(function (s) { s.tasks.forEach(function (t) { var k = key(s, t); if (t.type === 'observe' && ST.ans[k]) out.push('現場（' + s.name + '）：' + ST.ans[k]); }); });
    out.push('一句話故事：' + (ST.reflect.story || '還沒寫'));
    return out.join('\n');
  }
  function render() {
    if (!D) return;
    var v = ST.view;
    APP.setAttribute('data-v', v === 'stop' && ST.cur && sget(ST.cur) ? 'stop' : (v === 'end' || v === 'map' ? v : 'title'));
    if (v === 'stop' && ST.cur && sget(ST.cur)) return TK.mods['角色'].render(ST);
    if (v === 'end') return TK.mods['勝負'].render(ST);
    if (v === 'map') return TK.mods['空間'].render(ST);
    ST.view = 'title'; TK.mods['空間'].renderTitle(ST);
  }
  function fatal(list) {
    APP.innerHTML = '<h1>這份資料有地方錯了</h1><div class="card err"><ul>' + list.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul></div><p class="small">改好 JSON 以後重新整理，或在下面重新選一個檔。</p><input type="file" id="pick" accept=".json,application/json">' + '<div class="row">' + BUILTIN.map(function (n) { return '<button class="btn ghost" data-act="variant" data-n="' + n + '">' + LABEL[n] + '</button>'; }).join('') + '</div>';
  }

  /* ---------- 載入資料 ---------- */
  function start(d, name) {
    var v = validate(d);
    if (v.e.length) { D = null; return fatal(v.e); }
    d.__warn = v.w; D = d; NAME = name; ST = load(); TK.initAll(D); render(); window.__walkReady = true;
  }
  function parseThen(text, name) { var d; try { d = JSON.parse(text); } catch (x) { return fatal(['JSON 格式不對（多一個逗號、少一個引號？）：' + x.message]); } start(d, name); }
  function loadByName(name) {
    var inl = document.getElementById('inline-' + name);
    function useInline() { if (inl) parseThen(inl.textContent, name); else fatal(['找不到 ' + name]); }
    if (location.protocol === 'file:') return useInline();
    fetch(name, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (t) { parseThen(t, name); }).catch(useInline);
  }

  /* ---------- 走過去（地圖上的小人移動） ---------- */
  function arriveAt(s) { ST.pos = s.id; ST.at[s.id] = 1; ST.note = ''; ST.fail = false; ST.view = 'stop'; ST.cur = s.id; ST.pend = null; save(); render(); window.scrollTo(0, 0); }
  function walkTo(s) {
    if (WALKING) return;
    ST.sel = s.id; WALKING = true; ST.note = ''; render();
    var pl = document.getElementById('pl'), p = posOf(s);
    if (!pl) { WALKING = false; return arriveAt(s); }
    void pl.getBoundingClientRect();
    pl.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function () { WALKING = false; arriveAt(s); }, reduce ? 50 : 650);
  }


  /* ---------- 八個模組（名稱與規格正本一致；薄包裝：版面函式留在上面，模組負責「讀自己的那一段 JSON」與固定介面） ---------- */
  TK.reg({ id: '空間', section: 'stops', root: '#app',
    init: function (cfg, root) { this.cfg = cfg || []; this.root = root; },
    step: function (state, a) {
      var s = a.s;
      if (a.type === 'title') { state.view = 'title'; }
      else if (a.type === 'start') { state.started = true; state.view = 'map'; state.sel = null; }
      else if (a.type === 'home') { state.view = 'map'; state.note = ''; state.fail = false; state.pend = null; state.sel = null; }
      else if (a.type === 'sel') { state.sel = s.id; state.note = ''; state.fail = false; state.view = 'map'; }
      else if (a.type === 'open') { state.view = 'stop'; state.cur = s.id; state.note = ''; state.fail = false; state.pend = null; }
      else if (a.type === 'end') { state.view = 'end'; }
      return state;
    },
    render: function (state) { mapView(); },
    renderTitle: function (state) { titleView(); } });
  TK.reg({ id: '時間回合', section: 'rules', root: '#app',
    init: function (cfg, root) { this.cfg = cfg || {}; this.root = root; },
    step: function (state, a) { if (a.type === 'arrive') { state.at[a.s.id] = 1; state.pos = a.s.id; state.note = ''; state.fail = false; } return state; },
    render: function (state) { return paceHtml(); } });
  TK.reg({ id: '角色', section: 'stops', root: '#app',
    init: function (cfg, root) { this.cfg = cfg || []; this.root = root; },
    step: function (state, a) {
      if (a.type === 'next') { var ls = (a.s.npc && a.s.npc.lines) || [], ni = (state.talk[a.s.id] || 0) + 1; if (ni >= ls.length) state.talked[a.s.id] = true; else state.talk[a.s.id] = ni; }
      return state;
    },
    render: function (state) { stopView(sget(state.cur)); } });
  TK.reg({ id: '核心動作', section: 'stops', root: '#app',
    init: function (cfg, root) { this.cfg = cfg || []; this.root = root; },
    step: function (state, a) {
      var s = a.s, t = a.t, b = a.el, k = key(s, t);
      function done(pts_, head, msg, note) { state.done[k] = true; state.fb[k] = ''; state.pts[k] = pts_; state.pend = { s: s.id, head: head, msg: msg, note: note || '' }; afterTask(s); }
    if (a.type === 'choice') {
      var o = t.options[+b.getAttribute('data-i')];
      if (o === t.answer) { if (!state.wrong[k] && D.rules.score) state.score++; done(state.wrong[k] ? 1 : 2, '✓ 答對了' + (state.wrong[k] ? '（第二次）' : '，一次就中'), t.reward || '對。'); }
      else { state.wrong[k] = true; state.fb[k] = '不是這個。' + (D.rules.hints && t.hint ? '提示：' + t.hint : ''); }
    }
    else if (a.type === 'text') {
      var v = norm(document.getElementById('in-' + k).value || '');
      if (t.accept.some(function (a) { return norm(a) === v; })) { if (!state.wrong[k] && D.rules.score) state.score++; done(state.wrong[k] ? 1 : 2, '✓ 答對了' + (state.wrong[k] ? '（第二次）' : '，一次就中'), t.reward || '對。'); }
      else { state.wrong[k] = true; state.fb[k] = '不對，再試一次。' + (D.rules.hints && t.hint ? '提示：' + t.hint : ''); }
    }
    else if (a.type === 'pick') {
      var pk = state.order[k] = state.order[k] || []; pk.push(b.getAttribute('data-v'));
      if (pk.length === t.items.length) {
        if (pk.join('|') === t.answer.join('|')) done(state.wrong[k] ? 1 : 2, '✓ 順序對了', t.reward || '順序對了。');
        else { state.wrong[k] = true; state.order[k] = []; state.fb[k] = '順序不對，重排。' + (D.rules.hints && t.hint ? '提示：' + t.hint : ''); }
      }
    }
    else if (a.type === 'unpick') { state.order[k] = []; }
    else if (a.type === 'observe') {
      var tx = (document.getElementById('in-' + k).value || '').trim();
      if (tx.length < (t.min || 8)) { state.fb[k] = '再多寫一點（至少 ' + (t.min || 8) + ' 個字）。'; }
      else { state.ans[k] = tx; done(2, '✍ 筆記收進冊子了', t.reward || '記下來了。', tx); }
    }
      return state;
    },
    render: function (state) { var s = sget(state.cur), cur = tasksOf(s).filter(function (t) { return !state.done[key(s, t)] && !t.optional; })[0]; return cur ? taskView(s, cur) : ''; } });
  TK.reg({ id: '事件選擇', section: 'flags', root: '#app',
    init: function (cfg, root) { this.cfg = cfg || {}; this.root = root; },
    step: function (state, a) {
      var s = a.s, t = a.t, b = a.el, k = key(s, t);
      function done(pts_, head, msg, note) { state.done[k] = true; state.fb[k] = ''; state.pts[k] = pts_; state.pend = { s: s.id, head: head, msg: msg, note: note || '' }; afterTask(s); }
      if (a.type === 'decide') {
      var op = t.options[+b.getAttribute('data-i')]; grant(op.grant); state.ans[k] = op.reply || op.text; done(1, '你選了：' + op.text, op.reply || '');
      }
      return state;
    },
    render: function (state) { return flagsHtml(); } });
  TK.reg({ id: '資源計分', section: 'ranks', root: '#app',
    init: function (cfg, root) { this.cfg = cfg || []; this.root = root; },
    step: function (state, a) { if (a.type === 'point') state.score += (a.n || 1); return state; },
    render: function (state) { return scoreHtml(); } });
  TK.reg({ id: '勝負', section: 'endings', root: '#app',
    init: function (cfg, root) { this.cfg = cfg || []; this.root = root; },
    step: function (state, a) { return state; },
    render: function (state) { endView(); } });
  TK.reg({ id: '回饋', section: 'stops', root: '#app',
    init: function (cfg, root) { this.cfg = cfg || []; this.root = root; },
    step: function (state, a) { if (a.type === 'complete') afterTask(a.s); return state; },
    render: function (state) { return fragView(sget(state.cur)); } });

  window.__walkModules = function () { return TK.list(); };

  /* ---------- 事件 ---------- */
  APP.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('role') === 'button' && ev.target.tagName.toLowerCase() === 'g') { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
  APP.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), s = b.getAttribute('data-s') ? sget(b.getAttribute('data-s')) : null;
    var t = s && b.getAttribute('data-t') ? s.tasks.filter(function (x) { return x.id === b.getAttribute('data-t'); })[0] : null;
    var k = s && t ? key(s, t) : '';
    if (act === 'variant') { return loadByName(b.getAttribute('data-n')); }
    if (!D || WALKING) return;
    function done(pts_, head, msg, note) { ST.done[k] = true; ST.fb[k] = ''; ST.pts[k] = pts_; ST.pend = { s: s.id, head: head, msg: msg, note: note || '' }; afterTask(s); }
    if (['title', 'start', 'home', 'sel', 'open', 'end'].indexOf(act) >= 0) { TK.mods['空間'].step(ST, { type: act, s: s }); }
    else if (act === 'arrive') { TK.mods['時間回合'].step(ST, { type: 'arrive', s: s }); }
    else if (act === 'walk') { if (locked(s)) { ST.sel = s.id; } else { return walkTo(s); } }
    else if (act === 'reset') { if (!ST.confirmReset) { ST.confirmReset = true; render(); setTimeout(function () { if (ST && ST.confirmReset) { ST.confirmReset = false; render(); } }, 6000); return; } var sim = ST.sim; ST = fresh(); ST.sim = sim; ST.started = false; ST.view = 'title'; }
    else if (act === 'talknext') { TK.mods['角色'].step(ST, { type: 'next', s: s }); }
    else if (act === 'cont') { ST.pend = null; }
    else if (act === 'gps') {
      if (!navigator.geolocation) { ST.note = '這個瀏覽器不能定位，請改按「走過去」。'; ST.fail = true; render(); return; }
      ST.sel = s.id; ST.note = '定位中……'; render();
      navigator.geolocation.getCurrentPosition(function (p) {
        var d = Math.round(dist(p.coords.latitude, p.coords.longitude, s.lat, s.lon));
        if (d <= (s.r || 60)) { arriveAt(s); return; } else { ST.note = '你離這裡還有約 ' + d + ' 公尺，再走近一點（或按「走過去」）。'; ST.fail = true; }
        save(); render();
      }, function () { ST.note = '拿不到定位（可能沒開權限或在室內）。可以改按「走過去」。'; ST.fail = true; render(); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
      return;
    }
    else if (act === 'decide') { TK.mods['事件選擇'].step(ST, { type: act, s: s, t: t, el: b }); }
    else if (['choice', 'text', 'pick', 'unpick', 'observe'].indexOf(act) >= 0) { TK.mods['核心動作'].step(ST, { type: act, s: s, t: t, el: b }); }
    else if (act === 'share') {
      var sv = document.getElementById('story'); if (sv) ST.reflect.story = sv.value;
      save(); render();
      var out = document.getElementById('out'); out.value = shareText(); out.hidden = false; out.focus(); out.select();
      try { if (navigator.clipboard) navigator.clipboard.writeText(out.value).catch(function () { }); } catch (x) { }
      return;
    }
    save(); render(); if (act !== 'choice' && act !== 'text' && act !== 'pick' && act !== 'unpick' && act !== 'refl') window.scrollTo(0, 0);
  });
  APP.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'pick' && t.files[0]) { var r = new FileReader(); r.onload = function () { parseThen(r.result, 'custom'); }; r.readAsText(t.files[0]); return; }
    if (t.getAttribute && t.getAttribute('data-photo') && t.files[0]) { ST.draft = ST.draft || {}; Array.prototype.forEach.call(APP.querySelectorAll('textarea[id^="in-"]'), function (x) { ST.draft[x.id.slice(3)] = x.value; }); PHOTO[t.getAttribute('data-photo')] = URL.createObjectURL(t.files[0]); var top = window.scrollY; render(); window.scrollTo(0, top); }
  });

  var q = new URLSearchParams(location.search).get('data');
  loadByName(q && /^[\w.\-]+\.json$/.test(q) ? q : 'walk.json');
})();
</script>
