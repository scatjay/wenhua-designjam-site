<title>三場鼓：小上帝廟前（節奏樣板）</title>
<style>
:root{
  --tk-surface:#0d0b1a; --tk-panel:#1b1636; --tk-ink:#f4f1ff; --tk-muted:#a79fd8;
  --tk-accent:#ff3d9a; --tk-accent-ink:#0d0b1a; --tk-line:#3d3280;
  --tk-font-title:"Huninn","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --tk-font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --tk-radius:20px; --tk-shadow:0 0 14px color-mix(in srgb,var(--tk-accent) 45%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--tk-surface);color:var(--tk-ink);font-family:var(--tk-font-body);line-height:1.55;-webkit-text-size-adjust:100%}
body{padding-bottom:28px;overflow-x:hidden;background-image:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--tk-accent) 22%,transparent),transparent 60%);background-attachment:fixed}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--tk-surface);border-bottom:2px solid var(--tk-accent)}
.bar{display:flex;align-items:center;gap:8px;max-width:520px;margin:0 auto;padding:8px 16px}
.bar b{flex:1;font-family:var(--tk-font-title);font-size:15px;line-height:1.25;color:var(--tk-accent)}
.bar button{min-height:44px;padding:0 12px;font-size:14px}
.banner{max-width:520px;margin:0 auto;padding:0 16px 6px;font-size:12px;color:var(--tk-muted)}
button{font:inherit;color:var(--tk-ink);background:var(--tk-panel);border:1px solid var(--tk-line);border-radius:var(--tk-radius);min-height:48px;padding:0 18px;cursor:pointer;touch-action:manipulation}
button.pri{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-accent);font-weight:700;box-shadow:var(--tk-shadow)}
#mute[aria-pressed="false"]{outline:2px solid var(--tk-accent)}
.choices button[aria-pressed="true"]{outline:2px solid var(--tk-accent)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--tk-accent);outline-offset:2px}
h1,h2,h3{font-family:var(--tk-font-title);letter-spacing:.03em}
h1{font-size:23px;margin:16px 0 4px;color:var(--tk-accent)}
h2{font-size:18px;margin:20px 0 6px}
h3{font-size:15px;margin:12px 0 4px;color:var(--tk-accent)}
p{margin:6px 0}
.card{background:var(--tk-panel);border:1px solid var(--tk-line);border-radius:var(--tk-radius);padding:12px 16px;margin:12px 0}
.sub{color:var(--tk-muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.row>button{flex:1 1 120px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--tk-surface);border:1px solid var(--tk-muted);margin-right:6px;white-space:nowrap}
.chip.t-原著{border-color:var(--tk-accent);color:var(--tk-accent)}
.chip.t-民間{border-style:dashed}
.chip.t-工坊創作{border-style:dotted;border-width:2px}
.chip.t-改編{border-style:double;border-width:3px}
.chip.t-田野{background:var(--tk-line)}
.chip.t-常識{border-color:var(--tk-line);color:var(--tk-muted)}
ul.basis{list-style:none;margin:6px 0 0;padding:0}
ul.basis li{margin:6px 0;font-size:14px}
.stagelist{display:grid;gap:8px;margin:10px 0}
.stagelist button{text-align:left;display:flex;gap:10px;align-items:center;padding:8px 14px}
.stagelist .ic{flex:0 0 34px;height:34px}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:8px 0 4px;align-items:baseline}
.hud b{font-size:15px}
#meters{display:grid;gap:6px;margin:4px 0 8px}
.meter{font-size:12px}
.meter .lab{display:flex;justify-content:space-between}
.meter .track{height:10px;border-radius:6px;background:var(--tk-line);overflow:hidden;margin-top:2px}
.meter .fill{height:100%;width:0;background:var(--tk-ink);transition:width .12s}
.meter.warn .fill{background:color-mix(in srgb,var(--tk-accent) 60%,var(--tk-ink))}
.meter.hot .fill{background:var(--tk-accent)}
.meter.shake{animation:sh .4s infinite}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.dots{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.dots i{flex:1 1 0;min-width:34px;text-align:center;font-style:normal;font-size:11px;padding:3px 0;border-radius:8px;background:var(--tk-line);color:var(--tk-muted)}
.dots i.on{background:var(--tk-accent);color:var(--tk-accent-ink);font-weight:700}
.dots i.sep{flex:0 0 8px;min-width:8px;background:transparent}
.cvwrap{position:relative;border:1px solid var(--tk-line);border-radius:var(--tk-radius);overflow:hidden;background:var(--tk-surface);box-shadow:var(--tk-shadow)}
canvas#cv{display:block;width:100%;height:340px;touch-action:none}
#toast{position:absolute;left:8px;right:8px;top:8px;text-align:center;font-weight:700;font-size:14px;padding:6px 10px;border-radius:12px;background:var(--tk-panel);color:var(--tk-ink);border:1px solid var(--tk-accent);opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#pads{display:flex;gap:8px;margin:8px 0}
#pads button.pad{flex:1 1 0;min-height:84px;font-size:16px;font-weight:700;border-width:2px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;user-select:none;-webkit-user-select:none;touch-action:none}
#pads button.pad small{font-weight:400;font-size:11px;color:var(--tk-muted)}
#pads button.pad.down{filter:brightness(1.4);transform:scale(.97);box-shadow:var(--tk-shadow)}
.big{font-size:44px;font-weight:800;text-align:center;margin:0}
textarea{width:100%;min-height:180px;font:13px/1.45 ui-monospace,Consolas,monospace;background:var(--tk-panel);color:var(--tk-ink);border:1px solid var(--tk-line);border-radius:16px;padding:10px}
.err{color:var(--tk-accent);font-size:13px;margin:4px 0;font-weight:700}
.okmsg{color:var(--tk-ink);font-size:13px;margin:4px 0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all}
label.calib{display:block;font-size:13px;margin-top:8px}
input[type=range]{width:100%;min-height:36px;accent-color:var(--tk-accent)}
details{margin:10px 0}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
footer.f{max-width:520px;margin:18px auto 0;padding:0 16px;font-size:12px;color:var(--tk-muted)}
.choices{display:grid;gap:8px;margin:8px 0}
.choices button{text-align:left;padding:10px 14px}
.lines li{margin:4px 0}
.hide{display:none!important}
</style>

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function buildModel(st, D){
  var beatMs = 60000/st.bpm, cellMs = beatMs*st.beats_per_bar/st.grid, leadMs = st.lead_in_beats*beatMs;
  var laneIds = st.lanes.map(function(l){return l.id;});
  var notes = [], nid = 0, starCount = 0;
  var starMeter = (st.meters||[]).filter(function(m){return m.type==='count' && m.per_phrase;})[0];
  st.bars.forEach(function(bar, bi){
    laneIds.forEach(function(lid, li){
      var pat = bar[lid] || '';
      for(var i=0;i<pat.length;i++){
        var ch = pat.charAt(i);
        if(ch!=='x' && ch!=='o') continue;
        notes.push({id:nid++, lane:li, kind:ch, t:leadMs+(bi*st.grid+i)*cellMs, bar:bi, cell:i, state:'pending', star:-1, shifted:false, switched:false});
      }
    });
  });
  notes.sort(function(a,b){return a.t-b.t || a.lane-b.lane;});
  var xi = 0; notes.forEach(function(n){ if(n.kind==='x'){ n.xi = xi++; } });
  if(starMeter){ notes.forEach(function(n){ if(n.kind==='x'){ n.star = starCount % starMeter.per_phrase; starCount++; } }); }
  var endMs = leadMs + st.bars.length*st.grid*cellMs;
  var nTap = notes.filter(function(n){return n.kind==='x';}).length;
  var model = {st:st, D:D, beatMs:beatMs, cellMs:cellMs, leadMs:leadMs, notes:notes, endMs:endMs, nTap:nTap, nAvoid:notes.length-nTap,
               laneIds:laneIds, starMeter:starMeter||null, finaleMs: st.finale ? endMs + (st.finale.after_beats||4)*beatMs : null};
  return model;
}
function win(model){ var j=model.D.judge, o=model.st.judge||{}; return {perfect:o.perfect||j.perfect, good:o.good||j.good, avoid:o.avoid||j.avoid, approach:o.approach_ms||j.approach_ms, sheng:(o.jiao&&o.jiao.sheng)||j.jiao.sheng, xiao:(o.jiao&&o.jiao.xiao)||j.jiao.xiao}; }

function createRun(model){
  var run = {model:model, notes:model.notes.map(function(n){return Object.assign({},n,{state:'pending'});}), meters:{}, mischief:0,
    stats:{perfect:0,good:0,miss:0,avoidHit:0,score:0,combo:0,maxCombo:0,taps:0,stray:0}, events:[], e:0, done:false,
    finale:{status: model.st.finale?'idle':'none', jiao:null, tries:0, t:null, tapped:false}, warned:{}, endAt:null};
  (model.st.meters||[]).forEach(function(m){ run.meters[m.id] = (m.type==='count') ? 0 : (m.start||0); run.warned[m.id]=false; });
  return run;
}
function emit(run, type, o){ var ev = Object.assign({type:type, e:run.e}, o||{}); run.events.push(ev); return ev; }
function applyEffect(run, eff){

/* ====================== 因果延續（carry）：上一場留下的事，影響這一場的起點 ====================== */
var CARRY_STATS = ['mischief','miss','avoid_hit','jiao_sheng'];
function carryFor(idx){
  var D = curData(), st = D.stages[idx], out = [];
  if(S.fieldStage || !st) return out;
  (D.carry||[]).forEach(function(c){
    if(c.to!==st.id) return;
    var fi = -1; D.stages.forEach(function(x,i){ if(x.id===c.from) fi = i; });
    var r = fi>=0 ? S.results[S.mode+':'+fi] : null; if(!r) return;
    var val = c.stat==='mischief' ? r.mischief : c.stat==='miss' ? r.stats.miss : c.stat==='avoid_hit' ? r.stats.avoidHit : c.stat==='jiao_sheng' ? (r.jiao==='sheng'?1:0) : 0;
    var d = Math.round(val*c.per); if(c.cap!=null) d = clamp(d, -Math.abs(c.cap), Math.abs(c.cap)); if(d) out.push({c:c, delta:d});
  });
  return out;
}

/* ====================== 一場的進行（即時） ====================== */
function startRun(){

  var cr = carryFor(S.stageIdx);
  cr.forEach(function(x){
    var m = (st.meters||[]).filter(function(mm){return mm.id===x.c.meter;})[0]; if(!m) return;
    S.run.meters[m.id] = clamp(S.run.meters[m.id] + x.delta, 0, m.max||100);
  });
  buildMeters();
  if(cr.length) toast(cr.map(function(x){return x.c.line;}).join(' '));
  var cv = $('cv'); sizeCanvas(cv);

  sfx('start');
  S.raf = requestAnimationFrame(loop);
}
function stopLoop(){ if(S.raf){ cancelAnimationFrame(S.raf); S.raf = 0; } }
function sizeCanvas(cv){

  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); cv._w = w; cv._h = h; cv._dpr = dpr;
}
function nowElapsed(now){ return (now - S.t0)*S.speed; }
function handleTap(laneIdx, ts){
  if(!S.run || S.screen!=='play' || S.pausedAt!=null) return;
  if(!(ts>0) || ts>1e11) ts = performance.now();

function buildMeters(){
  var st = curStage(), box = $('meters'); if(!box) return;
  box.innerHTML = (st.meters||[]).map(function(m){
    if(m.type==='count'){
      var names = st.star_names || [];
      var dots = '';
      if(m.per_phrase){ for(var i=0;i<m.per_phrase;i++){ if(i===4 && st.avoid) dots += '<i class="sep"></i>'; dots += '<i data-dot="'+i+'">'+esc(names[i]||(i+1))+'</i>'; } }
      return '<div class="meter" data-m="'+m.id+'"><div class="lab"><span>'+esc(m.label)+'</span><span class="val"></span></div>'+(dots?'<div class="dots">'+dots+'</div>':'')+'</div>';
    }
    return '<div class="meter" data-m="'+m.id+'"><div class="lab"><span>'+esc(m.label)+'</span><span class="val"></span></div><div class="track"><div class="fill"></div></div></div>';
  }).join('');
}
function updateMeters(){
  var run = S.run, st = curStage();
  (st.meters||[]).forEach(function(m){
    var el = document.querySelector('.meter[data-m="'+m.id+'"]'); if(!el) return;
    var v = run.meters[m.id];
    if(m.type==='count'){
      el.querySelector('.val').textContent = v+' / '+S.model.nTap;
      if(m.per_phrase){
        var done = run.notes.filter(function(n){return n.kind==='x' && n.state!=='pending';}).length;
        var ps = Math.floor(Math.max(0,done-1)/m.per_phrase)*m.per_phrase, litSet = {};
        run.notes.forEach(function(n){ if(n.kind==='x' && n.xi>=ps && n.xi<ps+m.per_phrase && (n.state==='perfect'||n.state==='good')) litSet[n.star]=1; });
        Array.prototype.forEach.call(el.querySelectorAll('[data-dot]'), function(d){ d.classList.toggle('on', !!litSet[+d.getAttribute('data-dot')]); });
      }
    } else {
      var pct = Math.round(v/(m.max||100)*100);
      el.querySelector('.val').textContent = Math.round(v);
      el.querySelector('.fill').style.width = pct+'%';
      var bad = m.high_is_bad ? pct : 100-pct;
      el.classList.toggle('warn', m.warn ? (m.high_is_bad && v>=m.warn) : false);
      el.classList.toggle('hot', m.high_is_bad && v>=(m.warn||70)+20);
      el.classList.toggle('shake', !!(m.warn && m.high_is_bad && v>=m.warn));
    }
  });
}
function toast(msg){
  var t = $('toast'); if(!t) return; t.textContent = msg; t.classList.add('show'); S.toastT = performance.now()+2400;
}
function flash(txt, laneIdx, color){ S.flashes = S.flashes.filter(function(F){return F.lane!==laneIdx;}); S.flashes.push({txt:txt, lane:laneIdx, t:performance.now(), color:color}); }

function consume(){
  var run = S.run, st = curStage(), D = curData();
  var evs = run.events; run.events = [];
  evs.forEach(function(ev){
    if(ev.type==='hit'){ MOD['角色'].step(S, {type:'voice', lane:ev.lane, star:ev.star}); MOD['回饋'].step(S, {type:'flash', txt:(ev.grade==='perfect'?'準':'好'), lane:ev.lane, color:(ev.grade==='perfect'?'var(--tk-accent)':'var(--tk-ink)')}); }
    else if(ev.type==='miss'){ sfx('thud'); flash('漏', ev.lane, 'var(--tk-muted)'); }
    else if(ev.type==='stray'){ flash('空', ev.lane, 'var(--tk-muted)'); }
    else if(ev.type==='avoid_hit'){ sfx('avoid'); flash(st.avoid ? st.avoid.token+'!' : '×', ev.lane, 'var(--tk-accent)'); toast(st.avoid_penalty || '碰到不能碰的了！'); }
    else if(ev.type==='mischief'){ sfx('mischief'); }
    else if(ev.type==='effect'){ toast(ev.message); }
    else if(ev.type==='warn'){ toast('怨氣快滿了，要鬧了！'); }
    else if(ev.type==='finale_open'){ toast(st.finale.ask || ''); }
    else if(ev.type==='finale_locked'){ toast(st.finale.locked || ''); }
    else if(ev.type==='jiao'){
      sfx(ev.result);
      var label = ev.bonus ? (ev.result==='sheng'?'加分！':'沒打中') : ({sheng:'聖筊！',xiao:'笑筊：神明還沒決定，再擲一次',yin:'陰筊'}[ev.result]);
      toast(label);
    }
    else if(ev.type==='done'){ MOD['勝負'].step(S, {type:'finish'}); }
  });
}
function finishRun(){
  if(S.ended) return; S.ended = true;
  var run = S.run, st = curStage(), D = curData();
  sfx('end');
  var key = stageKey();
  var max = stageMax(st, D, S.fieldStage ? null : key);
  S.last = {outcome:pickOutcome(run), stats:Object.assign({},run.stats), mischief:run.mischief, model:S.model, max:max, field:!!S.fieldStage, jiao:run.finale.jiao};
  if(!S.fieldStage) S.results[S.mode+':'+S.stageIdx] = S.last;
  setTimeout(function(){ if(S.screen==='play') show('result'); }, 500);
}

function loop(now){
  if(S.screen!=='play' || !S.run) return;
  if(S.pausedAt!=null) return;
  var e = nowElapsed(now);
  if(S.bot) botStep(e);
  MOD['時間回合'].step(S, {type:'tick', e:e});
  /* 節拍音（只在有聲音時排程） */
  var st = curStage(), tk = st.tick;
  if(tk && !AU.muted && AU.ctx){
    var beatMs = S.model.beatMs;
    while(true){
      var te = S.nextTick*tk.every_beats*beatMs;
      if(te > e+120) break;
      if(te >= e-30){ sfx('tick', tk); }
      S.nextTick++;
    }
  } else { S.nextTick = Math.max(S.nextTick, 0); }
  MOD['事件選擇'].step(S, {type:'consume'});
  MOD['空間'].step(S, {type:'draw', e:e, now:now});
  $('score').textContent = S.run.stats.score;
  $('combo').textContent = S.run.stats.combo;
  updateMeters();
  if(S.toastT && now > S.toastT){ var t = $('toast'); if(t) t.classList.remove('show'); S.toastT = 0; }
  if(!S.run.done) S.raf = requestAnimationFrame(loop);
}

/* ====================== 畫面繪製（canvas） ====================== */
function draw(e, now){
  var cv = $('cv'); if(!cv) return;
  if(cv._w !== cv.clientWidth && cv.clientWidth){ sizeCanvas(cv); }
  var g = cv.getContext('2d'), W = cv._w, H = cv._h, dpr = cv._dpr;
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  var st = curStage(), model = S.model, run = S.run, J = win(model);
  var cs = getComputedStyle(document.documentElement);
  var ink = rc('var(--tk-ink)'), line = rc('var(--tk-line)'), sub = rc('var(--tk-muted)');
  var nL = st.lanes.length, lw = W/nL, hitY = H-56, topY = -24;
  function yOf(t){ return hitY - (t-e)/J.approach*(hitY-topY); }
  /* 鼓道 */
  for(var i=0;i<nL;i++){
    g.fillStyle = rc(st.lanes[i].color); g.globalAlpha = 0.09; g.fillRect(i*lw, 0, lw, H); g.globalAlpha = 1;
    if(i>0){ g.strokeStyle = line; g.lineWidth = 1; g.beginPath(); g.moveTo(i*lw,0); g.lineTo(i*lw,H); g.stroke(); }
  }
  /* 拍線 */
  g.strokeStyle = line; g.lineWidth = 1;
  for(var b=0; b<400; b++){
    var tb = b*model.beatMs; if(tb < e-200) continue; if(tb > e+J.approach+100 || tb > model.endMs+model.beatMs) break;
    var yb = yOf(tb); g.globalAlpha = (b % st.beats_per_bar===0) ? 0.9 : 0.35; g.beginPath(); g.moveTo(0,yb); g.lineTo(W,yb); g.stroke();
  }
  g.globalAlpha = 1;
  /* 判定線 */
  var bp = ((e % model.beatMs)+model.beatMs)%model.beatMs, pulse = Math.max(0, 1 - bp/160);
  for(var k=0;k<nL;k++){ g.strokeStyle = rc(st.lanes[k].color); g.lineWidth = 3 + pulse*3; g.beginPath(); g.moveTo(k*lw+6, hitY); g.lineTo((k+1)*lw-6, hitY); g.stroke(); }
  /* 預備拍 */
  if(e < model.leadMs){
    var cnt = Math.ceil((model.leadMs - e)/model.beatMs);
    g.fillStyle = ink; g.globalAlpha = 0.85; g.font = '800 64px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(cnt), W/2, H/2-30); g.globalAlpha = 1;
  }
  /* 音符 */
  var r = nL>=3 ? 18 : 22;
  run.notes.forEach(function(n){
    if(n.state==='perfect' || n.state==='good' || n.state==='safe') return;
    var y = yOf(n.t); if(y < topY-10 || y > H+30) return;
    var x = n.lane*lw + lw/2, ln = st.lanes[n.lane];
    var col = rc(ln.color), tok = ln.token, a = 1;
    if(n.kind==='x' && st.star_tokens && n.star>=0){ tok = st.star_tokens[n.star]; }
    if(n.kind==='o'){ col = rc((st.avoid&&st.avoid.color)||'var(--tk-muted)'); tok = (st.avoid&&st.avoid.token)||'×'; }
    if(n.switched){ col = rc(st.lanes[n.fromLane].color); tok = st.lanes[n.fromLane].token; }
    if(n.state==='miss' || n.state==='bad'){ a = 0.35; }
    g.globalAlpha = a;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2);
    if(n.kind==='o'){ g.fillStyle = col; g.globalAlpha = a*0.25; g.fill(); g.globalAlpha = a; g.setLineDash([4,3]); g.strokeStyle = col; g.lineWidth = 3; g.stroke(); g.setLineDash([]); }
    else { g.fillStyle = col; g.fill(); }
    if(n.shifted || n.switched){ g.strokeStyle = ink; g.lineWidth = 2; g.beginPath(); g.arc(x,y,r+3,0,Math.PI*2); g.stroke(); }
    g.fillStyle = n.kind==='o' ? col : rc('var(--tk-surface)'); g.font = '700 '+(r-2)+'px "Noto Sans TC","Microsoft JhengHei",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(tok, x, y+1);
    g.globalAlpha = 1;
  });
  /* 鰲頭／加分（擲筊）音符 */
  var f = run.finale;
  if(st.finale && (f.status==='open' || f.status==='retry_wait')){
    var fl = st.lanes.map(function(l){return l.id;}).indexOf(st.finale.lane), fx = fl*lw+lw/2, fy = yOf(f.t);
    g.beginPath(); g.arc(fx,fy,r+10,0,Math.PI*2); g.fillStyle = rc('var(--tk-accent)'); g.globalAlpha = 0.3; g.fill(); g.globalAlpha = 1;
    g.beginPath(); g.arc(fx,fy,r+4,0,Math.PI*2); g.fillStyle = rc('var(--tk-accent)'); g.fill();
    g.fillStyle = rc('var(--tk-accent-ink)'); g.font = '800 '+(r+2)+'px "Noto Sans TC",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(st.finale.token, fx, fy+1);
    g.fillStyle = sub; g.font = '12px sans-serif'; g.fillText(st.finale.label, fx, fy+r+18);
  }
  /* 判定回饋字 */
  S.flashes = S.flashes.filter(function(F){ return now - F.t < 420; });
  S.flashes.forEach(function(F){
    var k2 = (now-F.t)/420, x = F.lane*lw+lw/2;
    g.globalAlpha = 1-k2; g.fillStyle = rc(F.color); g.font = '800 20px "Noto Sans TC",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(F.txt, x, hitY-30-k2*28); g.globalAlpha = 1;
  });
}
window.addEventListener('resize', function(){ var cv = $('cv'); if(cv) sizeCanvas(cv); });

/* ====================== 測試用機器人（不影響一般玩，只在測試時被叫） ====================== */
function botStep(e){ if(!S.botR) S.botR = rng((S.bot&&S.bot.seed)||7); autoTap(S.run, e, S.bot, S.botR); }

/* ====================== 「我要改做」 ====================== */
function bindRemix(){
  var box = $('jsonbox'), msg = $('rxmsg');
  $('rxGet').addEventListener('click', function(){ box.value = JSON.stringify(curData(), function(k, v){ return k==='sources' ? undefined : v; }, 2); msg.innerHTML = '<p class="okmsg">已取出。整份複製貼給 Claude 或 Gemini。</p>'; });
  $('rxLoad').addEventListener('click', function(){
    var d; try{ d = JSON.parse(box.value); }catch(err){ msg.innerHTML = '<p class="err">這不是正確的 JSON：'+esc(err.message)+'</p>'; return; }
    var errs = validate(d);
    if(errs.length){ msg.innerHTML = errs.slice(0,12).map(function(m){return '<p class="err">'+esc(m)+'</p>';}).join('') + (errs.length>12?'<p class="err">還有 '+(errs.length-12)+' 個，先修前面的。</p>':''); return; }
    S.custom = d; S.mode = 'culture'; S.results = {}; maxCache = {}; msg.innerHTML = '<p class="okmsg">載入成功！回主畫面就能玩你的版本。</p>';
    setChrome();
  });
  $('rxReset').addEventListener('click', function(){ S.custom = null; S.results = {}; maxCache = {}; box.value=''; msg.innerHTML = '<p class="okmsg">已還原成原版。</p>'; setChrome(); });
}

/* ====================== 田野打拍器 ====================== */
function bindField(){
  var F = S.field; F.taps = []; F.rec = null;
  var out = $('fOut');
  $('fTempo').addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    F.taps.push(ev.timeStamp); if(F.taps.length>9) F.taps.shift();
    if(F.taps.length>=4){
      var iv = []; for(var i=1;i<F.taps.length;i++) iv.push(F.taps[i]-F.taps[i-1]);
      iv.sort(function(a,b){return a-b;}); var med = iv[Math.floor(iv.length/2)];
      F.bpm = clamp(Math.round(60000/med), 40, 200); $('fBpm').textContent = F.bpm;
    }
  });
  $('fMinus').addEventListener('click', function(){ F.bpm = clamp((F.bpm||90)-2,40,200); $('fBpm').textContent = F.bpm; });
  $('fPlus').addEventListener('click', function(){ F.bpm = clamp((F.bpm||90)+2,40,200); $('fBpm').textContent = F.bpm; });
  $('fRec').addEventListener('click', function(){
    if(!F.bpm){ out.innerHTML = '<p class="err">先在第一步打出拍子的快慢。</p>'; return; }
    var beat = 60000/F.bpm, start = performance.now() + 4*beat;
    F.rec = {start:start, beat:beat, taps:[], end:start+8*beat}; out.innerHTML = '';
    function tick(){
      var now = performance.now(), el = $('fCount'); if(!el) return;
      if(now < F.rec.start){ el.textContent = String(Math.ceil((F.rec.start-now)/beat)); requestAnimationFrame(tick); }
      else if(now < F.rec.end){ el.textContent = '打！'; requestAnimationFrame(tick); }
      else { el.textContent = ''; finishField(); }
    }
    requestAnimationFrame(tick);
  });
  $('fPad').addEventListener('pointerdown', function(ev){ ev.preventDefault(); if(F.rec && ev.timeStamp >= F.rec.start-100 && ev.timeStamp <= F.rec.end) F.rec.taps.push(ev.timeStamp); });
}
function quantize(taps, start, beat){
  var cell = beat*4/8, cells = new Array(16).fill('.');
  taps.forEach(function(t){ var k = Math.round((t-start)/cell); if(k>=0 && k<16) cells[k]='x'; });
  return [cells.slice(0,8).join(''), cells.slice(8).join('')];
}
function finishField(){
  var F = S.field, out = $('fOut'); if(!F.rec) return;
  var bars = quantize(F.rec.taps, F.rec.start, F.rec.beat), n = bars.join('').split('x').length-1;
  if(!n){ out.innerHTML = '<p class="err">沒有收到任何一下。再試一次，在「打！」出現之後打。</p>'; return; }
  F.out = {bpm:F.bpm, bars:bars};
  var snippet = '{"id":"field","bpm":'+F.bpm+',"grid":8,"bars":[{"field":"'+bars[0]+'"},{"field":"'+bars[1]+'"}]}';
  out.innerHTML = '<div class="card"><h3>你打出來的節拍譜（共 '+n+' 下）</h3><p class="mono">'+esc(bars[0])+'<br>'+esc(bars[1])+'</p><p class="sub">x＝有打，.＝空。每個字是半拍。</p>'
    + '<p class="mono" id="fSnip">'+esc(snippet)+'</p>'
    + '<p class="sub">把上面這段貼給 Claude，說：「請把這個節拍加成我遊戲 JSON 的新一場（lanes 用一個鼓面 field，其餘照第一場的格式），並在 basis 加一條 tag 是 田野 的說明，寫我在哪裡、什麼時候聽到的。」</p>'
    + '<div class="row"><button type="button" id="fCopy">複製這段</button><button class="pri" type="button" id="fPlay">試打這段</button></div><div id="fmsg"></div></div>';
  $('fCopy').addEventListener('click', function(){
    var m = $('fmsg'); var done = function(){ m.innerHTML = '<p class="okmsg">已複製。</p>'; };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(snippet).then(done, function(){ m.innerHTML = '<p class="sub">瀏覽器不讓複製，請手動選取上面那段。</p>'; }); }
    else m.innerHTML = '<p class="sub">請手動選取上面那段複製。</p>';
  });
  $('fPlay').addEventListener('click', function(){
    var D = curData(), rows = []; for(var i=0;i<4;i++){ rows.push({field:bars[0]}); rows.push({field:bars[1]}); }
    S.fieldStage = {id:'field', title:'田野打拍：你打的那一段', who:'', bpm:F.bpm, beats_per_bar:4, grid:8, lead_in_beats:4, story:'', how:'照你自己打的節拍，再打一遍。',
      lanes:[{id:'field',label:'田野',key:' ',key_label:'空白鍵',instrument:Object.keys(D.instruments)[0],color:'var(--tk-ink)',token:'聲',icon:'drum'}],
      bars:rows, meters:[{id:'life',type:'gauge',label:'穩定度',lane:null,start:70,max:100,high_is_bad:false,color:'var(--tk-accent)',on:{perfect:2,good:1,miss:-6}}],
      outcomes:[{when:{harvest_min:70},title:'打得很準',text:'你把現場的拍子打回來了。',line:''},{title:'再打一次',text:'節奏有點跑掉，再試一次。',line:''}], tick:{instrument:'muyu',every_beats:1,vol:0.3}};
    show('play');
  });
}

/* ====================== 八個機制模組（名稱與其他樣板同名；每段 init(cfg, root)／step(state, action)／render(state)） ======================
   核心動作 讀 stages[].lanes             按鼓面：落在判定線上的音符 → 準／好／漏
   資源計分 讀 score、judge               香火、連擊
   時間回合 讀 stages[].bpm／bars         一首曲子的時間軸（預備拍 → 小節 → 結束）
   空間     讀 stages[].lanes             鼓道與音符下落區（canvas）
   角色     讀 stages[].who／instruments  這一場的主角與鼓面的聲音
   事件選擇 讀 meters、carry、finale      怨氣、擲筊、上一場留下的事
   勝負     讀 outcomes、ending           每場結果與三場合計的結局
   回饋     讀 meta、ui                   提示字、判定字、聲音、改作頁
   視覺語言只用 :root 的 --tk-* token（surface／panel／ink／muted／accent／accent-ink／line／font-title／font-body／radius／shadow） */
var MOD = {
  '核心動作': {
    init: function(cfg, root){ },
    step: function(state, action){ if(action.type==='tap'){ handleTap(action.lane, action.ts); return true; } return null; },
    render: function(state){
      var st = curStage();
      return '<div id="pads">'+st.lanes.map(function(l,i){ return '<button type="button" class="pad" data-lane="'+i+'" style="border-color:'+l.color+'"><span style="color:'+l.color+'">'+esc(l.token)+'</span>'+esc(l.label)+'<small>'+esc(l.key_label || String(l.key).toUpperCase())+'</small></button>'; }).join('')+'</div>';
    }
  },
  '資源計分': {
    init: function(cfg, root){ },
    step: function(state, action){ if(action.type==='score'){ addScore(state.run, action.grade); return true; } return null; },
    render: function(state){ var st = curStage(); return '<div class="hud"><b>'+esc(st.title)+'</b><span>香火 <b id="score">0</b>　連擊 <b id="combo">0</b></span></div>'; }
  },
  '時間回合': {
    init: function(cfg, root){ },
    step: function(state, action){ if(action.type==='tick'){ stepRun(state.run, action.e); return true; } return null; },
    render: function(state){
      var st = curStage();
      return MOD['資源計分'].render(state) + '<div id="meters"></div>' + MOD['空間'].render(state) + MOD['核心動作'].render(state)
        + (st.avoid ? '<p class="sub" id="legend">虛線圈圈「'+esc(st.avoid.token)+'」＝'+esc(st.avoid.label)+'，不要按。</p>' : '')
        + '<div class="row"><button type="button" id="pause">暫停</button><button type="button" id="quit">離開這場</button></div>';
    }
  },
  '空間': {
    init: function(cfg, root){ },
    step: function(state, action){ if(action.type==='draw'){ draw(action.e, action.now); return true; } return null; },
    render: function(state){ return '<div class="cvwrap"><canvas id="cv" aria-label="音符下落區"></canvas><div id="toast" role="status" aria-live="polite"></div></div>'; }
  },
  '角色': {
    init: function(cfg, root){ },
    step: function(state, action){ if(action.type==='voice'){ playLane(action.lane, action.star); return true; } return null; },
    render: function(state){ return viewHome(curData()); }
  },
  '事件選擇': {
    init: function(cfg, root){ },
    step: function(state, action){ if(action.type==='consume'){ consume(); return true; } return null; },
    render: function(state){ return viewIntro(curData()); }
  },
  '勝負': {
    init: function(cfg, root){ },
    step: function(state, action){ if(action.type==='finish'){ finishRun(); return true; } return null; },
    render: function(state){ return state.screen==='ending' ? viewEnding(curData()) : viewResult(curData()); }
  },
  '回饋': {
    init: function(cfg, root){ },
    step: function(state, action){
      if(action.type==='toast'){ toast(action.msg); return true; }
      if(action.type==='flash'){ flash(action.txt, action.lane, action.color); return true; }
      if(action.type==='sfx'){ sfx(action.name, action.extra); return true; }
      return null;
    },
    render: function(state){ return state.screen==='remix' ? viewRemix(curData()) : viewField(curData()); }
  }
};
Object.keys(MOD).forEach(function(k){ MOD[k].init(DATA, document.getElementById('view')); });

/* ====================== 啟動 ====================== */
$('mode').addEventListener('click', function(){ S.mode = S.mode==='skin' ? 'culture' : 'skin'; S.results = {}; S.pick = null; S.fieldStage = null; S.stageIdx = 0; show('home'); });
$('mute').addEventListener('click', function(){ setMuted(!AU.muted); });
window.__rhythm = {S:S, DATA:DATA, simulate:simulate, buildModel:buildModel, validate:validate, stageMax:stageMax, curData:curData,
  setSpeed:function(n){ S.speed = n; }, setBot:function(b){ S.bot = b; S.botR = null; }, pickOutcome:pickOutcome, quantize:quantize,
  go:function(mode, idx){ S.mode = mode; S.stageIdx = idx||0; S.fieldStage=null; show('stageintro'); }};
setChrome(); render();
})();
