<title>遶境不能停</title>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1915;--card:#27231e;--ink:#efe7da;--muted:#b3a897;--line:#4a4238;--accent:#e57a5f;--accent-ink:#1c1915;--ok:#7fd1a0;--bad:#ff8a80;--sky:#2b2a33;--ground:#5b4c38}}
:root[data-theme="dark"]{--bg:#1c1915;--card:#27231e;--ink:#efe7da;--muted:#b3a897;--line:#4a4238;--accent:#e57a5f;--accent-ink:#1c1915;--ok:#7fd1a0;--bad:#ff8a80;--sky:#2b2a33;--ground:#5b4c38}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:1.45rem;margin:.3em 0 .1em}h2{font-size:1.1rem;margin:1.1em 0 .4em}
.sub{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.kind{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.w2c{border-left:4px solid var(--accent);padding:4px 10px;margin:8px 0}.w2c small{display:block;color:var(--muted)}
button{font:inherit;min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;touch-action:manipulation}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.row>button{flex:1 1 140px}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.92rem}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--ok)}
canvas{width:100%;height:190px;display:block;border-radius:12px;border:1px solid var(--line);background:var(--sky)}
.pad{display:flex;gap:10px;margin:10px 0}.pad button{flex:1;min-height:64px;font-size:1.15rem;font-weight:800}
.msg{min-height:3.2em;padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:.95rem}
.msg.bad{border-color:var(--bad);color:var(--bad)}.msg.ok{border-color:var(--ok)}
.overlay{border:2px solid var(--accent);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.order button{display:block;width:100%;margin:6px 0;text-align:left}
.order button.done{opacity:.5}
.strip-on{outline:3px dashed var(--muted);outline-offset:4px;border-radius:10px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.sel{outline:3px solid var(--accent)}
textarea{width:100%;min-height:88px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.err{color:var(--bad);font-size:.92rem;white-space:pre-wrap}
details{margin:10px 0}summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.8rem;margin-right:4px;color:var(--muted)}
.foot{color:var(--muted);font-size:.8rem;margin-top:18px}
.legend div{display:flex;gap:8px;align-items:center;margin:4px 0}
.chip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;color:#fff;font-weight:800;flex:0 0 auto}
</style>

      if(S.mode==='temple'){ var bs=E.orderButtons(D,S); if(policy==='informed'){ E.templeTap(D,S,E.ordOf(D,S)[S.seq.length].id); } else if(policy==='learner'){ var sig=E.ordOf(D,S).map(function(o){return o.id;}).sort().join(','); if(!memo[sig]) memo[sig]={mem:[],bad:{}}; mem=memo[sig].mem; bad=memo[sig].bad; var pos=S.seq.length, pick; if(pos<mem.length){ pick=mem[pos]; } else { var cand=bs.map(function(b){return b.id;}).filter(function(id){ return S.seq.indexOf(id)<0 && (bad[pos]||[]).indexOf(id)<0; }); pick=cand[Math.floor(rnd()*cand.length)]; } var res=E.templeTap(D,S,pick); if(res.wrong){ (bad[pos]=bad[pos]||[]).push(pick); } else if(pos>=mem.length){ mem.push(pick); } } else { E.templeTap(D,S,bs[Math.floor(rnd()*bs.length)].id); } continue; }
      if(S.mode==='stalled'){ E.restart(D,S); continue; }
      var inp={jump:false,take:false};
      for(var i=0;i<D.route.length;i++){ if(S.st[i]!==null) continue; var it=D.route[i], d=it.at-S.x; if(d<-60) continue; if(d>60) break;
        if(it.kind==='obstacle' && d>10 && d<38) inp.jump=true;
        if(it.kind!=='obstacle'&&it.kind!=='temple' && Math.abs(d)<D.world.take_w-6){ var tk=D.kinds[it.kind].take||{}, isBad=(tk.pts||0)<0||(tk.stamina||0)<0; if(policy!=='informed'||!isBad) inp.take=true; } }
      E.step(D,S,inp,dt);
    }
    var sc=E.score(D,S); return {score:sc.total,stalls:S.stalls,wrong:S.wrong,finished:S.finished,failed:S.failed,altars:sc.altarsGot+'/'+sc.altars,time:+S.time.toFixed(1)}; }
};

// ===================== 畫面 =====================
var DATA={rule:readData('data-rule'), skin:readData('data-skin'), custom:null};
var LET='ABCDEFGH', GRAY=['#7a7a7a','#5f5f5f','#949494','#6c6c6c','#868686'];
var ui={screen:'home',ver:'rule',strip:false,S:null,answer:null,why:'',remixErr:'',remixOk:'',msg:'',msgCls:'',jumpReq:false,takeReq:false,raf:0,last:0,acc:0,auto:null};
function D(){ return DATA[ui.ver]; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];}); }
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
function kv(k){ var d=D(), keys=Object.keys(d.kinds), i=keys.indexOf(k), K=d.kinds[k]; if(ui.strip) return {name:'物件'+LET[i],icon:LET[i],color:GRAY[i%GRAY.length]}; return {name:K.name,icon:K.icon,color:K.color}; }
function tname(id){ var d=D(); if(!ui.strip) return d.temples[id].name; var keys=Object.keys(d.temples); return '停靠點 '+(keys.indexOf(id)+1); }
function segName(x){ var d=D(), n=''; (d.segments||[]).forEach(function(s){ if(x>=s.from) n=s.name; }); return ui.strip?'':n; }

function render(){ var a=document.getElementById('app'); a.innerHTML= ui.screen==='home'?home():ui.screen==='play'?play():end(); bind(); if(ui.screen==='play'){ draw(); } }
function w2block(d){ return '<div class="card"><span class="kind">W2 文化卡：'+esc(d.w2_kind.label)+'</span><p>'+esc(d.w2_kind.line)+'</p>'+d.w2_cards.map(function(c){ return '<div class="w2c"><b>#'+c.no+' '+esc(c.v)+'</b>：'+esc(c.note)+(c.more?'<small>'+esc(c.more)+'</small>':'')+'</div>'; }).join('')+'</div>'; }
function basis(d){ return '<details><summary>依據：哪些是原著、民間、遊戲自己加的</summary><div class="card">'+d.basis.map(function(b){ return '<p><span class="tag">'+esc(b.tag)+'</span>'+esc(b.text)+'</p>'; }).join('')+'</div></details>'; }
function home(){ var d=DATA.rule; return '<h1>'+esc(d.title)+'</h1><div class="sub">橫向捲軸跑酷・文化遊戲松樣板</div>'+w2block(d)+
  '<div class="card"><h2>怎麼玩</h2><p>神轎會自己往前走。按「跳」跳過路障，經過路邊的東西時按「接駕」。走到廟前會停下來，照順序按。</p><p class="sub">'+esc(d.route_note)+'</p>'+
  '<p>這個樣板有兩版，跑起來一樣，差在<b>規則看不看「它是什麼」</b>。兩版都走完，再回答同一題。</p>'+
  '<div class="row"><button class="primary" data-act="start" data-ver="rule">玩「文化長在規則裡」</button><button data-act="start" data-ver="skin">玩「文化只是皮」</button></div>'+(DATA.custom?'<div class="row"><button data-act="start" data-ver="custom">玩我改做的版本</button></div>':'')+'</div>'+
  remix()+basis(d)+'<div class="foot">工坊創作的樣板；《小封神》相關內容只取故事裡的事實，標示在「依據」。</div>'; }
function remix(){ return '<details id="remix"><summary>我要改做（貼上自己的資料）</summary><div class="card"><p>整個遊戲的內容都在一份 JSON 裡：路線上每一個東西放在哪（at）、是什麼（kind）、廟前拜的順序（order）。取出來、貼給 Claude 或 Gemini 改，再貼回來載入。</p>'+
  '<div class="row"><button data-act="dump" data-ver="rule">取出規則版資料</button><button data-act="dump" data-ver="skin">取出皮版資料</button></div><textarea id="remix-box" spellcheck="false" placeholder="把 JSON 貼在這裡"></textarea><div class="row"><button class="primary" data-act="load">載入我的版本</button></div>'+
  (ui.remixErr?'<div class="err">'+esc(ui.remixErr)+'</div>':'')+(ui.remixOk?'<div class="msg ok">'+esc(ui.remixOk)+'</div>':'')+'</div></details>'; }

function play(){ var d=D(), S=ui.S, sc=E.score(d,S);
  var hud='<div class="hud"><b>'+esc(d.title)+'｜'+esc(ui.ver==='custom'?'我改做的版本':d.version_label)+'</b><span>'+sc.total+' 分'+(d.lives?'・命 '+S.lives:'')+(d.on_hit==='stall'?'・停轎 '+S.stalls+' 次':'')+'</span></div>';
  var bar=d.stamina?'<div class="sub">'+esc(ui.strip?'能量':d.stamina.name)+'</div><div class="bar"><i id="stam" style="width:'+Math.max(0,S.stamina)+'%"></i></div>':'';
  var over='';
  if(S.mode==='temple'){ var it=d.route[S.ti], T=d.temples[it.id], bs=E.orderButtons(d,S);
    over='<div class="overlay" id="temple"><b>'+esc(tname(it.id))+'</b><p>'+esc(ui.strip?'按下面三顆鈕繼續。':(d.temple_mode==='order'?T.text+' '+d.order_hint:d.order_hint))+'</p><div class="order">'+
      bs.map(function(o){ var done=S.seq.indexOf(o.id)>=0; return '<button data-act="pray" data-id="'+o.id+'" class="'+(done?'done':'')+'" '+(done?'disabled':'')+'>'+(ui.strip?'◯':esc(o.label))+(done?' ✓':'')+'</button>'; }).join('')+'</div></div>'; }
  if(S.mode==='stalled'){ over='<div class="overlay" id="stalled"><b>'+(ui.strip?'停下來了':'神轎停下來了')+'</b><p>'+esc(ui.strip?'回到上一個停靠點，再走一次。':S.reason+' 要回到上一間廟前，重新起駕，剛剛那段路再走一次。')+'</p><div class="row"><button class="primary" data-act="restart">'+(ui.strip?'重新出發':'重新起駕')+'</button></div></div>'; }
  var rules=d.rules_text.filter(function(x){ return !ui.strip||!x.culture; }), hidden=d.rules_text.length-rules.length;
  return hud+'<div class="'+(ui.strip?'strip-on':'')+'">'+(ui.strip?'<div class="sub">🔍 抽掉文化中：名字、圖示、規則說明都換成代號。</div>':'')+bar+
   '<canvas id="cv" width="488" height="190" aria-label="遶境的路"></canvas>'+over+
   '<div class="pad"><button id="b-jump" data-act="jump">跳</button><button id="b-take" data-act="take">'+(ui.strip?'按':'接駕')+'</button></div>'+
   '<div class="msg '+ui.msgCls+'" id="msg" role="status">'+esc(ui.msg||'神轎準備出發。')+'</div>'+
   '<div class="row"><button data-act="strip">'+(ui.strip?'把文化放回來（從頭再走）':'抽掉文化試試看（從頭再走）')+'</button></div>'+
   '<details '+(S.time===0?'open':'')+'><summary>規則</summary><ul>'+rules.map(function(x){return '<li>'+esc(x.text)+'</li>';}).join('')+(hidden?'<li class="sub">（還有 '+hidden+' 條規則是用文化講的，抽掉之後就看不到了。）</li>':'')+'</ul></details>'+
   '<details><summary>路上會遇到什麼</summary><div class="legend">'+Object.keys(d.kinds).map(function(k){ var v=kv(k); return '<div><span class="chip" style="background:'+v.color+'">'+esc(v.icon)+'</span><b>'+esc(v.name)+'</b></div>'; }).join('')+'</div></details></div>'+
   '<div class="row"><button data-act="home">回首頁</button></div>'; }

function end(){ var d=D(), S=ui.S, sc=E.score(d,S), en=d.endings.slice().sort(function(a,b){return b.min-a.min;}).filter(function(x){return sc.total>=x.min;})[0]||{title:'',text:''}, R=d.reflect;
  if(S.failed) en={title:'沒走完',text:'命用完了，神轎沒走到終點。'};
  var story='這一趟出巡，'+(ui.strip?'（抽掉文化走的）':'')+'接到 '+sc.altarsGot+'／'+sc.altars+' 家的香案，'+(d.on_hit==='stall'?'神轎停了 '+S.stalls+' 次，':'')+(d.temple_mode==='order'?'廟前拜錯 '+S.wrong+' 次，':'')+'最後 '+sc.total+' 分。';
  return '<h1>'+esc(en.title)+'</h1><div class="sub">'+esc(ui.ver==='custom'?'我改做的版本':d.version_label)+(ui.strip?'・抽掉文化':'')+'・'+sc.total+' 分・'+S.time.toFixed(0)+' 秒</div>'+
   '<div class="card"><p>'+esc(en.text)+'</p><p><b>一句話故事：</b>'+esc(story)+'</p><ul>'+sc.items.map(function(x){return '<li>'+esc(x.label)+'：'+x.pts+' 分</li>';}).join('')+'</ul></div>'+
   '<div class="card"><h2>W2 判斷題</h2><p>'+esc(R.question)+'</p>'+R.options.map(function(o,i){ return '<button class="opt'+(ui.answer===i?' sel':'')+'" data-act="ans" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+
   '<p>寫一句為什麼：</p><textarea id="why" placeholder="例：抽掉之後我分不出哪個要接，因為……">'+esc(ui.why)+'</textarea>'+(ui.answer!==null?'<div class="msg ok"><p>你選的是「'+esc(R.options[ui.answer])+'」。</p><p>'+esc(R.our_view)+'</p></div>':'')+'</div>'+
   '<div class="card"><h2>'+esc(d.field.title)+'</h2><p>'+esc(d.field.prompt)+'</p><textarea id="field" placeholder="'+esc(d.field.placeholder)+'">'+esc(store('runner_field')||'')+'</textarea><div class="row"><button data-act="field">記下來（只存在這台裝置）</button></div><div id="field-msg" class="sub"></div></div>'+
   '<div class="row"><button class="primary" data-act="again">再走一次</button><button data-act="other">換另一版走</button><button data-act="again-strip">'+(ui.strip?'把文化放回來再走':'抽掉文化再走一次')+'</button><button data-act="home">回首頁</button></div>'+basis(d); }

// ---- 畫布 ----
function draw(){ var cv=document.getElementById('cv'); if(!cv) return; var d=D(), S=ui.S, dpr=window.devicePixelRatio||1, cw=cv.clientWidth||488, ch=cv.clientHeight||190; if(cv.width!==Math.round(cw*dpr)){ cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); } var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); var W=cw, H=ch, G=H-40, px=80;
  var cs=getComputedStyle(document.documentElement); ctx.clearRect(0,0,W,H);
  ctx.fillStyle=cs.getPropertyValue('--ground')||'#c8b38f'; ctx.fillRect(0,G,W,H-G);
  ctx.fillStyle=cs.getPropertyValue('--muted')||'#666'; ctx.font='13px sans-serif'; ctx.fillText(segName(S.x),10,18);
  var total=d.route[d.route.length-1].at||1; ctx.fillRect(10,26,(W-20)*Math.min(1,S.x/total),3);
  d.route.forEach(function(it,i){ var sx=px+(it.at-S.x); if(sx<-40||sx>W+40) return; var st=S.st[i];
    if(it.kind==='temple'){ ctx.fillStyle=ui.strip?'#6c6c6c':'#b5372a'; ctx.fillRect(sx-18,G-62,36,62); ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif'; ctx.fillText(ui.strip?'□':'廟',sx-8,G-26); return; }
    if(st==='taken'||st==='hit') return; var v=kv(it.kind);
    if(it.kind==='obstacle'){ ctx.fillStyle=v.color; ctx.beginPath(); ctx.moveTo(sx-11,G); ctx.lineTo(sx,G-22); ctx.lineTo(sx+11,G); ctx.fill(); return; }
    ctx.globalAlpha=st==='missed'?0.35:1; ctx.fillStyle=v.color; ctx.fillRect(sx-14,G-34,28,28); ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif'; ctx.fillText(v.icon,sx-8,G-14); ctx.globalAlpha=1; });
  var py=G-S.y; ctx.fillStyle='#5a3a1e'; ctx.fillRect(px-26,py-20,52,4); ctx.fillStyle=ui.strip?'#555':'#d4a017'; ctx.fillRect(px-14,py-40,28,24);
  ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.fillText(ui.strip?'■':'轎',px-7,py-22); ctx.fillStyle='#333'; ctx.fillRect(px-20,py-16,6,16); ctx.fillRect(px+14,py-16,6,16); }

function loop(ts){ ui.raf=0; if(ui.screen!=='play') return; var d=D(), S=ui.S; if(!ui.last) ui.last=ts; var el=Math.min(0.1,(ts-ui.last)/1000); ui.last=ts; ui.acc+=el; var before=S.mode, txt=S.lastText;
  while(ui.acc>=1/60){ ui.acc-=1/60; var inp={jump:ui.jumpReq,take:ui.takeReq}; if(ui.auto) ui.auto(inp); ui.jumpReq=false; ui.takeReq=false; E.step(d,S,inp,1/60); if(S.mode!=='run') break; }
  if(S.mode!==before||S.mode==='done'){ if(S.mode==='done'){ ui.screen='end'; render(); window.scrollTo(0,0); return; } if(S.mode==='stalled'){ ui.msg=ui.strip?'停下來了。':S.reason; ui.msgCls='bad'; } if(S.mode==='temple'){ ui.msg=ui.strip?'到了一個停靠點。':'到了'+d.temples[d.route[S.ti].id].name+'。'; ui.msgCls=''; } render(); return; }
  if(S.lastText!==txt){ var m=document.getElementById('msg'); if(m){ m.textContent=ui.strip?'過去了。':S.lastText; m.className='msg'; } }
  var b=document.getElementById('stam'); if(b) b.style.width=Math.max(0,S.stamina)+'%';
  draw(); ui.raf=requestAnimationFrame(loop); }
function go(){ if(!ui.raf){ ui.last=0; ui.acc=0; ui.raf=requestAnimationFrame(loop); } }

function start(ver,strip){ ui.ver=ver; ui.strip=!!strip; ui.S=E.newState(D()); ui.answer=null; ui.why=''; ui.msg=''; ui.msgCls=''; ui.screen='play'; render(); window.scrollTo(0,0); }
function bind(){ document.querySelectorAll('[data-act]').forEach(function(el){ el.addEventListener('click',function(){ act(el.getAttribute('data-act'),el); }); }); }
function act(a,el){ var d=D(), S=ui.S;
  if(a==='start'){ start(el.getAttribute('data-ver'),false); return; }
  if(a==='home'){ ui.screen='home'; ui.strip=false; render(); return; }
  if(a==='jump'){ ui.jumpReq=true; return; }
  if(a==='take'){ ui.takeReq=true; return; }
  if(a==='pray'){ var r=E.templeTap(d,S,el.getAttribute('data-id'));
    if(r.wrong){ ui.msg=ui.strip?'不對，從頭再按。':d.order_wrong; ui.msgCls='bad'; render(); return; }
    if(S.mode==='done'){ ui.screen='end'; render(); window.scrollTo(0,0); return; }
    if(S.mode==='run'){ ui.msg=ui.strip?'出發。':'拜完了，起駕。'; ui.msgCls='ok'; render(); go(); return; }
    ui.msg=''; render(); return; }
  if(a==='restart'){ E.restart(d,S); ui.msg=ui.strip?'重新出發。':'回到廟前，重新起駕。'; ui.msgCls=''; render(); go(); return; }
  if(a==='strip'){ start(ui.ver,!ui.strip); return; }
  if(a==='ans'){ ui.why=(document.getElementById('why')||{}).value||ui.why; ui.answer=+el.getAttribute('data-i'); render(); return; }
  if(a==='field'){ var f=document.getElementById('field').value.trim(), m=document.getElementById('field-msg'); if(f.length<(d.field.min_chars||10)){ m.textContent='再多寫一點（至少 '+(d.field.min_chars||10)+' 個字），寫你問了誰、他怎麼說。'; return; } store('runner_field',f); m.textContent='記下來了。之後改做時，把它變成一條規則。'; return; }
  if(a==='again'){ start(ui.ver,ui.strip); return; }
  if(a==='again-strip'){ start(ui.ver,!ui.strip); return; }
  if(a==='other'){ start(ui.ver==='rule'?'skin':'rule',false); return; }
  if(a==='dump'){ document.getElementById('remix-box').value=JSON.stringify(DATA[el.getAttribute('data-ver')],null,2); return; }
  if(a==='load'){ var txt=document.getElementById('remix-box').value, obj=null; ui.remixOk=''; ui.remixErr='';
    try{ obj=JSON.parse(txt); }catch(e){ ui.remixErr='這不是正確的 JSON：'+e.message+'\n把這行紅字貼回給 AI，說「請修這個」。'; render(); document.getElementById('remix').open=true; return; }
    var errs=E.validate(obj); if(errs.length){ ui.remixErr=errs.join('\n')+'\n把上面的紅字貼回給 AI，說「請修這個」。'; render(); document.getElementById('remix').open=true; return; }
    DATA.custom=obj; ui.remixOk='載入成功。按「玩我改做的版本」。'; render(); document.getElementById('remix').open=true; return; }
}
document.addEventListener('keydown',function(e){ if(ui.screen!=='play') return; if(e.code==='Space'){ ui.jumpReq=true; e.preventDefault(); } else if(e.code==='Enter'&&ui.S&&ui.S.mode==='run'){ ui.takeReq=true; e.preventDefault(); } });
window.__R={E:E,DATA:DATA,ui:ui,start:start};
render();
window.__runnerReady=true;
})();
</script>
