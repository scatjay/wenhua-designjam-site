<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>普渡七日</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  /* 外觀 token：城牆石灰、鐵（正本第五節「塔防 towerdef」）。樣式只准用這十一個。 */
  --tk-surface:#c9c4b8; --tk-panel:#e6e2d8; --tk-ink:#262321; --tk-muted:#5b554c;
  --tk-accent:#8c2f1b; --tk-accent-ink:#f3ede0; --tk-line:#7d776b;
  --tk-font-title:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --tk-font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --tk-radius:0px;
  --tk-shadow:4px 4px 0 color-mix(in srgb, var(--tk-ink) 88%, transparent);
  color-scheme:light;
}
:root{
  /* 以下全由 token 推出來，不寫死顏色 */
  --stone:color-mix(in srgb, var(--tk-ink) 24%, var(--tk-surface));
  --path:color-mix(in srgb, var(--tk-panel) 85%, var(--tk-surface));
  --chip:color-mix(in srgb, var(--tk-surface) 55%, var(--tk-panel));
  --glow:color-mix(in srgb, var(--tk-accent) 26%, transparent);
}
*{box-sizing:border-box}
body{margin:0;background:var(--tk-surface);color:var(--tk-ink);font:16px/1.6 var(--tk-font-body)}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 48px}
h1{font-family:var(--tk-font-title);font-weight:900;font-size:1.6rem;letter-spacing:.08em;margin:4px 0 0;padding:6px 10px;background:var(--tk-ink);color:var(--tk-panel);border-left:10px solid var(--tk-accent)}
.sub{color:var(--tk-muted);font-size:.9rem;margin:6px 0 8px}
button{font:inherit;min-height:44px;min-width:44px;padding:8px 12px;border-radius:var(--tk-radius);border:2px solid var(--tk-ink);background:var(--tk-panel);color:var(--tk-ink);cursor:pointer;box-shadow:2px 2px 0 var(--tk-ink)}
button:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-ink)}
button.primary{background:var(--tk-ink);color:var(--tk-panel);border-color:var(--tk-ink);font-weight:900}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--tk-panel);border:2px solid var(--tk-ink);border-radius:var(--tk-radius);box-shadow:var(--tk-shadow);padding:12px;margin:12px 0}
.w2{border-left:10px solid var(--tk-accent)}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--tk-line);padding:0 10px;font-size:.85rem;margin:2px 4px 2px 0}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--tk-line);padding:0 5px;margin-left:6px;color:var(--tk-muted)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;font-family:var(--tk-font-title);font-weight:900}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.hud div{background:var(--tk-panel);border:2px solid var(--tk-ink);padding:4px 2px;font-size:.85rem}
.hud b{display:block;font-size:1.2rem;font-family:var(--tk-font-title);font-weight:900}
.nights{display:flex;gap:4px;overflow-x:auto;padding:2px 2px 6px}
.nights span{flex:0 0 auto;font-size:.78rem;padding:3px 8px;background:var(--chip);border:1px solid var(--tk-line);white-space:nowrap}
.nights span.now{background:var(--tk-accent);color:var(--tk-accent-ink);border-color:var(--tk-ink);font-weight:900}
.nights span.past{opacity:.5}
.nights span.big{outline:2px solid var(--tk-accent)}
.board{position:relative;width:100%;max-width:420px;margin:10px auto;aspect-ratio:7/9;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(9,1fr);gap:3px;background:var(--tk-ink);border:3px solid var(--tk-ink);padding:0;box-shadow:var(--tk-shadow)}
.cell{border-radius:var(--tk-radius);background:var(--stone);display:flex;align-items:center;justify-content:center;font-size:1.25rem;position:relative;border:0;padding:0;box-shadow:none;min-height:0;min-width:0}
.cell:active:not(:disabled){transform:none}
.cell.path{background:var(--path)}
.cell.lit{box-shadow:inset 0 0 0 100px var(--glow)}
.cell.path.lit{background:color-mix(in srgb, var(--tk-accent) 16%, var(--path))}
.cell.dim::after{content:"暗";position:absolute;right:2px;bottom:0;font-size:.6rem;color:var(--tk-accent-ink);background:var(--tk-ink);padding:0 2px}
.cell.flash{outline:3px solid var(--tk-accent)}
.cell.endc::before{content:attr(data-l);position:absolute;font-size:.55rem;bottom:1px;color:var(--tk-muted)}
.vis{position:absolute;width:7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;transition:left .15s linear,top .15s linear}
.vis.ghost{background:radial-gradient(circle,var(--tk-panel) 0%,var(--tk-panel) 30%,var(--tk-muted) 75%);box-shadow:0 0 8px 2px var(--tk-muted);opacity:.92}
.vis.ghost.hungry{background:radial-gradient(circle,var(--tk-panel) 0%,var(--tk-panel) 30%,var(--tk-accent) 75%);box-shadow:0 0 8px 2px var(--tk-accent)}
.vis.fed{opacity:.35;transform:translate(-50%,-80%) scale(.7);transition:all .4s}
.vis.mob{background:var(--tk-accent);border:2px solid var(--tk-panel)}
.vis.mob.hungry{background:color-mix(in srgb, var(--tk-accent) 60%, var(--tk-ink))}
.log{max-height:220px;overflow:auto;font-size:.9rem;padding-left:18px;margin:0}
.log li{margin:2px 0}
.msg{min-height:1.4em;color:var(--tk-accent);font-size:.9rem;font-weight:700}
textarea,input[type=text]{width:100%;font:inherit;padding:8px;border-radius:var(--tk-radius);border:2px solid var(--tk-ink);background:var(--tk-panel);color:var(--tk-ink)}
textarea.json{height:260px;font-family:ui-monospace,Consolas,monospace;font-size:.78rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{border:1px solid var(--tk-line);padding:4px 6px;text-align:left}
th{background:var(--tk-ink);color:var(--tk-panel)}
pre{white-space:pre-wrap;word-break:break-word;background:var(--chip);border:1px solid var(--tk-line);padding:8px;font-size:.82rem}
.hide{display:none!important}
.big-end{font-size:1.4rem;margin:0;font-family:var(--tk-font-title);font-weight:900}
.small{font-size:.82rem;color:var(--tk-muted)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-family:var(--tk-font-title);font-weight:900}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">普渡七日</h1>
  <p class="sub" id="subtitle"></p>
  <div class="row" role="group" aria-label="版本">
    <button data-act="__m_culture" id="m_culture">文化規則版</button>
    <button data-act="__m_skin" id="m_skin">普通塔防版</button>
  </div>
  <div class="card w2">
    <b>這一關練的 W2 文化卡：<span id="w2kind"></span></b>
    <div class="small" id="w2hint"></div>
    <div id="w2cards"></div>
  </div>
  <div class="tabs" role="tablist">
    <button data-act="__tab_play" id="tab_play" class="on">玩</button>
    <button data-act="__tab_remix" id="tab_remix">怎麼改做</button>
    <button data-act="__tab_data" id="tab_data">資料檔</button>
  </div>

  <section id="pane_play">
    <p id="intro" class="small"></p>
    <div class="nights" id="nights"></div>
    <div class="hud" id="hud"></div>
    <div class="board" id="board" aria-label="地圖"></div>
    <p class="small" id="legend"></p>
    <p class="small" id="waitNote"></p>
    <div class="msg" id="msg" aria-live="polite"></div>

    <div id="planBox" class="card">
      <div class="row">
        <button data-act="__tool_lamp" id="tool_lamp"></button>
        <button data-act="__tool_table" id="tool_table"></button>
        <button data-act="__undo" id="undoBtn">復原上一步</button>
      </div>
      <p class="small" id="toolDesc"></p>
      <div class="row">
        <span id="offerLabel"></span>
        <button data-act="__offer_minus" aria-label="少一份">−</button>
        <b id="offerN">0</b>
        <button data-act="__offer_plus" aria-label="多一份">＋</button>
        <button data-act="__offer_fit" id="offerFit">剛好今晚人數</button>
      </div>
      <p class="small" id="chantDesc"></p>
      <div class="row" style="margin-top:6px">
        <button data-act="__chant" id="chantBtn"></button>
        <button data-act="__end" id="startBtn" class="primary">開始這一夜</button>
      </div>
    </div>

    <div id="runBox" class="card hide">
      <div class="row">
        <button data-act="__fast" id="fastBtn">快轉</button>
        <button data-act="__skip" id="skipBtn">直接到天亮</button>
      </div>
    </div>

    <div id="askBox" class="card hide">
      <p id="askText"></p>
      <div class="row">
        <button data-act="__ask_yes" id="askYes" class="primary"></button>
        <button data-act="__ask_no" id="askNo">推說沒有</button>
      </div>
    </div>

    <div id="endBox" class="card hide">
      <p class="big-end" id="endTitle"></p>
      <p id="endText"></p>
      <div class="row" style="margin-top:6px">
        <button data-act="__restart" id="restartBtn">再玩一次</button>
        <button data-act="__other" id="otherBtn">換另一版玩</button>
      </div>
      <div id="compare" class="card hide"></div>
    </div>

    <details class="card">
      <summary>這一夜發生了什麼（紀錄）</summary>
      <ol class="log" id="log"></ol>
    </details>
  </section>

  <section id="pane_remix" class="hide"></section>

  <section id="pane_data" class="hide">
    <div class="card">
      <b>試跑 100 局</b>
      <p class="small">用三種機器玩家各玩 100 局，看你改的規則讓誰比較會贏。</p>
      <button data-act="__trial" class="primary">試跑 100 局</button>
      <div id="trialOut"></div>
    </div>
    <div class="card">
      <b>我的資料檔</b>
      <p class="small">整份資料檔在這裡。改完按「載入」就會照你的版本玩；可以整份複製給 Claude／Gemini 請它幫忙改。</p>
      <textarea class="json" id="jsonBox" spellcheck="false" aria-label="資料檔"></textarea>
      <div class="row">
        <button data-act="__load" class="primary">載入</button>
        <button data-act="__reset">還原成原本的</button>
        <button data-act="__save">存成檔案</button>
      </div>
      <div class="msg" id="loadMsg"></div>
    </div>
  </section>
</div>

<script>
/* 普渡七日 引擎（純邏輯，不碰畫面）。瀏覽器：window.TD；Node：module.exports。
   資料全部來自 towerdef.json 的一個版本（versions.culture 或 versions.skin）。 */
(function (root) {
  'use strict';

  function rng(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function validate(v) {
    var errs = [];
    if (!v || typeof v !== 'object') return ['資料檔不是物件'];
    ['meta', 'rules', 'items', 'nights', 'start', 'endings'].forEach(function (k) {
      if (!v[k]) errs.push('缺少欄位：' + k);
    });
    if (errs.length) return errs;
    if (!Array.isArray(v.meta.path) || v.meta.path.length < 3) errs.push('meta.path 至少要 3 格');
    (v.meta.path || []).forEach(function (p, i) {
      if (!Array.isArray(p) || p.length !== 2) errs.push('meta.path 第 ' + (i + 1) + ' 格格式錯誤，要寫成 [欄, 列]');
      else if (p[0] < 0 || p[1] < 0 || p[0] >= v.meta.cols || p[1] >= v.meta.rows) errs.push('meta.path 第 ' + (i + 1) + ' 格超出地圖');
    });
    ['lamp', 'table'].forEach(function (k) {
      if (!v.items[k]) errs.push('items 缺少 ' + k);
      else if (typeof v.items[k].cost !== 'number') errs.push('items.' + k + '.cost 要是數字');
    });
    if (!Array.isArray(v.nights) || !v.nights.length) errs.push('nights 至少要一夜');
    (v.nights || []).forEach(function (n, i) {
      if (typeof n.count !== 'number' || n.count < 0) errs.push('第 ' + (i + 1) + ' 夜的 count 要是 0 以上的數字');
      if (n.hungry && n.hungry > n.count) errs.push('第 ' + (i + 1) + ' 夜的 hungry 不能比 count 多');
    });
    if (!Array.isArray(v.endings) || !v.endings.length) errs.push('endings 至少要一個');
    else if (v.endings[v.endings.length - 1].when) errs.push('endings 最後一個不能有 when（它是「其他情況」）');
    return errs;
  }

  function key(c, r) { return c + ',' + r; }

  function newGame(v, seed) {
    var path = v.meta.path, onPath = {};
    path.forEach(function (p) { onPath[key(p[0], p[1])] = true; });
    var g = {
      v: v, seed: seed, rand: rng(seed),
      night: 0, phase: 'plan',               // plan → run → morning → plan … → ended
      money: v.start.money, peace: v.start.peace, favor: v.start.favor,
      offer: 0, chant: false,
      placed: {}, placedThisPlan: [],
      onPath: onPath, log: [], nightStats: [], result: null,
      sim: null, pendingAsk: null, waiting: [], helpers: []
    };
    var n0 = v.nights[0];
    if (n0 && n0.intro) g.log.push({ text: n0.intro, tag: n0.tag || '' });
    return g;
  }

  function night(g) { return g.v.nights[Math.min(g.night, g.v.nights.length - 1)]; }

  function canPlace(g, kind, c, r) {
    var v = g.v, it = v.items[kind];
    if (g.phase !== 'plan') return '現在不能擺';
    if (!it) return '沒有這種東西';
    if (c < 0 || r < 0 || c >= v.meta.cols || r >= v.meta.rows) return '超出地圖';
    if (g.onPath[key(c, r)]) return '這格是路，不能擺';
    if (g.placed[key(c, r)]) return '這格已經有東西了';
    if (g.money < it.cost) return '錢不夠';
    if (kind === 'table' && v.rules.max_tables) { var nt = 0; for (var kk in g.placed) if (g.placed[kk].kind === 'table') nt++; if (nt >= v.rules.max_tables) return '街邊最多只擺得下 ' + v.rules.max_tables + ' 張供桌'; }
    if (kind === 'lamp' && v.rules.lamp_gate && g.night !== 0) return v.rules.lamp_gate_msg || '燈只能在第一夜前豎';
    return '';
  }

  function place(g, kind, c, r) {
    var why = canPlace(g, kind, c, r);
    if (why) return why;
    g.money -= g.v.items[kind].cost;
    g.placed[key(c, r)] = { kind: kind, c: c, r: r };
    g.placedThisPlan.push(key(c, r));
    return '';
  }

  function undo(g) {
    if (g.phase !== 'plan' || !g.placedThisPlan.length) return false;
    var k = g.placedThisPlan.pop(), p = g.placed[k];
    g.money += g.v.items[p.kind].cost;
    delete g.placed[k];
    return true;
  }

  function offerCost(g) { return g.v.items.offer ? g.v.items.offer.cost : 1; }

  function setOffer(g, n) {
    if (g.phase !== 'plan') return;
    n = Math.max(g.offerKept || 0, Math.floor(n));
    var cost = offerCost(g), delta = n - g.offer;
    if (delta > 0 && g.money < delta * cost) { n = g.offer + Math.floor(g.money / cost); delta = n - g.offer; }
    g.money -= delta * cost;
    g.offer = n;
  }

  function setChant(g, on) {
    if (g.phase !== 'plan' || !g.v.items.chant) return '';
    var cost = g.v.items.chant.cost;
    if (on && !g.chant) { if (g.money < cost) return '錢不夠'; g.money -= cost; g.chant = true; }
    else if (!on && g.chant) { g.money += cost; g.chant = false; }
    return '';
  }

  function cheb(a, b) { return Math.max(Math.abs(a.c - b.c), Math.abs(a.r - b.r)); }

  function lit(g, t) {
    var lr = g.v.items.lamp.range;
    for (var k in g.placed) {
      var p = g.placed[k];
      if (p.kind === 'lamp' && cheb(p, t) <= lr) return true;
    }
    return false;
  }

  function tableInfo(g, p) {
    var v = g.v, range = v.items.table.range;
    if (v.rules.lamp_boost && lit(g, p)) range += 1;
    return { range: range, works: v.rules.need_lamp ? lit(g, p) : true };
  }

  function startNight(g) {
    if (g.phase !== 'plan') return;
    var n = night(g), list = [];
    var noise = g.v.meta.noise || 0, cnt = Math.max(0, n.count + Math.round((g.rand() * 2 - 1) * noise));
    var wl = g.waiting || [], base = wl.length;
    wl.forEach(function (w, i) { list.push({ id: i, need: w.need, at: -(i * (n.gap || 2)), done: false, gone: false, waiting: true, hungry: w.need > 1 }); });
    g.waiting = [];
    for (var i = 0; i < cnt; i++) list.push({ id: base + i, need: 1, at: -((base + i) * (n.gap || 2)), done: false, gone: false });
    var idx = list.map(function (x, i) { return i; }).slice(base);
    for (var j = idx.length - 1; j > 0; j--) { var k = Math.floor(g.rand() * (j + 1)); var t = idx[j]; idx[j] = idx[k]; idx[k] = t; }
    idx.slice(0, n.hungry || 0).forEach(function (i) { list[i].need = 2; list[i].hungry = true; });
    if (g.chant && g.v.items.chant && g.v.items.chant.relief) list.forEach(function (x) { if (x.need > 1) x.need = 1; });
    var tables = [];
    for (var k2 in g.placed) {
      var p = g.placed[k2];
      if (p.kind !== 'table') continue;
      var info = tableInfo(g, p);
      tables.push({ c: p.c, r: p.r, range: info.range, works: info.works, cd: 0 });
    }
    g.sim = { t: 0, count: cnt + base, back: base, vis: list, tables: tables, served: 0, satisfied: 0, leaked: 0 };
    g.phase = 'run';
    g.placedThisPlan = [];
  }

  function visPos(g, x) {
    var path = g.v.meta.path;
    var i = Math.max(0, Math.min(path.length - 1, Math.floor(x.at)));
    return { c: path[i][0], r: path[i][1] };
  }

  function tick(g) {
    if (g.phase !== 'run') return false;
    var v = g.v, s = g.sim, path = v.meta.path;
    var slow = (g.chant && v.items.chant) ? v.items.chant.slow : 1;
    s.t++;
    s.vis.forEach(function (x) {
      if (x.done || x.gone) return;
      x.at += (x.at < 0 ? 1 : slow);
      if (x.at >= path.length) { x.gone = true; s.leaked++; }
    });
    s.tables.forEach(function (tb) {
      if (!tb.works) return;
      if (tb.cd > 0) { tb.cd--; return; }
      if (g.offer <= 0) return;
      var best = null;
      s.vis.forEach(function (x) {
        if (x.done || x.gone || x.at < 0) return;
        if (cheb(visPos(g, x), tb) > tb.range) return;
        if (!best || x.at > best.at) best = x;
      });
      if (best) {
        best.need--; g.offer--; s.served++; tb.cd = v.items.table.cooldown || 0; tb.flash = 3;
        if (best.need <= 0) { best.done = true; best.doneT = s.t; s.satisfied++; if (v.rules.kill_reward) g.money += v.rules.kill_reward; }
      }
    });
    var alive = s.vis.some(function (x) { return !x.done && !x.gone; });
    if (!alive) { endNight(g); return false; }
    return true;
  }

  function runToEnd(g) { var guard = 0; while (g.phase === 'run' && guard++ < 5000) tick(g); }

  function endNight(g) {
    var v = g.v, n = night(g), s = g.sim, R = v.rules, M = v.meta;
    var per = (R.leak_penalty == null ? 1 : R.leak_penalty);
    if ((R.must_feed_all || []).indexOf(g.night) >= 0) per = R.must_feed_all_penalty || 2;
    if (R.close_night === g.night) per = R.close_penalty || 2;
    var isBig = (R.must_feed_all || []).indexOf(g.night) >= 0 || R.close_night === g.night;
    var carry = 0, lost = 0;
    if (R.waiting) {
      s.vis.forEach(function (x) {
        if (!x.gone || x.done) return;
        if (isBig || x.waiting) lost += per;           // 十五、月底，或已經等過一夜
        else { g.waiting.push({ need: Math.max(1, Math.ceil(x.need / 2)) }); carry++; }
      });
    } else lost = s.leaked * per;
    g.peace -= lost;
    g.nightStats.push({ night: g.night, label: n.label, count: s.count, satisfied: s.satisfied, leaked: s.leaked, lost: lost, carry: carry, leftover: g.offer });
    var line = n.label + '：' + s.satisfied + '/' + s.count + (M.word_done || ' 位吃飽離開');
    if (s.leaked) {
      if (R.waiting && carry && !lost) line += '，' + carry + ' 位還在街角等（明晚先來，只要補剩下的一份）';
      else line += '，' + s.leaked + (M.word_leak || ' 位沒被招待') + (carry ? '，其中 ' + carry + ' 位還在街角等' : '') + '（' + (M.peace_label || '平安') + ' −' + lost + '）';
    }
    g.log.push({ text: line, tag: '' });
    if (s.leaked && lost && n.leak_text) g.log.push({ text: n.leak_text, tag: n.tag || '' });
    if (!s.leaked && n.ok_text) g.log.push({ text: n.ok_text, tag: n.tag || '' });
    g.money += (R.income || 0);
    g.chant = false;
    g.sim = null;
    if (n.ask && R.share_events) {
      g.pendingAsk = { n: n.ask.n, text: n.ask.text, tag: n.ask.tag || '', who: n.ask.who || '', helper: !!n.ask.helper };
      g.phase = 'morning';
    } else afterMorning(g);
  }

  // 早上：親朋上門想吃一頓飯。剩下的供品先拿來分，不夠再用錢
  function askCost(g) {
    if (!g.pendingAsk) return { need: 0, fromOffer: 0, fromMoney: 0, people: 0 };
    var a = g.pendingAsk, cost = g.v.rules.share_cost || 2;
    var people = Math.min(a.n, Math.floor((g.offer + g.money) / cost));
    var need = people * cost, fromOffer = Math.min(g.offer, need);
    return { need: need, fromOffer: fromOffer, fromMoney: need - fromOffer, people: people };
  }

  function answerAsk(g, give) {
    if (g.phase !== 'morning' || !g.pendingAsk) return;
    var a = g.pendingAsk;
    if (give) {
      var c = askCost(g), d = c.people - (a.n - c.people);
      g.offer -= c.fromOffer; g.money -= c.fromMoney; g.favor += d;
      if (a.helper && c.people >= a.n) { g.helpers.push(a.who); }
      g.log.push({ text: (a.who ? '早上 ' + a.who + ' 上門，' : '早上親朋上門，') + '請 ' + c.people + '/' + a.n + ' 位吃飯' + (c.fromOffer ? '（拜完的供品分出去 ' + c.fromOffer + ' 份）' : '') + '（人情 ' + (d >= 0 ? '+' : '−') + Math.abs(d) + '）' + (a.helper && c.people >= a.n ? '。' + a.who + '說：十五那晚我來幫忙。' : ''), tag: a.tag });
    } else {
      g.favor -= a.n;
      g.log.push({ text: (a.who ? '早上 ' + a.who + ' 上門想吃一頓飯，' : '早上親朋上門想吃一頓飯，') + '你推說沒有（人情 −' + a.n + '）', tag: a.tag });
    }
    g.pendingAsk = null;
    afterMorning(g);
  }

  function afterMorning(g) {
    var v = g.v;
    if (g.offer > 0) {
      if (v.rules.spoil) { g.log.push({ text: '剩下的 ' + g.offer + ' 份供品放不住，壞了。', tag: '遊戲設計' }); g.offer = 0; }
    }
    g.offerKept = g.offer;
    g.night++;
    if (g.night >= v.nights.length) { finish(g); return; }
    g.phase = 'plan';
    var n = night(g);
    if (n.intro) g.log.push({ text: n.intro, tag: n.tag || '' });
    if (n.helpers_arrive && v.rules.helper_offer) {
      if (g.helpers.length) {
        var add = g.helpers.length * v.rules.helper_offer;
        g.offer += add; g.offerKept = g.offer;
        g.log.push({ text: g.helpers.join('、') + ' 回來幫忙，各帶了 ' + v.rules.helper_offer + ' 份供品（免費 ' + add + ' 份）', tag: '工坊創作' });
      } else g.log.push({ text: '今晚沒有親朋來幫忙。', tag: '工坊創作' });
    }
  }

  function test(g, w) {
    var val = w[0] === 'peace' ? g.peace : w[0] === 'favor' ? g.favor : g.money;
    var op = w[1], x = w[2];
    return op === '>=' ? val >= x : op === '<' ? val < x : op === '<=' ? val <= x : op === '>' ? val > x : val === x;
  }

  function finish(g) {
    var e = null;
    for (var i = 0; i < g.v.endings.length; i++) {
      var en = g.v.endings[i];
      if (!en.when || en.when.every(function (w) { return test(g, w); })) { e = en; break; }
    }
    g.result = { id: e.id, title: e.title, text: e.text, win: !!e.win, tag: e.tag || '', peace: g.peace, favor: g.favor };
    g.phase = 'ended';
  }

  /* ---------- 機器玩家（給「試跑 100 局」與自動測試用） ---------- */
  function freeCells(g) {
    var v = g.v, out = [];
    for (var r = 0; r < v.meta.rows; r++) for (var c = 0; c < v.meta.cols; c++) {
      if (g.onPath[key(c, r)] || g.placed[key(c, r)]) continue;
      var near = 0;
      v.meta.path.forEach(function (p) { if (Math.max(Math.abs(p[0] - c), Math.abs(p[1] - r)) <= v.items.table.range) near++; });

    }
    return out.sort(function (a, b) { return b.near - a.near || a.r - b.r || a.c - b.c; });
  }

  function countKind(g, kind) { var n = 0; for (var k in g.placed) if (g.placed[k].kind === kind) n++; return n; }

  var BOTS = {
    // 亂點：亂擺、亂買、早上隨便答
    random: function (g) {
      var cells = freeCells(g);
      for (var i = 0; i < 3; i++) {
        var x = cells[Math.floor(g.rand() * cells.length)];
        if (x) place(g, g.rand() < 0.3 ? 'lamp' : 'table', x.c, x.r);
      }
      setOffer(g, g.offer + Math.floor(g.rand() * 12));
      if (g.rand() < 0.3) setChant(g, true);
    },
    // 通用塔防玩法：在路邊塞供桌、買剛好的供品；燈、日期、親朋都不管
    generic: function (g) {
      var n = night(g), want = n.count + (n.hungry || 0) + g.waiting.length * 2, cells = freeCells(g);
      for (var i = 0; i < cells.length && g.money - g.v.items.table.cost >= want - g.offer; i++) {
        if (countKind(g, 'table') >= 8) break;
        place(g, 'table', cells[i].c, cells[i].r);
      }
      setOffer(g, want);
    },
    // 懂規矩：初一先豎燈、供桌擺在燈下、大夜請師父誦經、供品多買一點拜完分給親朋
    wise: function (g) {
      var v = g.v, n = night(g), R = v.rules, H = v.bot_hint || {};
      if (g.night === 0 && (R.need_lamp || R.lamp_boost)) {
        (H.lamp_cells || []).forEach(function (p) { place(g, 'lamp', p[0], p[1]); });
      }
      var want = (H.tables_by_night || [])[g.night] || 4;
      var cells = freeCells(g).filter(function (c) { return !R.need_lamp || lit(g, c); });
      var n2 = n.count + (n.hungry || 0) + g.waiting.length + (n.ask && R.share_events ? n.ask.n * (R.share_cost || 2) : 0);

      }

    }
  };

  // 懂規矩但不顧親朋：只照顧好兄弟
  BOTS.wise_noshare = function (g) { BOTS.wise(g); };
  // 懂規矩但捨不得請師父
  BOTS.wise_nochant = function (g) { BOTS.wise(g); setChant(g, false); };
  // 懂規矩但初一忘了豎燈（第二夜才想起來）
  BOTS.late_lamp = function (g) {
    if (g.night === 0) { var h = g.v.bot_hint; g.v.bot_hint = Object.assign({}, h, { lamp_cells: [] }); BOTS.wise(g); g.v.bot_hint = h; }
    else { (g.v.bot_hint.lamp_cells || []).forEach(function (p) { place(g, 'lamp', p[0], p[1]); }); BOTS.wise(g); }
  };

  function playBot(v, seed, mode) {
    var g = newGame(v, seed), guard = 0;
    while (g.phase !== 'ended' && guard++ < 100) {
      if (g.phase === 'plan') { BOTS[mode](g); startNight(g); runToEnd(g); }
      if (g.phase === 'morning') answerAsk(g, (mode === 'generic' || mode === 'wise_noshare') ? false : mode === 'random' ? g.rand() < 0.5 : true);
    }
    return g;
  }

  function trial(v, n, mode, seed0) {
    var wins = 0, ends = {};
    for (var i = 0; i < n; i++) {
      var g = playBot(v, (seed0 || 1000) + i, mode);
      if (g.result.win) wins++;
      ends[g.result.id] = (ends[g.result.id] || 0) + 1;
    }
    return { n: n, wins: wins, rate: wins / n, ends: ends };
  }

  var TD = { validate: validate, newGame: newGame, canPlace: canPlace, place: place, undo: undo, setOffer: setOffer,
    setChant: setChant, startNight: startNight, tick: tick, runToEnd: runToEnd, answerAsk: answerAsk, askCost: askCost,

  if (typeof module !== 'undefined' && module.exports) module.exports = TD; else root.TD = TD;
})(this);

      if (!plan) return;
      var L = v.items.lamp, T = v.items.table;
      $('tool_lamp').textContent = L.icon + ' ' + L.label + '（' + L.cost + '）';
      $('tool_table').textContent = T.icon + ' ' + T.label + '（' + T.cost + '）';
      $('tool_lamp').className = S.tool === 'lamp' ? 'on' : '';
      $('tool_table').className = S.tool === 'table' ? 'on' : '';
      var lampLocked = R.lamp_gate && g.night !== 0;
      $('tool_lamp').disabled = lampLocked;
      if (lampLocked && S.tool === 'lamp') S.tool = 'table';
      var it = v.items[S.tool];
      $('toolDesc').innerHTML = esc(it.desc) + tag(it.tag) + (lampLocked ? '<br>' + esc(R.lamp_gate_msg) : '');
      $('undoBtn').disabled = !g.placedThisPlan.length;
      $('offerLabel').textContent = v.items.offer.icon + ' ' + v.items.offer.label + '（每份 ' + v.items.offer.cost + '）';
      $('offerN').textContent = g.offer;
      var C = v.items.chant;
      $('chantBtn').textContent = C.icon + ' ' + C.label + '（' + C.cost + '）' + (g.chant ? ' ✓' : '');
      $('chantBtn').className = g.chant ? 'on' : '';
      $('chantDesc').textContent = C.desc;
      $('startBtn').textContent = '開始：' + n.label;
    }
  };

  /* ---------- 模組 2：資源計分（錢、平安、人情、供品份數） ---------- */
  MOD['資源計分'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g) {   // 只讀：這一刻的資源
      return { money: g.money, peace: g.peace, favor: g.favor, offer: g.offer };
    },
    render: function (g) {
      var v = this.v, M = v.meta, R = v.rules, sc = this.step(g);
      var hud = [['夜', g.phase === 'ended' ? '完' : (g.night + 1) + '/' + v.nights.length], [M.money_label, M.money_icon + sc.money], [M.peace_label, sc.peace]];
      if (R.share_events) hud.push(['人情', sc.favor]); else hud.push([v.items.offer.label, sc.offer]);
      $('hud').innerHTML = hud.map(function (h) { return '<div>' + esc(h[0]) + '<b>' + esc(h[1]) + '</b></div>'; }).join('');
    }
  };

  /* ---------- 模組 3：時間回合（七夜、初一到十五、天亮與天黑） ---------- */
  MOD['時間回合'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g, a) {   // 讓這一夜往前跑：一小步，或直接到天亮
      if (a && a.type === 'toEnd') TD.runToEnd(g); else TD.tick(g);
      return g.phase;
    },
    render: function (g) {
      var v = this.v, R = v.rules;
      $('nights').innerHTML = v.nights.map(function (x, i) {
        var cls = i === g.night && g.phase !== 'ended' ? 'now' : (i < g.night ? 'past' : '');
        if ((R.must_feed_all || []).indexOf(i) >= 0 || R.close_night === i || (R.lamp_gate && i === 0)) cls += ' big';
        return '<span class="' + cls + '">' + esc(x.label) + '</span>';
      }).join('');
    }
  };

  /* ---------- 模組 4：空間（七乘九的格子、路、燈照得到的地方） ---------- */
  MOD['空間'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g, a) {   // 只讀：這一格擺得下嗎？回傳原因（空字串＝可以）
      return TD.canPlace(g, a.kind, a.c, a.r);
    },
    render: function (g) {
      var v = this.v, M = v.meta, R = v.rules, html = '';
      for (var r = 0; r < M.rows; r++) for (var c = 0; c < M.cols; c++) {
        var k = TD.key(c, r), p = g.placed[k], cls = 'cell', inner = '', extra = '';
        if (g.onPath[k]) cls += ' path';
        if ((R.need_lamp || R.lamp_boost) && TD.lit(g, { c: c, r: r })) cls += ' lit';
        if (p) {
          inner = v.items[p.kind].icon;
          if (p.kind === 'table' && R.need_lamp && !TD.lit(g, p)) cls += ' dim';
        }
        var first = M.path[0], last = M.path[M.path.length - 1];
        if (c === first[0] && r === first[1]) { cls += ' endc'; extra = ' data-l="' + esc(M.start_label) + '"'; if (R.waiting && g.waiting.length && g.phase === 'plan') inner = '<span style="font-size:.7rem;color:var(--tk-accent)">' + '●'.repeat(Math.min(5, g.waiting.length)) + '</span>'; }
        if (c === last[0] && r === last[1]) { cls += ' endc'; extra = ' data-l="' + esc(M.end_label) + '"'; inner = inner || '🏠'; }
        if (g.sim) g.sim.tables.forEach(function (t) { if (t.c === c && t.r === r && t.flash > 0) { cls += ' flash'; } });
        html += '<button class="' + cls + '" data-cell="' + c + ',' + r + '"' + extra + ' aria-label="第' + (r + 1) + '列第' + (c + 1) + '格">' + inner + '</button>';
      }
      $('board').innerHTML = html;
    }
  };

  /* ---------- 模組 5：角色（好兄弟、小怪：誰在路上、吃飽沒、餓很久） ---------- */
  MOD['角色'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g) {   // 只讀：畫面上要畫的訪客清單與位置
      var out = [];
      if (!g.sim) return out;
      g.sim.vis.forEach(function (x) {
        if (x.gone || x.at < 0) return;
        if (x.done && g.sim.t - x.doneT > 4) return;
        out.push({ x: x, pos: TD.visPos(g, x) });
      });
      return out;
    },
    render: function (g) {
      var M = this.v.meta, ghost = S.mode === 'culture', html = '';
      this.step(g).forEach(function (o) {
        var x = o.x, p = o.pos;
        html += '<i class="vis ' + (ghost ? 'ghost' : 'mob') + (x.hungry && x.need > 1 ? ' hungry' : '') + (x.done ? ' fed' : '') + '" style="left:' + ((p.c + .5) / M.cols * 100) + '%;top:' + ((p.r + .5) / M.rows * 100) + '%"></i>';
      });
      $('board').insertAdjacentHTML('beforeend', html);
      if (g.sim) g.sim.tables.forEach(function (t) { if (t.flash) t.flash--; });
      $('legend').textContent = S.mode === 'culture' ? '淺色光點＝好兄弟；紅圈＝餓很久、要兩份才吃得飽。亮起來的格子是燈照得到的地方；標「暗」的供桌，好兄弟看不到。' : '紅點＝小怪；深紅＝要打兩下。';
      var wn = g.waiting ? g.waiting.length : 0;
      $('waitNote').textContent = (this.v.rules.waiting && wn && g.phase === 'plan') ? '街角還有 ' + wn + ' 位好兄弟在等你昨晚沒招待到的一份——他們今晚會先來，只要補剩下的一份。' : '';
    }
  };

  /* ---------- 模組 6：事件選擇（天亮後親朋上門：請他們吃飯，還是推說沒有） ---------- */
  MOD['事件選擇'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g, a) { TD.answerAsk(g, !!a.give); return g.phase; },
    render: function (g) {
      $('askBox').classList.toggle('hide', g.phase !== 'morning');
      if (g.phase !== 'morning') return;
      var c = TD.askCost(g), a = g.pendingAsk;
      $('askText').innerHTML = '天亮了。' + (a.who ? esc(a.who) + ' 上門，' : a.n + ' 位親朋上門，') + '想吃一頓飯。' + tag(a.tag) + (a.helper ? '<br><span class="small">給他吃一頓，十五那晚他會回來幫忙。</span>' : '') + '<br><span class="small">剩下的供品 ' + g.offer + ' 份會先拿來分（拜完的供品）；不夠才用錢。寫《小封神》的許丙丁說過：拜拜捨得花，「親朋欲求一飯，頗呈難色」。</span>';
      $('askYes').textContent = '請他們吃飯（' + (c.fromOffer ? '供品 ' + c.fromOffer + ' 份' : '') + (c.fromOffer && c.fromMoney ? '＋' : '') + (c.fromMoney ? '錢 ' + c.fromMoney : '') + (c.need ? '' : '不夠') + '）';
    }
  };

  /* ---------- 模組 7：勝負（七夜走完，看平安與人情落在哪一種結局） ---------- */
  MOD['勝負'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g) {   // 只讀：結局（還沒結束就是 null）
      return g.phase === 'ended' ? g.result : null;
    },
    render: function (g) {
      var r = this.step(g), v = this.v;
      $('endBox').classList.toggle('hide', !r);
      if (!r) return;
      S.played[S.mode] = { title: r.title, win: r.win, peace: r.peace, favor: r.favor, stats: g.nightStats.map(function (s) { return s.satisfied + '/' + s.count; }).join('、') };
      $('endTitle').innerHTML = (r.win ? '🌕 ' : '🌑 ') + esc(r.title) + tag(r.tag);
      $('endText').textContent = r.text + '（' + v.meta.peace_label + ' ' + r.peace + (v.rules.share_events ? '、人情 ' + r.favor : '') + '）';
      $('otherBtn').textContent = S.mode === 'culture' ? '換普通塔防版玩' : '換文化規則版玩';
      var cmp = $('compare'), A = S.played.culture, B = S.played.skin;
      if (A && B) {
        cmp.classList.remove('hide');
        cmp.innerHTML = '<b>比一比兩個版本</b><table><tr><th></th><th>文化規則版</th><th>普通塔防版</th></tr>' +
          '<tr><td>結局</td><td>' + esc(A.title) + '</td><td>' + esc(B.title) + '</td></tr>' +
          '<tr><td>每夜招待／打倒</td><td>' + esc(A.stats) + '</td><td>' + esc(B.stats) + '</td></tr></table>' +
          '<p class="small">兩邊的結局不一樣的話，回頭找找：文化規則版裡哪些事是普通版沒有的？（燈什麼時候能點、十五、供品會壞、親朋上門）</p>';
      } else cmp.classList.add('hide');
      if (!playedMarked) {
        playedMarked = true;
        try { if (window.CT_HOOK) CT_HOOK.markPlayed(S.mode === 'culture' ? 'rule' : 'skin'); } catch (e) { /* 助教出錯不能影響樣板 */ }
      }
    }
  };

  /* ---------- 模組 8：回饋（這一夜發生了什麼：一句一句的紀錄） ---------- */
  MOD['回饋'] = {
    init: function (v, root) { this.v = v; this.root = root; },
    step: function (g) { return g.log.slice().reverse(); },   // 只讀：新的在最上面
    render: function (g) {
      $('log').innerHTML = this.step(g).map(function (l) { return '<li>' + esc(l.text) + tag(l.tag) + '</li>'; }).join('');
    }
  };

  function initModules() { MOD_NAMES.forEach(function (n) { MOD[n].init(V(), $('pane_play')); }); }

  function render() {
    var g = S.g;
    header();
    ['時間回合', '資源計分', '空間', '角色', '核心動作', '事件選擇', '勝負', '回饋'].forEach(function (n) { MOD[n].render(g); });
  }

  function drawBoard() { MOD['空間'].render(S.g); MOD['角色'].render(S.g); }

  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  function startTimer() {
    stopTimer();
    S.timer = setInterval(function () {
      var g = S.g;
      if (g.phase !== 'run') { stopTimer(); render(); return; }
      MOD['時間回合'].step(g);
      if (g.phase !== 'run') { stopTimer(); render(); } else drawBoard();
    }, S.fast ? 45 : 170);
  }

  /* ---------- 怎麼改做 ---------- */
  function renderRemix() {
    var R = S.data.remix, F = S.data.field || {};
    var h = '<div class="card"><p>' + esc(R.intro) + '</p></div>';
    R.steps.forEach(function (st) {
      h += '<div class="card"><b>' + esc(st.title) + '</b><p class="small">' + esc(st.goal) + '</p><p>' + esc(st.task) + '</p>' +
        (st.field ? '<p>🔎 ' + esc(st.field) + '</p>' : '') +
        '<p class="small">可以貼給 Claude／Gemini 的指令：</p><pre>' + esc(st.prompt) + '</pre>' +
        '<button data-act="__copy" data-text="' + esc(st.prompt) + '">複製指令</button></div>';
    });
    h += '<div class="card"><b>' + esc(R.field_title) + '</b><p class="small">' + esc(R.field_note) + '</p>';
    R.field_items.forEach(function (f) {
      h += '<label class="small" for="f_' + f.key + '">' + esc(f.label) + '</label><input type="text" id="f_' + f.key + '" data-field="' + f.key + '" value="' + esc(F[f.key] || '') + '">';
    });
    h += '<p class="small">填的內容會跟著資料檔一起存（「資料檔」分頁按「存成檔案」）。</p></div>';
    h += '<div class="card"><b>' + esc(R.extend_title) + '</b><p>' + esc(R.extend_text) + '</p><pre>' + esc(R.extend_json) + '</pre></div>';
    h += '<div class="card"><b>這一單元多學的一個工具串接</b><p>' + esc(R.tool_chain) + '</p></div>';
    $('pane_remix').innerHTML = h;
  }

  function showTab(t) {
    ['play', 'remix', 'data'].forEach(function (x) { $('pane_' + x).classList.toggle('hide', x !== t); $('tab_' + x).className = x === t ? 'on' : ''; });
    if (t === 'remix') renderRemix();
    if (t === 'data') $('jsonBox').value = JSON.stringify(S.data, null, 1);
  }

  function trialOut() {
    var bots = [['random', '亂點'], ['generic', '通用塔防玩法（不管燈與日期，親朋都不請）'], ['wise', '懂這些規矩']];
    var h = '<table><tr><th>玩家</th><th>文化規則版</th><th>普通塔防版</th></tr>';
    bots.forEach(function (b) {
      var a = TD.trial(S.data.versions.culture, 100, b[0], 1), c = TD.trial(S.data.versions.skin, 100, b[0], 1);
      h += '<tr><td>' + b[1] + '</td><td>' + a.wins + '%</td><td>' + c.wins + '%</td></tr>';
    });
    $('trialOut').innerHTML = h + '</table><p class="small">勝率是機器算的；好不好玩，要你自己玩一局才知道。</p>';
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('button'); if (!el) return;
    var g = S.g, act = el.dataset.act;
    if (el.dataset.cell) {
      if (g.phase !== 'plan') return;
      var cr = el.dataset.cell.split(',').map(Number);
      var why = MOD['核心動作'].step(g, { type: 'place', kind: S.tool, c: cr[0], r: cr[1] });
      say(why); render(); return;
    }
    switch (act) {
      case '__m_culture': S.mode = 'culture'; newGame(); say(''); break;
      case '__m_skin': S.mode = 'skin'; newGame(); say(''); break;
      case '__tab_play': showTab('play'); break;
      case '__tab_remix': showTab('remix'); break;
      case '__tab_data': showTab('data'); break;
      case '__tool_lamp': S.tool = 'lamp'; render(); break;
      case '__tool_table': S.tool = 'table'; render(); break;
      case '__undo': MOD['核心動作'].step(g, { type: 'undo' }); render(); break;
      case '__offer_minus': MOD['核心動作'].step(g, { type: 'offer', n: g.offer - 1 }); render(); break;
      case '__offer_plus': MOD['核心動作'].step(g, { type: 'offer', n: g.offer + 1 }); render(); break;
      case '__offer_fit': var n = TD.night(g); MOD['核心動作'].step(g, { type: 'offer', n: n.count + (n.hungry || 0) }); render(); break;
      case '__chant': say(MOD['核心動作'].step(g, { type: 'chant', on: !g.chant })); render(); break;
      case '__end': say(''); MOD['核心動作'].step(g, { type: 'start' }); S.fast = false; $('fastBtn').textContent = '快轉'; render(); startTimer(); break;
      case '__fast': S.fast = !S.fast; el.textContent = S.fast ? '正常速度' : '快轉'; startTimer(); break;
      case '__skip': stopTimer(); MOD['時間回合'].step(g, { type: 'toEnd' }); render(); break;
      case '__ask_yes': MOD['事件選擇'].step(g, { give: true }); render(); break;
      case '__ask_no': MOD['事件選擇'].step(g, { give: false }); render(); break;
      case '__restart': S.seed++; newGame(); window.scrollTo(0, 0); break;
      case '__other': S.mode = S.mode === 'culture' ? 'skin' : 'culture'; $('ansWhy').value = ''; newGame(); window.scrollTo(0, 0); break;
      case '__trial': trialOut(); break;
      case '__load':
        try {
          var d = JSON.parse($('jsonBox').value), errs = [];
          ['culture', 'skin'].forEach(function (k) { if (!d.versions || !d.versions[k]) errs.push('缺少 versions.' + k); else TD.validate(d.versions[k]).forEach(function (e) { errs.push(k + '：' + e); }); });
          if (errs.length) { $('loadMsg').textContent = '沒有載入，請修正：' + errs.join('；'); break; }
          if (!d.remix) d.remix = DEFAULT_DATA.remix;
          S.data = d; $('loadMsg').textContent = '載入了。回「玩」分頁就是你的版本。'; newGame();
        } catch (e) { $('loadMsg').textContent = '資料檔格式錯了（' + e.message + '），常見原因：少了逗號或引號。'; }
        break;
      case '__reset': S.data = JSON.parse(JSON.stringify(DEFAULT_DATA)); $('jsonBox').value = JSON.stringify(S.data, null, 1); $('loadMsg').textContent = '還原了。'; newGame(); break;
      case '__save':
        var blob = new Blob([JSON.stringify(S.data, null, 1)], { type: 'application/json' });
        var a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'towerdef.json'; a2.click();
        setTimeout(function () { URL.revokeObjectURL(a2.href); }, 1000); break;
      case '__copy':
        var t = el.dataset.text;
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { el.textContent = '已複製'; }, function () { el.textContent = '請手動選取複製'; });
        break;
    }
  });
  document.addEventListener('input', function (ev) {
    var k = ev.target.dataset && ev.target.dataset.field;
    if (k) { S.data.field = S.data.field || {}; S.data.field[k] = ev.target.value; store('field', S.data.field); }
  });

  newGame();
})();
</script>
