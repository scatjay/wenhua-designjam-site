<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<title>遶境不能停</title>
<style>
/* 〈遶境不能停〉的外觀（規格正本第五節：漫畫黃黑）：黃底、黑粗框、紅色重點、直角、黑色硬陰影、網點底紋；標題 Noto Sans TC 900。
   所有元件只用 --tk-* 語意 token 與下面的私有變數；顏色只在這個 :root 裡寫一次。 */
:root{
  --tk-surface:#ffd83d; --tk-panel:#fff3b0; --tk-ink:#111111; --tk-muted:#4d4100; --tk-accent:#e8341c; --tk-accent-ink:#ffffff; --tk-line:#111111;
  --tk-font-title:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --tk-font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --tk-radius:0px; --tk-shadow:4px 4px 0 #111111;
  --ok:#14702e; --bad:#b3170b; --ground:#3b3b3b; --gold:#ffd83d;
  --sky-day:#9fd8ff; --sky-dusk:#ffb36b; --sky-night:#1d2145;
  --k-obstacle:#8a4b2b; --k-altar:#e8341c; --k-tea:#14870f; --k-gamble:#6a3fb5; --k-low:#e87a0c; --k-rest:#1f6fd1; --k-fork:#8a6a00; --k-temple:#e8341c; --k-wood:#6b3d17; --k-gold:#ffd83d;
  --k-gray1:#7a7a7a; --k-gray2:#5f5f5f; --k-gray3:#949494; --k-gray4:#6c6c6c; --k-gray5:#868686;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tk-surface);color:var(--tk-ink);font-family:var(--tk-font-body);line-height:1.6;font-size:16px}
body{background-image:radial-gradient(var(--tk-ink) 1.1px,transparent 1.5px);background-size:12px 12px;background-attachment:fixed}
#app{max-width:520px;margin:0 auto;padding:0 14px 40px}
h1{font-family:var(--tk-font-title);font-weight:900;font-size:1.9rem;margin:.3em 0 .1em;letter-spacing:.04em}
h2{font-family:var(--tk-font-title);font-weight:900;font-size:1.1rem;margin:1em 0 .4em;background:var(--tk-ink);color:var(--tk-surface);display:inline-block;padding:0 10px}
.sub{color:var(--tk-muted);font-size:.88rem;font-weight:700}
.bunting{height:16px;margin:0 -14px 8px;background:repeating-linear-gradient(135deg,var(--tk-ink) 0 14px,var(--tk-surface) 14px 28px);border-bottom:3px solid var(--tk-ink)}
.poster{position:relative;background:var(--tk-panel);border:5px solid var(--tk-ink);box-shadow:var(--tk-shadow);padding:14px 14px 16px;margin:10px 0;transform:rotate(-1.2deg)}
.poster .sub{background:var(--tk-ink);color:var(--tk-surface);display:inline-block;padding:0 8px}
.comic{font-size:3rem;line-height:1.05;margin:.2em 0;color:var(--tk-accent);-webkit-text-stroke:2px var(--tk-ink);text-shadow:4px 4px 0 var(--tk-ink);letter-spacing:.02em}
.lead{margin:6px 0;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips span{background:var(--tk-ink);color:var(--tk-surface);padding:2px 12px;font-weight:900}
.panel{background:var(--tk-panel);border:3px solid var(--tk-ink);box-shadow:var(--tk-shadow);padding:10px 14px;margin:14px 0}
ul.plain{list-style:none;padding:0;margin:6px 0}ul.plain li{margin:6px 0}
.kind{display:inline-block;background:var(--tk-accent);color:var(--tk-accent-ink);padding:2px 12px;font-size:.85rem;font-weight:900}
.w2c{border-left:6px solid var(--tk-accent);padding:2px 10px;margin:8px 0}.w2c small{display:block;color:var(--tk-muted)}
button{font:inherit;font-weight:900;min-height:48px;min-width:48px;border-radius:var(--tk-radius);border:3px solid var(--tk-ink);background:var(--tk-panel);color:var(--tk-ink);padding:8px 16px;cursor:pointer;touch-action:manipulation;box-shadow:var(--tk-shadow)}
button:active{transform:translate(4px,4px);box-shadow:none}
button.primary{background:var(--tk-accent);color:var(--tk-accent-ink)}
button.big{font-size:1.4rem;min-height:62px}
button.quiet{box-shadow:none;border-style:dashed;font-weight:700}
button:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.row>button{flex:1 1 150px}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.95rem;font-weight:900;background:var(--tk-ink);color:var(--tk-surface);padding:4px 10px}
.bar{height:14px;border:3px solid var(--tk-ink);background:var(--tk-panel);margin:4px 0}.bar i{display:block;height:100%;background:var(--tk-accent)}
canvas{width:100%;height:200px;display:block;border:4px solid var(--tk-ink);background:var(--sky-day);box-shadow:var(--tk-shadow)}
.pad{display:flex;gap:10px;margin:16px 0}
.drum{flex:1;height:84px;min-height:84px;font-size:1.5rem;padding:0;background:var(--tk-panel)}
.drum.acc{background:var(--tk-accent);color:var(--tk-accent-ink)}
.msg{position:relative;min-height:3.4em;padding:8px 12px;background:var(--tk-panel);border:3px solid var(--tk-ink);font-size:.95rem;font-weight:700;margin-top:16px}
.msg::before{content:"";position:absolute;left:24px;top:-14px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:11px solid var(--tk-ink)}
.msg.bad{background:var(--tk-accent);color:var(--tk-accent-ink)}.msg.ok{border-color:var(--ok)}
.overlay{border:4px solid var(--tk-ink);box-shadow:var(--tk-shadow);padding:12px;margin:12px 0;background:var(--tk-panel)}
.card-ovl{background:var(--tk-surface)}.card-ovl h2{font-size:1.35rem}
.newbox,.recap{background:var(--tk-panel);border:3px solid var(--tk-ink);padding:4px 12px;margin:8px 0}
.order button{display:block;width:100%;margin:8px 0;text-align:left}.order button.done{opacity:.5}
.strip-on{outline:4px dashed var(--tk-ink);outline-offset:4px}
.opt{display:block;width:100%;text-align:left;margin:8px 0}.opt.sel{background:var(--tk-accent);color:var(--tk-accent-ink)}
textarea{width:100%;min-height:88px;font:inherit;padding:8px;border:3px solid var(--tk-ink);background:var(--tk-panel);color:var(--tk-ink)}
.err{color:var(--bad);font-size:.92rem;white-space:pre-wrap;font-weight:700}
details{margin:10px 0}summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:900}
.tag{display:inline-block;border:2px solid var(--tk-ink);padding:0 6px;font-size:.78rem;margin-right:4px}
.foot{color:var(--tk-muted);font-size:.8rem;margin-top:18px;font-weight:700}
.legend div{display:flex;gap:8px;align-items:center;margin:4px 0}
.chip{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid var(--tk-ink);color:var(--tk-accent-ink);font-weight:900;flex:0 0 auto}
.bigstars{font-size:2.2rem;letter-spacing:.2em;color:var(--tk-accent);-webkit-text-stroke:1px var(--tk-ink);text-align:center}
.ach{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ach span{border:2px solid var(--tk-ink);padding:2px 10px;font-size:.88rem;font-weight:700}.ach span.on{background:var(--tk-ink);color:var(--tk-surface)}.ach span.off{opacity:.55}
</style>
</head>

fork": {"name": "路口", "icon": "岔", "color": "fork"}}, "temples": {"qijia": {"name": "小上帝廟（起駕）", "text": "出發之前，先在廟裡照順序拜，再起駕。", "checkpoint": true}, "tudi": {"name": "安海街土地公", "text": "路過安海街的土地公。這是一間小廟，遊戲裡設定它沒有天公爐：先拜土地公，再拜陪祀的神（進廟拜、這個順序，都是遊戲安排的）。", "checkpoint": true, "order": [{"id": "tudi", "label": "土地公（這間廟的主神）"}, {"id": "peisi", "label": "陪祀的神"}]}, "huigong": {"name": "小上帝廟（回宮）", "text": "回到小上帝廟，照順序拜完，這一趟出巡才算圓滿。", "checkpoint": true, "end": true}, "beiji": {"name": "北極殿（學者說的大上帝廟）", "text": "第三天要經過北極殿。學者把原著的「大上帝廟」對到這裡（原著沒寫明，是學者的對應）。遊戲設定：這間廟有天公爐，先拜天公，再拜主神；廟裡沒有陪祀的神。", "checkpoint": true, "order": [{"id": "tiangong", "label": "天公爐（拜天公）"}, {"id": "zhushen", "label": "這間廟的主神"}]}, "tianhou": {"name": "大天后宮（媽祖宮口，回程駐駕）", "text": "回程再過媽祖宮口，在大天后宮駐駕。原著裡千里眼、順風耳是媽祖的手下，在這裡擺賭攤。遊戲設定：先拜天公，再拜主神天上聖母，最後拜陪祀的神。", "checkpoint": true}}, "order": [{"id": "tiangong", "label": "天公爐（拜天公）"}, {"id": "zhushen", "label": "這間廟的主神"}, {"id": "peisi", "label": "陪祀的神"}], "order_hint": "先拜最大的天公，再拜這間廟的主神，最後拜陪祀的神（各廟不同，真的去拜時看廟方的立牌）。", "order_wrong": "順序亂了，要從頭再拜一次（轎班站著等，體力少一點）。", "penalties": {"stall": {"pts": -4, "label": "神轎停下來"}, "wrong_order": {"pts": -1, "label": "拜錯順序"}}, "rules_text": [{"text": "遊戲規定：撞到路障或彩旗、或轎班體力用完，神轎就停下來，要回到上一個駐駕的地方（廟或歇腳棚）重新出發，剛剛走過的路再走一次（真的遶境有排好的休息和駐駕，這條是遊戲加的）。", "culture": false}, {"text": "各家戶在路邊擺香案接駕：經過時按「接駕」，這一家才算接到。連續接到 3 家，多加 1 分；錯過一家就從頭算。", "culture": true}, {"text": "路邊有人奉茶：按「接駕」接下來，轎班體力會回來。歇腳棚與廟前也會讓體力回來一些。", "culture": true}, {"text": "媽祖宮口有賭攤：《小封神》裡康、趙二元帥就是在這裡賭輸了錢。賭一把能多一點分，但轎班會很累，累倒就停轎。", "culture": true}, {"text": "到廟前要照順序拜：有天公爐的先拜天公，再拜這間廟的主神，最後拜陪祀的神；小廟沒有天公爐，就從主神開始。拜錯要重來。", "culture": true}, {"text": "第二段起，彩旗橫帶掛得低，按「蹲」才過得去。", "culture": false}, {"text": "第三段的路口，請神明擲筊指路：聖筊走近路、陰筊走遠路、笑筊再擲一次。神明回答過的路口，再回來重走時答案不會變。", "culture": true}, {"text": "「跳」跳過路障；「蹲」蹲過彩旗；「接駕」接下路邊的東西。鍵盤：空白鍵跳、向下鍵蹲、Enter 接駕。", "culture": false}], "endings": [{"min": 153, "title": "圓滿回宮", "text": "三段路、五間廟都走完了：沿路的香案幾乎都接到，轎子沒有亂停，廟前的順序也沒亂。沿路的人家說：今年小上帝有出來看我們。"}, {"min": 81, "title": "回宮了，但有點亂", "text": "神轎是回來了，但有幾家的香案沒接到，或轎子停了好幾次。想一想：哪一段、哪一間廟最常出事？"}, {"min": -999, "title": "這一趟走得很辛苦", "text": "停轎、拜錯、被賭攤吸走……再走一次看看：哪一條規矩最常讓你出事？"}], "reflect": {"question": "你玩完一趟了：這個遊戲最讓你「有感」的是哪一個設計？", "options": ["跳、蹲、接駕的手感（反應）", "廟前要照順序拜（規矩變成玩法）", "路口擲筊（神明決定，運氣）", "香案和賭攤的取捨（接或不接）"], "expected": "開放", "our_view": "我們的看法：沒有標準答案。這四個設計，各自撐起不同的好玩——手感靠反應，廟前順序靠記憶與試錯，擲筊靠運氣與接受，接或不接靠取捨。你的企劃只要選一個當核心，其他可以簡化。請寫下：你玩的時候哪一刻最想繼續玩？是哪個設計造成的？ 附電腦玩家的數字（各玩 200 局）：分得出香案與賭攤、廟前按對順序的，約 180 分、停轎約 0 次；全按、廟前亂按的，拜錯約 84 次、約 95 分、停轎約 2.85 次——規矩看不看得懂，結果差很多。"}, "field": {"title": "AI 做不到的欄位：去問一個真的出巡規矩", "prompt": "去看一次廟會、遶境或進香，或問一位廟方的人、轎班、長輩：「神轎要休息或停下來的時候，有什麼規矩？」、「這間廟先拜哪一尊？」寫下你問了誰（不用寫名字，寫身分就好）、他怎麼說。", "placeholder": "例：我問了＿＿廟的＿＿，他說神轎＿＿的時候，要＿＿。所以規則可以改成：＿＿。", "min_chars": 15}, "basis": [{"tag": "原著", "text": "康、趙二元帥輔佐小上帝；他們帶著典當通天冠換來的錢，路過媽祖宮口，跟千里眼、順風耳賭「拋璉寶」，輸光了錢（《小封神》第二回）。安海街的土地公也是原著人物（第十八至二十回）。"}, {"tag": "原著（提醒）", "text": "賭攤是原著的諷刺：康、趙賭輸了錢還說謊，最後被罰。遊戲讓賭攤有一點誘惑，但代價更大，不是在鼓勵賭博。"}, {"tag": "民間", "text": "遶境又叫巡境、出巡，路線由廟方與地方人士組成的主辦團體安排，各地方式不同；沿途家戶擺香案。"}, {"tag": "民間（各廟不同）", "text": "拜拜常見的順序是天公先、主神次、陪祀神最後；多尊神像時的左右先後說法不一，以廟方立牌為準。"}, {"tag": "工坊創作", "text": "整條路線、路障、體力、分數都是遊戲編的；小上帝出巡、經過媽祖宮口與安海街，原著沒有這一段。"}, {"tag": "遊戲設定（還要再查證）", "text": "「神轎停下來要回到上一間廟前重新出發」「拜錯要重來」「進土地公廟拜」都是遊戲為了讓規矩變成玩法而定的；真的遶境有排好的休息與駐駕，各廟做法要以現場為準。"}, {"tag": "原著／學者", "text": "北極殿：原著只寫「大上帝駐在草花街」，學者把大上帝廟對到北極殿（民權路二段）；這是學者的對應，不是原著寫明。大天后宮：千里眼、順風耳是天上聖母的手下，在媽祖宮口擺「拋璉寶」賭攤（《小封神》第二回）。"}, {"tag": "民間（常見說法）", "text": "擲筊用兩塊筊杯：一正一反叫聖筊（神明同意）、兩面都平叫笑筊（再問一次）、兩面都凸叫陰筊（不同意）。各廟與各地說法有細微差別，以現場廟方為準。"}, {"tag": "工坊創作", "text": "「三段路」「每一段的新東西」「彩旗橫帶」「連續接駕加分」「路口擲筊決定近路遠路」「駐駕歇腳棚」都是工坊為了讓這個樣板夠長、夠好玩編的遊戲設計，不是任何一間廟真實的遶境安排；小上帝出巡原著沒有這一段。"}, {"tag": "民間（常見說法）", "text": "擲筊用兩塊筊杯：一正一反叫聖筊（神明同意）、兩面都平叫笑筊（再問一次）、兩面都凸叫陰筊（不同意）。各廟與各地說法有細微差別，以現場廟方為準。"}, {"tag": "工坊創作", "text": "「三段路」「每一段的新東西」「彩旗橫帶」「連續接駕加分」「路口擲筊決定近路遠路」「駐駕歇腳棚」都是工坊為了讓這個樣板夠長、夠好玩編的遊戲設計，不是任何一間廟真實的遶境安排；小上帝出巡原著沒有這一段。"}, {"tag": "民間（常見說法）", "text": "擲筊用兩塊筊杯：一正一反叫聖筊（神明同意）、兩面都平叫笑筊（再問一次）、兩面都凸叫陰筊（不同意）。各廟與各地說法有細微差別，以現場廟方為準。"}, {"tag": "工坊創作", "text": "「三段路」「每一段的新東西」         if(S.mode==='temple'){ var bs=E.orderButtons(D,S);
          if(policy==='informed'){ E.templeTap(D,S,E.ordOf(D,S)[S.seq.length].id); }
          else if(policy==='learner'){ var sig=E.ordOf(D,S).map(function(o){return o.id;}).sort().join(','); if(!memo[sig]) memo[sig]={mem:[],bad:{}}; var mem=memo[sig].mem, bad=memo[sig].bad, pos=S.seq.length, pick;
            if(pos<mem.length){ pick=mem[pos]; } else { var cand=bs.map(function(b){return b.id;}).filter(function(id){ return S.seq.indexOf(id)<0 && (bad[pos]||[]).indexOf(id)<0; }); pick=cand[Math.floor(rnd()*cand.length)]; }
            var res=E.templeTap(D,S,pick); if(res.wrong){ (bad[pos]=bad[pos]||[]).push(pick); } else if(pos>=mem.length){ mem.push(pick); } }
          else { E.templeTap(D,S,bs[Math.floor(rnd()*bs.length)].id); } continue; }
        if(S.mode==='stalled'){ E.restart(D,S); continue; }
        var inp={jump:false,duck:false,take:false};
        for(var i=0;i<D.route.length;i++){ if(S.st[i]!==null) continue; var it=D.route[i], d=it.at-S.x; if(d<-60) continue; if(d>90) break;
          if(it['if']&&!Event.cond(S,it['if'])) continue;
          if(it.kind==='obstacle' && d>10 && d<38) inp.jump=true;
          if(it.kind==='low' && d>8 && d<58) inp.duck=true;
          if(it.kind==='altar'||it.kind==='tea'||it.kind==='gamble'){ if(Math.abs(d)<D.world.take_w-6){ var tk=D.kinds[it.kind].take||{}, isBad=(tk.pts||0)<0||(tk.stamina||0)<0; if(policy!=='informed'||!isBad) inp.take=true; } } }
        E.step(D,S,inp,1/30); S.ev.length=0;
      }
    } finally { E.rng=old; }
    var sc=E.score(D,S); return {score:sc.total,stalls:S.stalls,hits:S.hits,wrong:S.wrong,finished:S.finished,failed:S.failed,altars:sc.altarsGot+'/'+sc.altars,time:+S.time.toFixed(1),stars:E.starsAll(D,S),sheng:S.sheng,yin:S.yin,continues:S.continues,maxStreak:S.maxStreak}; }
};

   '<div class="panel"><h2>給你的企劃用：這個遊戲好玩在哪</h2><p>'+esc(R.question)+'</p>'+R.options.map(function(o,i){ return '<button class="opt'+(ui.answer===i?' sel':'')+'" data-act="ans" data-i="'+i+'">'+esc(o)+'</button>'; }).join('')+
   '<p>寫一句為什麼，再想：要放進你的企劃，你會留下它、還是換掉它？</p><textarea id="why" placeholder="例：我最有感的是路口擲筊，因為……">'+esc(ui.why)+'</textarea>'+(ui.answer!==null?'<div class="msg ok"><p>你選的是「'+esc(R.options[ui.answer])+'」。</p><p>'+esc(R.our_view)+'</p></div>':'')+'</div>'+
   '<div class="panel"><h2>'+esc(d.field.title)+'</h2><p>'+esc(d.field.prompt)+'</p><textarea id="field" placeholder="'+esc(d.field.placeholder)+'">'+esc(store('runner_field')||'')+'</textarea><div class="row"><button data-act="field">記下來（只存在這台裝置）</button></div><div id="field-msg" class="sub"></div></div>'+
   '<div class="row"><button class="primary" data-act="again">再走一次</button><button data-act="other">換另一版走</button><button data-act="home">回首頁</button></div>'+basis(d); }

// ---- 畫布（核心動作與時間的畫面；顏色一律從 :root 的變數讀） ----
function draw(){ var cv=document.getElementById('cv'); if(!cv) return; var d=D(), S=ui.S, dpr=window.devicePixelRatio||1, cw=cv.clientWidth||488, ch=cv.clientHeight||200; if(cv.width!==Math.round(cw*dpr)){ cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); }
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); var W=cw, H=ch, G=H-40, px=80, cs=getComputedStyle(document.documentElement);
  function C(n){ return cs.getPropertyValue(n).trim()||'gray'; }
  var sg=(d.stages&&d.stages[S.stg])||{}, night=(sg.sky==='night')&&!ui.strip;
  ctx.fillStyle=C(ui.strip?'--sky-day':'--sky-'+(sg.sky||'day')); ctx.fillRect(0,0,W,H);
  if(night){ ctx.fillStyle=C('--tk-ink'); for(var q=0;q<18;q++){ ctx.fillRect((q*97+S.x*0.05)%W,6+((q*53)%50),2,2); } }
  ctx.fillStyle=C('--ground'); ctx.fillRect(0,G,W,H-G);
  ctx.fillStyle=C(night?'--tk-ink':'--tk-muted'); ctx.font='bold 14px '+C('--tk-font-title'); ctx.fillText(ui.strip?'':(sg.name||'')+(S.seg?'・'+S.seg:''),10,18);
  var total=d.route[d.route.length-1].at||1; ctx.fillStyle=C('--tk-line'); ctx.fillRect(10,26,(W-20)*Math.min(1,S.x/total),3); ctx.globalAlpha=0.35; ctx.fillRect(10,26,W-20,3); ctx.globalAlpha=1;
  d.route.forEach(function(it,i){ var sx=px+(it.at-S.x); if(sx<-40||sx>W+40) return; var st=S.st[i]; if(st==='skip') return;
    if(it['if']){ var fi=-1; for(var z=i-1;z>=0;z--){ if(d.route[z].kind==='fork'){ fi=z; break; } } var resolved=fi>=0&&S.st[fi]==='done'; if(resolved?!E.M.event.cond(S,it['if']):(it['if']==='sheng'||it['if']==='yin')) return; }
    if(it.kind==='temple'){ ctx.fillStyle=C(ui.strip?'--k-gray1':'--k-temple'); ctx.fillRect(sx-18,G-62,36,62); ctx.fillStyle=C('--tk-accent-ink'); ctx.font='bold 16px '+C('--tk-font-title'); ctx.fillText(ui.strip?'□':'廟',sx-8,G-26); return; }
    if(st==='taken'||st==='hit') return; var v=kv(it.kind);
    if(it.kind==='obstacle'){ ctx.fillStyle=C(ui.strip?'--k-gray2':'--k-obstacle'); ctx.beginPath(); ctx.moveTo(sx-11,G); ctx.lineTo(sx,G-22); ctx.lineTo(sx+11,G); ctx.fill(); return; }
    if(it.kind==='low'){ ctx.fillStyle=C(ui.strip?'--k-gray3':'--k-low'); ctx.fillRect(sx-30,G-52,60,8); ctx.fillRect(sx-30,G-52,3,52); ctx.fillRect(sx+27,G-52,3,52); ctx.fillStyle=C('--tk-accent-ink'); ctx.font='bold 12px '+C('--tk-font-title'); ctx.fillText(ui.strip?'C':'彩 彩',sx-14,G-45); return; }
    if(it.kind==='rest'){ ctx.fillStyle=C(ui.strip?'--k-gray4':'--k-rest'); ctx.beginPath(); ctx.moveTo(sx-20,G-24); ctx.lineTo(sx,G-46); ctx.lineTo(sx+20,G-24); ctx.fill(); ctx.fillRect(sx-16,G-24,32,24); ctx.fillStyle=C('--tk-accent-ink'); ctx.font='bold 14px '+C('--tk-font-title'); ctx.fillText(ui.strip?'E':'歇',sx-7,G-7); return; }
    if(it.kind==='fork'){ ctx.fillStyle=C(ui.strip?'--k-gray5':'--k-fork'); ctx.fillRect(sx-3,G-60,6,60); ctx.fillRect(sx-24,G-58,48,16); ctx.fillStyle=C('--tk-accent-ink'); ctx.font='bold 13px '+C('--tk-font-title'); ctx.fillText(ui.strip?'？':'岔路',sx-14,G-46); return; }
    ctx.globalAlpha=st==='missed'?0.35:1; ctx.fillStyle=v.color.indexOf('var(')===0?C(v.color.slice(4,-1)):v.color; ctx.fillRect(sx-14,G-34,28,28); ctx.fillStyle=C('--tk-accent-ink'); ctx.font='bold 15px '+C('--tk-font-title'); ctx.fillText(v.icon,sx-8,G-14); ctx.globalAlpha=1; });
  var ducking=S.duckT>0, py=G-S.y, top=ducking?py-24:py-40; ctx.fillStyle=C('--k-wood'); ctx.fillRect(px-26,py-(ducking?10:20),52,4); ctx.fillStyle=C(ui.strip?'--k-gray1':'--k-gold'); ctx.fillRect(px-14,top,28,ducking?14:24);
  ctx.fillStyle=C('--tk-surface'); ctx.font='bold 14px '+C('--tk-font-title'); ctx.fillText(ui.strip?'■':'轎',px-7,top+(ducking?12:17)); ctx.fillStyle=C('--k-wood'); ctx.fillRect(px-20,py-(ducking?6:16),6,ducking?6:16); ctx.fillRect(px+14,py-(ducking?6:16),6,ducking?6:16); }

Space.render=function(S){ draw(); };
Core.render=function(S){ return ''; };
Actor.render=function(S){ var d=D(); return '<div class="legend">'+Object.keys(d.kinds).map(function(k){ var v=kv(k); return '<div><span class="chip" style="background:'+v.color+'">'+esc(v.icon)+'</span><b>'+esc(v.name)+'</b></div>'; }).join('')+'</div>'; };
Resource.render=function(S){ return hudR(D(),S,E.score(D(),S)); };
function loop(ts){ ui.raf=0; if(ui.screen!=='play') return; var d=D(), S=ui.S; if(!ui.last) ui.last=ts; var el=Math.min(0.1,(ts-ui.last)/1000)*(ui.timeScale||1); ui.last=ts; ui.acc+=el; var before=S.mode, txt=S.lastText, stg=S.stg, sc0=S.comboN;
  while(ui.acc>=1/60){ ui.acc-=1/60; var inp={jump:ui.jumpReq,duck:ui.duckReq,take:ui.takeReq}; if(ui.auto) ui.auto(inp); ui.jumpReq=false; ui.duckReq=false; ui.takeReq=false; E.step(d,S,inp,1/60); if(S.mode!=='run') break; }
  Feedback.flush(S);
  if(S.mode!==before||S.mode==='done'){
    if(S.mode==='card'&&FAST){ E.dismissCard(d,S); }
    if(S.mode==='done'){ ui.screen='end'; render(); window.scrollTo(0,0); return; }
    if(S.mode==='stalled'){ ui.msg=ui.strip?'停下來了。':S.reason; ui.msgCls='bad'; }
    if(S.mode==='temple'){ ui.msg=ui.strip?'到了一個停靠點。':'到了'+d.temples[d.route[S.ti].id].name+'。'; ui.msgCls=''; }
    if(S.mode==='fork'){ ui.msg=ui.strip?'到了岔路。':'到了路口。'; ui.msgCls=''; }
    if(S.mode==='failed'){ ui.msg=ui.strip?'命用完了。':S.lastText; ui.msgCls='bad'; }
    render(); return; }
  if(S.lastText!==txt){ var m=document.getElementById('msg'); if(m){ m.textContent=ui.strip?'過去了。':S.lastText; m.className='msg'; } }
  var b=document.getElementById('stam'); if(b) b.style.width=Math.max(0,S.stamina)+'%';
  var hr=document.getElementById('hud-r'); if(hr&&(S.lastText!==txt||stg!==S.stg||sc0!==S.comboN)) hr.textContent=hudR(d,S,E.score(d,S));
  draw(); ui.raf=requestAnimationFrame(loop); }
function go(){ if(!ui.raf){ ui.last=0; ui.acc=0; ui.raf=requestAnimationFrame(loop); } }

function vlabel(){ return ui.ver==='custom'?'我改做的版本':D().version_label; }
function start(ver,strip){ ui.ver=ver; ui.strip=!!strip; ui.vlabel=vlabel(); E.init(D()); ui.S=E.newState(D()); if(FAST&&ui.S.mode==='card') E.dismissCard(D(),ui.S); ui.answer=null; ui.why=''; ui.msg=''; ui.msgCls=''; ui.screen='play'; render(); window.scrollTo(0,0); if(ui.S.mode==='run') go(); }
function bind(){ document.querySelectorAll('[data-act]').forEach(function(el){ el.addEventListener('click',function(){ act(el.getAttribute('data-act'),el); }); }); }
function act(a,el){ var d=D(), S=ui.S; ac();
  if(a==='mute'){ ui.mute=!ui.mute; store('runner_mute',ui.mute?'1':'0'); el.textContent='音效：'+(ui.mute?'關':'開'); return; }
  if(a==='start'){ start(el.getAttribute('data-ver'),false); return; }
  if(a==='home'){ ui.screen='home'; ui.strip=false; render(); return; }
  if(a==='jump'){ ui.jumpReq=true; return; }
  if(a==='duck'){ ui.duckReq=true; return; }
  if(a==='take'){ ui.takeReq=true; return; }
  if(a==='card'){ E.dismissCard(d,S); ui.msg=''; render(); if(S.mode==='run') go(); return; }
  if(a==='pray'){ var r=E.templeTap(d,S,el.getAttribute('data-id')); Feedback.flush(S);
    if(r.wrong){ ui.msg=ui.strip?'不對，從頭再按。':d.order_wrong; ui.msgCls='bad'; render(); return; }
    if(S.mode==='done'){ ui.screen='end'; render(); window.scrollTo(0,0); return; }
    if(S.mode==='run'){ ui.msg=ui.strip?'出發。':'拜完了，起駕。'; ui.msgCls='ok'; render(); go(); return; }
    ui.msg=''; render(); return; }
  if(a==='forkroll'){ E.forkTap(d,S); Feedback.flush(S); render(); return; }
  if(a==='forkgo'){ E.forkGo(d,S); Feedback.flush(S); ui.msg=ui.strip?'出發。':'神明指了路，起駕。'; ui.msgCls='ok'; render(); if(S.mode==='run') go(); return; }
  if(a==='restart'){ E.restart(d,S); ui.msg=ui.strip?'重新出發。':'回到駐駕的地方，重新起駕。'; ui.msgCls=''; render(); go(); return; }
  if(a==='cont'){ E.cont(d,S); ui.msg=ui.strip?'接關。':'從停靠點接關，命補滿了。'; ui.msgCls='ok'; render(); go(); return; }
  if(a==='giveup'){ ui.screen='end'; render(); window.scrollTo(0,0); return; }
  if(a==='strip'){ start(ui.ver,!ui.strip); return; }
  if(a==='ans'){ ui.why=(document.getElementById('why')||{}).value||ui.why; ui.answer=+el.getAttribute('data-i'); render(); return; }
  if(a==='field'){ var f=document.getElementById('field').value.trim(), m=document.getElementById('field-msg'); if(f.length<(d.field.min_chars||10)){ m.textContent='再多寫一點（至少 '+(d.field.min_chars||10)+' 個字），寫你問了誰、他怎麼說。'; return; } store('runner_field',f); m.textContent='記下來了。之後改做時，把它變成一條規則。'; return; }
  if(a==='again'){ start(ui.ver,ui.strip); return; }
  if(a==='again-strip'){ start(ui.ver,!ui.strip); return; }
  if(a==='other'){ start(ui.ver==='rule'?'skin':'rule',false); return; }
  if(a==='dump'){ document.getElementById('remix-box').value=JSON.stringify(DATA[el.getAttribute('data-ver')],null,2); return; }
  if(a==='load'){ var txt=document.getElementById('remix-box').value, obj=null; ui.remixOk=''; ui.remixErr='';
    try{ obj=JSON.parse(txt); }catch(e){ ui.remixErr='這不是正確的 JSON：'+e.message+'\n把這行紅字貼回給 AI，說「請修這個」。'; render(); document.getElementById('remix').open=true; return; }
    var errs=E.validate(obj); if(errs.length){ ui.remixErr=errs.join('\n')+'\n把上面的紅字貼回給 AI，說「請修這個」。'; render(); document.getElementById('remix').open=true; return; }
    DATA.custom=obj; ui.remixOk='載入成功。按「玩我改做的版本」。'; render(); document.getElementById('remix').open=true; return; }
}
document.addEventListener('keydown',function(e){ if(ui.screen!=='play') return; var t=(e.target&&e.target.tagName)||''; if(t==='TEXTAREA'||t==='INPUT') return;
  if(e.code==='Space'){ ui.jumpReq=true; e.preventDefault(); } else if(e.code==='ArrowDown'||e.code==='KeyS'){ ui.duckReq=true; e.preventDefault(); } else if(e.code==='Enter'&&ui.S&&ui.S.mode==='run'){ ui.takeReq=true; e.preventDefault(); } });
window.__R={E:E,DATA:DATA,ui:ui,start:start,modules:MODS.map(function(m){return {id:m.id,name:m.name,reads:m.reads,iface:['init','step','render'].filter(function(k){return typeof m[k]==='function';})};})};
render();
